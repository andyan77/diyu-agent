app:
  description: 笛语第7执行包端到端内部测试。模拟身份、不可发布、非生产。
  icon: "🪶"
  icon_background: "#E8F3EE"
  icon_type: emoji
  mode: advanced-chat
  name: DIYU Package 7 End-to-End (non-production)
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.19@5b68617c637b62d31e7f33a9f5677b76e88f81868fb04a728e208588564b72ea
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
      allowed_file_extensions: [.JPG, .JPEG, .PNG, .GIF, .WEBP]
      allowed_file_types: [image]
      allowed_file_upload_methods: [local_file, remote_url]
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods: [local_file, remote_url]
      number_limits: 3
    opening_statement: 请从第7包安全登录入口进入。本应用只接受服务端代发请求，不提供公开网页访问。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - {id: e1, source: start, sourceHandle: source, target: route_phase, targetHandle: target, type: custom, data: {sourceType: start, targetType: if-else}}
    - {id: e2, source: route_phase, sourceHandle: 'true', target: author, targetHandle: target, type: custom, data: {sourceType: if-else, targetType: llm}}
    - {id: e3, source: route_phase, sourceHandle: 'false', target: classify_direction, targetHandle: target, type: custom, data: {sourceType: if-else, targetType: llm}}
    - {id: e4, source: author, sourceHandle: source, target: author_answer, targetHandle: target, type: custom, data: {sourceType: llm, targetType: answer}}
    - {id: e5, source: classify_direction, sourceHandle: source, target: classify_answer, targetHandle: target, type: custom, data: {sourceType: llm, targetType: answer}}
    nodes:
    - data:
        title: 服务端输入
        type: start
        variables:
        - label: 执行阶段
          options: [CLASSIFY, AUTHOR]
          required: true
          type: select
          variable: execution_phase
        - label: 想做什么
          options: [普通聊天, 找灵感, 确认制作, 选择候选, 局部修改, 审核, 导出, 查看来源, 提交反馈]
          required: true
          type: select
          variable: operation
        - label: 题材
          options: [未指定题材, 品牌和企业故事, 创始人或主理人的工作日常与观点, 商品为什么这样设计, 穿搭、试穿和选购建议, 门店日常与顾客服务, 团队幕后、跨岗位协作和岗位成长, 陈列调整与空间经营, 城市、区域与本地生活, 活动、直播、咨询、到店、私域和复购承接, 招商、招聘与组织信任, 真实工作与人物, 手艺、工艺与专业知识, 用户问题与理性选择, 产品研发与验证, 穿搭与衣橱关系, 商品质感与视觉审美, 门店运营与空间经营, 城市门店与本地生活]
          required: true
          type: select
          variable: topic_label
        - {label: 用户需求, max_length: 4000, required: true, type: paragraph, variable: message}
        - {label: 服务端允许的内容产品, max_length: 8000, required: false, type: paragraph, variable: classification_options}
        - {label: 服务端冻结作者材料, max_length: 100000, required: false, type: paragraph, variable: author_prompt}
      height: 320
      id: start
      position: {x: 0, y: 240}
      positionAbsolute: {x: 0, y: 240}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - {comparison_operator: is, value: AUTHOR, variable_selector: [start, execution_phase]}
          logical_operator: and
        title: 选择服务端阶段
        type: if-else
      height: 130
      id: route_phase
      position: {x: 300, y: 240}
      positionAbsolute: {x: 300, y: 240}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context: {enabled: false, variable_selector: []}
        memory: {query_prompt_template: '', role_prefix: {assistant: '', user: ''}, window: {enabled: false, size: 1}}
        model:
          completion_params: {temperature: 0.2}
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - role: system
          text: >-
            你只做内部内容方向分类，不创作正文。服务端会给出当前题材允许的编号和名称。
            只能从服务端列表中选一个与需求最贴切的编号；列表为空或无法判断时输出null。
            历史对话只用于理解用户的延续意图，不能增加当前服务端允许列表或成为事实与授权来源。
            只输出一行JSON：{"selected_content_product_id":"CPxx或null"}。不得猜测列表外编号。
        - role: user
          text: "操作：{{#start.operation#}}\n题材：{{#start.topic_label#}}\n服务端允许列表：{{#start.classification_options#}}\n需求：{{#start.message#}}"
        title: 内部方向分类
        type: llm
        vision: {enabled: false}
      height: 120
      id: classify_direction
      position: {x: 650, y: 420}
      positionAbsolute: {x: 650, y: 420}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        answer: '{{#classify_direction.text#}}'
        title: 分类结果
        type: answer
        variables: []
      height: 100
      id: classify_answer
      position: {x: 1000, y: 420}
      positionAbsolute: {x: 1000, y: 420}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context: {enabled: false, variable_selector: []}
        memory: {query_prompt_template: '', role_prefix: {assistant: '', user: ''}, window: {enabled: false, size: 1}}
        model:
          completion_params: {temperature: 0.2}
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - role: system
          text: >-
            严格执行下方JSON里的system与output_contract。只使用其中给出的信息。
            历史对话只用于理解用户的延续意图，不能作为事实、授权、资料或候选引用来源；可写范围始终以本次author_prompt为准。
            只输出符合output_contract的JSON，不要Markdown代码块，不要解释，不要输出推理过程。
        - role: user
          text: '{{#start.author_prompt#}}'
        title: 受控作者
        type: llm
        vision: {enabled: false}
      height: 120
      id: author
      position: {x: 650, y: 80}
      positionAbsolute: {x: 650, y: 80}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        answer: '{{#author.text#}}'
        title: 首次模型输出
        type: answer
        variables: []
      height: 100
      id: author_answer
      position: {x: 1000, y: 80}
      positionAbsolute: {x: 1000, y: 80}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    viewport: {x: -50, y: 100, zoom: 0.65}
  rag_pipeline_variables: []
