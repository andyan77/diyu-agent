root_cause_analysis: >
  这是同一失败轴（跨条套路收敛）的第 4 次独立复现（R1/R2/R3 + 执行包5重跑）。
  机制仍是"打地鼠"：v3.1 用结构位置门（END_BOUNDARY_DISCLAIM）精确堵死了"末段可分离
  免责节拍"这一具体承载位——这一层是真封住了（机器 0 命中、CP01/02/03 全清为证），
  但收敛并未消除，而是迁移到下一个未被门覆盖的承载位（正文中段/口播/画面里的同一
  "缺料静默/泛化免责"语义家族）。根因不在任何单一句族或承载位，而在生成结构本身：
  众多作者用同一批 typed_material、同一组边界事实、同一套发牌骨架填同一批语义槽位，
  凡未被机器 HARD 强制发散的槽位必然坍缩到共同输入所隐含的同一修辞动作。
  逐轮封死具体承载位（边界句面→末段节拍）只是把同一收敛不断赶到下一个槽位，
  从未改变"多作者共同输入→语义槽坍缩"这一结构性根因。
  定域成功（CP01/02/03）证明方向可行但强度/覆盖严重不足：单主体、工序天然线性的档型
  能被"收尾正向锚定"救活，但多要素/判断/边界/复盘型档型（其余 17 CP）的限度表达仍会
  在任意剩余槽位重新同构。

honest_negative_findings:
  - v3.1 修复非全盘失败：CP01/02/03 三个 CP 各 6/6 全接受是真实、可复算的定域成功（18/21 可接受条来自这 3 个 CP）。
  - 但 18/120 的定域成功距 90% 首次可接受门槛差距巨大；82.5% 套路率距 ≤10% 门槛差距巨大。
  - 修末段免责节拍的三H合同诱发了一类新编造（CP20-001 为满足"前向价值动作"硬造出与源矛盾的电话回访）——正向合同的副作用，记为设计教训。
  - 五条事实硬否决中 3 条为纤维/材质编造（棉/耐久），与第3轮"羊毛混纺"同族，说明纤维核源仍需机器层确定性门（当前仅靠人审兜底）。

