    与「整段没旁白/没配乐」免责句族；CP08/CP09 等整条骨架仍逐条复用。

root_cause_analysis: >
  三轮正式轮均在同一轴（跨条套路收敛）失败，机制为"打地鼠"：每轮封死上一批句族后，
  作者在下一个尚未被门覆盖的槽位重新收敛出替代家族。根因不是某个具体句族，而是生成
  结构本身——众多作者用同一批 typed_material、同一组边界事实、同一套发牌骨架填同一批
  语义槽位，凡未被机器 HARD 覆盖的槽位必然坍缩。第3轮策展层重写边界措辞（6 风格发牌）
  把收敛从"边界句面"挤到了"限度/收尾槽的叙事壳"，档型互异度真实提高（CP16 6/6、
  CP10 4/6 证明该方向对部分 CP 有效），但对多数 CP 未能强制结构级发散。
  证据：CP16 全清与多数 CP 全套路并存，说明方向正确但强度不足、覆盖不全。

focus_cp_note: >
  CP01/06/07 三个焦点 CP 的盲判相对上一轮基线均可复算改善（5/6、6/6、6/6），
  该项核心验收通过；但盲可辨识改善不能补偿首次可接受率与套路率两项主门失败。

