    state_machine_mapping: 01_generation_contracts/codex_state_machine_mapping_policy.v0.1.yaml
  risk_controls:
    hard_claim_policy: hard claims require source refs or route to SourceGapLedger/Excluded
    real_instance_fact_policy: real brand/SKU/store/person/customer/fabric/body-effect
      facts cannot be invented by expert synthesis
    P0_00_boundary_policy: P0-00 control-plane content cannot land in GeneralKnowledgeBase
    provenance_safety_policy: historical provenance true flags are not active readiness
      authority
    readiness_all_false: true
