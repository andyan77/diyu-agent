      target_scope_must_match_authorization_grant: true
      expired_revoked_or_ungranted_fragment_is_usable: false
      may_grant_authorization: false
      may_override_precise_fact: false
      may_override_revocation: false
    - channel_id: VERIFIED_PRECISE_FACT
      future_owner: POSTGRESQL
      purpose: authoritative_operational_fact
      fact_kinds:
      - SKU
      - SPECIFICATION
      - PRICE
      - STOCK
      - TIME_POINT
      - AUTHORIZATION
      - REVOCATION
      required_metadata:
      - fact_id
