  - cso_overlay_missing
  - cso_marked_ontology_truth
  - brandkb_slot_creates_brandkb_instance
  - creative_prototype_requires_brand_facts
  - evidence_bound_candidate_lacks_evidence_requirement
  - display_solution_lacks_scene_fact_requirement
  - three600_run_manifest_created
  - candidatepack_created
  - ke_serving_rag_dify_touched
  - google_drive_live_or_external_web_or_source_repo_live_or_embedding_required
  - any_readiness_flag_true
  - checker_cannot_fail_closed
  - python_O_bypasses_checker

  # Stop conditions the FUTURE P7C-GEN generation task must also honor.
