    body: '货架里有一次很小的返工：导购把燕麦针织挂上去又取下，因为腰带还没在画面里站稳。拍摄者往后退两步，只说“再看一眼”。


      口播放到动作之后：“让岗位用各自眼睛说衣服，但先看眼前这一处。”说完不追加形容词，让环境声和手感继续一秒。导购把原来的提词卡抽走，换成一句更像现场的话：“让岗位用各自眼睛说衣服。”然后用腰带和袖口先后入镜，让同一物件承接不同角色动作可以被看见。


