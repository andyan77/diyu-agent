    body: '开拍前，拍摄者把提词卡反扣在试穿区外的台面上。她拿起驼色针织外套，让轮廓在近景里过一遍，再用表面纹理接住下一句口播。


      口播放到动作之后：“用组货关系分配产品角色，但先看眼前这一处。”说完不追加形容词，让环境声和手感继续一秒。中间留出一个呼吸位，不接配乐，只听见衣料的摩擦声。这一拍把用组货关系分配产品角色从概念变成感受，也让主推承接搭配与补位各司其职不显得像教程。


      人物只承担表达任务，不背负未经提供的履历、成绩或顾客证言。


      结尾回到开头的位置，拍摄者把驼色针织外套挂回去，只留一句：“别急，再看一眼轮廓。”避免所有商品同时抢话。'
