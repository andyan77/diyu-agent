    body_text: 后场刚拆完箱，台面上留了两件针织衫。负责人轻轻拉开领边，再松手看它怎么回位，又顺手捏了捏袖口罗纹。两件的反应并不一样。她没急着给这批货贴上漂亮形容词，只说这一批先别急着全挂出去，先把观察记下来，再往后查。
