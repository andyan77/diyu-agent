      scene_premise: 到货整理后的后场台面
      event_trigger: 店员整理针织衫时发现两件领口松紧不同
      visible_detail: 领边受力后回位速度不同，袖口罗纹也有松紧差
      business_judgment: 以针织克重下限加到货复核节点的回弹抽检，把版型稳定性与系列一致性锁死，使面料取舍与货品结构围绕同一条克重线排布；由此价值表达与可观察差异对齐，门店解释难度与顾客选择成本一并下降。
      tradeoff_or_tension: 先锁定顾客买针织衫时背着的选择成本（怕洗两水就领口发垮、袖口起球），把它立成企业所回应的问题场景，作为叙事的第一锚点，而不是从年份或走红事件起笔
      spoken_line_seed: 这一批先别急着全挂出去。
