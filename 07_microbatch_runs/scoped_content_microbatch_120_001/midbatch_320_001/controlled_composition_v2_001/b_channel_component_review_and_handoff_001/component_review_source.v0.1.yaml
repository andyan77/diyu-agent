    truth_boundary: *truth_boundary
    proposed_cp_upper_bound: [CP02, CP10, CP15, CP18, CP20]
    compatibility_requirements: [时间锚有来源, 对象保持可比, 锚点之间不补事件]
    anti_pattern_rules: [禁止自造时间, 禁止用跳切制造事件, 禁止把未完成状态闭合]
    forbidden_inference: [invented_timestamp, invented_interval_event, fabricated_completion]
    accepted_cp_edges:
      CP15: {fit_basis: CP15要求商品旅程和多岗位接力，并具备transition角色；来源时间锚可连接真实生命周期状态而不补库存事实。, profile_role_basis: transition, hard_guard_refs: [AGR_CP15_01], truth_mode_compatible: true, founder_upper_bound_respected: true}
    rejected_cp_edges:
