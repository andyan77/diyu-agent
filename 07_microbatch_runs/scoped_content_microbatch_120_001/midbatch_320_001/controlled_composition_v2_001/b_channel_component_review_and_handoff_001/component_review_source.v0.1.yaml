    composition_asset_class: narrative_operator
    component_role: transition
    canonical_component_id: RCV2-004-TRANSITION-SOURCE-BOUND-TIME-SLICE
    mechanism_definition: 在稳定观察对象上，依次连接输入中明确提供的时间锚和对应状态，不生成时间、时长或频次。
    output_function: 以来源约束的时间锚完成状态段之间的叙事过渡。
    claim_boundary: 时间锚及每段状态必须来自输入，普通重复和未完成状态可以原样保留。
    input_slots: [source_bound_time_anchors, stable_observation_subject, state_at_each_anchor, unfinished_state]
    required_observable_evidence: [time_anchor_evidence, state_at_anchor_evidence]
