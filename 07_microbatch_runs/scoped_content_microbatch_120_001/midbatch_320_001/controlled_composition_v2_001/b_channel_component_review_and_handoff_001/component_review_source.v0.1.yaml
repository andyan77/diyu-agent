      CP10: {fit_basis: CP10的时间节点由trigger、reasoning和capture承载，没有transition角色；保留该边会造成角色错配。, profile_role_basis: no_transition_role, hard_guard_refs: [AGR_CP10_01, AGR_CP10_02], truth_mode_compatible: true, founder_upper_bound_respected: true}
      CP18: {fit_basis: CP18的地域时间状态需真实声景和事件素材，但Profile没有transition角色，不能仅凭地方编年扩大边。, profile_role_basis: no_transition_role, hard_guard_refs: [AGR_CP18_01, AGR_CP18_02], truth_mode_compatible: true, founder_upper_bound_respected: true}
      CP20: {fit_basis: CP20以trigger、reasoning和capture记录节点，没有transition角色；时间节点相似性不足以建立组件适用。, profile_role_basis: no_transition_role, hard_guard_refs: [AGR_CP20_01, AGR_CP20_02, AGR_CP20_03], truth_mode_compatible: true, founder_upper_bound_respected: true}
