    required_observable_evidence: [conflict_evidence, variable_state_evidence, comparison_observation]
    required_authorization_slots: [authorized_comparison_role]
    role_authority_boundary: 仅由获准比较该对象和变量的角色使用，不取得实验设计或普遍结论权。
    truth_boundary: *truth_boundary
    proposed_cp_upper_bound: [CP06, CP09, CP13, CP14, CP17]
    compatibility_requirements: [冲突来自输入, 变量预先给定, 比较条件可追溯]
    anti_pattern_rules: [禁止制造冲突, 禁止增加变量, 禁止观察即因果]
    forbidden_inference: [fabricated_conflict, invented_experiment, causal_overreach]
    accepted_cp_edges:
      CP06: {fit_basis: CP06要求观察、判断、依据和限制；单变量比较可作为reasoning move，但判断必须停在岗位权限内。, profile_role_basis: audience_facing_reasoning_move, hard_guard_refs: [AGR_CP06_01, AGR_CP06_02], truth_mode_compatible: true, founder_upper_bound_respected: true}
      CP09: {fit_basis: CP09的真实适用与不适用条件可围绕已给变量比较，并明确禁止绝对适配和身体结论。, profile_role_basis: audience_facing_reasoning_move, hard_guard_refs: [AGR_CP09_01, AGR_CP09_02], truth_mode_compatible: true, founder_upper_bound_respected: true}
      CP13: {fit_basis: CP13可对已授权搭配关系中的单一条件作有限演绎，前提是场景和冲突不得冒充经历。, profile_role_basis: audience_facing_reasoning_move, hard_guard_refs: [AGR_CP13_01, AGR_CP13_02], truth_mode_compatible: true, founder_upper_bound_respected: true}
    rejected_cp_edges:
      CP14: {fit_basis: CP14没有audience_facing_reasoning_move角色，且非语言物性短片不应被强制加入比较推理。, profile_role_basis: no_reasoning_role, hard_guard_refs: [AGR_CP14_01, AGR_CP14_02, AGR_CP14_03, AGR_CP14_04, AGR_CP14_05], truth_mode_compatible: true, founder_upper_bound_respected: true}
      CP17: {fit_basis: CP17没有audience_facing_reasoning_move角色；其前后复核应由动作和视觉证据承担，不能用本组件替代。, profile_role_basis: no_reasoning_role, hard_guard_refs: [AGR_CP17_01, AGR_CP17_02], truth_mode_compatible: true, founder_upper_bound_respected: true}
    review:
      semantic_readback: 该机制不是制造戏剧冲突，而是对已给冲突中的一个已授权变量做有限比较。
      asset_class_schema_fit: 可映射为audience_facing_reasoning_move，CP14和CP17因角色缺失被剔除。
