  candidates:
  - proposal_id: BNO-01
    label: 结果到原因的倒序复盘
    candidate_family: B_CHANNEL_NARRATIVE_OPERATOR
    composition_asset_class: narrative_operator
    component_role: audience_facing_reasoning_move
    canonical_component_id: RCV2-004-REASONING-RESULT-TO-AUTHORIZED-TRACE
    mechanism_definition: 从已提供的结果状态回读已提供的原因或决策轨迹，使每个解释都能回指输入证据，而不是依据结果猜测原因。
    output_function: 将结果、已授权轨迹和边界组织为可回溯的逆向推理路径。
    claim_boundary: 只允许回读输入中明确存在的原因或决策轨迹，不产生新的原因、动机或因果关系。
    input_slots: [observed_result, authorized_cause_or_decision_trace, trace_order, claim_boundary]
    required_observable_evidence: [result_state_evidence, cause_or_decision_trace_evidence]
    required_authorization_slots: [authorized_reasoning_role]
    role_authority_boundary: 仅由对结果和轨迹均有观察或记录权限的角色使用，不取得决策所有权。
    truth_boundary: &truth_boundary
      brand_fact_source: false
      factual_authority: false
      ontology_truth: false
      person_experience_source: false
      real_event_evidence: false
    proposed_cp_upper_bound: [CP10, CP12, CP19, CP20]
    compatibility_requirements: [结果和轨迹分别有据, 回读顺序不改变事实集合, 未知原因保持未知]
    anti_pattern_rules: [禁止结果倒推原因, 禁止补造决策动机, 禁止把相关性改写为因果]
    forbidden_inference: [unsupported_cause, inferred_motive, retrospective_success_story]
    accepted_cp_edges:
      CP10: {fit_basis: CP10要求证据先于长期结论；逆向回读只在结果与验证轨迹同时存在时成立，并保留记录局限。, profile_role_basis: audience_facing_reasoning_move, hard_guard_refs: [AGR_CP10_01, AGR_CP10_02], truth_mode_compatible: true, founder_upper_bound_respected: true}
      CP19: {fit_basis: CP19具备选择、放弃、代价和结果字段；该机制可从结果回到真实取舍轨迹而不制造价值观。, profile_role_basis: audience_facing_reasoning_move, hard_guard_refs: [AGR_CP19_01, AGR_CP19_02], truth_mode_compatible: true, founder_upper_bound_respected: true}
      CP20: {fit_basis: CP20的结果或偏差可回读至承诺节点和执行证据；机制要求两端均有据并禁止情绪替代证据。, profile_role_basis: audience_facing_reasoning_move, hard_guard_refs: [AGR_CP20_01, AGR_CP20_02, AGR_CP20_03], truth_mode_compatible: true, founder_upper_bound_respected: true}
    rejected_cp_edges:
      CP12: {fit_basis: CP12没有audience_facing_reasoning_move角色；将整体逆向推理映射为observable_action会改变该候选的资产语义。, profile_role_basis: no_lossless_role_match, hard_guard_refs: [AGR_CP12_01, AGR_CP12_02], truth_mode_compatible: true, founder_upper_bound_respected: true}
    review:
      semantic_readback: 候选不是倒叙修辞，而是要求结果与原因轨迹双端有据的逆向证据组织机制。
      asset_class_schema_fit: 可无损映射为narrative_operator下的audience_facing_reasoning_move，但只适用于具备该角色的Profile。
      atomicity_assessment: 单一功能是逆向回读证据轨迹，不同时承担镜头、角色或收束功能。
      truth_boundary_assessment: 明确禁止由结果补造原因、动机或成功叙事，事实权威保持为false。
      duplicate_equivalence_assessment: 现有EVIDENCE_BEFORE_CONCLUSION规定先证后结论，不提供结果到既有轨迹的逆向组织，核心顺序和输入槽不同。
      hard_guard_assessment: 保留CP10长期证据、CP19真实代价和CP20承诺证据边界；CP12因角色不匹配被删除。
      decision: PROMOTE_AS_NEW
      decision_rationale: 机制具备独立的逆向证据路径、闭合输入和清晰权限边界，且与现有先证后结论组件不等价。
      reason_codes: [DISTINCT_EVIDENCE_ORDER, CLOSED_DUAL_ENDPOINT_INPUT, CP_EDGES_NARROWED]

