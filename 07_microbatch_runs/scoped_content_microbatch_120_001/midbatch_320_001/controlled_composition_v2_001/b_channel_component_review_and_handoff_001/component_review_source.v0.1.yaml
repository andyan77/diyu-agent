      CP08: {fit_basis: CP08的visual_beat适合局部结构展示，但把整体状态序列降为视觉节点会丢失叙事路径语义。, profile_role_basis: no_lossless_role_match, hard_guard_refs: [AGR_CP08_01, AGR_CP08_02], truth_mode_compatible: true, founder_upper_bound_respected: true}
      CP12: {fit_basis: CP12需要版本、动作和判断角色；当前候选未明确应落为trigger、observable_action或closing，不能猜测映射。, profile_role_basis: no_lossless_role_match, hard_guard_refs: [AGR_CP12_01, AGR_CP12_02], truth_mode_compatible: true, founder_upper_bound_respected: true}
      CP14: {fit_basis: CP14支持非语言视觉路径，但候选被指定为narrative_operator且没有对应的visual_beat子角色，强行映射会产生平行枚举。, profile_role_basis: no_lossless_role_match, hard_guard_refs: [AGR_CP14_01, AGR_CP14_02, AGR_CP14_03, AGR_CP14_04, AGR_CP14_05], truth_mode_compatible: true, founder_upper_bound_respected: true}
      CP17: {fit_basis: CP17具备状态与调整动作，但候选未区分trigger、observable_action和visual_beat功能，无法满足原子角色闭合。, profile_role_basis: no_lossless_role_match, hard_guard_refs: [AGR_CP17_01, AGR_CP17_02], truth_mode_compatible: true, founder_upper_bound_respected: true}
    review:
      semantic_readback: 候选试图用同一物件串联多个已知状态，但当前定义停留在整体叙事骨架，尚未落到canonical组件角色。
      asset_class_schema_fit: narrative_operator类存在，但现有Profile只接受transition、reasoning或closing等具体角色；本候选无法无损选择其中之一。
      atomicity_assessment: 物件身份、状态转移和观察顺序被捆在整体路径中，需先裁定具体子功能才能成为原子组件。
      truth_boundary_assessment: 防补造状态的边界正确，但schema角色缺口使其无法进入Registry。
      duplicate_equivalence_assessment: 与SAME_OBJECT_OBSERVATION_ENTRY不同，后者切换任务入口；本候选追踪状态序列，不能合法合并。
      hard_guard_assessment: 五条拟议边均存在角色表达缺口，保留会造成虚假适用边，因此全部拒绝。
      decision: NEEDS_REPAIR
      decision_rationale: 机制方向成立，但必须拆定为明确的transition或visual/action子功能后再审；本轮不新造平行角色。
      reason_codes: [SCHEMA_ROLE_GAP, ATOMIC_SUBFUNCTION_UNRESOLVED, ZERO_VALID_CP_EDGE]

