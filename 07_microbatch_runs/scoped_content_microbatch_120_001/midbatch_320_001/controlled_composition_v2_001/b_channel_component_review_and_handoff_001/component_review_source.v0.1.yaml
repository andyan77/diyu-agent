  - proposal_id: BNO-04
    label: 完成、待办、阻塞并列状态地图
    candidate_family: B_CHANNEL_NARRATIVE_OPERATOR
    composition_asset_class: narrative_operator
    component_role: transition
    canonical_component_id: RCV2-004-TRANSITION-PARALLEL-WORK-STATE
    mechanism_definition: 将输入中分别有据的完成、待办和阻塞状态并列，并在状态之间移动注意力而不改变任何状态归属。
    output_function: 以并列状态关系完成工作状态之间的叙事过渡。
    claim_boundary: 每个状态必须单独有据，进行中、待办和阻塞不得被转换成完成。
    input_slots: [completed_items, pending_items, blocked_items, state_evidence_refs]
    required_observable_evidence: [evidence_for_each_state, state_ownership_evidence]
    required_authorization_slots: [authorized_status_recorder]
    role_authority_boundary: 记录者只能移动叙事注意力，不能修改状态或替其他岗位关闭事项。
    truth_boundary: *truth_boundary
    proposed_cp_upper_bound: [CP01, CP04, CP15, CP17, CP20]
    compatibility_requirements: [状态逐项有据, 状态类别互不替换, 阻塞原因未知时不解释]
    anti_pattern_rules: [禁止把待办写成完成, 禁止虚构阻塞原因, 禁止抹去未完成项]
    forbidden_inference: [status_upgrade, invented_blocker, false_resolution]
    accepted_cp_edges:
      CP04: {fit_basis: CP04具备transition角色和真实岗位权限；并列状态可连接各岗位已完成与待交接部分而不编协作冲突。, profile_role_basis: transition, hard_guard_refs: [AGR_CP04_01, AGR_CP04_02, AGR_CP04_03], truth_mode_compatible: true, founder_upper_bound_respected: true}
      CP15: {fit_basis: CP15具备transition角色与生命周期状态；完成、待办和阻塞可按真实岗位接力并列且不虚构库存状态。, profile_role_basis: transition, hard_guard_refs: [AGR_CP15_01], truth_mode_compatible: true, founder_upper_bound_respected: true}
    rejected_cp_edges:
      CP01: {fit_basis: CP01虽有结果或未完成状态，但没有transition角色；其状态收束可由closing处理，不能错配本组件。, profile_role_basis: no_transition_role, hard_guard_refs: [AGR_CP01_01, AGR_CP01_02, AGR_CP01_03], truth_mode_compatible: true, founder_upper_bound_respected: true}
      CP17: {fit_basis: CP17具备状态观察但无transition角色，状态地图更适合作为capture或visual机制而非本叙事过渡。, profile_role_basis: no_transition_role, hard_guard_refs: [AGR_CP17_01, AGR_CP17_02], truth_mode_compatible: true, founder_upper_bound_respected: true}
      CP20: {fit_basis: CP20的偏差和下一步由reasoning与capture承载，没有transition角色，不能仅因存在状态字段保留边。, profile_role_basis: no_transition_role, hard_guard_refs: [AGR_CP20_01, AGR_CP20_02, AGR_CP20_03], truth_mode_compatible: true, founder_upper_bound_respected: true}
    review:
      semantic_readback: 候选以平行状态关系组织注意力，关键价值是保留未完成项而非制作运营看板。
      asset_class_schema_fit: 可无损映射为transition，并限于具备该角色的CP04和CP15。
      atomicity_assessment: 只承担状态间过渡，不承担视觉地图拍摄或最终交接收束。
      truth_boundary_assessment: 状态逐项绑定证据，禁止状态升级和虚构阻塞原因。
      duplicate_equivalence_assessment: 现有角色交接transition移动岗位观察，本候选移动的是状态类别，输入槽和输出功能不同。
      hard_guard_assessment: 保留CP04权限边界与CP15库存真实性；三条无角色边已删除。
      decision: PROMOTE_AS_NEW
      decision_rationale: 平行工作状态过渡具有独立反假完成价值，且可在两个Profile中闭合表达。
      reason_codes: [DISTINCT_STATE_TRANSITION, STATUS_PRESERVATION, CP_EDGES_NARROWED]

  - proposal_id: BNO-05
    label: 单一冲突、单一变量实验
    candidate_family: B_CHANNEL_NARRATIVE_OPERATOR
    composition_asset_class: narrative_operator
    component_role: audience_facing_reasoning_move
    canonical_component_id: RCV2-004-REASONING-SOURCE-BOUND-SINGLE-VARIABLE
    mechanism_definition: 仅在冲突、可调整变量和观察边界均由输入提供时，围绕一个变量组织比较，不创建实验、冲突或因果结论。
    output_function: 将来源约束的冲突和变量组织为有限比较推理。
    claim_boundary: 观察差异不自动证明因果，也不扩展为普遍结果。
