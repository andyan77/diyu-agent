  - asset_id: RV80-ASSET-015
    current_primary_anchor: 橱窗
    status: LIKELY_APPAREL_PRIMARY_REQUIRES_FOUNDER_RULE
    patched_by_this_task: false
    founder_rule_needed: display_method_primary_is_apparel_or_space_or_display
    body_evidence: 我刚把橱窗里的大衣肩部重新理顺。它静静挂着，肩部被衣料的分量压住，下摆落到小腿附近，风口开着也没有乱成一团。旧稿原本借了一个顾客故事，我把它撤掉了。不借谁的私事，这件衣服也有东西可讲。路过时，可以近一点看它怎么垂下来。
  - asset_id: RV80-ASSET-049
    current_primary_anchor: 橱窗
    status: AMBIGUOUS_DISPLAY_METHOD_PRIMARY
    patched_by_this_task: false
    founder_rule_needed: display_method_primary_is_apparel_or_space_or_display
    body_evidence: 我正把橱窗上沿那块亮色往旁边挪。驼色毛衣裙留在中间占最大面积，辅色只在两侧接住高度，最亮的小配件收在上方一点。暖不是把所有暖色都堆满，面积和位置也要有分寸。摆完后我会走到街对面停几秒，看第一眼是否仍回到主色上。
  - asset_id: RV80-ASSET-059
    current_primary_anchor: 橱窗
    status: AMBIGUOUS_DISPLAY_PROCESS_PRIMARY
    patched_by_this_task: false
    founder_rule_needed: display_method_primary_is_apparel_or_space_or_display
    body_evidence: 陈列上墙前，店长先拿清单核对可用服装与尺码，再给橱窗人台套上廓形西装和阔腿裤。衣服穿好后，她退到玻璃外，复核人台肩部与裤长是否落在同一条视线上。检查结束才实施，实施结束再复核；每一步都有清楚的完成标志。
  - asset_id: P7D40-REPAIR-234
    current_primary_anchor: 橱窗
    status: AMBIGUOUS_DISPLAY_VISIBILITY_PRIMARY
    patched_by_this_task: false
    founder_rule_needed: display_method_primary_is_apparel_or_space_or_display
    body_evidence: 橱窗里的藏青西装外套压住白色上衣，直筒牛仔裤把正式感放松下来。陈列师给橱窗人台完成穿搭后，退到玻璃外复核：肩线有没有被灯压暗，裤脚是否挡住底座，主角能不能第一眼被看见。每次移动，都对应一个能在橱窗里看清的问题。
