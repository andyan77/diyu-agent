    original_body: '试衣镜边刚亮灯，他把风衣从衣架上取下，先理下摆，再把表面纹理转向侧光。店长没催，等手停下才问：“今天先看哪一处？”


      第一镜拍人与衣服的距离，第二镜只跟下摆，第三镜回到店长的反应。镜头不换对象，只换观察深度。店长原本想加一句更响亮的话，他摇了摇头：“把适配写成带条件的任务。”她用手势把声音压低，因为同时给适用和不适用现场。


      这里可以保留想象力，但不替任何品牌补写年份、销量或真实人物经历。


      结尾回到开头的位置，他把风衣挂回去，只留一句：“别急，再看一眼下摆。”百搭被还原为具体选择。'
    repaired_body_text: 风衣能不能叫“百搭”，先放到一天的任务里试。去写字楼，前襟坐下时别堆住，起身后还能保持利落；带孩子出门，过长的下摆和手里的包可能会互相添乱。导购不急着给总评，只问：“你今天要走多久、坐多久、手上还要拿什么？”条件说清，选择才有用。
