    original_body: '镜头先不拍脸，只拍焦糖灯芯绒裙子从正面转到侧面。老板用指腹顺过橱窗，再退到直播间的镜子边看表面纹理落在整体里是什么样子。


      老板把衣服递给导购，对方只接管表面纹理的那一步。谁先动手、谁后退观察，就是这段内容里的角色关系。声音放得很轻：“今天不追着证明它多好，先把橱窗拍清。”这样的克制服务于让产品在角色和渠道间换位置，而每次切换都重写任务而非套话是画面真正的骨架。


      把未知项写成【待绑定事实】，其余段落仍按可直接拍摄的节奏完成。


      老板离开画面后，焦糖灯芯绒裙子仍在原位。环境声多留一拍，让跨域内容仍保持同一事实边界这个意思自己落下。'
    repaired_body_text: 同一条焦糖色灯芯绒半裙，在橱窗里陪衬大衣，在直播里可以成为主角，导购面对顾客时则只需接住一句“它配短靴是什么感觉”。三个位置不是三套互相打架的话。颜色、纹理和长度保持一致，改变的是任务：吸引第一眼、讲清细节，或帮助完成一次搭配选择。
