    original_body: '镜头外的同事把羊毛这件衣服搭在臂弯，拍摄者没接过去，只指了指下摆。两人在样衣桌旁对望一下，内容从这个没有被剪掉的停顿开始。


      画面从全景走到手部，再退回人物关系。镜头外的同事问为什么，拍摄者不讲道理，把羊毛这件衣服翻到下摆那一面回答。两个人的分歧没被剪掉。镜头外的同事想看整体，拍摄者坚持先看下摆。这段小小的拉扯让只比较同一任务下的可见差异落地，最后又回到并排拍版型长度和结构。


      把能看见的部分拍清，把需要证明的部分交给【成分/工艺记录】后置确认。


      最后一句口播只说选择，不说奇迹：“我们先把这个动作做对。”然后用下摆完成不把观察偷换成优劣结论。'
    repaired_body_text: 两件同色羊毛开衫放在一起，一件落肩宽松，一件腰身收得更清楚；一件下摆是双层罗纹，另一件更薄、更贴。差别先讲到这里就够了。哪件更暖、哪件更耐穿，不能只凭厚薄替人决定。选择可以从看得见的长度、结构和手感开始，再交给真实穿着。
