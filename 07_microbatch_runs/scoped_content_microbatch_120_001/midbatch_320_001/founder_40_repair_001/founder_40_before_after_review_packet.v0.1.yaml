  - original_output_id: P7D320-OUT-021
    repair_id: P7D40-REPAIR-021
    original_review_class: A
    original_body: '打烊后的样衣间安静下来，风衣还留在木台上。模特重做一次并排比较：先看袖口，再摸门襟，最后把衣服放回原位。


      口播放到动作之后：“让小改动撑起完整故事，但先看眼前这一处。”说完不追加形容词，让环境声和手感继续一秒。如果关掉声音，观众仍能从那次并排比较里看懂让小改动撑起完整故事。不是因为字幕写了答案，而是用前后差异而非宏大口号推进被放进了人与衣服的距离。


      这里可以保留想象力，但不替任何品牌补写年份、销量或真实人物经历。


      最后一句口播只说选择，不说奇迹：“我们先把这个动作做对。”然后用袖口完成在细节处留下叙事余味。'
    repaired_body_text: 风衣已经接近完成，团队却在袖口前停了下来。门襟扣到第二颗时很利落，袖口一抬却显得过重。继续交货省时间，退回去再改会多一轮工，但他们选择先把那半寸处理好。企业叙事不一定从大事件开始；一件差点完成、最后仍被叫停的衣服，已经把“我们愿意为哪件小事多走一步”说清楚了。
