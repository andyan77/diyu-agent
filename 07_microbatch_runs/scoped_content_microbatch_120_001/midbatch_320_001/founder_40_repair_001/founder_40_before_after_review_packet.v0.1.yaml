  - original_output_id: P7D320-OUT-040
    repair_id: P7D40-REPAIR-040
    original_review_class: A
    original_body: '这条内容不从正面全身开始。模特先把这件衣服叠在门店的一角，手掌压过垂坠，然后展开，让腰线自己进入画面。


      结构是一近一远再一近：先看垂坠，再看这件衣服在门店里承担的任务，最后回到模特手上的腰线。镜头外有人问：“为什么不直接说结论？”模特指指这件衣服，回答“先把这个选择让人看懂”。这正好对应把夸张结果降为可观察画面，也保住了只描述镜头能确认的变化。


      把未知项写成【待绑定事实】，其余段落仍按可直接拍摄的节奏完成。


      收尾让搭配师接过这件衣服，重复一次刚才的动作。方法被人真正用起来时，保住感染力也保住说话分寸。'
    repaired_body_text: 一条高腰直筒牛仔裤，不必急着替任何人保证“显瘦”。先看腰线落在哪里，再看裤缝从胯部向下是否顺直，坐下与站起时前片会不会堆成一团。团队选择把结论留给试穿的人，把能看见的结构讲清楚。克制不是少说，而是把每一句都放回衣服本身。
