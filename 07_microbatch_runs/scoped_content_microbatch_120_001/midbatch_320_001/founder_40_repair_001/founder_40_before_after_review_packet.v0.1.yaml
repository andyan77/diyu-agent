  - original_output_id: P7D320-OUT-030
    repair_id: P7D40-REPAIR-030
    original_review_class: C
    original_body: '挂通里有一次很小的返工：模特把这件衣服挂上去又取下，因为走线还没在画面里站稳。拍摄者往后退两步，只说“再看一眼”。


      画面的转折不用特效：模特换个角度看的瞬间，走线和袖口的关系变了。拍摄者的目光跟着动，理由就站住了。模特把原来的提词卡抽走，换成一句更像现场的话：“用实物锚点拆掉空泛形容。”然后用走线和袖口先后入镜，让先让手与衣服发生动作可以被看见。


      脚本可先完整成形，但【品牌口吻】和【可核事件】必须等资料接入后再替换。


      片尾不把衣服变成口号。这件衣服被折好或挂回，人物的选择留在现场；把槽位留给真实身份和事件。'
    repaired_body_text: “好看”太容易说，也太容易忘。把外套袖口向上翻两道，里衬的走线、门襟扣的位置和领口的收势就都有了落点。团队真正要留下的，不是一个更响的形容词，而是一套人人都能指出来的判断：哪里值得看，为什么先看这里。品牌的表达从实物开始，空话自然会少。
