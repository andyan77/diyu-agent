    original_body: '试衣镜边刚亮灯，导购把砂色衬衫从衣架上取下，先理袖口，再把下摆转向侧光。店长没催，等手停下才问：“今天先看哪一处？”


      第一镜拍人与衣服的距离，第二镜只跟袖口，第三镜回到店长的反应。镜头不换对象，只换观察深度。店长原本想加一句更响亮的话，导购摇了摇头：“让角色权限决定能说多深。”她用手势把声音压低，因为经验不清时用现场观察替代履历。


      发布前把【角色称呼】、【商品信息】与【现场依据】补齐；空位留着，也不拿想象填满。


      结尾回到开头的位置，导购把砂色衬衫挂回去，只留一句：“别急，再看一眼袖口。”人物故事不越过事实线。'
    repaired_body_text: 砂色工装衬衫不需要“十年老导购”来撑场。导购把袖口双线翻给人看，再示范下摆放出和半掖的差别，就已经有话可说：“先别听我夸，你看领台立起来时，整件衣服是不是更精神。”经验可以体现在观察次序里，不必编成履历。
