    original_body: '这条内容不从正面全身开始。拍摄者先把针织叠在货架的一角，手掌压过表面纹理，然后展开，让轮廓自己进入画面。


      中段保持机位，让拍摄者再做一遍退。动作前后的差别留在轮廓上，口播只说一句：“同色延续异材质制造转折。”镜头外有人问：“为什么不直接说结论？”拍摄者指指针织，回答“先把这个选择让人看懂”。这正好对应用邻接关系讲产品与陈列，也保住了同色延续异材质制造转折。


      把未知项写成【待绑定事实】，其余段落仍按可直接拍摄的节奏完成。


      收尾让搭配师接过针织，重复一次刚才的动作。方法被人真正用起来时，让画面关系成为叙事语法。'
    repaired_body_text: 那件外套放在中心，不代表旁边只能空着。同色针织靠近一点，会把颜色继续下去；换成皮质小包，则会形成材质转折。店长先决定谁是主角，再决定陪衬是延续还是对比，最后留出一块不说话的空处。陈列真正的秩序，是让顾客一眼知道先看谁，再顺着看什么。
