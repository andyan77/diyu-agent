  - original_output_id: P7D320-OUT-012
    repair_id: P7D40-REPAIR-012
    original_review_class: D
    original_body: '镜头先不拍脸，只拍羊毛大衣从正面转到侧面。导购用指腹顺过表面纹理，再退到货架的镜子边看轮廓落在整体里是什么样子。


      同一机位留两次画面：一次保留原状，一次完成比。观众先看出变化，才听见“沿工序追一件衣服的来路”这个判断。声音放得很轻：“今天不追着证明它多好，先把表面纹理拍清。”这样的克制服务于沿工序追一件衣服的来路，而每次交手都要留下可拍动作是画面真正的骨架。


      让情绪来自动作之间的停顿，不靠虚构品牌战绩把分量抬高。


      导购离开画面后，羊毛大衣仍在原位。环境声多留一拍，让把抽象承诺换成过程画面这个意思自己落下。'
    repaired_body_text: 羊毛大衣从布料走到货架，中间最怕一句“我们用的都是好料”把过程盖过去。选料要回答起球顾虑，打版要处理肩背活动，试穿要看省道是否顺，交到门店还得让导购讲得明白。企业的认真，不在一句保证里，而在每一道交接都有人停下来问：这一处为什么这样做？
