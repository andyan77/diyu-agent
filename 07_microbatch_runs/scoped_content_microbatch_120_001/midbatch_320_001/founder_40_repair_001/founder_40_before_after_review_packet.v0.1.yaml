    original_body: '开拍前，拍摄者把提词卡反扣在货架的台面上。她拿起羊毛这件衣服，让袖口在近景里过一遍，再用表面纹理接住下一句口播。


      口播放到动作之后：“让语气跟随现场强弱，但先看眼前这一处。”说完不追加形容词，让环境声和手感继续一秒。中间留出一个呼吸位，不接配乐，只听见衣料的摩擦声。这一拍把让语气跟随现场强弱从概念变成感受，也让普通动作平说，关键细节抬高不显得像教程。


