    original_review_class: A
    original_body: '手机竖在开门前的卖场外一步，画面里只有这件衣服和拍摄者的手。她不报卖点，先微调，又把裤脚和罗纹对着镜头留了两秒。


      画面从全景走到手部，再退回人物关系。版师问为什么，拍摄者不讲道理，把这件衣服翻到裤脚那一面回答。重点留在选择的先后上。拍摄者先处理裤脚，后看罗纹；这个顺序就是把使用教育与效果承诺分开，也使动作可以演示，结果必须留证不再只是一句话。


      脚本可先完整成形，但【品牌口吻】和【可核事件】必须等资料接入后再替换。


      画面停在裤脚与罗纹同时入镜的瞬间。不替观众总结价值，因为让脚本完整却不冒充证明。'
    repaired_body_text: 背带裤对小个子不必只剩一句“拉长比例”。先把肩带收两格，看看腰线怎样移动；再把裤脚翻两道，让鞋面多露一点；罗纹打底放在最里面，短开衫停在腰线上方。导购可以让顾客前后比较，但不替她宣布效果。会调、会穿，比一个万能结论更实在。
