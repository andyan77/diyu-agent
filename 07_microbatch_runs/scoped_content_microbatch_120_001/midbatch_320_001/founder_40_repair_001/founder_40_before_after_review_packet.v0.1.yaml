    original_body: '这条内容不从正面全身开始。他先把衬衫叠在短视频的一角，手掌压过下摆，然后展开，让面料自己进入画面。


      中段保持机位，让他再做一遍改。动作前后的差别留在面料上，口播只说一句：“按场景重排切口而非换标题。”镜头外有人问：“为什么不直接说结论？”他指指衬衫，回答“先把这个选择让人看懂”。这正好对应让同一单品承担不同内容任务，也保住了按场景重排切口而非换标题。


      把未知项写成【待绑定事实】，其余段落仍按可直接拍摄的节奏完成。


      片尾不把衣服变成口号。衬衫被折好或挂回，人物的选择留在现场；形成可持续的系列表达。'
    repaired_body_text: 同一件白衬衫，可以陪人去见客户，也可以接住下班后的晚饭局。前一种先看肩线和下摆是否利落，后一种再看面料松开一颗扣后的状态。做系列内容，不是把同一个卖点换十个标题，而是让一件衣服在不同任务里承担不同角色。团队要守住的是同一件东西，改变的是观察它的入口。
