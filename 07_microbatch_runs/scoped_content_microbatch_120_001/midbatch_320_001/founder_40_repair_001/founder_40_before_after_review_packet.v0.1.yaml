  - original_output_id: P7D320-OUT-006
    repair_id: P7D40-REPAIR-006
    original_review_class: B
    original_body: '货架里有一次很小的返工：版师把外套挂上去又取下，因为表面纹理还没在画面里站稳。拍摄者往后退两步，只说“再看一眼”。


      画面的转折不用特效：版师拿起的瞬间，表面纹理和轮廓的关系变了。拍摄者的目光跟着动，理由就站住了。版师把原来的提词卡抽走，换成一句更像现场的话：“把企业选择放进衣服细节。”然后用表面纹理和轮廓先后入镜，让先给犹豫，再给反复做的动作可以被看见。


      这是一段可拍原型，场景成立即可，不把原型伪装成某家店已经发生的往事。


      片尾不把衣服变成口号。外套被折好或挂回，人物的选择留在现场；让价值被看见而非被喊出。'
    repaired_body_text: 样衣间快收工时，版师把两季外套挂到一起。新款更轻，旧款的领型却更稳。团队没有急着给新款找漂亮话，而是重新检查肩线和袖窿：顾客未必记得一季的口号，却会记得每次穿上都不必重新适应。所谓长期，不是永远不改，而是每次改动都知道什么不能丢。
    repair_focus:
    - remove_governance_language
