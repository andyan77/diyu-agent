    left_body: 样衣确认最容易卡在这种小地方。风衣门襟已经顺了，抬手时袖口还是有点坠。产品同事觉得可以往下交，版师又试了一遍，决定收回半寸再看。做衣服很多时候不是遇到大问题，而是大家都看见那点不舒服后，愿不愿意多走一轮。能往下走，不代表这半寸不用管。等袖口改回来，再抬一次手，答案就有了。
    right_body: 样衣快定了，袖口一抬还是有点沉。版师把它退回去收半寸。门襟已经顺，问题只剩抬手时那一点重量。能交和现在就交，中间有时只差这一眼。等改回来再试。
