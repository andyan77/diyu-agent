    left_body: 姜黄缎面总看不准？问题可能在现场的光。做商品颜色记录时，我会换三处光再决定怎么写：顶灯偏冷，布面更亮；桌灯偏暖，颜色会往橙里走；手机屏幕靠近后，纯度又容易被推高。旁边放一件炭灰内搭，差异更好辨。值得存下的只有一个方法：描述颜色时，把当时的光一起记下来。至于显不显白，色卡不能替任何人回答。
    right_body: 我手上是姜黄色缎面，现在直播灯偏冷，颜色看着会亮一点。你平时更多在办公室，还是暖光餐厅？我把它挪到暖灯边，再放一件炭灰内搭作参照，两种状态一起看。这里能说的是当下看到的冷暖和明暗变化；显白不显白，要上身后由你自己判断。告诉我常去的场景，我继续换一组光给你看。
