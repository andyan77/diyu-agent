    left_body: 背带裤腰线总不对？问题可能在肩带这两格。门店做穿法记录时，我会把肩带调两个位置再比较：肩带往上，腰线跟着移；裤脚翻两道，鞋面露得更多；罗纹打底和短开衫最后再加。这个顺序可以存下来：调肩带、看裤脚、再定外层，不要同时乱动三处。它只帮助比较，显不显高仍由本人试穿判断。
    right_body: 这条背带裤先看肩带和裤脚。你平时配平底鞋还是短靴？我把肩带往上调一格，再把裤脚翻起来，你看腰线和鞋面露出的变化。罗纹打底可以留在里面，短开衫最后再加。这里能演示的是怎么调、怎么叠；显不显高得本人上身后决定。告诉我常穿什么鞋，我再把裤脚长度对一下。
