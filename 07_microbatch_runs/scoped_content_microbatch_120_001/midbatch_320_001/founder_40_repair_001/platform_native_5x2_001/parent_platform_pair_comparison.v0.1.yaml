    human_pair_differentiation_review: PENDING
    left_body: 腰带先松一点，我已经把卡其风衣穿上了。领子立住，腰带别系死，往前走两步看下摆。这件别站着猜，动一下才知道腰要不要收。门店试风衣就做三个动作：立领、松腰带、走两步。想看另一种状态，到店把腰带系紧再比一次。
    right_body: 我在店里讲风衣，通常会先让人多走两步。卡其领子立起来、腰带松开时，下摆会跟着人动；腰带收紧后，整件又利落一点。我不急着替人选，只把两种状态都摆出来：“你平时走动多，就看看腰带松开时顺不顺手。”两种状态都看过，再决定会轻松很多。
