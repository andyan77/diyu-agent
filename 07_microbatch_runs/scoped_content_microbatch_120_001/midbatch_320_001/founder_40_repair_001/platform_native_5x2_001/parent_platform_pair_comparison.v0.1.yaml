    human_pair_differentiation_review: PENDING
    left_body: 我正从门口往里走。入口看整组颜色，中岛看搭配；到了端架，我把旁边两件外套收走，只留一件。第一眼没主角，就先拿掉两件。挂通再把尺码排清楚，这趟开店前巡场就完成了。到店时你也可以在门口停一秒，看自己第一眼落在哪件。
    right_body: 开店前巡了一遍。端架挤了三件外套，拿掉两件后主角出来了。入口色块顺，中岛搭配清楚，挂通也好找尺码。陈列有时候不是加，是少说两句。今天先这样开门。
