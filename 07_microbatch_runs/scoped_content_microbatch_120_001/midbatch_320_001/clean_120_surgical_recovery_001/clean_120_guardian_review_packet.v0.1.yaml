    source_body: 店还没开，我正站在驼色大衣墙前分派今天的讲法。买手只说为什么把它放进这批货，陈列师讲它怎样稳住两侧灰蓝针织，导购则准备回答上身先看哪里。只说你这个岗位真正碰过的那一层。三个人不抢同一句，整件衣服反而更完整。
