    body: '傍晚的店里，暖灯把货架照得发黄。一个刚下班的男生取下那件燕麦色的粗针毛衣，先翻开袖子内侧，盯住罗纹收口那一段。棒针织得紧实，罗纹起伏得匀，接头收在腋下缝里，翻出来也不见冒头的线头。他顺着肩往下摸，前片和袖片的拼接压在肩线上，两边织纹对得齐，一路线迹没有一处松垮。


      他信得过的，只有这些眼睛看得见、指腹摸得着的可观察品质线索——罗纹的松紧、接头的干净、肩缝的平整，一样样当场就能核对，不用谁替他打包票。


      同来的朋友把毛衣往他身上一比，问显不显瘦。他没点头，把亲眼看清的一样样讲出来：身侧收了一道弧，下摆略往里扣，穿上是往身上贴的走向；显不显瘦这事，得他对着镜子自己拿主意。


      朋友又说，这针脚这么整齐，肯定耐穿吧。他手指还停在那道平整的肩缝上，没顺着往下滑——一处拼接平，只够说这一处平；不得把局部观察写成整体保证，袖口收口再利落，也换不来"整件穿几年不走形"的准话。这是眼前一小块的局部观察，扛不动一整件毛衣往后几年的分量。


      最后朋友捏了捏面料，说手感这么软，是不是高级羊绒。他停得更久。凡碰上成分、等级、认证这类话，光靠一摸一看断不出来，得往上抬一档，见着白纸黑字才算数。他照实讲，这件的成分与含毛量是【产品事实：成分与含毛量待补】，够不够某个羊绒等级，要看【品牌事实：羊绒等级检测报告与出具方待补】——凭据没到，这句他不替它下，看得见的照直说，看不清出处的先挂着。


      他把毛衣搭回臂弯，往门口走。暖灯正落在那圈罗纹收口上，织纹一起一伏，看得清清楚楚。'
