    body: '周三上新那天，店还没开门，我把三个人叫到那面挂满驼色大衣的墙前，让她们各自说一段。这是我这两年摸出来的做法：同一批衣服，谁看得见哪一层，就只从那一层开口，别替别人讲。


      导购小周先说。她的观察接口，就是试衣间门口那三步路——哪件客人一上身就不肯脱，哪件肩线一提就皱眉。她的内容职责很窄，只讲上身那一刻的反应，落到袖长够不够、领口卡不卡脖子这种细颗粒。


      陈列师阿May接着说。试衣间里的表情她看不见，可她能看见整面墙的呼吸：那件驼色大衣挂在正中，把两侧灰蓝针织衫稳住了；风衣腰带系起还是垂着，直接改这排货的重心。她的信息颗粒度，是一整组的色块和廓形，不是单件的手感。


      轮到我，我讲的是这一季为什么押驼色、押及踝长度，为什么让羊毛混纺打头阵——我看的是更远那层，两个月后还补不补这块料，明年春天它还站不站得住。


      我把这套叫组织生态角色网格：每个角色功能层级配一副眼睛、一段能公开表达的话，各自看得见什么、适合开口讲什么，先划清楚。不同角色的信息颗粒度凑齐，才是一件衣服能公开复用的完整生态视角。谁接手都照这张网格开口，不必去还原谁向谁汇报。'
