    body: '镜头先给货架一个横移。两件同为通勤外套的大衣并排挂着：左边长及小腿肚的直筒款，右边短到胯骨的茧型廓形。我把它们拽到打光板前，手指顺着门襟一路往下捋——做同类对比，我第一步永远是先把能用眼睛看清、口径又一致的东西摆出来。


      版型可以直接比：一个笔直落下的直筒，一个肩窄摆宽的茧型，镜头怼近肩线和下摆，差别观众自己就看得出。长度也好比，长款遮到小腿、短款露出半截腿，我拿卷尺贴着比一下，把刻度摆在屏幕上。面料厚薄捏一把就有画面：右边这件对着灯能透一点光，左边那件几乎不透。门襟的可见工艺再拉个特写，一边是藏起来的暗门襟，一边走了两道明线压线。这些都是同类之间可比的维度，能直接说成差异——谁厚谁薄、谁长谁短，看得见，就当场下判断。


      可弹幕一冒出"哪件更保暖""哪件更耐穿""我穿哪件显瘦"，我就把话收住。这几样恰恰是不可直接比较的维度：保暖得看实测、耐穿得看长期上身、显瘦更是各人身形各人看，谁更高档也不是我一句话能拍板。我不替谁下结论，而是在画面角标里挂一个位置——【证据待补：两件大衣的保暖差异需克重与实测数据支撑】【证据待补：耐磨、起球等耐穿表现需长期穿着或检测结论】。拿不到口径一致的信息，我就把它标成"未知，待补"，让看的人清楚这里我没答案，而不是含糊糊弄过去。


      最后落回使用场景：天天挤地铁通勤，还是周末逛街拍照，你更吃哪种长度和版型，我给你两条路子摆着；那句"到底哪件更好"，留给你自己的衣柜去回答。'
