    body: '打烊前十来分钟，一个导购已经把中岛那摞开衫抱下来想重叠，还顺手要把主推那组换成她偏爱的配色。我按住衣服：先搁着，我跟你走一遍。


      中岛这种叠放，通用摆法我能讲很细。焦糖色灯芯绒工装夹克别摊平，对半叠好立起来码，绒条顺一个方向反光；旁边半身模特上身一件，里头压白衬衫，松一颗扣，接直筒裤，裤缝压中岛边沿。灯往台心收一收，人一走近，眼睛先落到夹克肩线上。这些谁来都摆得出，是摆法这一层，我讲清楚不心疼。


      难就难在再往下半步。她刚问我，咱们这家能不能自己改总部定的这季主题、换主推？这就踩到我不敢替你答的线。我这个零售角色，能做的动作、手上那点动作权限，就那么大一圈；再往里，加盟这条线签了什么、划进哪个片区、条款怎么落，是白纸黑字的制度事实，不是我凭印象能补的。真有客人追问，我只回一句：我们跟总部有这么个合作，别的不往外倒——加盟边界就卡在这句话上。店里谁握多大权限，零售角色、动作、权限关系得对上号，不然三人各改各的，明早这台准散。


      摆法归摆法，规矩归规矩，一个敞开讲，一个先捂住。总部到底放多少自主口子，我手上没有能核对的正式说法，就先把这问题挂着，等真东西到了再答，不靠感觉编个数甩出去。所以这几格我空着：

      【品牌事实：本店这季主推的自主改写口径，也就是加盟/授权信息的泛化改写条件，等总部说法——待补】

      【门店事实：中岛这组夹克的叠位与在架配色——待补】

      【镜头事实：半身模特主镜位与肩线打光角度——待补】

      说完我把夹克领子抚平，退半步看肩线正不正，剩下几格等材料到手再填。'
