    body: 样衣挂在窗边，午后的光斜斜打上去，她把外套翻过来，先让镜头扫一遍整体的廓形，再走到肩线和摆缝，最后才凑近那些藏在边角的手感——她习惯按这个先后来看，外观、结构、细节一层层往里剥，不急着替这件衣服下判断。镜头先停在门襟。一排纽扣孔起针收得很齐，线迹绕着孔壁压了两圈，边上没有跳线也没有毛头。她伸手把袖口翻开，里侧走的是一道包边，布边被整条包住，用指腹蹭过去不刮手。领口压线是双针走的，两条线平行着咬住领面，转弯的地方没有堆叠。她把这些一处处指给镜头看，像在念一份可见工艺节点清单，念到哪儿手就停在哪儿。到这里最容易顺口的一句是“所以它特别耐穿”。她把这句话咽了回去。看得见的只是这几处针脚走得规整、包边包得住布边，至于穿一季两季会不会松、会不会起球，画面里根本没有答案。她改口说：这几个节点的处理是干净的，能扛多久，得等【品牌事实：该面料耐磨与洗涤周期实测结论】补上来再讲，现在只说眼睛能证明的部分。她也没让节奏散掉。工艺节点是有叙事先后的——先给一眼能认的门襟和领口，再引到袖口内里这种要翻开才看见的地方，观众跟着一处处往细看，情绪是慢慢热起来的，而不是一上来就被“耐用”“高级”这类词砸晕。这件衣服在镜头里担了个角色：它不吆喝，只是安安静静地把自己的做工摊开，让人自己看见，愿不愿意相信，交回给看的人。
