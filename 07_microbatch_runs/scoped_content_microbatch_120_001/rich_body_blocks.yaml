    body: '镜前这件燕麦色西装外套，先别急着说它显不显身材。把手掌贴上肩头，你会看到肩线并不压在肩骨正上方，而是往手臂方向落了一指宽——这是结构层面动过手脚的地方，属于版型；而它上身之后从正面看到的那条从肩到下摆的外部轮廓，才叫廓形。版型与廓形区别，说穿了一个在里、一个在外：里头是纸样和剪裁怎么处理，外头是穿上身后镜头里那个整体形状。


      拍这类内容，我习惯让镜头顺着结构节点走一圈。第一站肩线，落肩会让肩部走向变缓、横向张开，画面里人看着不端着；第二站腰线，腰线落点往上提，上下比例就被重新切了一刀，腿的视觉起点跟着抬高；第三站衣长，衣长盖到胯还是停在腰节，重心和宽窄的观感立刻两样。轮廓线、长度、宽窄、松量、重心这些词，我会一个一个对到画面里看得见的变化上，而不是甩一句空口形容。


      松量是最容易被讲飞的一项。别只说很宽很好看，要让观众看见：袖窿到胸围之间空出的那口气，走动时布面怎么荡开又怎么回落。把结构节点与视觉结果的关系提示讲透，观众才接得住。


      至于穿上立刻显瘦这种承诺，我一律不写死。版型词与身材效果承诺的切断，是这套版型廓形剪裁术语内容的底线——真要下这种结论，得挂上真人同角度上身对比【品牌事实：该廓形实穿的显瘦效果需以真人上身对比素材为证】。没有素材，就退回到腰线上提后视觉重心更高这类看得见的描述，不硬塞一个卖点。'
