    body: '橱窗刚擦干净，模特身上那条酒红百褶裙，我理了三回褶子才服帖。新来的助理捏着总部发的陈列卡凑过来，问牌子上能不能照抄一句"今年最显瘦的裙型"。我伸手把她的笔按住。


      做陈列久了就懂一个理，我给自己立了条规矩，叫它异常回退与前复核路由提示，说穿了就四个字：先停后查。裙子我看得见摸得着——腰头收得窄、褶子朝一个方向倒，这些敢往牌子上写，顾客隔着玻璃也看得见。可"显瘦"两字，谁拿尺子量过？证据不够，我不许她硬安，先把这句拎出来搁一边，旁边注清楚缺什么凭据、等谁来补。


      更麻烦的是，这条裙本店到的是哪个颜色、算不算总部说的新系列，仓库单子还没对上。这一步悬着落不下，我叫它节点缺失。真遇上，节点缺失时的回退没那么玄：别硬着头皮往下填，掉头找上一环把准信要到手，空着的地方老实标上【品牌事实：本店本季到货的这条裙子颜色与所属系列待总部核对】。至于"本店首发"挂不挂得上，得上头点头，我们说了不算，就标一句【授权事实：能否标"本店首发"待上级确认】递上去，绝不自己拍板。


      她还没上身试过这条裙，"上腿不勒"也别急着替她圆，标成【角色事实：助理对该裙的上身反馈待补】先挂着。


      牌子背面留了一小格，专收这些没落定的话：一行抄原话，一行写卡在哪、等着谁。这格叫异常项记录，异常项的最小记录格式拢共就这两栏。写不成又怕干巴巴，就拿安全替代表达顶上——把"显瘦"改成"裙摆压过膝盖一寸，走动时那道弧顺着小腿往下淌"。


      助理点点头，重新拧开笔帽。玻璃里那条酒红裙子，褶子正随空调的风，一下一下轻轻荡。'
