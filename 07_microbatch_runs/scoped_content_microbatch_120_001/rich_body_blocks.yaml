    body: '镜头架在窗边，桌上并排摊着两件同色系的羊毛开衫，我把手机竖过来正对着它们开录。这是很多人拍对比视频最容易翻车的地方——一上来就替观众下结论：这件更暖、那件更耐穿。可我摸得到的，只有摆在面前能看见的东西。


      我先讲能当场比的。把两件叠齐压平，用尺贴着后中线量长度，一件到胯、一件短半个巴掌，这是同类之间可比的维度，观众对着屏幕自己也能看出来。接着翻肩线、拎袖窿，讲版型——一件落肩宽身，一件收腰更利落；再捏起下摆掂厚薄，一件双层罗纹压得住风，一件单层贴身。领口、门襟的走线和锁边这些可见工艺，我用微距怼近了拍，针脚匀不匀，一帧就交代清楚。


      真正要按住的是下一句。有人追问哪件更保暖、哪件穿三年不变形，这就到了不可直接比较的维度——保暖和耐穿，是要穿过、洗过、扛过一整个冬天才验得出的效果，我手上没有实测，就不替它背书。我在画面右下角挂一行小字：【证据待补：保暖实测对比】【证据待补：多次水洗后的形变记录】，明确告诉看的人这两项现在是未知项。这就是比较时如何显示未知项——不含糊带过，是把空着的格子摆在明面上。


      最后我把话收回到使用场景：通勤久坐，还是周末逛街遛弯，先想清楚自己要哪种长度和厚薄，再回头看那些能看见的差别。能下的结论只到眼睛能证实的地方，剩下的，等证据到了再补。'
