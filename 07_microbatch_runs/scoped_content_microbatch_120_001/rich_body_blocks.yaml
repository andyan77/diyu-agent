    body: '开场别念参数，先把外套往身上一披。镜头跟着我，从里到外走一遍穿着顺序：打底衫、针织开衫、再罩这件风衣，全程同一光线，谁也别中途换灯——不然你看到的差别，到底是衣服的差别还是灯的差别，讲不清。


      层搭这段我只讲看得见的：领口翻折两指宽，风衣腰带不打死结，用后腰那颗隐藏扣做调节方式，腰线一收就出来。布面怎么垂、袖口怎么堆，你在屏幕上都能看到，这是演示；至于"穿上显瘦""比别家耐穿"，打住，这是结论，我手里没依据，就不硬往你耳朵里塞。


      想夸它挺括不易皱？我换成你自己能验的说法：揉一把再松开，镜头怼近看回弹，回不回、几秒回，你自己数。这就是教育性说明的允许范围——教你怎么穿、怎么翻折、怎么调，不替你下那个"效果"的判。


      比较语言的边界也守着：同类里我只指可见差异，比如这件门襟压线更密；真要说"更好更有效"，得等依据到位我才敢开口，今天没有，那就先挂在一边。


      注意事项表达也搁这句：洗涤和缩水看【品牌事实：面料成分与洗护标注】，按标签条件来，别按我随口记的来。今天出镜的是【角色事实：出镜者身材与身份】，不是人人都得这么穿。演示与证明的区别记牢——过程我给你看，证明交给证据。'
