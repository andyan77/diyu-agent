    body: 镜头先给一个平铺画面：两件同色的羊毛大衣并排搭在木衣架上，一件直筒版型、及膝长度，另一件收腰、下摆短一截。我把手机架好，开口不急着下判断，而是先把能当场看见的摊开讲。这两件属于同类之间可比的维度，我一项一项指给屏幕前的人看：袖口的走线、翻领的压线、纽扣的锁眼，这些可见工艺凑近拍一段特写，谁的针脚更密、谁的收边更平整，画面自己会说话。接着捏起两片下摆对折，让镜头看厚薄——一件对光几乎不透，一件能看到手指影子，这是厚薄的差别，也是不同使用场景的差别：通勤挤地铁，还是周末逛街。拍到这儿，弹幕开始问"哪件更保暖、哪件更耐穿、哪件穿上更显瘦"。我停下来，很诚实地说：这几样恰好是不可直接比较的维度。保暖要真穿一冬、耐穿要洗上十几回才知道，显瘦更是看人、看搭法，我在镜头前站三十秒下不了这个结论。于是我改成只呈现能看见的差异，把拿不准的挂成未知项，字幕打上【品牌事实：克重与成分实测数据待补】【证据槽位：保暖与耐磨的第三方检测结果】。这就是比较时如何显示未知项——不糊弄、不替观众拍板。最后我把两件重新挂好，收尾只留一句能落地的话：看得见的版型、长度、工艺，我帮你摆到眼前；看不见、要靠时间和检测才算数的，等数据到了再来补这条。
