    body: '裁剪台上先摊平这件茧型毛呢外套，模特还没上身。我指给镜头看两处被剪开又重新缝住的地方——肩头往里收的那道弧，还有后背中缝多放出来的量。这些藏在纸样里的处理，就是版型这个词管的事；等模特把它套上，从侧面看它中段鼓、下摆收的那条外形线，才是廓形。要把这两个词分清，其实是分清两件事：一件讲布料怎么被裁、怎么被拼，一件讲上身后镜头里定住的那个形状。


      我让模特慢慢转过半圈，一个结构节点接一个地讲它在画面里换来什么变化。肩线这道做了内收，肩部走向就往里聚，人看着不显方；腰线没刻意去卡，重心落在胯骨上方一点，一整件的上下比例就偏松；衣长停在膝盖上一掌，下摆那圈宽窄，直接决定了走动时布面荡开多大。轮廓线往哪走、重心压在哪，我一处一处让观众自己看，不替他们下结论。


      松量是这件最好演示的一处。让模特抬手、插兜、再坐下，胸前和袖窿留的那口余量怎么撑住又怎么回弹，镜头扫一遍就清楚。


      到了会不会显瘦，我停下不接。结构能讲清线往哪走、量留多少，可"穿上准瘦一圈"是对身体会变成什么样的保证，得有依据才敢开口。没把同一个人穿不同版型的样子都拍下来做对照之前，我只把话说到腰线抬高、视觉重心上移这一层【证据缺口：茧型外套的显瘦观感需同一人同角度换版实拍佐证，来源暂缺】。说完，我伸手把下摆理平，让那道弧线在光里重新落回原位。'
