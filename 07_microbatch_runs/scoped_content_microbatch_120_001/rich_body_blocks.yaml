    body: 同一件卡其色风衣，在货架上待的那几个月里，其实换了好几张脸。刚上身那阵，顾客对它是陌生的——袖口的活动袢、后背的枪挡、可拆的内胆，这些结构没人看得懂。这就是认知进入期：镜头得慢下来，一只手把腰带松松系上，肩线怎么落、立领挡不挡风，一处一处让人看清。此时叙事密度不宜铺太满，一次只讲一个扣子的用法，把结构教育期的重心压在"它是什么、怎么穿对"上。再过一段，风衣不必再自我介绍了，故事就该往搭配走：里面叠一件粗棒针高领，下面换直筒牛仔，脚上一双乐福鞋，从写字楼的玻璃门一路穿到周末的菜市场。这是场景验证期，也是组合扩展期——同一件外套被拆进不同的生活切面，让人相信它经得起日常。教育重心从"认识它"挪到"用它、配它"，画面里的人味也更足：起风时把领子竖起来那一下，最有说服力。到了尾声，衣服走进复盘维护期与退场前的场景延展：不再强调新，而讲它旧一点之后反倒耐看的样子，袖口压出些褶皱，颜色晒淡了半度。陈列也跟着挪——从主推位退到搭配区，和新一季单品并排，提示它仍能组合。把导入期、成长期、成熟期到退场期做成这样的阶段抽象命名，而不绑死在某个具体档期，产品生命周期角色窗口才有了一条能被复述的叙事骨架：阶段与叙事密度关系、阶段与教育重心关系、阶段与陈列更新关系一层层对齐，同一件风衣才讲得出四段不重样的故事。
