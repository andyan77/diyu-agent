    body: 选完图准备写那件燕麦色麻花开衫，指尖悬在键盘上，差点敲出一句「一冬天都不会松垮」。停住，删掉。这话听着提气，可它是会被人当真、照着掏钱的那种硬话，手上没证据撑着，就不许它上屏。先退回最稳的地方：字幕头一行只写眼睛能对着核的——粗针麻花走竖条，牛角扣是哑光的，下摆比常见开衫多压一指。读的人不用替我担风险，也不必凭一句空话就信任我。往后才敢一点点加暖：第二组图放上身，抬手袖口不缩，坐下前襟不豁，风一掀纹路跟着起伏，声气顺势暖上一档——但先摆看得见的，再带那点暖意，次序不能倒，一乱人就飘。真正得摁住的是「显瘦」「零下也扛得住」这类话，一出口就越界，我情愿只讲你眼睛能瞧见的：领口收得高，视线往上带；毛线垂下来不糊在身上。还有句更滑头的差点溜出去——搬「懂行的都认这种针法」替我背书，那是借别人的嘴，没准头，不写。到底多厚实、会不会起球，眼下没有依据坐实，先空着当待补的凭据挂起：【品牌事实：这件开衫的羊毛含量与克重】、【品牌事实：起球与耐洗的实测结论】。数据不到位，一个字都不替它编；出镜的人穿它去过哪儿，也留一格【角色事实：镜头前这个人穿这件开衫的真实场合】，等填。
