    body: '先别急着敲"这件外套真好看"。把镜头怼近点，能讲的东西全藏在细节里。


      我拍一件外套，第一个动作是把袖口往上翻折两道。不是为了造型，是让人看清里衬走线和门襟第一颗扣子的落点。翻折这个动作本身，就是一条能被别人照着复述的路子：观众跟着翻一下，衣服的样子立刻就变了。这就是我说的动作锚点——先有能被指认的实物，再谈感觉。


      再说领口。开多深、翻不翻，直接决定叠装层次怎么走。里面套一件高领，外面敞着门襟，脖子这一段就有了前后两层的呼吸。我让模特把手插进口袋，顺势把腰线提到该在的位置，腰线一动，整个人的比例等于被重新讲了一遍。


      颜色我逼自己收着。一条内容里挂通色组不超过三个色，多了画面就散。这算一种约束锚点：你先认下取舍，张力反倒出来了。


      有人追着问卖点。"销量第一"这种话我不写——【品牌事实：该款所属系列与上市时段】还没核对，我宁可空着，也绝不替品牌硬编。观众真正记得住的，永远是眼睛能抓到的那几处：一道翻折的袖口、一颗门襟扣、一段被提起的腰线。把这些一处处递示出去，比堆十个形容词都顶用。


      【角色事实：出镜人身份与合作关系】先留位，对齐后再补。'
