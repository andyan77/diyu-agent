    body: '先别急着往模特身上套衣服。做陈列最怕的就是一上来就动手，风衣还没熨、层板已经断码，摆到一半只能全拆重来。


      顺手的做法，是把它当成一套陈列动作 SOP 节点框架来走：陈列前检查、实施、复核，这三个一般节点像台阶一样一级一级往上踩。每个节点都有自己的节点输入与节点输出。陈列前检查这步，节点输入是空货架、待上身的针织衫和阔腿裤、一台还没热的挂烫机；节点输出，是熨平的衣服、备齐的衣架、擦净的模特底座——这几样凑齐，才算摸到这步的完成标志。


      节点之间的依赖顺序是焊死的：前一步的节点输出没交出来，下一步就别启动。手里的衬衫还皱着、正挂的钩子还缺俩，就先别进实施，不然搭出来的那组风衣配阔腿裤，远看就是一堆没精神的布。


      实施，就是把脑子里的画面落到挂通上：模特换上风衣，敞着穿，里面压一件高领针织，下面接阔腿裤；侧挂按深浅走一道渐变，针织衫叠成一摞一摞的小方块。收尾进复核：退到三步开外眯眼看整组的呼吸感，把歪掉的肩线拉正，再对着心里那张图逐格比一遍。


      想把这套框架落到你那家店，还差几样现场事实，我先给你把位置留出来，别硬编：


      【门店事实：这次上新的具体货品清单与实际到货尺码】

      【商品事实：主推风衣的颜色与可搭配的下装款式】

      【镜头事实：出片要拍的机位、光线与出镜模特】


      这几个空位没填之前，节点可见化表达先画成一张三步流程图贴在操作台边——谁做到哪，缺了哪个节点输出，一眼就看得见。'
