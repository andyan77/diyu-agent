    body: '镜头前摊着三件衣服，博主没急着报卖点，而是先做一个动作：把手里这件往身上一比，问自己它落在哪一格。这套开场就是把品类解释与属性槽位骨架用出来——任何一件衣服上镜，先定位，再展开。


      她先把大类分成四摞：贴身穿在上半身的算上装，套在下半身的算下装，一件到底、不用另配的算连衣类，罩在最外层、能脱能穿的算外搭类。四摞摆开，观众一眼就知道今天这件站在哪儿。定位这步不能省，也不能跳，顺序颠倒了，后面全乱。


      位置定好，才轮到逐层打开属性槽位。她拿起一件上装，先说领口是圆领还是翻领，再说袖长到哪儿，接着捏一下料子，进到面料/材质槽位——是偏挺括的梭织，还是会垂坠的针织；至于这件几支纱、多少克重，留一格【品牌事实：该件面料成分与克重待吊牌数据补入】，不凭手感瞎编。这些格子按结构从上往下一个个开，手指点到哪儿，字幕就落到哪儿，观众跟得住。


      镜头最容易翻车的地方，是刚定完位就滑到"这件卖得最好"。这句和结构没关系，是该切断的部分。想夸耐穿，就退回能看见的：克重、织法、走线密不密；真要下"更耐穿"这种结论，就挂一条【证据待补：该面料耐磨结论需实测数据支撑】，不硬说。同样，"上身显瘦"也降到"高腰线把下半身比例视觉拉长"这种眼睛能验证的话。


      一件讲完换一件，还是这套骨架。观众带走的不是某一件，而是单品解释时可使用的通用属性槽位——换季、换款、换类目都能复用。'
