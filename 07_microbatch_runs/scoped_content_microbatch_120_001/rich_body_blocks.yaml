    body: '新来的陈列师【角色事实：陈列师姓名与到岗时间】第一天单独整靠窗那排挂通，手停在一件砂色棉麻衬衫前，卡住了。她过去的做法是按色阶从浅到深挂满一整杆，远看齐整，顾客走近却什么都没记住。店长的话很直：整排都"还不错"，就是整排都没被讲清楚。


      她把那件衬衫单独取下来，只动了领口——最上面两颗门襟解开，让领子往外翻折出一个立起来的角度，锁骨那截线条一下被拎了出来。有了这个能被手指点到的地方，顾客的视线先咬住这道翻折的领口，再往下走到腰线束进去的那一寸，最后落到袖口卷起的收束。她把这条看的路径整杆复制，让每件衬衫都以同样敞开的领口朝外，排成一条顾客能照着复述的反模板叙事锚点。


      换来的，是她得砍掉一半颜色。这排挂通色组她只留砂、白、烟灰三档，多添一色，那个领口的角度就被别的东西抢走了。腰线以下她故意不做叠装层次，留出大片空，让上半身这几处动作独占眼睛。


      至于这批衬衫棉麻各占多少、算不算本季主推，【品牌事实：面料配比与本季主推系列】还没落定，她宁可把吊牌那行留空，也不肯替品牌抢先编一句。走之前她回身，把最外那件衬衫的领口又往外压实了半分，让那个立起来的角度正对进门第一眼。'
