    body: '夜里快十点，直播间的补光灯一盏盏灭下去，只剩桌角那台还亮着。负责第二天口播稿的男生把一条靛蓝色水洗直筒牛仔裤平铺在桌上，指腹顺着裤缝来回蹭，布面粗粝，压手，双针车缝的线走得又直又密，膝盖那块坐下也不见松垮。他端起早凉透的茶，开始敲字。


      第一句他打出的是"这条越洗越耐磨、久坐一天照样不走形、上腿立刻显高"。敲完盯了两秒，又逐字往回抹。手里这条裤子的水洗测试还压在样品袋里没送出去，面料克重的单子也没回来——他心里那本账很清楚：话头一旦从"我刚摸到的"滑到"它能扛几年、能洗多少回"，就撞上了那道 source gap 触发阈值，没有底就先把结论按住。耐用、耐磨这种硬话，是得送检、拿得出对应证据类别才敢落笔的重档，跟随口一句"上身还算舒适"压根不在一层；他给自己排的那套 claim 分级里，硬话配硬证，一寸不让。


      于是稿子被他改成镜头能怼上去拍的样子：裤脚锁边压了两道、后袋封口打了枣、洗水的纹路深一道浅一道。这些是眼能看见、手能摸到的东西，不是他替这条裤子提前落的判断。连"显高显瘦"这类上身效果他也不写死，只留客人试穿时裤线垂到鞋面的那道剪影。真正关于性能和品质的那一格，他空在那儿，挂上一条待补的槽——【耐磨与克重证据：水洗测试结果及面料克重数据待补】。


      灯又暗一盏。他把牛仔裤叠好搭回椅背，明早那份单子到不到、稿子里最响的那个形容词等不等得来，都压在样品袋那张没回的纸上。'
