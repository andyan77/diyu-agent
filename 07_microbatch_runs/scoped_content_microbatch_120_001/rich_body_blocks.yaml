    body: 镜头从一件搭在椅背上的卡其风衣开始。手先落在衣领，这是动作起点——不急着穿上身，而是把领口往里翻半寸，让原本贴颈的硬领松成一道斜口。镜头跟随手腕上移，停在袖口：两折翻起，露出内搭针织衫的螺纹边。每一个动作都配一句极短的解释槽位，不讲道理，只报可见变化——领子软下来了、袖口露出一截。这就是强观察/弱解释的组合方式：观众眼睛先看见，脑子才慢半拍反应过来为什么顺眼。一段完整的动作镜头起承转合被拆成三小节——起，是空衣服静静搭着；承，是手介入、面料被改变形状；转，是套上身、腰带一收出现腰线；合，是转身定格，给一个能停住的完成判断：下摆是否落在胯骨最宽处、门襟是否对齐。到这里，看的人自己就能照着做一遍。但这只是可复用的演示骨架，不是能直接发出去的成片。真要落到具体一条，还缺几样现场事实，得留成槽位：【商品事实：这件风衣的实际颜色与面料成分】【门店事实：拍摄用的试衣镜位与背景墙陈列】【镜头事实：跟拍这段动作的机位与运镜节奏】。填进去之前，画面里不摆任何编造的在售款，也不假装某家店的角落已经布置停当。至于每条要压多长、画幅怎么切，平台提示仅作为研究注释，先不写死进正文。
