    body: '镜头架在旧木桌前，她把一件砖红色的灯芯绒衬衫抖开，绒面的纹路顺着光扫过去，像一排细窄的田垄。补光灯偏暖，衬衫的色相往橙里挪了一点；她伸手关掉一盏，只留窗口漏进来的天光，整块布立刻沉下去，冷了半度，明度也跟着压低。评论区总会飘来这么一句："这件到底显不显瘦，显白吗？"她盯着那行字停了两秒，没顺着往下接。


      她改口讲能被看见的：这是个偏暖的砖红，纯度不算高，发一点旧、发一点哑；它不算中性色，是有脾气的暖色，落在暖色那一支色彩家族里，跟正红隔着好几层。她提醒屏幕那头，颜色会在不同光线里换脸——补光灯下比窗光艳，手机录出来又比肉眼提亮，所以她报的从来不是一个板上钉钉的色名，而是"暖调、偏哑的砖红，直播灯下拍的"。冷暖先说清，明度、纯度也一并交代，看的人手里就攥着一把尺子，能拿去比一比，不至于让一句空话把他拽走。


      至于显瘦、显白、料子比别家高档——这几句她一个字都不往外说。那不是她眼睛看见的，是替观众的身材和判断打了包票。真要落到"上身收腰、显瘦"这种话，她把它收进【上身效果：需真人多体型试穿实拍佐证】；这块绒面到底几股纱、耐不耐磨，也挂成【单品信息：面料成分与耐磨表现以吊牌及检测为准】，等材料齐了再开口。她把衬衫重新挂回衣架，镜头推近领口那排扣子，只补一句："想看上身，等我把试穿那条拍好。"'
