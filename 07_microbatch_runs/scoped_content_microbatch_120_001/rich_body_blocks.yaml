    body: 清晨拉开卷帘，光斜切进店堂，第一组镜头交给最普通的开场准备类动作：把昨夜叠乱的针织衫重新码平，领口对齐，袖子折进去，指腹沿门襟压过一道，让堆在层板上的一摞衣服重新立起边线。这段整理不必任何台词，动作前提清清楚楚——一摞未理的衣服；结束标志也清清楚楚——层板上一条齐整的边、一只手退出画面。门店日常动作观察切片要抓的正是这种一眼看得懂起止的小事，而不是笼统地拍一句门店很忙。第二组交给比对。把两件同色系的外套并排搭在手臂上，退半步，让顾客视角里的它们互为参照：一深一浅、一挺一软，肩线在光下谁更利落。比对的动作对象是衣服本身，镜头贴近材质，绒面吃光、府绸反光，差别自己会说话。第三组交给讲解与递示。手指点过驳头一处翻折，说清它为什么这样收；随后把叠好的衬衫双手递到镜框边缘，动作停在交接那一秒——这就是递示的结束标志。这几段串起来，讲的是动作与场景道具的最小关系：手、衣服、层板、光，四样就够。但要真正落到某家店面上，以下事实必须现取，不能凭空：【门店事实：当日该店层板区位与采光朝向】【商品事实：入镜款式、颜色与材质名】【镜头事实：机位高度与景别顺序】。凡触及真实店员的可辨认脸孔、对话或业绩，一律先撤出画面或挂为待补来源，画面里只留可复用的一般化动作。
