    body: '清晨的橱窗前，一件藏青风衣挂在最外侧。姑娘伸手把袖口翻过来，指腹先落在收口那一圈——针脚密而齐，没有跳线，翻折的边压得平。她没急着说这件耐穿，只把看到的说出来：这处收口做得干净，起码在袖口这一小块，线迹经得起翻看。


      她顺着肩线往下摸。前身与袖片的拼接落在肩头偏后，接缝两侧的布纹对得上，走线没有明显的皱起。这些都是能被眼睛和指尖确认的可观察品质线索，可她心里有一条：局部观察只能撑起局部的话。一处拼接平整，不等于整件都平整；她给自己立过一条规矩——不得把局部观察写成整体保证。


      镜子里，她把风衣披上身。有人问是不是显瘦，她笑笑，把话往回收：版型在腰侧收了一道，上身线条是往下走的——这是能看见的样子，至于显不显瘦，得穿的人自己站进镜子里才算数。面料的成分与克重，她没凭手感乱下判断，标签这一栏是【产品事实：面料成分与克重待补】。


      顾客追问，这算不算高级面料、有没有认证。她停在这儿。凡碰到认证、标准、等级这类说法，就不能靠一眼看、一手摸就点头，得往上走一档，见着实打实的凭据才行。她如实讲：认证与等级的凭证是【品牌事实：面料认证与等级证明待补】，拿到之前，她只讲能看见的——颜色正、线迹齐、这处收口利落。


      她把每一处当成一个品质观察项来看，最后把风衣挂回去，指尖顺过那道拼接。好的产品故事不在于把每句结论都说满，而在于看见什么说什么；说不清出处的，先按住。'
