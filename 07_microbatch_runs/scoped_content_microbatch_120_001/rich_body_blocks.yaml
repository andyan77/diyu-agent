    body: '午后的店里没什么人，一台手机架在三脚架上，镜头正对着中岛的陈列台。台面上摊着一件橄榄绿工装夹克，两个大贴袋鼓鼓的，袖子随手压在一叠焦糖色灯芯绒裤上。拍短片的姑娘蹲在一旁，没急着念稿，只盯着一个进来试衣的男生——他抖开夹克、翻起立领，又低头去看门襟那排铜扣，指尖在领口连接的那道缝线上来回蹭。这一下，才是她真正要的观察对象。


      镜头先把场景提示喂足：台灯压下来的暖光、贴袋边缘磨白的一小截走线、下摆刚好盖到胯骨的那段长度，这些画面自己就替她讲了半句话。搭配条件她也只肯给一句——里头衬件米色高领，脚上换双厚底德训鞋，整套的分量往下半身压。轮到陈列主次，夹克摆在最前，灯芯绒裤退半步、站到暗一点的地方，谁先被眼睛捞走，一看就分得出。


      该收那句话时，她把原先写好的"错过再等一年"划掉了。但凡得拿证据才敢下的判断——耐穿、显高——她一律先压着，不替这件夹克认下没影的好处；这条 CTA 与商品事实的隔离，她守得比谁都死。收尾只留一个动作：给这句话补上 CTA 与陈列/场景的连接点，把人拽回刚才那个翻立领的画面，而不是硬甩一句结论压下来。她对着镜头说的是——"下回路过，帮我把这排扣子挨个扣一遍看看"。至于摆在店里哪个角、跟哪几件凑一组，她留给【本季实际陈列位与联名搭配单品，以落地为准】那一栏，不写死在片子里。这份收着劲，就是叙事到 CTA 的非硬卖边界。


      关补光灯的时候，那男生还没走，又对着镜子把立领翻了一遍。'
