    body: '下午收拾橱窗，陈列师把一条雾蓝色直筒连衣裙套上人台，没急着写吊牌旁那行小字。她用别针在背后收了一道，让布面贴合又不勒——这一收，动的是纸样和剪裁，属于版型；人台正面那条从颈根垂到裙摆的外形，才是廓形。要说版型与廓形区别，她让人先摸后看：手指探进去碰到的是缝份走向，眼睛在外头收下的是整条轮廓线。


      摆弄时她盯着几处结构。肩缝没压在人台肩点上，往外偏了些，肩线一松，上半身横向就摊开；把腰线的接缝往上挪半寸，裙子上下长度的比例立刻换了个分法；衣长停在小腿肚还是压到脚踝，重心落点和整体宽窄又是两副样子。这些看得见的变化，她对着人台一处处指认：宽窄、长度、松量、重心，每个词都落到布面上一个点，不是空喊。


      松量最容易写飘。她不写“很垂很显瘦”，只记下腰侧留出的那口余量，让裙身走动时荡开一个弧度。轮到写效果，手停在键盘上——本想敲“上身立显高挑”，想想删了，那是替穿的人身材打包票，超出一条裙子结构能担保的边。她改成“接缝上提后视觉起点跟着抬高”，把承诺那半句挂起来等素材：【品牌事实：这条裙子的显高说法需一组真人同角度上身对比照支撑，目前空缺】。这版人台进不进本季橱窗还没定：【陈列事实：此人台廓形方案能否落地，待排期确认】。她拔下最后一枚别针，退后两步，眯眼把裙子从头到脚又扫了一遍。'
