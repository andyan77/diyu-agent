    body: '先说个我天天在店里碰到的事。同一件外套，在橱窗、在短视频、在店员嘴里，其实不是同一个"人"。


      橱窗里它是主角，灯打在肩线上，人一进门先看它。换到那条搭配短视频里，它退成陪衬——被讲的是里面那件针织开衫，外套只负责撑住画面、给开衫让位。再到店员领客人从新品区走向试衣间那段路，它又成了过渡，一句"这件直接套阔腿裤就行"，把两个区缝到一起。


      我带新店员，头一件事就是让他们分清这三种身份，别一上来全按主角讲。这就是产品与角色语气的关系：橱窗走品牌旁白式表达，克制、留白，让衣服自己说话；到店员这儿切成导购式表达，能搭话、能追问；客人要是问"这块为啥这样收边"，才用设计解释式表达，把面料和版型讲透，这一下就成了教育节点。


      至于产品与 display 动作的接口，说白了就是摆的时候留没留出后面能讲的钩子。挂反了、灯偏了，话就接不上。


      但我得划条线。加盟店改文案，最容易犯的错，是把这套产品到角色到叙事跨域关系，硬改成"第几秒说什么、手往哪指"的死流程图，一步不许差。那就过界了。我们给的是提示，不是命令：这件衣服在这段大概演什么，话你按自家客群自己接；真到要写死每步动作那刻，就该停手。


      补不齐的事实我明着挂：【品牌事实：本季这件外套主推的系列名】【产品事实：外套面料成分与主要卖点】【角色事实：本店主力客群与所在商圈】。没核实前，谁都别替它编。'
