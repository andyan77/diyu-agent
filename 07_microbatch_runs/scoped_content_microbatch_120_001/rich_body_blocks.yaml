    body: '我带店八年，如今多了一摊活：帮门店写挂在橱窗屏和小程序里的短文案。刚上手那阵，我总爱把老顾客的故事整段搬进去——谁上周来试那件卡其风衣、说要去见客户、临走还夸店里灯打得好。写完自己看着挺得意，第二天就被叫停。凡是能指认到某个真人的痕迹，我现在一律划掉：具体长相、家里几口人、原话对白、成交那点业绩，都是不可写的真人痕迹，落到墙上等于把人家的私事挂出去。


      那留什么？留一个「懂行的讲解者」就够了。她可以是个没有脸的声音，帮你把那件卡其风衣的门道说清楚：领口立起来挡风，袖口有暗扣收一收，配一条阔腿裤走起来带风。这就是允许的人设表面层——有职业的手感，却认不出具体是谁。


      写的时候我盯两件事。一是语气强度与场景强度匹配：橱窗里那件羊毛大衣安安静静挂着，我就不喊「必入」，让画面替我说话，落到观察化表达——垂坠压住肩线，下摆到小腿肚，风一过纹丝不动。二是碰到高风险断言先停手。凡是「这件穿三年不起球」「防泼水绝对不渗」这种关乎耐用和效果的话，语气放再软也没用，事实那一关照样过不去。我会在高风险 claim 前的降调与限制语上多琢磨，改成「就我上身这阵子的感受」，或干脆留一句「面料的具体数据我再去核」。这套语气校准与去人物化的手艺，说穿了就是：把人味留住，把会惹麻烦的那半句先咽回去。'
