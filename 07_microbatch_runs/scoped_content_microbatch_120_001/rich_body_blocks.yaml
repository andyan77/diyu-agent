    body: '先把一间店的走动路线拆成几段景别。人从门口进来，第一眼落在入口区：这里不摆单品细节，用远景交代空间关系——一排风衣挂在门侧的挂通上，肩线朝向过道，颜色由浅到深铺开，镜头退到三四米外，把顶灯、地面反光和衣架排布一起收进画面，这是远景该干的活，负责第一印象。


      往里走两步到中岛。中岛是成组展示的位置，把一件针织开衫、一条直筒裤、一只帆布托特包摆成能看懂的搭配组，镜头收到中景，人半身入镜，手正搭在开衫袖口上——中景交代的是这几件怎么配到一起，不是某一件的纹理。


      再走到端架。端架适合压上一件重点单品，比如一件廓形大衣，让近景怼上去：翻领的缉线、纽扣的光泽、袖口的罗纹，一寸一寸看清楚。近景收的就是单品细节。入口区给远景、中岛给中景、端架给近景、挂通铺系列，这条路线就是从区位到镜头的最小映射，一趟走完，远景-中景-近景的观察切换也拍完了。


      以上是通用打法，可以照着排镜头。真正落地时，画面里的店、货、人还得对齐现场：具体门店的走位与灯位见【门店事实：入口区到端架的实际动线与光源方向】；压端架的那件重点单品见【商品事实：本次主推单品的款式与颜色】；出镜的人和拍摄机位见【拍摄事实：出镜角色与近景机位安排】。区位类型是抽象的，别把它写成某家店的真实货架；每类区位挑出来的，才是静态陈列中的可拍摄重点。'
