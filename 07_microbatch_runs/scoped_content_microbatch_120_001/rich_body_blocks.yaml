    body: '直播间开播头五分钟，飘进来的人混得很：一半纯路过、指尖一划就走，一半是蹲了好几场的老面孔。同一件卡其色系带风衣，你要敢一套嗑讲到尾，准有一半人中途溜号。


      先说划进来的生客，多半在新客阶段，卡在“这类风衣到底怎么回事”的了解阶段。隔着一层认知落差，你张口就报面料配比、暗门襟怎么走线，全喂进了空气。给他一个眼睛能一把抓住的：风衣往身上一披，腰带随手绕一圈打个活结，下摆量感荡开，人立马精神。


      蹲场的老粉是熟客阶段，愿意守着等你上手，你才好把里子一层层揭开：这件风衣收在腰上还是盖过胯、扣子扣到第几颗最挺括。同一件风衣，生客熟客两副讲法，把不同阶段对应的信息深浅摊开，也就这点门道。


      还得盯一处：观众的停留时长和互动热度不齐，话的密度也得跟着收放——划两秒就走的开场，字要抠着放；肯守到底、边看边扣屏的那拨，才敢往深里堆。这正是受众距离与信息深浅轴上最见功夫的一格。真要连屏那头站在哪一格都看不清，decision stage 根本读不出来，就先别硬拨粒度，宁可讲浅。


      记死一条：这套轴拨的只是讲深讲浅，从不替谁认领他是谁、买过哪件、偏爱哪个色。万一脚本里溜进谁的真名真单，先撤下来或挂起。老客的既往喜好真要提，只能挂着【顾客事实：老客既往偏好，须本人确认后才可引用，未核实前留空】。这件风衣的真底细同理，留【品牌事实：这件风衣本季实际的面料配比与防风表现】；我凭什么开口讲外套，也空一格【角色事实：出镜主播在外套品类上的真实从业背景】。回填之前，先让镜头怼住那截刚系好的腰带活结，别急着报参数。'
