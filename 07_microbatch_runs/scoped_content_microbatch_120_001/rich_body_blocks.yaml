    body: '拍这条秋装的时候，我在镜头前先给自己立了三根线。


      第一根，能看见的照拍，看不见的别吹。模特一转身，这条高腰直筒牛仔裤把腰线往上提了一截，腿看着利落——可我嘴上只说"腰线落在这里，视觉上腿会拉长一点"，不敢直接甩一句"穿上更显瘦"。显瘦是个结论，结论得有人认；没人认，我就把它压回成能看见的画面：光打在裤缝上，垂下去是直的。


      第二根，凡是要靠某一个具体的人才成立的话，我一律先停。有个同事想加一段员工经历，就是【角色事实：这位老员工的从业年限与真实经历】，说这样有人味。人味我要，可那段没经过本人点头，我先挂着，材料齐了再上，不齐就不上。同一条线也管顾客反馈——有人想把评论区的好评直接搬进文案，可那属于【品牌事实：可公开引用的顾客原话与授权凭据】，没授权我不搬，只写"面料是这个克重，手感偏挺括"，把夸奖还原成能摸到的东西。


      第三根最硬。碰上奖项、排名、认证、更耐穿这类词，我一个都不自己下笔。这件风衣到底拿没拿过【品牌事实：可核验的奖项或认证名称与年份】，不知道就不写；"更耐穿"要么挂着等测试，要么改成"双层压胶、走线密"。真撞上门店事件、或者带承诺口气的说法，我不改也不删，直接转给能拍板的人复核——这种边界不是我一个写稿的能定的。


      三根线立完，这片子反而好拍：能拍的全是真东西；吹不出去的，就老实留个口子，等它变成真的再说。'
