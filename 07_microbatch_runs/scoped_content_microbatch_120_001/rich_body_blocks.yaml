    body: 一件羊绒混纺的大衣，从一卷布到能挂上衣架，中间要过好几双手。故事真正的张力，不在成品有多好看，而在每一次"为什么这样选"。设计角色先定了调子：领口收窄、下摆放大，让人走起来有摆动。可这一版到了版型角色手里就卡住了——布厚，收窄的领口一压就起皱。两个人在选料节点前后来回磨：换轻一点的里布，还是把领口的弧度改缓？最后选了改弧度，代价是那点利落的线条要让一步。把这个选择和它对着的约束一起摆出来，别人才信这不是随手画的。打样节点做出第一件样衣，试穿节点上真人一穿，问题全露了：抬手时后背发绷、口袋位偏高。改，再打样，再试穿。导购角色这时被拉进来提前看货，她盯的是顾客会不会一上手就问，这袖子活动得开吗。真正让人踏实的，是后面那道复核门。衣服进包装前，要过质量门、复核门、交接门三关，每件都翻开里子看走线、对扣位。这里有条边界得守住：可以讲这道二次确认一直都在，却不能顺口报出某一批到底挑出几件返工——那是账本上的数，不是随口能讲的故事。陈列角色最后接手，把大衣挂在进门第一排，肩线朝光。它身上每一道被磨过的选择，这时候才算真正翻译成了顾客愿意伸手去碰的理由。
