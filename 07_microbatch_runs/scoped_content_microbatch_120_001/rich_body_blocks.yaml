    body: '一件米白风衣第一次挂上镜头前，拍它的人只想让人先记住它的轮廓。这是它在产品生命周期角色窗口里的认知进入期——画面不必堆搭配，一个人抱着热咖啡穿过清晨的路口，风把下摆掀起一个弧度，镜头停在肩线落下来的那一刻。不说它多好，只让它被看见。


      过些日子，同一件风衣走进结构教育期。内容开始贴近细节：插肩袖抬手为什么不勒，腰带松松系住时腰线落在哪儿，翻领立起来能挡多少风。这一段愿意慢下来讲一处剪裁，看的人也愿意听，这正是阶段与叙事密度关系在起作用——越往后，一条内容能承载的讲述越厚。


      到了组合扩展期，风衣不再是主角，而成了场景里的一个角色。它搭在针织开衫外走进地铁，套在连衣裙外赴一场晚饭，配白衬衫和阔腿裤时又像换了个人。内容不再教你认识它，而是让它替不同的人出场。


      场景验证期里，镜头退远，看它在真实的风里、雨后、久坐起皱的样子——皱了反倒像有人真穿过。复盘维护期再回头，把最耐看的几帧重剪，阶段与陈列更新关系也跟着换季推进，橱窗里那件样衣悄悄挪了位置。


      判断一件衣服走到窗口的哪一段，是为了知道这条内容该说什么、说多密，而不是替它算一笔卖了多少的账。那种真实经营数字，没有来源就先空着，不塞进画面充当结论。'
