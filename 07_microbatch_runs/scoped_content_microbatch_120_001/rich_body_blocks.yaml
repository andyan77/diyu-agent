      这里要按住一句话。很多人写文案时顺手就写"这件穿上显瘦、够耐穿、一看就高档"——停。这类硬结论没有可核对的来源，一律改成能被看见的描述：不说显瘦，说腰线收在腰节、下摆向内微收；不说耐穿，说走三十步后袖肘没有起皱回弹的痕迹——这一句得挂成待补证据【证据事实：耐穿与回弹实测，先挂缺来源】，等实测再补。色彩之间可以讲呼应与轻重，讲主色怎样把辅色兜住、点缀色在哪里点一下节奏，但别写成"这组色让人放松"，情绪保证越过了系列感与节奏感的表达边界。


