    body: 把那件雾蓝色的针织开衫从衣架上取下来，先别急着开口夸。走到窗边，让天光落在袖口和螺纹领口——这一刻它偏灰、偏冷；再退回屋里，暖光一打，同一片织物立刻泛出一点土黄，色相像往绿里挪了半步；最后举到手机镜头前，屏幕又把明度抬高一档，纯度也比手上看着更扎眼。一件衣服，三种光线，三张脸。所以拍这条穿搭内容，我先给自己立了条规矩：说颜色，先交代是在哪种光线下看的。把光线、冷暖、明度、纯度、色相这几个颜色基础维度当成描述的骨架，而不是张口报一个绝对色名。窗光下我写"偏冷的灰蓝"，暖光下补一句"会泛黄调"，让屏幕那头的人自己去对，而不是替他下判断。镜头扫过前襟的扣子和下摆的罗纹，我会说这颜色让人想到清晨没散尽的雾——氛围尽管联想，可话一旦滑到"穿上显白""看着显瘦""比别家更高档"，就得当场切断。那几句不是我看见的，是替观众的身体和钱包打包票。至于它到底是什么成分、准不准这个色名，一律挂成【product_anchor：单品成分与官方色名以实物吊牌、打样为准】；要说得上"耐洗不掉色"这种硬话，也先收进【brand_claim：颜色牢度需检测报告或复洗记录佐证】，有据再补，绝不先替衣服开口。
