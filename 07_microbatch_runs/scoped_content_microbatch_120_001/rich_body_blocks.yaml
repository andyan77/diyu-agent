    body: '刚上手的搭档把一整组白衬衫素材塞过来，说想趁热挨条发掉。我按住她：这么发，三条下去就自己打架了。


      发之前得先掂量一件事——这批东西够不够撑成一条线。要是手里只剩零散的一条，这套跨形态资产的串法根本使不上劲，硬套只会空耗，那还不如把那一条讲到底。可这回是同一批出的白衬衫、结构感西装外套、及踝半裙，三件同源，就值得往一根轴上码。


      先把主次分清。白衬衫当全场主角，西装外套卡中段做转场衔接，半裙压到最后收口，品类角色一钉死，哪一段轮到谁开口就有了准数。真正的坎在后面：挨着的两条不能讲重。同是这件白衬衫，头一条图文放进写字楼见客户，镜头咬着版型变化，看肩线立不立、下摆收不收；接着那条短视频立刻换口子，把衬衫掖进半裙赶一场晚饭局，改说面料取舍——为什么留下这块洗过多水也不发塌的，撇开手感更硬那块【品牌事实：该款衬衫的成分与克重】。


      一条一个入口，场景任务各占各的格子，人才不会两眼就看腻。压轴那条索性不上人，镜头顶着衣架：白衬衫和西装外套怎么错落挂、颜色怎么咬，把陈列关系一次说清。每翻过一个流程节点，机位、语气、要点全换新。至于这串到底叫什么名、还能牵出哪几件，我一路留着不填【品牌事实：可对外引用的系列名称，以及能一并带出的其他单品】【角色事实：出镜者身份及其适穿的身形范围】——没有真事实垫底，就让槽位空着，绝不顺手编一个糊上。'
