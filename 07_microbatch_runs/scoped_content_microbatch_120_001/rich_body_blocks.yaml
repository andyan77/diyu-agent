    body: '同一件风衣，我拍了六条，没有一条撞车，秘密全在系列轴。


      先看反面：早期我三条都在喊"这件风衣真好看"，观众照样划走。毛病不在风衣，在于我压根没定轴。系列轴一旦落定，这一批内容的座次就排好了——谁讲什么、相邻两条靠哪个维度拉开距离，都被它锁死。


      这次挑的轴是"一件衣服的一天"，从清晨排到深夜，一个场景任务对应一条。开篇走图文：风衣套白T和阔腿裤，挤早高峰地铁，镜头只盯肩线塌不塌、抬手勒不勒。第二条转短视频，风衣披在针织裙外走进咖啡馆，怼近门襟讲面料取舍——为什么挑这块不起皱的料子，而不是更挺括那块【品牌事实：本季风衣的面料成分与克重】。


      第三条必须换切入点，否则又和前面重。去重复机制这时候顶上：风衣退到背景，换卫衣接棒讲版型变化，同一个人 oversize 和收腰两种穿法并排出镜，陈列关系上一左一右挂着，差别一眼比出来。品类角色轮流坐庄，风衣当串场，卫衣、针织各领一段，谁也不抢谁的话。


      每条结尾留个扣子勾住下一条："今天先看肩线，明天看她怎么把这件穿去夜场。"直到收尾那条才把成交价值收口，落地信息老实留槽【品牌事实：该系列可延展单品清单与主推色】【角色事实：出镜模特身份与体型区间】，绝不瞎编。'
