    body: '镜头先给的不是衣服，是清晨还没醒透的走廊——女孩抱着一杯热水，光从窗棂斜切进来。这时候那件卡其色风衣才慢慢入画，它不急着抢戏，先在门口的椅背上搭着，像一个还没开口的角色。这就是产品在镜头中的首出现位置要解决的事：不是把商品硬塞给看的人，而是让它有理由出现在这段生活里。


      想清楚一件衣服在这段内容里到底演谁，是动手拍之前最该定的。给它一个角色功能命名方式：它是这段故事的主角，还是用来反衬旧外套臃肿的对比项，是替换掉那件不合身大衣的解决项，还是从室内过渡到出门那一秒的过渡项？身份定了，产品与场景任务的绑定方式也就定了，叙述的位置随之落位。定成主角，风衣就该在腰线一收、门襟半敞的动作里被看见；定成过渡项，它只需在玄关被拿起、披上，镜头就走。


      接着才谈细节作证。手指划过面料纹理那点微微的斜纹起伏，领口翻折时露出里衬的一小截颜色，走动时下摆带出的层次变化——这些不是卖点清单，是让角色站得住的证据。搭配重心压在下半身，上面就留白；重心提到肩线，风衣就得敞开让内搭说话。


      这套入场框架只在真有一件能担戏的衣服时才成立。要是这段内容里没有哪件单品能承担叙事，硬给它派角色，就只剩空壳。产品是来演一个角色的，不是来念台词的。'
