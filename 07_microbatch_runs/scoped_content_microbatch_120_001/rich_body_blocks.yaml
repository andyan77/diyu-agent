    body: '加盟店老板半夜甩来一版直播脚本，头一句就把我看乐了——"姐妹们这条焦糖灯芯绒裙，一上身腿长十公分，显瘦到亲妈都认不出"。我语音怼回去：这句先掐了。


      她还委屈，说不写狠点直播间留不住人。我说，留人是本事，编数字是心虚。这条裙子在你镜头里是主角，怼着它转就行；可它一挪到橱窗就换了身份，挂在那件大衣背后当陪衬，射灯压根没扫过它；再到导购领着客人往试衣间走那几步，它又降成一句过渡——"这条裙子配双短靴就齐活"，话头递出去就完事。别拿同一副大嗓门套这三处的它。


      老板追问，那要不要照着秒表给她钉死一套本子，几分几秒抬手转身，一个字都不许飘。我说别费这劲。橱窗怎么摆、主播怎么起头、文案怎么收口，这几处产品与 display 动作的接口本来就咬着，你要干的不是另起一条新道，是让它们别互相拆台。直播口播那股导购式表达的猛劲，跟品牌旁白式表达那点收着的劲，正好在"显瘦"俩字上顶上了——一个要喊，一个要按。这种当口我只认更稳妥那句：镜头拍得出来的，垂坠、裙摆那道弧，讲；拍不出来的效果，把嘴闭上。她那句狠话我没删，旁边戳个记号写明白为啥摁下去，省得下一个接手的手一痒又给捡回来。


      面料那几句，得等客人自己伸手去捏、张嘴来问，才切进设计解释式表达，那一下才够格叫教育节点，硬塞在开场只会把人赶跑。剩下填不实的，全明着晾：【产品事实：这条裙的面料成分与克重】【角色事实：出镜主播的人设边界】【品牌事实：显瘦这类说法能不能核实的凭据】。她"嗯"了一声，把那句大话从脚本里拎出去，换成一个空着的方括号，等谁带真凭据来补。'
