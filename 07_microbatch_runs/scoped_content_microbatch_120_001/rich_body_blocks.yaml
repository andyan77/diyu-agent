    body: '试衣间的门帘刚拉上，姑娘对着镜子把肩往后收了收。我举着手机站在斜后方，本想在文案里敲下"显瘦"两个字，手指停在半空——这是个结果词，等于替她的身体打包票，可我并不能替她保证身体上会有什么变化。于是删掉，改成镜头真能看见的东西。


      她穿一条高腰直筒长裤，配竖条纹衬衫。竖条从领口一路往下，裤子的直筒把这条走向接着送到脚踝，落地几乎不打弯。这条从上到下没断过的线条，是镜头实拍到的，我敢写；至于它让谁看起来怎样，那是她照镜子时自己的感受，我不越界替她下结论。


      写这类穿在身上的画面，我给自己留了台阶。最外面只用观察词，描述看得见的：布面怎么垂、竖条怎么排、裤脚停在哪儿。往里一层是关系词，讲衣服跟身体、跟光的相处——肩线搭在她肩头哪个点，腰头卡在哪一寸。最里面的结果词，像"显瘦""耐穿"，我一律先按住。"耐穿"这种要有依据才敢讲的，我挂上【待补证据：面料耐磨与起球实测】，数据没回来之前绝不写死；直筒的裁剪也标着【品牌事实：直筒版型裁剪参数】等填。


      这套场景化观察不是把话说含糊，而是把能说的线条变化说满，把不能保证的身体结果收住。姑娘转身那下，竖条随动作轻轻错开又对齐，我把这一幕录下来——这就是替代表达与回避表达该有的样子：不喊口号，让画面自己开口。'
