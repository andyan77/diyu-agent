    body: '先别急着把整排衣服挂满。你真正在做的，是给这面陈列写一句话——谁是主角，谁在旁边搭腔，谁退到后面当背景。这就是产品到陈列叙事关系语法。


      站在两米外看，最先被眼睛抓住的那个点，就是中心位置。把这一季最想让人记住的那件放这儿，比如【品牌事实：本季主推的那件外套具体系列名】那件廓形大衣，它得占住画面正中，光也压在它身上。它一上位，主次层级就立起来了，旁边的都自动退成配角。


      配角怎么放，讲的是位置关系。同色系的针织开衫、丝质衬衫，用同色邻接的方式贴着大衣排开，色块连成一条线，眼睛顺着往下滑，画面很稳；想让人心里一动，就在相邻位置塞一件异材质邻接的皮质马甲，麂皮撞针织，粗糙咬着柔软，这层对比一出来，邻接关系就有了张力。


      再往里退一层，是层次后方。把基础款白T、灰阔腿裤挂到侧边位置或压到后排，它们不抢戏，只负责把主角衬得更清楚。


      最后一步最容易被忽略：留白。别把杆子塞死，主角左右各空出一个衣位，它才喘得过气。一整面下来不是堆货，是一组主题化组合，讲的是一个人一天怎么从通勤穿到晚餐。至于出镜搭它的到底是谁，用【角色事实：出镜搭配的主理人或模特身份】这条线索收尾，观众才真的接得住这句话。'
    body_char_count: 489
    min_body_chars_standard: 350
    min_body_chars_met: true
    cluster_specific_mechanism_chain:
    - 一面陈列谁都想抢眼、看点全散掉 -> 用中心位置锁死主角，其余按主次层级往下退成配角
    - 两件挨在一起观感说不清 -> 同色邻接做呼应、异材质邻接做对比，把邻接关系写成明确的画面情绪
    - 基础款抢了主角的戏 -> 把白T、阔腿裤放侧边位置或压到层次后方，只做衬托不出声
    - 整杆塞满没有呼吸、主角被淹没 -> 靠留白在主角左右让出视觉气口，让主题化组合读得出节奏
