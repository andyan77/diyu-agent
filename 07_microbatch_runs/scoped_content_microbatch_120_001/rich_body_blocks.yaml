    body: 先说句可能得罪人的：一件衣服光说“百搭”，基本等于什么都没说。真正能帮你定下今天穿哪件的，是它配不配得上你这一天要干的事。拿一条直筒西装裤配针织背心来讲。它适配的场景很具体：一整天在写字楼里坐着开会，偶尔起身去打印，午饭走两步下楼——坐立切换的时候裤子不勒、背心不往上跑，这就是它的场景任务锚点。可只要今天的行程里塞进一段“骑车通勤四十分钟”，同一套立马露怯：步行距离一拉长，再叠上骑车这种场景中的动作限制，直筒裤原本的挺括反倒成了束缚。我习惯把每套穿搭先过三个问题。一，正式程度对不对，见客户和接孩子放学，差着好几档。二，室内外温差大不大，地铁里闷、办公室空调透凉、傍晚一起风，这就决定了外搭层次得能随手脱、能塞进包。三，携带物限制，今天背双肩包还是拎个小方包，肩上一变，垫肩衬衫和软塌针织的取舍也跟着翻篇。三问走完，场景切换条件自然浮出来：这套到哪个节点还立得住，跨过哪一步它就不适配，看得清清楚楚。至于“穿上就显瘦”“这件谁穿都好看”这类话，我不写死。没有具体的人、具体的身形站在跟前，这种硬话只能先按下，换一句能被看见的描述：它坐下时不堆量、走动时不乱飘，就这些。把不适配条件表达明白，远比嘴上甩一句百搭来得诚实。
