    body: '镜头对着一件棉麻外套，讲这件衣服的人没急着念卖点。她先把它平铺在木台上，让整件外观自己说话：肩线落在哪里、门襟有没有歪、纽扣孔排得齐不齐，这些一眼能看见的东西，先交给观众的眼睛。她心里其实存着一份可见工艺节点清单，却没有一上来就抠某一处，而是按外观、结构、细节的先后顺序，一层层往里走。


      看完整体，她把外套翻到内侧，指腹压过袖口的包边，线迹走得直不直、两块布拼得有没有错位、边缘锁得毛不毛，这些处理都摆在眼前，她就照着看见的说：这条包边收得服帖，翻过来也不起毛。到了领口压线，她把语速放慢——针脚密、压得直，是画面里实打实的细节；可她停在这儿，没有顺势接一句"所以这件特别耐穿"。


      这一停，是她给自己划的线：工艺名词只能证明工艺本身，证明不了功能和寿命。真想说耐用，就得把话交给证据【耐用结论：需实测穿着数据，暂缺】，在拿到之前，只描述看得见的，不外推看不见的质量结论。


      于是那件外套在镜头里不是被夸出来的，而是被一处处细节领着走：门襟的平整、纽扣孔的干净、袖口包边的收口，各自作证，各自只说自己那一句。观众看完，记住的不是硬广，而是一套能自己复述的、看衣服的顺序。'
