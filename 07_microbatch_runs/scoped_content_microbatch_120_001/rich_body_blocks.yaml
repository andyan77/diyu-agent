    body: '"越洗越糯，穿三年不起坨"——小许把改好的半裙文案递过来，我念到这半句就把笔按住了。谁穿满三年验过？这话我们店里没人担得起。


      那是一条墨绿灯芯绒的A字半裙，我摊在收银台上。手能给的只有眼前这点：绒条压得密，一根挨一根；腰头是宽的，里子加了衬；侧缝那道拉链藏得平，人一走下摆往外荡半寸。这些看得见、摸得着的，照实写；耐洗、不起坨这种要靠数据顶的话，手里没凭据，这句我就不往实里写。


      带小许我只教一条分寸：夸一件东西之前，先问这句谁核过。核不到又舍不得删的，别硬发，先把它摁住，边上写清还差哪样凭证才敢露出来，画面里换成安全替代表达——只留我能担的那几句：腰头不勒，坐下不顶胯，绒面顺手一抹是暖的。


      这稿更别扭的是，加盟那头把上身核对那一环整个跳过，直接推到了发布。这种节点缺失我不顺着往下顶，照节点缺失时的回退，退回到能把核对补上的那一步再往前。改稿本第一页贴着那行异常回退与前复核路由提示，新人手上发虚，眼睛先落在这行字上。


      要是评论区真冒出一回到货的岔子，那是店里的实例，不往片子里塞——单开一条异常项记录，按我们那套异常项的最小记录格式写三行：卡在哪件、缺什么、转给谁。


      讲不实的地方，我一处一处留了口：【品牌事实：这条半裙的面料成分、含绒克重】【品牌事实：灯芯绒的可洗方式与缩水幅度】【角色事实：这条改写稿谁能签发】。小许拿铅笔把"越洗越糯"那半句圈起来，页边留了个空框。半边灯灭了，墨绿的绒面还挂在试衣镜前，我们俩谁都没再往上添一个字。'
