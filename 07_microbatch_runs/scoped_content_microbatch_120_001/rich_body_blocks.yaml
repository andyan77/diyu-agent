      第一层看主体，把最先抢眼、占画面重心的那件放在中央，是一件长风衣还是一条阔腿裤，记它的轮廓走向，是直筒落到脚踝，还是在腰线处收出一道褶。这里只描述几何与位置，不往穿着者身材上引申，显高、收腰这类结论换成下摆垂直、腰节有横向切分的可观察说法。


      再往外铺前景与陪体，前景是离镜头最近、会先入眼的那件小物，一只挎包压在胯侧，或一截卷起的袖口，陪体是衬托主体、退到侧后的单品，像搭在肩上的针织。三者拉开，可拍摄的前景-主体-陪体结构就立起来了，画面有了纵深。


