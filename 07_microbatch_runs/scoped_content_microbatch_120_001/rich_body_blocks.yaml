    body: '试衣间的帘子一拉，他把新拿的直筒牛仔裤套上，没先照镜子，反倒蹲下去看裤脚。脚踝上方那圈收口翻叠两层，压得实，走线一路下来没跳针，拐到内缝转角，线迹仍旧咬着布边。他翻起后袋抠了抠，两片布的拼接叠在袋口下沿，接缝平，斜纹也对得上。这些他都看在眼里，属于局部观察，是能上手摸、也能凑近数清的可观察品质线索。


      帘子外头，朋友催：这条耐不耐穿，显不显腿长？他没顺着接。袋口这一处平整，只说明袋口这一处平整；一条缝走得漂亮，换不来整条裤子每根针脚都一样扛造——这话他没出口，只在心里把"耐穿"按了回去。显不显腿长，他站直转了半圈：裤线直着往下落，脚踝这段干净利落，样子就摆在这，剩下的让照镜子的人自己拿主意。


      翻到腰里那方水洗标，含棉几成、掺没掺弹力，他不靠手感瞎断，标签这栏空着，记作【品牌事实：牛仔布成分与含棉比例】。朋友又追，这不掉色吧，是不是原色。碰上掉色、色牢度、原色这类得拿检测和标准撑腰的说法，他不肯用一双眼替它盖章——这类往硬处走、要凭据接住的证明类型，他单独拎出来当一个品质观察项挂着：【品牌事实：色牢度检测机构与报告编号】【品牌事实：面料认证出具方与编号】。在凭据回来之前，他嘴上只认眼下能站住的那几处：走线齐、色泽此刻匀、裤脚那圈收口收得齐整。'
