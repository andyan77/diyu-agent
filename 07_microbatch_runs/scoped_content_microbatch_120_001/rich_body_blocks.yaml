    body: '镜头先怼近那块布。我把它翻到背面，让指腹压过去，屏幕上能看清经纬两根线怎么交叉——这是梭织，纹路像格子一样规整；旁边再摆一块，线圈一环扣一环、拉一下会回弹的，那是针织。我不急着下判断，只把看得见的先说出来：面料结构不同，落到身上的垂坠和贴合就不同。


      接着讲纤维、纱线、面料这三层怎么一层套一层：一根根细的纤维先捻成纱线，纱线再织成整块布。观众常把这三个词混着叫，我就顺手把纤维/纱线/面料层级区分摆清楚，让人知道自己摸到的到底是哪一层。


      拍到手感这段最容易翻车。手一搭上去，弹幕就催我说"这个肯定很保暖"。我停住——手感词能说，事实词得收着，这就是手感词与事实词的边界。摸着厚实、压下去有回弹，这些是当场用眼睛和手能验证的；可"所以很保暖"是性能结论，跳过去就成了没凭据的硬话。于是我把它按住，改成一句：织法和厚度看着扎实，具体保暖到什么程度，【证据待补：保暖性能以第三方检测报告为准】。成分也一样，标签写多少含量我念多少，【品牌事实：纤维成分含量以水洗标注为准】，绝不替它加码。


      这条内容真正想教的，是面料家族与属性边界怎么划：能看的尽管拍给你看，不能只凭摸就外推的性能项，一律先挂起来，等证据到位再讲。'
