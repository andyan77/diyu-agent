    body: 傍晚快打烊，实习生举着手机凑过来，说想拍条毛衣配裙子的搭配。我先替她摆：燕麦色高领毛衣的下摆掖进墨绿百褶裙的裙腰，只掖前面一小截露腰线，脚下配一双乐福鞋。机位对准落地镜斜前方，借窗光扫过针织。竖屏先给腰腹一个掖与不掖的对比，再让她迈两步，把裙摆甩开的弧线收进框，配句钩子——毛衣掖进裙腰，走路都精神几分。怎么摆、怎么发，随她放开拍。真要拿捏分寸的，是她抬手那下——镜头正巧带进一个下班进来试衣的人。我把她手机压低半寸，压着嗓子说，店里管这条红线叫门店日常内容化风险红线，头一档就是别把活人连脸带名字收进去。我让她把那位换成一个一般化角色——不点认得出是谁的那位，改成一个进店添件过冬衣裳的人；镜头扫到脸就压低景别，只留手指理领口、掖裙腰那两下。脸、名字、随口那句咨询，都别跨过隐私与实例事实边界。她试完夸的那句合身，别急着剪——没有能核对的来源，顾客反馈写进去只是替店里贴金；这周这条走得快不快，那种经营表现也别让一条短视频替我张口，没凭据先空着。素材要是来路没交代、授权不明，先搁一边等补齐。想说这条裙子显瘦，也别落成结论，写成裙腰上提、裙摆微收的可见样子，等有据再说。真落到某家店、某件裙子，还差几样得先标出来：【门店事实：可出镜的镜前位置与当日光线待到场落实】【商品事实：本季这件毛衣与百褶裙是否在架待补】【镜头事实：出镜只留衣物、避开面孔的分镜与范围待核】【角色事实：入镜真人身份与授权待落实，未定前用一般化角色顶替】。她把手机往下挪，重新框住裙摆扫过鞋面。
