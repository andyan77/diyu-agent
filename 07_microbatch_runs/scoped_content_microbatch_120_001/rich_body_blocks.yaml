    body: '我在店里试衣区站了一下午，手边是刚上架的那排卡其风衣。作为搭配师，我习惯先说自己做了什么："我把腰带松松挽了个结，袖子往上推了两折。"这是动作词，它只交代我的手做过什么，不替顾客下判断。


      接着我会说观察词，只说眼睛看到的："她站到镜子前，肩线落得刚好，风衣下摆随着转身荡开半圈。"我不写"她一定很满意"，因为那是我猜的，不是我看到的。


      真要提原因，我会切到解释词，而且留一句限制语："也许是这件的落肩剪裁让她愿意多站一会儿。"也许——这两个字就是我给自己的边界。动作词、观察词、解释词的边界不混用，是我做角色发声寄存器时最在意的一条：把看到的和猜到的分开，内容才立得住。


      同样一排风衣，换个站位口吻就变了。店主视角会说进货的心思："这批我压了货，就赌今年秋天风大。"导购视角贴着人走："里面搭一件高领针织，风一起就显利落。"搭配师视角管的是比例："配一条直筒牛仔裤，重心往下压，走起来才稳。"三种主语选择与叙述站位，说的是同一件衣服，情绪温度和信息密度却各不相同。


      至于品牌旁白那种中立口气，我尽量少用——它没有人味，读的人一眼就滑过去了。角色发声寄存器好用，但它只在真有叙述者的时候才成立；要我冒充一个不存在的老顾客现身说法，那我宁可空着不写。'
