    body: '傍晚六点,写字楼的玻璃门推开,风一下子灌进来。她左手抱着笔记本,右手把那件燕麦色风衣往肩上一搭——这是它在整个画面里的第一次露脸,不在开头的空镜,而是踩着人往外走的这一步进来。产品在镜头中的首出现位置,决定了观众先记住的是"谁需要它",而不是它多贵。


      镜头往下,她抬手系门襟,只扣中间两颗,任下摆随步子甩开。领口立着,挡住晚风顺脖子往里钻的那一小截凉意。这时候风衣不是被展示的商品,它在替她挡风——它承担的是解决项这个角色。搭配重心落在腰线上:她随手把腰带在身后打了个松结,原本直筒的廓形立刻收出一道弧,层次变化就在这一收一放之间发生。


      再走两步,她路过一排暖黄的橱窗,里头是打烊的花店。风衣的面料纹理在灯下泛起细密的斜织手感,和她里面那件旧白T的软塌一比,硬挺与松弛的对照就出来了——此刻它又切换成对比项。同一件衣服,在同一段路上,先做过渡项,把她从室内带到街头;再做解决项,替她扛住夜风;最后成了对比项,衬出整身的松紧节奏。


      这就是让一件衣服入场的写法:不喊它好,而是给它派一个在场景里必须干的活,让它跟着人的动作出现、跟着场景的任务转身。观众记住的是那道被风掀起又落下的门襟,是脖子后面那点被领口挡下的凉,而不是任何一句硬邦邦的卖点。'
