    body: '离开播十分钟,我在中控台把提词稿捋一遍。主播马上要上身那条焦糖色灯芯绒阔腿裤,稿里跳出一句"穿三年绒都不倒"——我卡这句:谁验过三年?我这会儿能确认的只有摸得到的:灯芯绒棱路压得密,裤腰宽襻加暗扣,裤脚正好盖住鞋帮。这些怼近镜头观众看得见,能照讲;可"三年不倒绒"这种说死的硬话,查不到出处,不能替品牌塞进主播嘴里。


      开播前我给自己排道关:当场证不了的夸法,先拦在出口。想吹"这批绒最厚"又拿不出凭据,我把这句先摘下挂着,旁边记清还差哪份依据,换一句安全替代表达顶上——"刚彩排蹲了个大动作,膝盖没绷紧",是彩排里真有的。碰上"能不能照上季报活动"这种该不该动品牌口径、我一个人定不了的,我不拍板,原样停住,交给能定的人。


      昨晚更麻烦:选品那环临时抽掉一款,替补资料没人接上,到我这儿就是节点缺失。我没抓个相近的顶上,按节点缺失时的回退,把这条退回到能补齐资料那步。至于抽了哪款、顶上几件,是后台一笔账,不能当成谁都照抄的规矩写出去。记这类岔子不用长,我们中控就一行:卡在哪件、缺哪条、往谁那儿转,这就是异常项的最小记录格式,一条异常项记录够了。这套异常回退与前复核路由提示钉在屏边,新搭档扫一眼就知道哪句得停。


      那条裤子的硬卖点我留着空:【品牌事实:该款灯芯绒阔腿裤的成分与克重】【角色事实:本场脚本的品牌口径授权人】【陈列事实:这条裤子这场最终定的上身搭配】。填不上就空着,倒计时归零,我把这条特写往前拉一格,先播看得见摸得着的那几处。'
