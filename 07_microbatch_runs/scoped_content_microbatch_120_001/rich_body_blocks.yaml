    body: '镜头别拉太远，我个子就摆在这儿，你正好拿我当尺子看。今天这条背带裤，别一扣上肩带就急着转圈，先跟我把穿着顺序理顺：里头一件贴身的罗纹长袖打底，再套背带裤，肩带那两颗金属扣先放到最长。


      上身之后，头一件事不是拍，是调。肩带往上收两格，裤腰提到肚脐上头一点，这就是它的调节方式——收得越高，腰线站的位置越靠上。裤脚做一次翻折，往上卷两道，露出脚踝那截，别一路盖到鞋面。外面再压一件短开衫，敞着穿，三层压下来有先有后，这才算层搭。


      拍对比我只认死一条：同一光线。收肩带以前、收肩带以后，我站同一扇窗、同一盏灯底下给你看，中途谁都别挪。屏幕里你看得见的，只有腰线抬上去以后、上半身的比例跟着往上提；可「穿上显高」这句，我先按住——那是个结果，得拿【产品事实：裤长与前裆尺寸】对着我的身高才敢讲，没有就先空在那儿。


      耐不耐磨我也不替它打包票。肩带扣是不是实心金属、下水洗几回会不会掉色，都翻到洗护标签去核，标签条件写几度水、能不能机洗，照它来，别照我顺嘴那句。要说同款里它比别家「更挺括」，我只把门襟走线排得更密这点指出来，挺不挺你自己上手掐。注意事项还有一句：金属肩带扣别硬掰，卡不进就松一格再扣。今天出镜的身高尺码摆这儿：【角色事实：出镜者身高与常穿尺码】。想看蹲下去绷不绷、抬手紧不紧，扣个「翻折」，下条我蹲下去挨个给你数。'
