    body: '傍晚的库房比前厅安静，新到的一批秋装还堆在长桌上没归位。做线上内容的姑娘一件件把它们抖开，先把那件姜黄粗棒针毛衣搁到最顺手的地方——今天要让人记住的那句话，就交给它去开口，别的都退半步替它铺台阶。她心里有杆秤：一组能被人原样复述的搭配，先得把主次关系与陪衬关系摆平，谁领唱，谁和声，谁只在画面边上补一口气，不能都抢着说话。


      她拈起一条橄榄绿的窄丝巾，在领口绕了一圈——它不为好看而来，是把胸前的姜黄和裤子的藏青悄悄接上，让这两块颜色不至于各说各话，这类活儿就是颜色连接项在做。又给发顶压一顶焦茶贝雷帽，人一戴上，画面的上沿就不空了，算场景补位项在默默补那一格。她不给每件都堆卖点，只按产品角色与主题化组合关系分派差事，一件对一种组货角色类型。


      真费神的是同一身要去两处。信息流里的人只肯给你半秒，姜黄得在这半秒里先把眼睛勾住，多余的话一句不留；愿意点进长图文、坐下来读的人，你才慢慢讲这件毛衣换条内搭又是另一种天气。这一删一留，讲的正是渠道差异下的信息删减规则——同一件领头的衣裳，换个地方摆出来，该说几句、说多深，都得重新拿捏。


      她也给自己划条线：这套讲法只认得抽象出来的组合关系，哪天它被拿去当成某批真货该进该出的派工单，就走味了。今天这几档角色她顺手记进本子，那越记越顺，慢慢就成了自己的一套组货角色与渠道边界矩阵。合上本子，她把毛衣袖口往上推了半截，退后一步，先给这件姜黄拍下第一张。'
