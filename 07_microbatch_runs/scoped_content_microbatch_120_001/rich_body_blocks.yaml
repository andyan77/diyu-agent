    body: '砂锅在灶上咕嘟着，窗玻璃蒙了一层白雾。先入镜的不是衣服，是一只手——袖子推到小臂，指节沾着面粉，正把一撮葱花撒进汤里。你要过两秒才发现，那截卷起来的袖口属于一件豆绿色针织开衫，它没在开头就杵在画面正中等人打量，而是跟着搅锅的动作一寸寸露出来。这就叫产品在镜头中的首出现位置：让一件衣服顺着手上的活儿进来，而不是空降到正中央。


      接着得替它定身份。同一件开衫，可以是被人细看的主角，可以是用来反衬旁边那件挺括衬衫的对比项，可以是替他挡住厨房穿堂风的解决项，也可以只是把他从睡醒的床沿带到灶台前的过渡项。这一回它是过渡项——所以别让它抢镜，它的角色功能命名方式一旦落成"过渡"二字，搭配重心便顺势移到下半身那条旧棉裤上，上身全留给动作。产品与场景任务的绑定方式，就藏在"它是来送人过场的"这半句里。


      细节到这时才上桌，而且只挑跟"过渡"对得上的那几处。门襟他懒得扣，敞着，两片衣襟随弯腰一荡又荡回来；领口洗得发软，松松地搭在后颈；面料纹理是粗针的那种凹凸，灯一照，沟壑里尽是毛线的绒气。层次变化就在开衫底下露出的半截白T恤上，一深一浅，把清晨那点没睡够的钝劲儿也一并穿在了身上。


      汤要溢锅了。他空出右手把开衫往身前一拢，拿胳膊肘压住掀起的锅盖，另一只手已经伸向碗架。那半敞的门襟晃了一下又落回原处——留在人眼睛里的是这一下，不是别的。'
