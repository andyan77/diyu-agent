    body: 今天这条灯芯绒直筒裤，我拍之前先把语气压下来。它就是条能穿很久的日常裤子，我犯不着在开头喊'一秒封神'。手指顺着裤缝往下摸，车缝线平整、门襟不咬手——这些镜头能看见的，我照实说；摸不准的，我不替它下判断。这几年我慢慢摸出一条线：语气强度与场景强度匹配。蹲在货架前把针织衫叠成方块、理平堆头的时候，我用最平的口吻；只有讲到袖口那道手工锁边、讲羊毛怎么被一针针收进立领，我才让语气稍微郑重些。你要是反过来，用夸张调子去撑一件普通打底衫，观众一眼就觉得假——语气强度与场景强度一旦错位，人味就没了。镜头前我愿意是'摸过很多料子的那个人'，这是允许的人设表面层——懂行、上手、肯讲。可越过这层往里，就是不可写的真人痕迹：我不报自己家里几口人，不搬某天谁对我说过的原话，不拿一个具体数字去压别人。这些一写进去，内容就从'讲衣服'滑成'晒我自己'。最要小心的是高风险断言。'穿十年不变形''立马显瘦'这类话，我要么不说，要么在前头补一句降调与限制语——'我上手这半个月，肘部还没起球''这个廓形对我这种肩宽，视觉上收了些'。把硬结论换成观察化表达，话往回收半步。所谓语气校准与去人物化，不过是让衣服自己站到前面，我退到它身后。
