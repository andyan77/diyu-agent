    - 橱窗和店员用同一种腔调导致话接不上 -> 橱窗走品牌旁白式表达、店员切导购式表达、答疑用设计解释式表达落成教育节点
    - 陈列时没给后面讲解留承接口 -> 在产品与 display 动作的接口处先留出能接话的钩子再摆位
    - 加盟店把跨域提示硬改成死流程图 -> 只给这件在这段演什么角色的提示、要固化每步执行动作那刻就停手交回各店
    domain_anchors:
    - 外套
    - 针织开衫
    - 阔腿裤
    concrete_apparel_anchor: 一件外套在橱窗当主角、在搭配短视频里退为针织开衫的陪衬、在店员领客走向试衣间的动线里又成阔腿裤那句话的过渡衔接。
    domain_mechanism: 同一件服装按所处画面切换主角/陪衬/过渡三种身份，并各配品牌旁白式表达、导购式表达、设计解释式表达三种语气，靠产品与 display 动作的接口把陈列和讲解缝到一起。
    downstream_content_effect: 店员不再千篇一律把每件都当主角猛夸，橱窗、短视频、动线各说各的分寸，讲解只落在真正需要的教育节点上，内容更像人话也更接得住客人追问。
    risk_boundary_handling: 跨域只给"这件在这段大概演什么角色"的提示，绝不改写成"第几秒说什么、手往哪指"的死流程图；一旦要固化每步执行动作，就在那一刻停手，把话术交回给各店按自家客群自己接。
    hard_claim_routing: 凡涉及"这件更耐穿/更显瘦/卖得最好/穿了更有身份"这类无源硬结论，正文一律不写死，要么降级成看得见的动作与画面描述，要么挂成【产品事实】【品牌事实】待核实槽位，绝不替它下定论。
