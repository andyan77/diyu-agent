    body: '一件卡其风衣挂上衣架的第一天，它还没有故事。认知进入期里，镜头只需交代它是谁：宽肩线、过膝长度、腰带在手里绕一圈的重量感——不急着解释为什么好，只让人先记住这个轮廓。这是产品生命周期角色窗口的开头，叙事密度压到最低，一句话配一个画面。


      到了结构教育期，风衣才被慢慢拆开讲。翻开衣领内衬，指着那条隐藏的插肩缝，说明它怎么让抬手不吃力；扣到第二颗扣子和整件敞开，肩背走向完全是两个人。此刻教育重心从"这是什么"挪向"它怎么运作"，阶段与教育重心关系在这里头一回显形。


      场景验证期把它放回生活。早高峰地铁口风硬，穿它的人把腰带随手系成活结，衣摆被掀起又落下——不是摆拍，是这件衣服真替人挡了那阵冷。细节作证，胜过空口一句好卖点。


      组合扩展期让它换搭档：内搭针织背心是一种情绪，外叠一件牛仔衬衫又是另一种周末。同一件风衣，在不同组合里承担不同角色。走到复盘维护期，话题回到起皱的袖口和该怎么挂放，陈列也随之换成收尾的语气，阶段与陈列更新关系，就是让货架跟着这条时间线往前走。


      要说清的是，这套阶段抽象命名只帮人判断一件衣服此刻站在哪一格，并不替谁预测它卖得好不好。'
