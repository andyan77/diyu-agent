    body: 开播前二十分钟，我把主播待会儿要照着念的话术卡摊在补光灯底下，一行一行往下捋。轮到那条阔腿裤，写手顺手加了句特别抓人的——"我们打版的老师傅拍着胸脯，这条穿三年膝盖都不鼓包"。我抽红笔在底下划了道杠。毛病不在裤子，在"拍着胸脯"这四个字。让一个打版的角色替屏幕那头的人把"耐穿"一口咬死，观众连一点依据都没瞧见，就先被那双满是老茧的手说服了——拿人头去顶结论，是最扎眼的默认背书的危险信号，这一句必须当场摁下去。耐不耐穿不归嘴说，归镜头：裤线烫得平不平、蹲下再站起来回弹快不快，这些拍得到、看得见的，才是可说方法层里能敞开讲的。三年鼓不鼓包这种话，只能挂着等实测【待补证据：起皱回弹与耐磨实测，拿到授权数据前不写死】。往下写手还惦记着给师傅补个来头，说他早年在哪家大厂、经手过多少走量的活儿。打住。某位真实师傅干过几年、手上过过什么货，落在不可说的事实层那边，我们手上没有他签字点头，就不能替他往镜头外抖，得先去授权化：【角色事实：打版师真实工龄与从业经历——授权确认前留空】。更滑的是不报名字那种——"圈里做裤子的都得喊他一声"，一句里既塞了身份暗示，又顺手替他领了默认背书，这种越权表述最爱躲在夸熟人的口气里。我把"拍着胸脯"整句抹掉，换成"想试的先量量自己顺手的裤长，看落地拖不拖地"。面料那栏我留个口子等准信【品牌事实：阔腿裤面料成分与克重——待采购补】，把卡递回去，主播照着念就行。
