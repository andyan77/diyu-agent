    body: '先把一套搭配当成一个能拆开看的物件，而不是一张扁平的美图。落地拍摄前，我会给现场的人一套统一的 Look 拆解观察骨架：任何一组陈列，都按前景、主体、陪体三个位置搭台。前景是离镜头最近、交代场景关系的那一层——垂在货架边缘的一截围巾、半开的风衣下摆，或斜靠桌角的帆布包；它不抢戏，只负责把视线领进门。主体是这套里最想被记住的那件单品，光要压在它身上，其余都为它让路。陪体退到后面做衬托，一件叠穿的针织、一双随手摆的乐福鞋，把层次撑开又不越界。


      按这个可拍摄的前景-主体-陪体结构去看，单套搭配与成组陈列就有了统一的观察节点：先定主体在画面里的落点，再排前景怎么引、陪体怎么托，镜头才不会飘。这套 Look 层级拆解维度里，轮廓只说外形是直筒还是收腰的几何形状，层次只说面料一层压一层的先后，搭配位只说这件落在肩线、腰线还是脚踝——这就是轮廓/层次/搭配位的命名边界。至于谁穿上显不显瘦、身材如何，骨架不下这个结论，那要留给别处去谈。


      真正落地那天，通用方法要接上具体现场，缺的部分先挂成明确位置，不硬编：主推单品是哪一件、什么颜色什么面料，写成【商品事实：主推单品名称与材质待填】；货架高度、地面材质、日光从哪面窗进来，写成【门店事实：现场空间与光线条件待填】；用哪支镜头、平拍还是俯拍、前景虚化到什么程度，写成【镜头事实：机位与景深参数待填】。骨架先立住，等这些现场事实补齐，一套能被看见的陈列画面才算拍得出来。'
