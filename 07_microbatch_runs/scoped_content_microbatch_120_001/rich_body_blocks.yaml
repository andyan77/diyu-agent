    body: '傍晚收了工，桌上只亮一盏台灯。她把那件米白开衫平铺开，袖子摆顺，让镜头先从桌沿退远一点——先收进整件衣服躺着的样子：门襟一条直线落下来，两只袖口对称地摊在两侧，下摆罗纹微微收着口。这一远，她不忙着夸它，只让人看清它整个的形。

      镜头往里走一层，停在肩头到袖笼那一片。能看的东西不少：接肩处两片针织怎么并到一起，罗纹和平针交界那道纹路走得齐不齐，收针的地方有没有留下歪扭的小坑。她把画面层级压在中间这段，让结构自己显形——只做说明与非结论化提示，看清什么就说什么，好不好留给屏幕外的人自己掂量。

      接着落到近景。镜头线索顺着门襟一路往下，停在最后一颗扣子上：指腹压过扣带，一颗颗数过去，纽襻缝得紧不紧、线头有没有藏干净，都在这一寸里。手指再翻起右边袖口，罗纹一圈圈叠着，针脚一密一疏，就是最实的对象线索。这些可拍摄对象都放在镜头一对焦就清楚的位置，用不着旁白替它喊好。

      翻面的时候，她本想补一句"这件又耐穿、还不起球"，话到嘴边又收住——穿多久、会不会起球，隔着屏幕谁也看不出来，这就撞上了镜头能证明的边界。她改了个可拍摄动作：把开衫对折，让下摆罗纹在指间松开、再弹回原样，只拍这一下眼睛能看见的。真要讲耐穿，就在旁边挂一个解释槽位：【品牌事实：纱线支数与含毛量待补】【角色事实：出镜者是谁、为何选中这件开衫待补】，等片尾由本人补齐再说，画面这头绝不替它编。'
