    body: '镜头先给两件挂在一起的上衣一个特写。左边是一件浅色梭织衬衫，右边是一件同色系的针织开衫。我把两只袖口并排提到光下，让观众看清它们表面的样子：梭织衬衫的经线和纬线一横一竖压得很紧，指腹划过去几乎不走形；针织开衫凑近能看见一圈圈套起来的线圈，轻轻一拉，布面就跟着手指的方向让开一小段。


      这一段不堆大词，只把面料结构摊开来看。我顺手补一句区分的顺序：先看纤维是什么原料，再看纱线被搓捻成什么样子，最后才问这块布到底是梭织还是针织——纤维、纱线、面料是三层，别一上来就混着说。梭织和针织的结构差异，往往就是我们摸到的手感、看到的外观从哪儿来的入口。


      到这里我会刻意停一下，守住手感与事实的那条线。镜头里我可以说"这件针织开衫垂下来会晃、贴着手臂有点绵"，这些是眼睛和指腹能当场验证的；但我不会顺口接一句"所以它很保暖"——保暖是要拿检测结果说话的性能，不是摸一把就能下的结论。真写进成品文案，这句得挂着【品牌事实：该针织开衫保暖性能的检测结论】等填，填不上就先不写。


      梭织衬衫也一样，我只描述它平整、挺括、褶子压得住这些看得见的表现；至于耐不耐穿，我留一个【证据：面料耐磨与水洗测试数据】的位置，等有据再补。收尾我把两件重新挂回去，跟观众说一句：手能感觉到的，尽管拍给你看；感觉不到、得靠数据的，我们不替它吹。'
