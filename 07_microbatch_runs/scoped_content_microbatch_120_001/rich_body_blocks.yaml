    body: '上新那件水洗牛仔外套，图文我改到第四遍才敢挂上去。做买手久了容易犯一个病：样衣看顺眼了就想替它喊，"闭眼入""能穿十年"顺口就出。我先把这类高风险断言一条条挑出来按住——牛仔到底耐不耐磨、下过几次水会不会掉色，得靠实测数据讲话，我手边没有，就不替它拍板，稿子里空出一格【待补：面料色牢度与克重实测报告】，实物到了再回来填。


      按住之后，我只写镜子里当场看得见的：袖口两道明线压得直，铜扣捏着有点涩，肩缝落在我肩头再往下半寸。摸得到、看得到的我照描，谁的身材我都不替它打包票。有人追问显不显瘦，我通常先降一句调子——"要看各人肩宽，多数情况下这种硬挺牛仔会把腰往里带一点"，绝对话咽回去，硬结论落回观察化表达，添一句限制语再往下说。


      心里还绷着一根弦：语气强度与场景强度匹配。屏幕上一件安安静静挂着的外套，配不上"炸场"那种嗓门；理货叠堆头时我用最轻的调，只有讲到那道手工压线，语气才稍微沉下去。至于我这个人——住哪层、离没离婚、昨天谁在店里同我讲过什么，都不写，这些不可写的真人痕迹一落纸就变成晒隐私。买手能露在外头的，只有懂料子、上过身、肯把门道讲白那点手感，允许的人设表面层就到这一层，再往里的私事一律咽回。


      发布前我把稿子念出声，"绝对""必"这些字一听见就划掉，念到不咯耳朵了，才抬手点发送。'
