    body: '打烊后的店里只剩收银台那盏灯。阿松把手机凑到眼前，屏幕上是小唐下午写好、等她点头才发出去的一条短文——配的是今天刚上架的棉衬衫。


      小唐起了个很戏剧的头：一位顾客试穿完站在镜子前红了眼眶，说这是她给自己三十岁的礼物。阿松念到这句，指腹在屏幕边上停住了。她今天是卖出去几件，可没有哪个客人跟她讲过这样的话；要让这句立得住，她得替一个素未谋面的人，凭空安上一段心里的戏。这么一安，她自己先心虚。


      她把那段删了。删完，抬头盯着挂在架子上的衬衫看了会儿：领型是这版刚做过版型修改的立领，收窄了些，比上一版利落；门襟走暗扣，扣起来是一条干净的直线；袖口那片面料肌理带着细密斜纹，光斜着扫过去，纹路自己就浮出来。这些都是摆在台面上、谁来都能上手摸的东西。


      她重写。不再替谁掉眼泪，改成把两块布并排铺开做面料比较——一块今年的斜纹棉，一块旧款府绸，隔着屏幕也大致分得出手感深浅。再补一句搭配比例：下摆掖进高腰半裙，腰线卡在最细那一处，上三下七，人立刻显得挺拔。至于明早怎么摆、挂哪一面、几件成一组，这类陈列调整她没拍脑袋，在便签上留了行空——【货架前实测后再落位】。


      灯关掉前，她又扫了眼那条素净的短文。没有眼泪，没有那记煽情的转折，可里头每一句，她都敢当着客人的面，再说第二遍。'
