    body: '清晨开店前的一小时，是最适合做陈列的窗口。灯还没全开，货架安静，正好把一整套陈列动作拆成几个能看得见的动作节点，一步接一步走完，这就是可以反复取用的陈列动作 SOP 节点框架。


      第一个动作节点是陈列前检查。陈列师站在挂通前，手指从一件驼色大衣的肩线滑到袖口，看褶皱、扣位、吊牌是否收好；这个节点的节点输入，是当天要上墙的几组服装和它们的尺码段，节点输出则是一张"可以上手"的清单——哪几件熨过、哪几件还得回熨台。只有这张清单齐了，才谈得上进下一步，这就是节点之间的依赖顺序。


      第二个动作节点是实施。把针织衫按深浅叠上层板，让半身裙在中岛错落挂开，模特身上换成廓形西装配阔腿裤，肩宽和裙长在同一条视线上收齐。上一节点交出的清单，正好变成这一节点的节点输入；摆好的这一面墙，就是它的节点输出。每摆完一组退后两步看整体节奏，是这个节点最朴素的节点可见化表达。


      第三个动作节点是复核。绕着这面墙走一圈对照着看：色块有没有断、动线顺不顺、主推款在不在第一眼的位置。走完这一圈且挑不出毛病，就是这一组陈列的完成标志。


      以上是可以反复取用的通用节点。真正落到某一天、某一面墙，还得补齐这些现场事实：【门店事实：具体门店与墙面位置】【商品事实：当日实际上墙的服装款式与配色】【镜头事实：成片要用的机位与光线】。这些不到位，画面就只是方法，不是那一面真实的墙。'
