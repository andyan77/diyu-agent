    body: '午后的样衣间里，架子上挂着三件刚从工作台下来的外套，我要给它们各写一段能发出去的内容，手却停在第一件上。


      这件的改动其实很小：腰线往上提了一指，门襟从明扣改成暗门襟，领型也收窄了些。改样的师傅说，穿上身人会精神点。我原想按最抓眼的写法开头——"一件衣服，让她重新爱上照镜子"，先抛一个巨大的反转，再往回填情节。写到第三行就卡住了：改动是安静的，硬塞进一个大起大落的弧线，故事就开始空转，像在演戏。


      我把开头删了。对着这种细小的版型修改，该走的不是反转，而是让镜头慢慢靠近的那种讲法——先给一个远景的搭配比例，再推到腰线落在胯骨上的位置，最后停在面料肌理被光扫过的那一下。什么问题配什么弧线，这正是故事弧线适用边界要我先想清楚的。


      第二件我差点又犯老毛病，想写"这块面料比上一季更耐穿"，笔已经落下去——可手里没有任何摆得上台面的东西去撑这句话。越想强调"比从前好"，越得拿得出看得见、验得了的凭据。撑不住，就往回收：我把那句改成两块料子并排的面料比较镜头，一块起绒，一块平织，让看的人自己去摸出差别，而不是我替他下结论。


      第三件最省心，只是一次陈列调整——换了个挂法，让门襟的走线看得更清楚。它本就不需要什么弧线，一个干净画面足够。


      三段写完，我把删掉的那些漂亮开头留在了废纸篓里。先看清每件衣服到底在讲什么问题，再决定用哪根线去牵它——这一步，偷不得懒。'
