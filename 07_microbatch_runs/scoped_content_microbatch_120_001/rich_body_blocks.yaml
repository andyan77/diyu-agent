    body: '先把卖场拆成四种一般化区位：入口区、中岛、端架、挂通。入口区是脚步刚踏进来那三秒里的第一眼，适合用远景把整片色块和层高一次收进画面；中岛站在动线中央，四面都能绕，最适合把一组同色系或同廓形的衣服像小岛一样围起来看；端架卡在通道拐角，专门顶一件重点单品，灯一压下来，肩线和门襟就成了天然的中景主角；挂通拉成一长排，系列铺陈的节奏全靠它，衣架间距和吊牌朝向，决定了镜头扫过去顺不顺。


      拍的时候按远景-中景-近景的观察切换走：远景先交代人站在哪种区位、身体往哪转；中景锁住一件衣服的版型和上下搭配；近景再钻进领口的罗纹、袖口的走线、面料被灯照出的纹路。这套从区位到镜头的最小映射，只是给现场拍摄当参考的编排底稿，还不是能直接发出去的成品，落地前得补上真实现场。


      真正开拍，要把这些留成明确的待补项：入口区实际怎么走、灯位在哪，先挂到【门店现场事实：入口区动线走向与灯位分布】，不能当它已经摆好；中岛上到底摆哪几件、怎么成组，对齐【商品事实：中岛成组展示的单品组合】；端架前那个取衣、上身、转身的动作交给谁演，落到【出镜事实：端架试穿与取放的执行角色】；近景究竟对准哪一处工艺，写进【镜头事实：近景要拍的面料与走线细节点】。这四项不到位，画面就只能停在方法这一层，不假装某家店已经布好在那等你拍。'
