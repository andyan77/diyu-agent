    body: '先别急着把那件外套挂上去。你有没有过这种时候——衣服本身没毛病，往架子上一放却像没人认得它。问题不在衣服，在它旁边站着谁。


      摆一组陈列，其实是在用位置关系讲一句话。第一步先定主角，把最想让人一眼看见的那件放到中心位置，这就是主次层级的起点：谁是主语，谁是陪衬，眼睛得能一秒分出来。主角站定，再想旁边放什么。相邻位置不是随手塞，邻接关系会替你说话——主角右手的侧边位置摆一件同色系针织，读者读到的是"延续、成套"；换成一只异材质邻接的皮质小包，读者读到的就是"这人有故事"。同色邻接让画面顺，异材质邻接让画面有话可说，选哪种，看这条内容想让人记住什么。


      再往深走一层。别把东西全挤在一个平面上，把配角往层次后方退半步，主角在前、配角在后，纵深就出来了，画面立刻像真实场景而不是货架。旁边再留一块留白，别怕空——空出来的地方是给主角喘气的，视线需要一个落点。


      要是这一组想讲一个完整主题，比如"周末去海边"，就用主题化组合把草帽、亚麻衬衫、帆布鞋串成一句话，每件都在为同一个画面作证。


      最后提醒一句：这套产品到陈列叙事关系语法只在一个前提下成立——画面里真有能被看见的产品和陈列的关系，没关系可读就别硬套。至于这次主推哪件、它到底什么材质、拍在哪，得填实：【品牌事实：本组主角单品的款式与名称】【产品事实：主角单品的面料与工艺】【场景事实：拍摄地点或门店场景】。填进去，这句话才立得住。'
