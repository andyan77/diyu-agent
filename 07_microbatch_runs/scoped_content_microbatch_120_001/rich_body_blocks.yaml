    body: '清晨窗光斜进屋，一条米白阔腿裤挂在衣柜横杆上，裤线笔直垂着，跟旁边任何一条没两样，这就是整支演示的动作起点。一双手把它取下，不急着上身，先在脚踝上方把裤脚卷起两道，指腹沿卷边一路抹平；镜头跟随手腕慢慢下移，不切镜，观众数得清卷了几道、边缘齐不齐。每落一个动作，旁白只补一句短话，正是给动作对应的解释槽位留的位置——「卷到踝骨上方，鞋面才露得出来」，点到就停，不抢画面。该看的动作一帧不落，该说的缘由只漏半句，这种强观察/弱解释的组合方式，让眼睛先认住样子，脑子才慢半拍跟上来。


      同一画面里，镜头把改前和改后并到一起：一边裤脚垂到地、盖住整只脚，一边卷起后腰线上提、脚踝透出来，可见变化不靠字幕，观众自己就看得出。镜头再拉到全身停一拍，给一个明确的完成判断——卷边平整不散、腰头不堆褶、裤脚停在踝骨那道线上，这一条动作镜头起承转合就算走通。每条压多少秒、竖屏还是方屏，平台提示仅作为研究注释，暂不落进画面里。


      这套翻卷的思路，任何一条阔腿裤都能照做，可演到这儿只是一副能反复套用的示范骨架，不是能直接发的成片。真要落成具体一条，还得先补几样现场实拍事实，留成槽位：【商品事实：这条裤子的真实颜色与洗水，等品牌确认】【现场事实：拍摄的空间、光线与背景陈设，到场再定】【镜头事实：跟拍用几个机位、每段掐多长，等分镜落下来】。填齐之前，它只当个演示用的样子，手把最后一道卷边压实，退出镜框。'
