    body: '同一件卡其色风衣挂在门口那排木衣架上，换三个人来说，说出来的东西完全不一样。


      店主视角先开口，她的主语永远是"我们"：我们这批风衣只做了两个色，米白到得早，卡其色上周才补进来，肩线往里收了半寸，上身不塌肩。她只说自己动手能确认的——进了什么货、改了哪道线、挂在哪一排，这是动作词该管的活。


      轮到导购视角，主语换成"你"和"我看到"：你上身这件，袖口刚好盖住手腕骨，刚才那位姑娘也挑的同一码，扣到第二颗最服帖。她说的全是观察词，眼睛看到的、手摸到的，绝不替顾客拍板"你穿显瘦"——那是把解释词硬塞进导购嘴里，越了界。


      搭配师视角站得远一点：这件风衣配直筒裤会利落些，配阔腿裤重心往下压，个子高的压得住。她用的是解释词，讲的是"可能""适合谁"，给的是判断的理由，不是打包票。


      这就是角色发声寄存器在做的事——先定主语选择与叙述站位，谁开口、站在哪儿说；再管信息密度与限制语，一句话里塞多少、哪些不能说满；最后守住动作词、观察词、解释词的边界，做了什么、看到什么、为什么各归各。三个人围着同一排衣架，口吻不打架，也不会替品牌旁白把话讲过了头。'
