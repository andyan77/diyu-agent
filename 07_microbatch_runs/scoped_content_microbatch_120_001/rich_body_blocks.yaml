    body: 想把一整套穿搭讲清楚，先别急着夸好不好看，而是拿一副固定的尺子把它拆开来看。这副尺子就是 Look 拆解观察骨架：站在衣服前，先看整体轮廓——是 A 字往下张开还是直筒垂落；再看层次，外披、内搭、贴身三件怎么叠出前后进退；接着扫一遍颜色怎么分布、哪块面料迎光哪块吃光，形成材质对比；最后把搭配位数清楚，上下内外一件不落，帽子、腰带、包挂在哪一处也要点到。五个拆解维度对齐，一套搭配就变成一串能挨个讲的观察节点，不会滑到“这人身材好”那种没法复用的判断上去。拆完维度就组织画面。把镜头里的空间分三层调度：最外层的前景交代人站在什么环境、脚边有没有道具垫住场景关系；正中间让要主推的那件单品当主体，光压过来、焦点落在它的领口或版型转折上；后面再放一层陪体，压虚压暗，只负责衬托不抢戏。可拍摄的前景-主体-陪体结构这样一排开，主次立刻分明，镜头知道往哪儿落，不会三层糊成一片找不到重点。单套这么看，成组陈列也照此办——几套并排时，先各自跑一遍这套骨架，再让轮廓与层次在货架上接力，视线从左到右被有节奏地牵着走，单套搭配与成组陈列的观察节点就能对上。真要拍、真要摆时，下面这些现场事实得先拿到再落地：【商品事实：本次主推单品的品类、颜色与版型细节】【门店现场：拍摄门店的空间尺寸、货架布局与可用道具】【镜头事实：可用机位、光线方向与出片构图清单】。事实没到手前，只写通用的观察与调度方法，不假装某个现场已经搭好。
