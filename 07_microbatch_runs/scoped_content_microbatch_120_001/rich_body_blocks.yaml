    body: '先别急着把衣服一件件挂满。你手里这排货，其实是在讲一个故事，谁是主角、谁是配角，观众一眼就能看出来——这就是产品到陈列叙事关系语法在做的事。


      第一步，定中心位置。把你最想让人记住的那件放在视线正落点，左右各空出一点留白，别让它跟旁边挤在一起。中心位置一旦被占满，主次层级就塌了，所有衣服看起来一样重要，等于什么都没说。【品牌事实：本次要主推的那件单品】放这儿，它就是这排货的第一句话。


      接着处理相邻位置。主角右手边挨着的那件，走同色邻接，颜色顺下去，眼睛不会被打断，像句子里的逗号；主角左边来一次异材质邻接，一边是软针织、一边换成硬挺梭织，手感一撞，画面立刻有了创作张力。这种邻接关系不是随手挂，是你在替观众排阅读顺序。


      配角往层次后方退。同一个主题化组合里，越靠后的越安静，把光让给前面。侧边位置留给延伸款——想搭什么、能怎么穿，用侧边位置的位置关系去暗示，不必写字。


      最后一句：凡要落到真门店货位、真实拍进画面的实景照，先脱敏再说；脱不了敏就挂着待补，别硬塞进画面。【门店事实：该组陈列的实际货位与实拍图】这块，确认脱敏后再补。


      记住，位置关系会替你说话。你排的不是货架，是一段能被人复述的话。'
