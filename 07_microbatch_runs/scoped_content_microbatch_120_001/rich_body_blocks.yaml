    domain_mechanism: 让单品顺着人物动作入镜以确定首次出现位置，再按其在场景里承担的叙事角色（此处为过渡项）做功能命名，据角色下移搭配重心并筛选细节作证，使商品在使用场景中承担角色而非充当硬广道具。
    downstream_content_effect: 读者先记住"谁需要这件开衫、它在场景里干了什么活"，而非任何卖点罗列；后续同类内容可复用"角色先定、位置随身份、细节按角色筛"这条可检查的叙事骨架，产出非硬广的产品故事。
