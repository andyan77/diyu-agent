    body: '店里没别的客人，只剩试衣镜前这一个姑娘。她捏着那件炭灰双面羊绒短大衣的袖口，反复问同一句：到底耐不耐穿，上身显不显瘦。做了十来年的女店员没接这两句，先把她的手引到肩线下那道对折的边——双面呢不缝里子，翻开也是干净的一面，线脚一针针缲进去。"你先摸这儿，"她说，"眼下最该盯的观察对象在这道缝上；耐穿、显瘦这种话，我不替它打包票。"


      她把大衣往姑娘肩上一披，只给一句用得上的场景提示：早高峰挤进车厢，一手拉扶手一手护着包，这件不勒腋下，抬臂也不往上吊。至于怎么搭，她只交代一样搭配条件——领口里露一点衬衫领尖，下面换条锥形西裤，肩背不往下坠，重心落到腿上。领口连接那道折痕正搭在锁骨上，姑娘对着镜子偏了偏头，看它服不服帖。


      要留最后那句招呼时，女店员把嗓门压了下来。她没讲"今天不定明天就没"，也不去报门口牌子上那行活动——那是【本周到店活动与可搭的当季单品，以店里当天为准】里的事。她只肯做一件：把这句邀请跟衣服好不好，两下拆开，走的是 CTA 与商品事实的隔离，这一条她这些年最不肯松。话也删到只剩一句，多一句她都嫌沉，这是她惯用的 CTA 的信息密度控制——"这周你再路过，别急着定，翻上领子对着镜子站上半分钟，看那道折痕搭在锁骨上顺不顺。"


      姑娘没应声，把大衣脱下来搭回臂弯，指尖又在那道缲边上摁了一下，才慢慢往门口挪。'
