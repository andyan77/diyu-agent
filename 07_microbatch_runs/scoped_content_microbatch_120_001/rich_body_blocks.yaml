    body: '镜头从一件摊在木台上的白衬衫开始，这是整段的动作起点：袖子还皱着，前襟敞开，看起来跟衣架上任何一件没差别。手入画，先把左边袖口向上翻两折，停在小臂中段；镜头跟随手腕移动，不切走，让观众看清折了几道、折到哪。这一段是"起"，交代要做的是把一件随便套的衬衫改出轮廓。


      接着"承"：两只手把前襟下摆掖进裤腰，只掖前面一段，后面留出来；再抽一条细腰带，从右手边绕过来系在侧腰，打一个松扣。每一步都配一句短旁白，属于动作对应的解释槽位——"袖口翻到小臂手腕更利落""前掖后放腰线才提得起来"，话少而准，不盖过画面。这里刻意用强观察/弱解释的组合方式：手怎么动看得见，为什么这么做只点一句。


      "转"是一个可见变化的对照：镜头拉回全身，把改之前的敞怀平塌和改之后的收腰立体并排给到，观众自己能判断差别在哪。"合"收束到完成判断——腰带扣住、袖口不再滑下来、下摆不外翻，就算做完。整段动作镜头起承转合走完，就是一条能直接发的示范。


      这套是通用方法，任何一件长身衬衫都能照着套。真正落地拍摄时，下面几样得先给到实拍事实，不能凭空当成已经拍好：具体上身的那件衬衫版型与颜色留成【商品事实：待补的衬衫单品】；实拍空间与道具台留成【门店事实：待补的拍摄场地】；分段镜头的机位与时长留成【镜头事实：待补的分镜表】；示范者与手部出镜留成【人物事实：待补的出镜人选】。平台提示仅作为研究注释，不写进画面。'
