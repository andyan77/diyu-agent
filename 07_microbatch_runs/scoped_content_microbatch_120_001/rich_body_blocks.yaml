    body: '想把门店里那些一闪而过的日常动作拍成能看的内容，第一步不是开机狂录，而是把「门店日常动作观察切片」当成一门手艺：把整片忙碌拆成一个个有头有尾的小段。


      先圈出几类反复冒头的一般化动作。开场准备类动作，比如清晨拉开卷帘后，店员把叠乱的针织衫一件件抖平、码齐在中岛台面；随后是整理，指尖顺着衣领把翻起的一角压回去；再是比对，把两件同款不同色的大衣搭在手臂上，牵到试衣镜前的光下，让客人看哪个颜色更衬脸；然后是讲解，捏起风衣下摆翻出内衬，指着走线说明这一处的用意；最后是递示，隔着台面把一条丝巾平托着递过去，请对方上手掂垂坠。


      要紧的是给每个动作标清动作前提与结束标志。以「比对」为例，前提是手里已握住两件可比之物、客人视线已被引到镜前；结束标志是其中一件被放回、另一件留在客人身上。有了这层动作与场景道具的最小关系，镜头才知道该对准动作对象——是那件衣服和那双手，而不是一整片空店面。切不干净，成片就只剩「店里很热闹」的空气，看不见一个落到实处的手上动作。


      方法讲到这里可以通用复用，但真要落成一条成片，还得补进现场事实，先留成槽位：【门店事实：门店实拍位置与光线条件】【商品事实：入镜单品的品类与材质】【镜头事实：机位与景别脚本】【角色事实：出镜店员站位与手部动作确认】。这些没到位之前，只当作方法脚本，不假装某家店的现场已经把机器架好了。'
