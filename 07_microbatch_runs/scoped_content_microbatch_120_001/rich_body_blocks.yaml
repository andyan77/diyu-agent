    body: '周三下午店里没什么人，她把一件浅灰衬衫从衣架上取下来，摊在木台上，先不急着开口。镜头跟着她的手走——这是她给自己定的规矩：讲一件衣服得按看得见的先后来，不能一上手就抠某一处。


      她先退半步，让整件衬衫平铺进画面。肩线落得正，门襟合缝不起浪，两侧下摆齐平，这是外观这一层一眼能读到的东西。她对着镜头说，先看它整体是什么样子，再往里走。


      接着指尖移到结构处。翻开门襟内侧，看接缝怎么走；捏起侧缝，看它是包边收口还是简单锁边。她把袖口翻过来，让大家看那一圈缝法，又指了指领口压线顺不顺直、有没有跳线。这些都是结构层的活儿，撑起一件衬衫的骨架。


      最后才落到细节。她凑近拍那排纽扣孔，孔口锁线密不密、有没有毛边，纽扣钉得牢不牢。走到这，一件衣服的可见工艺节点清单基本过完：外观、结构、细节，一层层递进，这套工艺观察线索与讲解节点连起来，观众跟着看，比劈头盖脸报参数舒服得多。


      有人在评论里追问：包边缝得这么密，是不是特别耐穿？她没顺着话头接。她清楚，从一处缝法好看，直接跳到"所以整件都耐穿"，是把局部放大成了整体结论，这一步得刹住。她的做法是：耐用与否得看【产品事实：面料克重与耐磨测试结果待补】，眼下只说"这处包边收得干净、走线均匀"，把看得见的说满，把没证据的结论先按住。工艺名词和耐用结论之间，本就该留一道切口。'
