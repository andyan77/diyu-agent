    body: '改到第三遍标注，笔尖停在"这条裤子显瘦"那几个字上。写陈列文案的人都撞过这个卡点：想夸的话到了嘴边，可"显瘦""耐穿""高级"这类断语手里没有能核对的依据，只能先按住，要么换成看得见的说法，要么挂一个【待补证据：版型对身形的修饰效果，需上身对比素材佐证】等着补齐。那句于是改成——焦糖色灯芯绒阔腿裤的裤缝笔直落到脚面，腰侧两道活褶把余量收进腰头。这是镜头拍得到的，不是替顾客提前下的结论。


      区位这一头也守同一条线。入口区退到远景，只交代一整片暖色压在层高里的第一眼；中岛四面围合，把这条裤子和一件燕麦色高领毛衫并置，中景框住半身，让人读懂两件怎么接色过渡；端架顶灯压下，近景贴近裤脚的绒条纹路和纽扣哑光。挂通把同系列顺次排开，一件接一件的均匀间隔，正好给镜头当平移的轨道。把远景-中景-近景的观察切换过一遍，就落成从区位到镜头的最小映射。


      真要开机，别默认这家店的货架早已布置停当候着你：实际怎么走、灯打哪边，挂【门店现场事实：从进门到端架的实际走位与打光角度】，中岛究竟成组哪几件挂【商品事实：本次并置的单品清单】，谁来取放上身、机位摆哪挂【出镜事实：执行角色与近景机位】。手边这份，不过是把静态陈列中的可拍摄重点先圈出来的底稿，还得脚本化、过一轮复核才谈得上对外发布。'
