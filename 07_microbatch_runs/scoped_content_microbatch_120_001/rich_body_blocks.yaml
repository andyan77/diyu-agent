    body: '烟灰色那条醋酸百褶裙，白天一直压在我的待发文件夹里。晚上店空了，我才坐下来慢慢拆买手甩进群的那串话——哪句能挂上明早的上新推文，哪句得留在群里烂掉，我一条条往两边拨，这活儿我私下管它叫边界分流。


      在买手的账本里，这条裙子是"压了两波才补齐的走量款"，她惦记的是断没断码、哪个色走得慢；挪到我这边写推文，它得变成客人滑到就想多看一眼的东西，我的解释重点也跟着挪——她数的是手上还压几手，我描的是裙褶走两步漾开的那圈弧。同一条裙子，从她嘴里到我笔下，这一层命名变化，我心里得存本对照表；账本到镜头的这趟交接，就是我每天要过的一次上下文切换。


      最费神的是买手随手补的那句"显瘦十斤、久穿不塌"。这话我不敢照抄。我没跟着谁把它穿满一季，塌不塌轮不到我拍胸脯——这种没被证过的断语，我一律按住：能改就改成眼睛真看得见的，腰头那道活褶收得住，垂下来顺着腿往里走；改不动就先挂着，标一个【上身久穿实测·待补】，等有回穿的人再来填。换个视角、换张嘴，不等于这句就落了地——视角切换与公开安全边界这条线，我拎得清：换的是说法，动不得那道门槛。


      至于她那句"这批返修我们压得低"，我一个字都不往外带。返修多少、补货压了几天、跟谁拿的货，全是留在门里的内部运营切断；公开安全的这一头，只留裙摆那圈弧、腰头那道褶。划完这道线，我把推文存成草稿，关掉店里最后一盏灯，明早头一件事，是再看一眼那圈弧，够不够勾住人的眼。'
