    body: 先把镜头对准店里最普通的一分钟：一位店员走到挂杆前，抬手把一件针织衫的领口捋平——这就是一段能被看见的开场准备类动作。要让这样的门店日常动作观察切片真正用起来，靠的不是摆拍，而是给每个动作找准它的动作对象，再画清它的动作前提与结束标志。整理最好切：动作前提是衣物歪斜、袖口翻卷，动作对象是那件挂在杆上的风衣，结束标志是腰带重新系向同一个方向、肩线被搭正。镜头贴着手走，只抓布料被抚平那半秒里褶皱散开的变化。比对紧随其后：把两件深浅相近的衬衫并排提到胸前，让光从侧面斜切进来，动作前提是顾客在犹豫，结束标志是其中一件被放回挂杆、另一件留在手上。讲解与递示连成一组——讲解时指尖点在袖扣、门襟这些动作对象上，递示的结束标志是衣物完整落进对方掌心、店员的手再收回。把整理/比对/讲解/递示等一般化动作各切成有头有尾的一小段，动作与场景道具的最小关系就浮出来了：一件衣、一束光、一双手，够了。到真正开拍那一步，下面这些必须补齐，不能凭空当作现场已经摆在那里：【门店事实：具体门店与货架位置】【商品事实：上镜衣物的品类与配色】【镜头事实：机位与景别】【现场事实：开拍时的光线条件】。
