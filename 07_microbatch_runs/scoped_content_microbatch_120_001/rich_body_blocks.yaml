    body: '先别急着夸一件衣服百搭。你把它从衣柜里拎出来那一刻，得先问自己一句：这趟出门，我到底要去完成什么？这就是场景任务锚点——通勤是把人稳稳送进工位，周末遛弯是能蹲下能追娃，看展是站着走两三个钟头也不塌。任务先定住，衣服才有可以对齐的方向。


      拿一件中长风衣来说。写字楼里它撑得住场面，坐进工位、起身开会，坐立切换之间前襟不堆不卡，正式程度刚好压得住。可你把同一件带去菜市场再拐进亲子乐园，问题立马冒头：一手牵孩子、一手拎袋子，携带物限制一上来，长下摆就开始碍事；一会儿钻滑梯，一会儿追着人跑，场景中的动作限制直接把它逼到墙角。这不是风衣不好，是它跟这个场景要干的活对不上。


      会讲衣服的人，从不张口就说"这件什么场合都行"。他反而主动交代不适配条件表达：室内暖气足、室外风口凉，室内外温差大的日子，得靠外搭层次去接——里头一件能单穿，外面这件随时脱、随手往臂弯一搭，别让它成累赘。要是通勤路上还夹着地铁换乘、步行距离拉得长，那就把厚重那件换成能收能放的。


      场景切换条件说穿了就一句：从坐到站、从室内到室外、从空手到拎满，只要有一样变了，就得重新掂量它还配不配。能说清它在哪儿合身、在哪儿掉链子，这件衣服才算被你真正讲明白。'
