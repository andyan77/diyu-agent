    body: '开店前一个钟头，卷帘门还没拉起来，我跪在中岛模特脚边，把那条焦糖色灯芯绒阔腿裤的裤脚往回叠了半寸。一束灯从斜上方压下来，绒条一根根立起来，膝盖那道折痕，我用手背来回蹭平。


      这条裤子昨天还躺在后场，在买手搭档笔下是一行代号、几条返工记录；到我手里，它是要立在客人一进门就撞见的那个位置上的东西；扛机器过来的同事眼里，它又成了镜头正中央的主角。一条裤子，一路的命名变化，我拿铅笔在挂牌背面挨个记下来，免得三张嘴对不回同一条上——名字跟着人走，我脑子里也得跟着做一次上下文切换。


      后场那摊事，我一句都不往台前带。哪几条裤缝的车线要返、供货那边什么脾气，全锁着，算我这头的内部运营切断；能立到灯下、能写进那张小卡片的，只有公开安全这一面客人真摸得着看得见的——绒面顺不顺手、坐下起不起皱、站直了裤线垂不垂。哪句话能出这道门、哪句得压在后头，是我每天蹲在这儿反复做的边界分流，也是从后场递到台前时最容易漏的那一处。


      小卡片我没急着写满。想落笔写"这条显瘦、百搭、还耐穿"，笔尖悬在半空又收了回来——这几句我眼下没凭据，镜子还没照过一整季。我只留能验的：腰头两指宽、口袋斜插、绒色在暖光里偏红。至于这季它摆哪个主推位、吊牌那行成分标怎么印，【本季主推位与吊牌成分标待补】，等准信到了我再落进卡片。换张嘴讲它，只是解释重点挪了挪，那道能不能露、该不该压的分寸，一寸不让。


      裤线最后我再对一遍，正冲着门口那束光。'
