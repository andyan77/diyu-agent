    body: '开播前八分钟，红笔在手，我把提词卡又从头顺了一遍。第一张写的是这条深蓝高腰牛仔裤，我逼自己先只报眼睛看得见的：直筒版型，裤缝压得笔挺，拉链是金属不是塑料。这一段我讲得稳，不撒钩子，观众防线最低——这属于低风险信任信号，我说出口的每句都能在镜头里的裤子上找到对应。


      情绪温度不是不给，是分着给。接着我让声音亮一点：上身那下腰被拎住，人往上抽条，走两步裤脚荡起来。声音抬一档，人也立体，可我心里那道信任门还关着——这就是情绪温度分层，一层层地暖，绝不一张嘴就把人架上天。


      真正得按住的，是我最想脱口而出的两句："穿三年怎么洗都不掉色""往身上一套直接小一号"。这两句是观众会拿去下单的强证据信号，一脚踩进我拍不了板的确定性禁区。没实测我就不喊，换成你能看见的：蹲下起身裤腰不勒，面料松手就回弹。还有句更险，差点横向比上别家——比谁更耐穿，得有数据撑腰，没有就咽回去。到底多耐磨、掉不掉色，这几项我先记成待补依据，卡上空一格白纸黑字留着——【品牌事实：这条牛仔裤的棉与氨纶配比及克重】、【品牌事实：色牢度与耐磨的实测数据】。数据没到，我一个数字都不许自己编。


      弹幕八成会追"你自己穿多久了"，这句我更不能顺口接，留成【角色事实：主播本人真实的上身穿着时长】。降级表达不是把直播讲闷，是不让上头的情绪替观众拍板。灯亮了，我把红笔一撂，先把看得见的那几句讲利索。'
