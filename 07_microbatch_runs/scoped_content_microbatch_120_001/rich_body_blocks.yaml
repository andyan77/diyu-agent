    body: '镜头先别急着切。你手里这件棉衬衫，别套上就走，跟着我把穿着顺序走一遍。先来一件贴身的内搭短打，再把衬衫敞开披上，最外层压一件针织背心——这叫层搭，不是随手叠三件。

      领口往里翻折两指宽，露出内搭的边，肩线会往后收一点。袖口也翻，翻到手腕骨头露出来那节就停。腰侧有根抽绳，往左边一带，这是它的调节方式，松紧你自己拿。

      拍的时候我只守一条：同一光线。不换灯、不挪窗，把「翻之前」和「翻之后」放进一样的光里给你看，你眼睛看到的差别才算数——这是比较语言的边界，我只让你看，不替你下判断。

      有人问穿上是不是显瘦。这句我不敢替你说。镜头里能看到的只是：翻折之后领口线往下走、袖口收干净、肩背这块的余量少了。至于「显瘦」，那是结果，得有【产品事实：面料克重与版型数据】撑着才敢讲，没有我就按住。

      注意事项也说清楚：这根抽绳是装饰的，别当承重拽；内搭挑深一点的颜色，翻折的边才立得住。我教你怎么穿、怎么翻、怎么调，这是教育性说明能做的；穿久了会怎样、值不值，那是另一码事，我不拿一个演示动作替你证明结果。想看更细的顺序对比，评论区扣「层搭」，下一条我把【角色事实：本人常穿尺码】也标出来。'
