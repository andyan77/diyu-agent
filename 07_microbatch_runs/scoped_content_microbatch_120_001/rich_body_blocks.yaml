    body: 清晨的棚里只留一盏侧光，一件外套挂在木衣架上。镜头先退到远景，把整件衣服的轮廓交代清楚——肩线怎么落、下摆怎么收，让人先看见它挂着时候的样子。这是画面层级里的第一层，不急着说好话，只让它自己站在那儿。一只手伸进来，把外套从架上取下、翻过肩去。这个取衣、翻面的可拍摄动作，是为了把镜头线索引向结构。中景停在肩缝那一段：两片布怎么拼到一起，拼缝走得直不直，袖窿的弧收得顺不顺。这里补一句说明与非结论化提示——先描述看见了什么，不替观众下"它一定好"的定论。接着进近景。可拍摄对象就落在能对上焦的地方：一行走线、一枚扣位、翻开衣襟后的里料收口。手指顺着走线捋过去，针脚密不密、匀不匀，都在这一寸里看得清。扣子转上半圈，看它缝得牢不牢，这些都是实打实的对象线索，不是空口卖点。再翻到内里，里料收口那一道包边，是很多人不会留意、却最能看出手艺的边界。镜头到这里停住。至于这道工艺叫什么、走的什么线、做了多少年，画面不替它编——留成【品牌事实：该工艺的名称与来历】【产品事实：面料成分与克重】，交给出镜的【角色事实：出镜人身份与关系】在片尾亲口补上。像"更耐穿""显瘦"这种硬话一律不写死，降成能看见的描述，或者挂着等证据补齐再讲。
