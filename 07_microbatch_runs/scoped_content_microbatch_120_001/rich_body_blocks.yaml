    body: '写这件长风衣的文案，我第一反应打的是"穿上立刻更显瘦"。手指停在那儿——这就是身体效果承诺区，属于叙事放大禁区与风险路由里最先要拦下的一类。我没写结论，只写看得见的：直筒廓形从肩线一路垂到脚踝，走动时下摆兜风，腰上那根同色布带一系，视觉上就把人往长里带。这叫降级成观察语言，眼睛能验证的才留。


      接着想夸面料更耐穿。这是功效暗示，没有实测撑着就是硬结论，改不动的先挂起，等【品牌事实：面料克重与水洗起球测试数据】补上再说。


      写到品牌背书，我本来顺手要接一句拿过的奖项、上过的排名、还有墙上那张认证。这三样全落在身份与背书区，一个字都不能编——【品牌事实：奖项名称与颁发年份】【品牌事实：榜单名称与排名位次】【品牌事实：认证机构与证书编号】，槽位空着，有一填一。


      最容易翻车的是绝对化比较区。"全网同款最能打"这种，属于风险放大词与禁用表达类别，直接删。


      压场那段最想放人味：一个熟客的顾客反馈、店里那天的门店事件、老裁缝的员工经历。不是不能用，是敏感承诺，得送到能拍板的人那儿复核——【角色事实：顾客原话与授权状态】【品牌事实：门店事件时间与在场记录】【角色事实：员工姓名与在职年限】。


      一条文案收尾，我做的就是高风险 narrative zone 分类：先认出它落哪块，再走不同风险 zone 对应的路由动作，改写、挂起，还是送审。'
