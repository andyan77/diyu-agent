    body: 傍晚收工前，编辑部里有人想赶紧给那件姜黄色的缎面衬衫配一句好听的说明。我抬手拦下：别忙着堆形容词，先把它端到三盏灯下各看一眼。头顶的日光灯管冷白，衬衫被照得发亮，明度一下抬高；挪到旁边那盏暖黄台灯，黄里立刻掺进一点橙，色相像悄悄往红那边挪了半格；再举到镜头前回看，屏幕又替它把纯度加了码，比手上瞧着更扎眼。同一片缎面，三盏灯，三副脾气。所以轮到写它的颜色，我头一句永远落在光线上——这是在什么灯下看见的。剩下的，把颜色拆成几样能对账的维度慢慢说：色相定它归哪个色系，明度管深浅，纯度分鲜还是灰，再顺手记下此刻光线的冷暖。这些都算颜色的基础维度，摊在明面上，谁想核都能自己对一遍。它落在偏暖的色彩家族里，旁边那件炭灰背心是压得住的中性色，一暖一冷并排摆，暖的更跳，冷的更稳。同事又追一句：加个"特别显气色"呗？我摇头。那不是我们眼睛看到的，是替读者那张脸先兜了底。讲气氛、扯联想都随意，说它像晒足一下午的稻壳；可话头只要拐向"上身显白""看着更贵气"这类身体承诺，就得原地压住。到底显不显、成分是什么、会不会晒久褪色，都不由这行文案拍板，先空着——【上身效果：显白、显气色一类结论，须真实试穿记录或用户反馈到位后回填】【材质与色牢度：具体成分、耐晒不褪，以吊牌检测与复晒样本为准】。写下这两个空格，我又抖了抖衬衫，让灯光重新爬过缎面，才朝她点头，让录制键按下去。
