    body: '打烊后店里只留半边灯。他把那组秋装从挂通上一件件取下，重新往中岛码，先把正对门口的角空出来。铁锈红的灯芯绒夹克单独搁在那儿，其余都退开半步——一组衣服总得推一件先开口，替大家把今晚要讲的话起个头，这样的主推叙事项他从不在它身上堆卖点，只把袖口随手卷了两道，像谁从椅背上抓起来就披上的。


      理主次关系与陪衬关系时他手很稳：红的先响，左边米白高领和炭灰西裤跟着点头，不去抢话。中间那件芥末黄薄背心最费思量，添它不为保暖，是要在铁锈红与灰之间搭一处颜色连接项，把生硬的断口缝上，视线从暖滑到冷才不硌手。至于脚边那双复古德训鞋，没大用，只因右下角空着构图会塌，拿它当个场景补位项补上罢了。


      同一组明早还得进直播镜头，难就难在这。中岛这边人能绕着走、伸手摸，袖口怎么卷、背心什么织法都留得住；镜头只给正面、只肯停几秒，细处只好狠心舍掉，把红和那句话直推到最前——这套按门口松紧来删的分寸，属于渠道差异下的信息删减规则；他把每件担的组货角色类型，连同谁主谁次、谁替谁圆场，一并收进那张组货角色与渠道边界矩阵。


      这张表管的是能反复照搬的关系，不是今晚这盘货具体怎么调度；真落到哪件明早几点上播，那是【本季实际上播单品与档位待定】，他把那行留白。码完最后一件，他退到门口回看，铁锈红正冲着来路，像在等明天头一个推门的人。'
