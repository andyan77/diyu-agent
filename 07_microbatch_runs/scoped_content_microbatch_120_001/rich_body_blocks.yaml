    body: '午后的光从侧窗压下来，穿开衫的人先坐在高凳上不动。镜头退到一整个身位以外，把这件米色针织开衫穿在身上的样子交代完整——肩头塌不塌、门襟合拢顺不顺、下摆那圈罗纹是收着还是散开。远景落在画面层级最外的一圈，让人先认清它上身后的整体形。


      人站起来，转过半个身，把袖子撸到手肘又放下，扣子一颗颗扣回去。这几个可拍摄动作不是摆拍，是给镜头线索一个落点，把眼睛引到接缝那一段。中景停在肩线和插肩的并接处：两片针织怎么拼到一起，线圈有没有被拽得变形，收针那一截松还是紧。


      再往里推到近景。能对上焦的可拍摄对象就那么几处：袖口一圈罗纹的松紧、领口收边那道包缝、翻开衣身后内里的一段藏线。手指顺着罗纹捏一下再松开，看它弹不弹得回来；指腹沿领口那道边推过去，针脚匀不匀，凑近了都藏不住。这些吃得住特写的地方，才算拿得出手的对象线索，不是嘴上说的好。


      到这儿得按住一条边界：暖不暖、会不会起球、能穿几季，镜头本就拍不出来，别让画面替它打这个包票。能拍的是线圈的回弹、是领口贴不贴颈、是罗纹松开那一下的动作；画面证不明的话，退回看得见的描述，或者先空着等补。


