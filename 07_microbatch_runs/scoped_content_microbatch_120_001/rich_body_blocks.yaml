    body: '先别急着夸。手里这件卡其色风衣，我第一句只想说清楚它长什么样：双排扣、过膝、肩线压得很平，腰带是同料的宽带，不是塑料扣那种。这一段我把它叫冷层，只报事实、不带感情，读的人心里那点戒备是最低的——这就是低风险信任信号，你说的每个字都能跟眼前的东西对上。


      往下我才敢升温。想象周一早上八点，地铁口那阵穿堂风，你把腰带随手一收，领子立起来挡住半张脸，风衣下摆跟着步子甩。到这儿情绪温度上来一档，画面有了人味，可我心里那根线还绷着：这叫情绪温度分层，从冷到温一档一档给，不能一开口就煽。


      真正要小心的，是我特别想说"这件穿十年都不塌""上身立刻瘦一圈"的时候。这些是强证据信号，是读者会拿去做决定的硬话——没依据我就不写，宁可降级表达：只讲走动时下摆的垂坠、坐下去不容易起皱这些你自己能看见的细节。它到底多耐穿、面料克重多少，那是确定性禁区，我把这几项标成待补依据，先用命名的空位占着：【品牌事实：面料成分与克重】、【品牌事实：耐洗测试的实测结论】。真数据填不进来，我绝不硬编。


      最后一句留给出镜的人：【角色事实：出镜者和这件风衣之间的真实关系】。有据才升温，没据就退回到看得见——这件风衣到底值不值，我把判断交回给你的眼睛。'
