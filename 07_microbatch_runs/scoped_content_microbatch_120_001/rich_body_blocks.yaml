    body: '傍晚店里空落落的，靠窗一束光斜铺在地板上。一位阿姨站在光里，手指捏着那件卡其长风衣的下摆来回捻，不太敢往镜子那边看。陪她来的女儿先出了声：“妈，你穿这件腿都拉长了，可显高！”


      “显高”两个字我差点顺口接住，又咽了回去。这类替人身体打包票的话，我心里都归进结果词那一档，默认不往外说——风衣能让眼睛看见的那道竖线更清楚，却决定不了阿姨天生的身量和骨架，我没资格替她的身体许愿。


      我把话头拐了个弯，请她往窗边挪半步，让光顺着门襟淌下来。“阿姨您看，这件我没系腰带，前襟这道线条从领口一路开到底下，中间没被拦断。”我讲的是关系词——这道竖线跟她的肩、跟窗光怎么摆在一处，不是给她的身材下判决。她顺着那道线往下看，肩膀不知不觉松开，原先憋着的那口气也慢慢吐了出来。


      往后我更愿意做场景化观察，只挑观察词说，讲眼前这一刻真能看见的：门襟怎么走向、布料怎么垂坠、下摆停在膝盖偏下哪一寸。至于这件风衣的面料配比和克重，我不敢张口就报，【品牌事实：这件风衣的面料配比与克重，待证据补充】；抗不抗皱、耐不耐穿也一样，实测数据没回来，我只说上手偏挺括，【待补证据：抗皱与耐磨实测数据】，绝不先写死。


      “遮不遮肚子”这种问法，我用替代表达与回避表达绕开，换成她照镜子自己就能对上的画面——腰这一段是直的，光顺着往下没打弯。阿姨转了半个身，风衣下摆荡开又落回，她盯着那道从肩到膝的竖线，轻声对女儿说了句：“这条线，看着舒服。”'
