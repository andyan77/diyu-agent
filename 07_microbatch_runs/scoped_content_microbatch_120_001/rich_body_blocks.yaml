    body: '"这件外搭好不好搭，别急着说百搭。"我把它从衣架上拿下来，先问自己一个更笨的问题：你今天要去哪，要在那儿干什么。


      答案不一样，判断就不一样。地铁转公交、再步行十几分钟到公司，步行距离一拉长，你就会嫌它下摆扫腿、走两步要拽一下——这时候外搭层次就得往上收，里面换成能塞进裤腰的短打，动作才不别扭。可要是全程有车、下车就进电梯，同一件反而稳当，垂坠感全留得住。


      再看坐立切换。开一下午的会，坐下站起来来回好几趟，长款一坐就压出褶、起身还得抻一抻，这就是场景中的动作限制在替你挑衣服。换成到膝盖上一点的中长款，坐立切换就利索多了。


      室内外温差也是硬指标。北方冬天室外零下、室内暖气二十几度，你要么一进门就得脱、手里凭空多一件；要么就靠外搭层次拆着穿。手上还拎着电脑包、拎着给对方带的样品，携带物限制一多，能腾出来整理衣服的手就那么两只，别让自己进门手忙脚乱。


      最后一格是正式程度。上台发言、见重要的人，和周末逛街、下楼接孩子，是两套完全不同的松紧，别拿一件去赌全部。


      所以我从不写这件谁穿都行、什么场合都合适。我宁可老老实实告诉你：它在哪几个场景里最顺手、在哪个场景里会给你添乱。把不适配的那一面也摊开讲，你反而更敢下手——因为你清楚我没糊弄你。'
