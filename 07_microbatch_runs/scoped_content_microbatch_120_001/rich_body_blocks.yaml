    body: '订货会那几天，我盯着一件豆绿色的粗棒针毛衣看了很久。麻花绞得紧，领口罗纹厚，落肩袖搭在手臂上有点憨。我在选货本上给它记的名字是“秋季头一波的走量款”——算的是它跟哪几条裤子凑一组、订几手、压不压仓。


      进了店，到陈列姑娘手里，它就不叫走量款了，成了摆进门第一组的“氛围件”；上哪面墙、挨着谁，还得等【本季首波陈列排期最终确认】。她盯着灯打在麻花纹上那道阴影够不够深、袖子松松堆两下够不够味。到了拍摄那头，它又成镜头主角，摄影只顾模特抱臂时领口往上耸的弧度。


      同一件毛衣一路递下去，名字换了三回，这种命名变化我早看惯了。它每交出去一次，解释重点就跟着挪一挪——我讲搭配和数量，陈列讲光影和堆叠，拍摄讲动态和情绪；一次上下文切换，就是一次重新对焦。


      要绷紧的是往外发那一刻。新来的小编写推文，顺手带了句“这批订得少、手慢就没了”。我赶紧按住：这是后场的账，得做内部运营切断。补了几手、还压着几件，只在门里说；到了公开安全这头，我只留见得了光的——麻花的手感、领口的厚度、上身抱臂的样子。这一拦就是边界分流：名字尽可在几个人手里换来换去，内部那截绝不许顺这股流溜到客人眼前。


      小编还想补一句“这毛衣绝对不起球、能穿好些年”，我也拦了。供应商嘴上这么说，我们没上身验过，换到公开面照样是没准头的话，不能改个说法就当板上钉钉。这句先挂着——【毛衣抗起球与耐穿的实测结论】没回来，谁也别往外写。视角换了、叫法换了，可什么算数、什么还欠凭据，这条线一寸都不松。


      删掉那两句，我把毛衣挂回样衣架，领口朝外。'
