    body: '「先别急着夸这件好看。」拍品类科普图文的第一步，是把一桌子衣服按结构归位：能套在躯干上半段的归上装，从腰往下走的归下装，一件到底、上下连成一片的进连衣类，罩在最外层、随时能脱能披的算外搭类。这套上装/下装/连衣类/外搭类等抽象品类分层先立住，画面里每件衣服才有了自己的格子。


      归好位，再逐层打开它的属性槽位。以一件上装为例：先看领型是圆领还是翻领，再看袖长到手肘还是到手腕，接着落到面料/材质槽位——是挺括的梭织还是带回弹的针织，最后补上廓形与版型。顺序不能倒过来，不能人还没站定就先喊「这件超好穿」。属性格子在正确的层级上一格格亮起来，内容才立得住，不会滑成叫卖。


      镜头转到连衣类和外搭类，仍是同一套动作：结构位置先定，槽位再依次填。这正是品类解释与属性槽位骨架能被反复套用的原因——它是一副骨架，不是某一件的说辞。


      到这里要收住手。凡是要落到「哪件在架上、卖得怎样、多少钱一件」的具体在售事实，图文只写到品类、属性、边界这三层就停：没有确凿来源，不替品牌下款号、不报价、不编上新时间。需要坐实的销售表现，就地留一个【品牌事实：该单品的真实在售数据与上新信息】的空槽，等有据可查再填；像「显瘦」「耐穿」这类判断，也降级成能看见的说法——面料克重偏厚、腰线偏高——或挂进【证据：显瘦/耐穿等效果的实测或买家凭证】。这样一张品类卡，既讲透了单品解释时可使用的通用属性槽位，又稳稳守住品类说明与真实在售事实之间那道切断的边界。'
