    body: '午后三点，斜光把玻璃橱窗照得发烫，橱窗里三个模特还空着架子。陈列师蹲在窗台里侧，照着那套用熟了的陈列动作 SOP 节点框架，把这一轮换装的活分三手走：先做陈列前检查，手里顺了才进实施，最后退出来复核。


      第一手，她抽出一件藏青西装外套抖开，指腹压过驳头找翘边，再把格纹半身裙的褶捋顺；皱的、平的分两堆，衣架对号挂齐。这一摊摊理顺的实物，就是往下递的节点输入——递不出去，后面就只能空手。节点之间的依赖顺序在这儿不讲情面：上一摊没交清，下一步的手就不许伸出去。


      接过这摞干净衣服，实施就直接落到窗里。她给三个模特分角色：一个藏青外套压白T配直筒牛仔裤，一个印花衬衫裙束帆布腰带，一个灯芯绒夹克搭格纹衬衫。整窗一环扣一环，全靠节点输入与节点输出对得上口；摆定的这一窗，就是这步交出的节点输出。


      复核这步，她推门走到人行道上，隔着玻璃从街这头看进去：色块断没断、三人视线齐不齐、主推那件在不在头一眼的落点。街上也挑不出毛病，才算这一窗的完成标志。


      她还给节点可见化表达留了个位置：窗台里侧贴一排能撕的小圆点，做完一个就点亮一个，隔着玻璃站远，也读得出这窗走到了第几手。


      真要落到某家店那扇窗，还缺几样现场事实，先留成空位别硬填：

      【门店事实：这家店的橱窗朝向与可用窗台尺寸】

      【商品事实：本轮真正摆进窗里的款式、配色与尺码】

      【镜头事实：隔着玻璃拍成片的机位、时段光线与要不要人入镜】


      这几格没填上，窗台那件衬衫裙的腰带就先松着，等料齐了，再收最后一道扣。'
