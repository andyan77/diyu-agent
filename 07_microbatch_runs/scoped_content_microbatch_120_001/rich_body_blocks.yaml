    body: 镜头从一整排衣架推过去，我先把手边的衣服按大类分开：套头衫、衬衫这些贴身穿的归上装，阔腿裤、半裙落到下装，一件到底的背心裙拎出来算连衣类，最外面那件风衣、廓形西装外套则是外搭类。这样的抽象品类分层不是为了显得专业，是让镜头前的人三秒钟就知道自己在看哪一格。分完大类，我给每件衣服挂一串通用的属性槽位：领型、袖长、版型松紧，还有最要紧的面料/材质槽位。指到那件米白外套，我本来顺口想说"这料子特别耐穿、上身巨显瘦、看着还挺高级"——话到嘴边被我按住了。耐穿要洗过几十次才算数，显瘦得看具体的人和身形，高级更是没凭据的形容，手边既没有吊牌也没有成分表，这几句就一律不能当事实讲出去。我把它改成能被看见的说法：面料表面是细密的斜纹肌理，捏起来偏厚、垂坠感明显，扣上之后腰线往内收了一点。至于成分和克重，我在脚本里留两个明确的口子——【品牌事实：外套面料成分与克重，待到货吊牌确认】、【品牌事实：这批面料的水洗与耐磨实测数据，待补】，填不上就空着，绝不顺手编一个。品类、属性、边界这三层，是我在没拿到具体单品事实时唯一能站稳的地盘。谁要是把"外搭类里的廓形西装"直接说成某个正在卖的款、报出产地和成分，那就越界了：这类话要么删掉，要么先挂成待补证据的口子，等真凭实据到位再说。单品解释可以讲得很细，但细在看得见的地方，不细在我根本没有的事实上。
