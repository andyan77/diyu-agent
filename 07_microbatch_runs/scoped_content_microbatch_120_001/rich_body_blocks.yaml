    body: '周三下午店里没几个客人，新来的实习生把靠里那面正挂重排了一遍，兴冲冲要拍条短视频。镜头刚架好，她张口就来："咱就说这条线全城独此一家、跟上头签了好几年——"我伸手把她手机往下按了按：这半句，咽回去。


      摆陈列是她今天的活，我不拦。你看这面墙：墨绿羊毛西装敞开挂在第一位，燕麦色条纹衬衫的领子翻出来压住西装领，袖口卷两道；往下接一条巧克力色直筒裤，裤缝朝过道那侧；层板下沿摆一双复古乐福鞋，焦糖色托特包立鞋边，包口拨开一指宽，像刚被谁搁下。灯从层板顶斜切，把那身墨绿压出一点哑光。这些随她拍。


      可她那半句不成。片区怎么划、跟谁签了几年、这条线怎么拿到手，全是制度事实，属于加盟边界里头的东西。店里的零售角色、动作、权限关系，谁动什么、动到哪，早定死了：一个实习导购，重排正挂、换套搭配是本分，可对镜头替店里抖授权底细，这份动作权限她够不着，我也没有。能挂嘴边的，只剩一层一般化授权表面——"店里就是有这么一档合作在"。泛到哪一步才敢开口，归加盟/授权信息的泛化改写条件管；真实制度与方法层的切断就卡在这道缝上：方法层随便拍，底下那套授权，不上台面。


      她又问，连来源都拿不准的说法呢？搁着，等准信儿再说。这条真要出成片，还差几样现成的：【门店事实：这面正挂的实拍机位与客流时段】【商品事实：这几件的实际配色与面料确认】【镜头事实：出镜角度与层板打光清单】【现场事实：可对外复述的合作口径——待补来源】。


      我回手把托特包口又拨开半指，让它更像有人刚走开。缺的那几样没齐，这条不发。'
