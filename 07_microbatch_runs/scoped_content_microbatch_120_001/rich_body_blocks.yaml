    body: 打烊后店里只留一盏顶灯，阿凯把手机架在三脚架上，给一件靛蓝牛仔外套拍上身的短视频。镜头前他抬手压过门襟，双线的车缝走得又直又密，指腹能顶到线迹凸起的那点硬；肘弯处已经洗出几道浅色的褶痕，布面挺括，翻领扣上不外翻。这些是他镜头里看得清、观众也能跟着看清的东西，尽可以照实说。轮到屏幕上那行字，他手指悬在键盘上，原想敲"这件越洗越好、穿三年都不带松的"，写到一半又反应过来：这已经不是在描述，而是在替一件衣服打包票。手里这点眼见的东西，压不住"三年不松"这四个字的重量——他没反复搓洗过它，也没真拿它扛过磨。在他心里，这些话是分台阶的，一道证据阶梯，越硬的越往上：耐用、性能这类词，要配的不是手感，而是说得清的检测和水洗记录。他私下把这套较真叫作"舒适性能耐用品质证据阶梯"，同事笑他绕，他也不辩。于是他把那行字往下挪。耐磨、不掉色这些他证不了的，先整句按住，挂一条待补的槽——【实测记录：反复水洗后的褪色与磨损程度待补】，不急着发出去。舒适也是，他不急着替它下定论，只拍观众自己能判断的：抬手顺、坐下不勒、后领服帖。真正想让人看见的品质，是布纹和线迹本身，不是一句他兜不住的承诺。镜头里，帮忙上镜的同事把袖子往上推了两把，靛蓝的布在肘弯堆出几道活褶。阿凯没敲那句最抓眼的大字，屏幕上先留下一行他兜得住的实话。
