    body: '七月的样品间里，秋装的第一版大衣刚挂上衣架。文案想在吊牌上写"这件耐穿、显瘦、够高级"，设计角色却把笔按住了。她说，这三个词一落纸，就等于替顾客把话说满了，可我们手里没有一样能撑住它的东西。


      争执从选料节点就开始。有人主张顺手加一句"某工厂供货、附检测报告"，让说法立刻有分量。可那家工厂、那份报告，谁也没拿到能公开的授权。于是这句被划掉，吊牌上只留一句克制的实话：这条线上确实有一道把关的工序，具体是谁、出自何处，暂时空着，等材料到齐再补上。


      真正让人别扭的是复核门。打样节点走完，衣服还要过质量门和交接门之间的二次确认才进店。文案想借这个写"每一件都被挑过毛病"，设计角色又摇头——你可以讲这里有一道关，却不能顺口报出某批挑了几件返工，那是账本里的数字，不是随手能抛的谈资。


      代价很明显：吊牌变短了，那些一眼抓人的狠话全没了。可留下的每句都站得住。导购角色在试穿节点旁不再背形容词，而是把袖口翻给顾客看针脚走向，让人自己在镜子前判断合不合身。版型角色把肩线的取舍讲成一段故事，陈列角色则顺着光线把这排大衣摆开，让面料自己说话。


      到了交接的那天，大家忽然想通：把"高级"两个字按住不写，不是认怂，是把下结论的权力还回给穿它的人。能被看见的，才敢往外说；看不见的，宁可先欠着。'
