    body: 镜头先对准衣服，别对准人。这是我带店里拍日常内容时反复念叨的第一句话，也是门店日常内容化风险红线里最该焊死的一条。一个下午，试衣间外总有人来回比划：有人把风衣的腰带系了又解，有人把针织开衫搭在阔腿裤外面比长度，有人对着镜子把衬衫下摆掖进半身裙。这些画面都是好素材，可我们能拍的只有衣服在身上怎么动、面料怎么垂坠、颜色在光线里怎么变，不能拍下任何一张能认出是谁的脸，也不能录下她随口问的那句咨询。我用惯的办法是把具体的人抽掉，只留一般化角色。文案里不写“上周三来的那位客人”，改写成“一个想给通勤找件挡风外套的人”；镜头若不小心带到脸，就压低景别，只留手指整理翻领、把腰带绕两圈的动作。这种可保留的一般化角色表达，既让内容有人味，又稳稳守在隐私与实例事实边界的内侧。真实顾客的样貌、对话、消费记录，一律不进画面——这是隐私边界，不是风格取舍。还有一类更容易手滑：把“这款卖得多好”“回头客夸得多热闹”直接写进脚本。这类不可写的经营表现与顾客反馈，只要没有能核实的来源，就先当它不存在，不许拿来替我们背书；经营表现这种硬话，宁可先空着也别编。真要落地成一条能发出去的内容，还差几样现场事实，得先讲清楚、留成槽位，别假装门店里已经拍好了：【门店事实：可出镜的试衣区与镜前光线】【商品事实：本季在架的风衣与针织开衫具体款式】【镜头事实：只拍衣不拍脸的分镜清单】。这几样填齐，这条日常才算真能落地。
