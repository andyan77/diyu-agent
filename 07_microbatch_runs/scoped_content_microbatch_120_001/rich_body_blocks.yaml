    body: 我是店里管搭配的那个人。早班灯一亮，我先把那排燕麦色针织从挂钩上取下来，抖开，对着光看纱线的走向——这是我的搭配师视角，先看，再说，不急着夸。店里还没进人，暖气刚起，我把领口往两边捋平，心里已经在替今天第一个推门进来的姑娘想：她大概会先摸袖子。同样一件针织，导购视角会说"上身特别显肤色，试一下就知道"，句子短、动作词多，直接把人往试衣间带；店主视角不一样，我们守着这摊的人更愿意讲来路，讲这批纱为什么起球慢，讲版型收在哪一寸；到了品牌旁白，主语就换成"这一季"，站得远，说的是整排货架的情绪。这套区分，就是我们私下讲的角色发声寄存器——同一件衣服，谁在说、站在哪儿说，句子的重心全变了。我给自己定过规矩。观察词只写眼睛真能看见的：袖口的螺纹松了半指、下摆比模特图长一截；动作词写手上正在做的：卷袖、别腰、把风衣的腰带从后面兜一圈；解释词最要收着，凡是"最耐穿""穿了显瘦十斤"这种把话说满的，我一律先划掉，等有据可查再补。主语选择与叙述站位一旦飘，信息密度与限制语就守不住，人味也就假了。所以我从不借别人的嘴。谁家店长说过什么、哪个熟客怎么夸，只要落到真名真职务，我宁可空着，也不替他们发声。
