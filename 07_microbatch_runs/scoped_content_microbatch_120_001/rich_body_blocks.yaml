    body: '同一条雾蓝色醋酸阔腿裤，我前后写过两版讲法，摆一块差点没认出是同一条。


      栽过跟头才想明白。头回我把它挂进信息流短视频，张口就报落裆几指、腰头几道明线、醋酸怎么坠——刷到它的人拇指一挑就划走。这拨多半还在新客阶段，对这种裤子没底，你跟他抠工艺，像拉着刚进门的人背菜谱。受众距离与信息深浅轴，头一段先量他离这条裤子多远，话从最外圈起。给面生的人，先扔一句站着就能照做的：脚尖对镜子，裤脚搭上鞋面一指，腿一下就抻直了。


      搜索页的详情图文又两样。人是自己摸进来的，早过了新客阶段，多在熟客阶段来回掂量。话就能往里钻：落裆留多深不夹又不垮，醋酸比常见西裤料更垂，平底和矮跟踩出的裤长两样——他肯收藏、肯翻回来再看，深些也咽得下。同一条裤子，一版怕说满，一版怕说浅，深讲浅讲全看他站在哪一档 decision stage。


      第三样我后来才回过神来：能收藏、来回翻的图文，信息尽管往密里码，几双鞋几件上衣的搭法摊得开；信息流里蹭一下就走的那屏，码满了没人看到底，留个钩子就顶用。人翻看的力道不一样，塞的信息深浅也跟着松紧——不同阶段对应的信息深浅，答案就压在这一密一疏里。真要连他站哪一格都没摸准，就先别忙着定粒度。


      这条裤子当季主推哪种身形、卖给哪拨人，我半个字都不敢自己补，先空着【品牌事实：这条阔腿裤当季实际主推的身形与版型定位】；我凭什么开口讲裤装，也留一格【角色事实：出镜的人在裤装搭配上的真实从业经历】。稿子先搁这儿，我把那条样裤往灯下一提，盯裤脚那道垂坠实不实。'
