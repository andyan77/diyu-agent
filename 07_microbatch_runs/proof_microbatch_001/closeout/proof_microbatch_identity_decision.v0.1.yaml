    automatic_stable_generation_demonstrated: false
    reusable_generator_harness_proven: false
    ai_execution_quality_probe_passed: true
    direct_3600_unlocked: false
    rationale: >
      Recon at P7A confirmed there is NO standalone automated generator harness in the
      repository and the P4 canary bodies were human-authored
      (06_canary_runs/canary_40_001/canary_generation_manifest.v0.1.yaml:50). The only
      mechanism that produced the 40 proof drafts was an execution AI authoring them per
      item. That proves an execution AI CAN author 40 gate-passing, non-copied,
      proposition-grounded drafts; it does NOT prove a reusable/stable/automatic generator
      exists, and it does NOT mechanically de-risk a 3600 run. No detector can distinguish
      "AI authored per item" from "automatic pipeline generated"; asserting the latter with
      no detector would be a false-green. Hence: honest quality PROBE, not capability proof.

  # --- the single classification flag the ledger + checker key on ---
  agent_authored_quality_probe_pass: true
  classified_as: agent_authored_quality_probe_pass

