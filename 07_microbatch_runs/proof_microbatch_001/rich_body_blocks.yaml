    cluster_title: 视角切换与公开安全边界
    body_form: full_rich_body
    body: 以一条百褶半裙为例，可观察的线索是固定的：压褶是深压还是软风琴、腰头有没有内衬、下摆随走动张开的幅度、垂坠时折痕的走向，这些结构本身不会变。但它在不同环节被接手时，称呼会跟着换——组货这头它是组货单元，看的是能否和同系列上装凑成整套；陈列这头它是展示对象，注意力落到色块排布和视线停留点；到了内容这头它又成了拍摄主体，得盘算镜头怎么带出褶量的动态。同一件东西三个名字，若不把这层对应登记清楚，读的人容易在前后两段里把它错当成两条裙子。所以第一步是先钉住被指对象，再让称呼随角色走并逐一登记，解释重点也随之切换。第二步管切换那一刻的过滤：每次从一个角色转到另一个，都在交接处架一道筛子，只放行可见款式结构、可复述的通用做法和不涉经营内幕的观察；一旦冒出内部作业步骤或真实经营数字，就拦在公开安全的边界外。这里有条底线：换角色只换称呼和角度，事实门槛一分不松，没被证实的说法别想换个措辞就洗成能用结论。凡沾上内部作业的具体规程、或真实的经营数字，一律切断，能改写成通用表达就改写、改不动就挂起、留不得就删掉，分别对应可接受、需待补、须剔除三条走向。这套办法只在内容需跨多角色流转、交接时才用，绝不能反过来当成把内部信息往外送的暗道。它的下游作用，是让读者把三个称呼都对回同一条裙子，同时堵死内部运营与对外表达之间的错误通路。至于效果、销量、增长这类硬话，只用观察语言描述现象，真要下判断必须挂为待补来源，不凭切换当定论。
