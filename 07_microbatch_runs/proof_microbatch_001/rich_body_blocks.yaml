    cluster_title: 受众距离与信息深浅轴
    body_form: full_rich_body
    body: 把受众和内容之间的远近拆开来看，第一个能落地的判断是知识距离：一个人对某类衣服的术语、面料手感和版型语言了解到什么程度，决定了讲解该从哪一层起步。就拿一件落肩针织开衫来说，对几乎没听过组织密度、刚接触这一品类的观众，先被画面抓住的是领口开度、下摆那圈微卷的边和它能穿去什么场合，讲解就从这些看得见的东西铺开；而对已经能分清罗纹与平针的人，可以直接跳到落肩量大小与替代款之间怎么取舍。第二个判断是决策阶段——只有当大致看得出对方是在随手翻看、在几件里比来比去、还是快要拿定主意时，这套调粒度的做法才立得住；顺着阶段排信息次序：翻看期给框架，比选期给可对照的维度，拿定期给上身注意点。第三个判断是互动强度：一段能被反复回看的内容，密度不妨叠得高些；只在指间划过一回的内容，就得把信息摊得稀些。新客阶段和熟客阶段在这里只是一把通用的距离刻度，用来让不同角色的口吻调整解释密度——旁白管入门口径、导购管临门提醒、搭配师管结构细节，绝不能被反推成某位顾客到底是谁、买过哪些、平时偏好什么这类落到个人头上的真实信息。内容里一旦冒出这种具体到个人的东西，必须先摘掉或挂起等授权来源；这也就是把“受众距离”和“信息深浅”并成一组调节轴的用法。至于哪一档距离该配多密的信息、又能带来多好的吸收，暂时只用观察语言去描述，不急着下硬结论。
