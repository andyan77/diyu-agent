    body_form: full_rich_body
    body: 这套 Look 的拆解观察骨架，做法是先把观察维度立稳，再顺着维度把一整身穿搭切成一个个能单独讲的节点。它固定五个入手角度：整套的外部线条即轮廓、内外长短叠压出的层次、颜色在全身如何铺陈的分布、软硬厚薄面料并置产生的对比，还有上下、里外连同配件各自落到的搭配位。维度立住，一身搭配就被切成互不重叠、可供后续取景与讲解直接取用的观察节点，而不是上来只盯着某件孤立单品。要落成能拍的画面，再把结构分三层安排：打头的前景一层交代场景与位置关系，居中一层托起这一轮要突出的那件也就是主体，另有一层作陪体去衬托，把主次压出来，如此镜头才找得到落点，主体与陪体不会糊作一团。成套与成组两种对象读法并不一样：单独一套，沿五个维度走通一条内部观察线就够；若干套并排，就得比对套与套在轮廓、搭配位上是呼应还是错开。要守的边界在于，给层次、搭配位或轮廓命名时，措辞只落在几何形状与所在位置，譬如一件敞口长外套露出内搭、腰间束带把线条收住，描述到此为止，不能顺手推出穿着者身材如何这类结论。一旦内容里混进了某家门店的实拍场景、或货架上正卖的商品这类具体事实，先摘除或标为缺来源，这一层只留下能反复套用的拆解骨架；至于好不好看、显不显之类的判断，要么换成看得见的画面语言，要么挂起等授权来源补齐，绝不在骨架里直接下断言。
