    cluster_title: 情绪温度层与信任门控
    body_form: full_rich_body
    body: 在服装内容里，情绪温度层与它配套的信任门控在处理两件互不相干的事：一段话该带多少温度，读者的信任又靠什么撑起来。先看温度分档：把情绪按由凉到暖排成梯度，最靠下的两档最克制——一档只交代结构和肉眼可见的事实，比如“这条直筒裤的侧缝笔直、裤脚是双道卷边”，不掺情绪；往上一档允许带点使用画面，比如“久坐时膝盖处不太顶褶”，用场景把结构讲得更好懂。这两档就是温度梯度的低端，越靠这里措辞越贴近客观陈述。温度只负责调节内容的距离或亲近感，本身证明不了任何东西，这条线不能松。接着是门控：信任信号得分两类。像可核验的缝制说明、数得清的针脚，属低风险信号，帮读者把衣服看懂，尽管用；可一旦想让人相信某种效果或耐用程度，就落进强证据信号，得先迈过一道证据门——握着可核验的依据才落成主张，拿不出就把这句话收回成一条能核对的观察，绝不写成“穿着必定舒适”“肯定耐穿”这类板上钉钉的话。判断有没有越门，盯三个滑坡口子：抛出结果承诺、搬来横向对比、暗示某种权威背书；命中其一而手边无据，要么补可核验来源，要么退回观察，缺依据的硬结论一律挂成待补依据、不进正文。分层理清后，就能按各档温度给内容配上对应的谨慎度。它也有边界：内容确实要立起可信度、要把“怎么说”和“凭什么信”分开时才启用；若有人拿亲切、可靠的语气去顶替举证、去推动没证据的结论，就得把结论拦下。总之，温度只管怎么说，证据才管能不能下结论。
