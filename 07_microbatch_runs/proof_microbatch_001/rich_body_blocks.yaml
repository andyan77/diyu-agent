    body_form: full_rich_body
    body: 为内容里的某件衣服设计它的叙事角色、安排它怎样入场,要回答的核心是:这件产品究竟以什么身份走进一段内容、又在哪一格画面里第一次露面。动手时不妨先盯住它在镜头里的首次落点——是开场第一帧就被推到眼前,还是在铺完一段情境之后才被带出来,这个落点会反过来提示该替它定一个什么功能身份。命名这一步是骨架:拿一件开衫来说,若用来撑起整段叙述,它就是主角;若被拿去和另一种穿法并置、把差别摊开,它便退成对比项;若它出现在某个困扰被提出之后、给出一条看得见的处理路子,它是解决项;若它只负责把前一个场景过渡到后一个场景、把一种层次接到另一种搭配重心上,那它是过渡项。角色一旦定下,它该落进开头段、对比段、解释段还是收束段也就跟着定了;而每一段都要求把这件衣服绑到一个具体的使用情境上,不让它凭空亮相。当画面把焦点收到门襟的走线、腰线的位置或面料纹理这类局部时,这件产品更适合当作解释结构的教育落点,而不是被催着去卖。要提醒的是,这套办法只搭角色和位置两层空槽,槽里不填价格、款号、卖点式保证这类具体商品信息;只要内容里压根没有一件能在故事里担起角色的衣服可写,或者只想把它写成一篇在售货品的推广文,这框架就不适用。凡涉及真实商品的说法,一律先留成待补来源,正文只保留角色和位置的判断,不替读者下购买或效果的结论。
