    body_form: full_rich_body
    body: 以一件薄款针织开衫为例，讲清它能落在哪些场景、又会在哪些场景失手，出发点不是先谈人群或上身效果，而是先给每个场景锚定它非办成不可的核心正事。通勤要不停上下车、在工位间走动，眼下的正事是应付坐立切换与一段步行距离，这件开衫恰好垫在室内外温差之间充当过渡，任务就对上了；一旦换到正式程度更高的会客场合，庄重感升为头等要务，它偏软的廓形反而托不住，这便是必须写明的不适配条件。把动作上的限制翻译成不适配条件是关键：坐下时料子会不会堆在腿面、拎着随身物件时外搭层次会不会松垮，都要照具体动作交代。场合一换，这件衣服所担的角色也随之挪动——通勤里是收尾外层，短途出行里可能顶上主角，多件叠穿时又退成中间的连接件。只有当场景正事与角色一一对上，判断才立得住；若对任何场合都声称合用、连一个失配的例子都举不出，方法就塌了；越敢点出它接不住的场合越可信，只用一句处处都行来遮掩，恰是可信度松动的信号。场合对不对得上，至多决定招呼读者行动时的语气上限，推不出穿着舒不舒服、耐不耐磨或身形会怎样。一旦叙述滑向穿上会更衬某种身形、或断言某类人必然合身，这类关乎成效与人群的强判断都得有可核验凭据兜底；拿不出出处，就退回肉眼可见的画面陈述，先记为来源待补，正文里最终沉淀下来的只是场景正事与这件衣服之间如何对位的方法。
