    body_form: full_rich_body
    body: 这一簇要立的规矩，是异常出现后先回退、再看前复核环节的路由提示：当内容生产链上的某一步出了岔子，正文该停在哪一步、又该把处置权转给哪一步，都得有既定去向，而不是让各个环节各凭手感乱补。举个画面，一组以落肩廓形上衣配直筒下装的陈列，要写清它为何看着利落，可支撑这句判断的肩线走向与面料垂坠还没被记录进来，这时对应的读图环节其实缺了前置。碰到这种情况，做法是往回退到最靠近、又能把所缺观察补起来的那一步，先把肩线、克重、廓形这些看得见的线索补录，再让后面的解释接着走，而不是把这段陈列硬算成写完。若退回之后仍拿不出足够支撑，就给那句结论挂上一处证据缺口的标记，写明还差哪一类东西——是缺实拍画面、缺能公开引用的依据，还是缺环节说明——把没有凭据的话先摁住，不放它往下游解释里流。再碰到某一项谁来负责、能不能改都说不清楚时，则转成一条待确认的路由记号，只把需要拍板的问题原样摆出来，请由人工来敲定，不自己替组织下结论。每一条异常都用一份精简登记留痕：属于哪一类、缺的到底是什么、还能保留的观察有哪些、以及在敏感之处应改用的安全替代表达。至于任何牵扯真实经营波动的具体数字，都算实例事实，一律先摁住或摘掉，正文只留下这套通用的停与转规矩；效果、规模一类硬话在没有官方来源之前，只用观察语言去描述、挂为待补，也不在这段文字里替它补上未证的结论。
