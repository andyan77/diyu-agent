    cluster_title: 产品生命周期角色窗口
    body_form: full_rich_body
    body: 把一件单品放进产品在生命周期中的角色窗口来看，第一步不是对应哪个上架时点，而是先给它安排一个抽象的阶段坐标；这套坐标可借服装内容里熟悉的说法，从认知进入期起步，经结构教育期打底，再进入组合扩展期，随后走到场景验证期，最终收在复盘维护期，若换成更粗的命名，也就是导入、随后的成长、趋稳的成熟与缓行的退场。按抽象阶段而不是具体档期来编排，为的是让同一件衣服在各时点承担的叙事任务能横向对照。阶段一旦定下，叙事的信息密度与教育侧重随之移动：刚进入认知那一段，正文要多花笔墨说明这件外套在整套货品结构里扮演什么角色，画面不妨停在肩线走向或袖口收束这类能被看见的细节上；往中段推，重心转向面料取舍与版型稳定性的交代，以及它跟陪衬款、过渡款如何搭配成组；到偏后的验证段，则改说它适合与不适合的穿着条件，密度收窄成一句提醒而非从头铺陈。这条由阶段推向叙事任务、再落到教育重心的顺序，也决定了每一段的陈列更新往哪个方向强调，供门店解释时取用。要设边界的是，这个窗口只回答产品此刻处在哪个抽象阶段，据此给出能横向对照的叙事安排；一旦有人拿它反推具体的经营节奏或成交走向，方法便不再成立，行动号召的力度也得压在该阶段允许的上限里。凡牵涉真实的上架时点、走量情况或存货多寡这类经营信息，先以观察语言描述，并标记为待补授权来源，绝不把未经核实的经营状态写成正文的硬结论。
