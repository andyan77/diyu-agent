    cluster_title: 产品到角色到叙事跨域关系
    body_form: full_rich_body
    body: 围绕产品、角色与叙事之间的这层跨域关系先立一个前提：产品的讲述与角色、陈列、叙事段落之间的连线，是把几张已经现成的能力面各自的接口对到一处口径，而不是另起一条新的执行走法。拿一件系腰带的风衣来说，在导购式表达里，落点是腰带怎么系、袖口要不要翻起、上身后腰线抬到哪；切到设计解释式表达，视角就移向立领的结构和面料的垂坠走向；再切到品牌旁白式表达，语速和限制语又换一套——这就是产品跟讲述口吻之间的对应，同一件衣服的信息密度随视角而变。往组织生态视角搭时，只提示它更宜由哪一类功能角色来开口、要不要过程或来源垫在下面；往陈列动作接上时，只标这件衣服在一组画面里是坐主角位、还是作陪衬、承担过渡，或当讲解知识的教育节点；往整段叙事里对齐时，只提示它宜进开头、宜作解释、宜作对比还是宜收尾。这里有一条能反复用的判断顺序：当两张能力面正好压到一块、给出的规矩彼此不合，就以约束更紧的那一侧为准，同时把这处不一致原样记下来，让后面的判断有据可查，而不预先替它定结论。这套说明只有在内容真的横跨好几张能力面、要把接口对上时才动用；内容只落在单面里就别硬套。边界还要焊死：一旦有人把这些连线固化成能照着直接跑的执行流程图，或者变成产线上的对象，它就出界、不再适用；本簇只给关系与归属层面的提示，不去接管本不属于它的控制规矩，也不碰真实商品、门店与组织事实，更不宣称任何已落地的效果，牵涉到具体的实例、或者归属上打架时，先挂起等人工裁断。
