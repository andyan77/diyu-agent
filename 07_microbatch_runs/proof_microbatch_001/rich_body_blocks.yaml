    cluster_title: 门店日常动作观察切片
    body_form: full_rich_body
    body: 这个聚类处理的是门店里日常动作的观察切片：把营业时段里能看见、能上手的动作，一段段抽出来当成可拍可讲的素材，而不是把卖场糊成一团忙碌背景。起点是先认出哪些动作值得单拎出来——它得指向清楚的动作对象，还带着肉眼跟得住的变化。给个画面：叠装台上一摞针织衫被翻松、领线和下摆错位，示范者挨件对折、把折边压齐，直到整摞显出棱角。这一段立得住，是因为它既有起手的缘由，也有收住的一刻。所以每抽一段都要补两个记号：一头写清它凭什么起手（如货品上架后出现歪斜、叠面塌散），另一头写清凭什么算做完（对象对齐、归拢或摊平到位这类看得见的样子，即结束标志），少了任一头，片段就头尾含糊、切不利落。动作还得跟身边道具与区位对上：手先碰到哪件、对象起了哪种可见改变、改变定住后又能填进哪个内容位置，这条最短关系把动作按回它发生的场合。顺着这套次序，整理、比对、讲解、递示这些一般化动作才能逐个落成具体、可再现的观察片段，而不是只攒下一句“全场都在忙”式的空场面；产出停在这种笼统气氛里，就说明动作没被认出来，得退回去重新分型、标注起止。还有一条不让步的边界：凡指向某个可辨认真实人员的举止、话语或经手成绩，都不许留在正文，要么当场抹去，要么标成等待补授权来源的空位，只保留不落到具体个人的通用动作。至于这类切片能替内容产出省多少工、罩住多大范围场景，眼下只拿看得见的样本来描述，硬结论留到补齐可核来源后再论。
