    body_form: full_rich_body
    body: 角色的授权表面，和人物故事那条红线，说到底要先分清镜头里那个讲解者替内容承担了什么。它能承担的是可说方法层——某种讲解身份在验看一件大衣时，怎样先判断廓形立不立得住、再顺着门襟和肩线核对走线是否平整、接着翻看里襟的收口做工、最后上身对一遍上下装的比例。这一整套验货的先后次序是能搬运、能反复用的判断路径，不依附于任何一个真实的人，所以借这个身份把它讲出来是允许的。真正越界的是不可说事实层：一旦把画面里的人坐实成干了很多年的那位、成交最多的那位，牵出能对上号的真实过往、真实成交额、私底下说过的话，而手里没有任何授权凭据，这段就不能落进稿子，只能删掉指名的成分，或做去授权化，改回泛指的讲解身份。比这更隐蔽的是默认背书：让这个角色张口“我担保这件上身一定收腰”，等于拿一个虚构身份的权威，替看的人把结论提前定死，这种身份暗示式的担保就是危险信号。碰到越权表述要当场拆成三段——属于验货方法的照旧保留；“收腰”这类落在身体结果上的承诺，是要有证据才成立的主张，证据不到位就先降成挂待补来源的中性说法；直指某个真人的身份则整段抹掉。归结起来，凡是只靠“角色开口就算数”撑起来的结论，都得退回到能被看见、能被核对的描述，或暂时记成来源缺口；上身成效、影响大小这类硬话，不由角色拍板，先用观察语言写下，等补进官方来源再定。
