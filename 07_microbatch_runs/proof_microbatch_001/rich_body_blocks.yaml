    cluster_title: 组货角色与渠道边界矩阵
    body_form: full_rich_body
    body: 给一组服装编排叙述之前，第一步不是问它在哪个入口更走量，而是替每件单品定下一个功能位置。角色可以先归成几类：一件承担把人引进来看的功能，一件承担撑起整组利润的功能，一件承担立住整组样貌的形象功能，还有一件承担带动同组其余件一起被看见的连带功能。有了这层分型，主次关系才立得住——比如让一件肩线利落的驼色大衣做主推叙事项，负责把这一组想讲的主题先开口说出来；再让一件同色系细针织做陪衬解释项，它的任务是把大衣为什么好搭这件事讲得更省力，替看的人减掉理解成本，而不是自己抢戏；接着放一条把大衣的驼调与内搭的燕麦白接上的围巾做颜色连接项，让整组的颜色走向一眼能被认出来。角色顺了以后，同一套编排投到承载力不同的入口时，只调信息的疏密：碰上随手翻看的场景，就把主次和主题组合留住、其余压掉；碰上愿意细看的场景，才展开穿着任务、替代条件、相邻搭配这类更密的说明，切忌两头一个密度，也切忌在快翻处硬塞深讲。最后所有件收进同一个主题里彼此呼应，角色的组合关系才算成立。要提醒的是，这套矩阵只在商品之间存在能被抽象归纳的组合关系时才管用；一旦被改写成对某一盘真实货品的调度指令，它就不再是角色语言。凡是把真实货号、某个入口的真实经营数据、或某场真实让利动作混进来的段落，都要先摘掉或标成缺来源待补，正文只承认角色关系那一层，不替任何真实货盘下经营结论。
