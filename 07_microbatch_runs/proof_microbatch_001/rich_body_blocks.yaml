    cluster_title: 同类比较维度与禁比边界
    body_form: full_rich_body
    body: 把两件同类衣服摆到一起讲差别，第一步不是急着断谁好谁差，而是先圈出哪些点眼睛看得见、尺子量得到、能如实记下来。拿两件针织连衣裙来说，可以并排陈述的是它们的几何与用料事实：一件裙摆停在膝上、另一件垂过小腿，这是长度差；一件织得偏薄、迎光能见织纹疏松，另一件密实压手，这是厚薄差；一件顺身形收出腰线、另一件直筒垂落，这是版型轮廓差；下摆一处走双明线、一处用包边把线头收起，领口一处罗纹一处滚边，这是可见工艺差。这些落在结构门类、材质分类、工艺可见度和覆盖几何上，口径统一，摆一处不会把读者带偏，能直接写成差异描述，进入常规品类讲解。但另有一批维度不能照此直接下结论：穿几季会不会起球走形的耐久、贴身后暖不暖、某项功能强到什么程度，都得靠检测或久穿才判得准；再加上哪件显瘦、哪件档次更靠上这类主观评断，也不能凭并排观感一句锁死。碰到这些，正确做法是替它单挂一个待补记号，而非拿印象顶替数据。要不要证据的分水岭，是读者会不会据此做跟效果或性能有关的选择：会，就得等可核验依据齐了再讲；没齐就只摆看得见的那部分，在缺口处显式标注此项暂缺。落到内容生产上，这要求先讲清对象与判断顺序、再谈边界，凡碰到效果、性能、规模的硬话，一律改成只描述所见的观察语言，或标成待补来源后再提口径，绝不把没依据的优劣混进正常品类说明当成既定事实。
