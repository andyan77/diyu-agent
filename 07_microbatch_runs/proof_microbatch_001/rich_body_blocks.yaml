    cluster_title: 动作转内容槽位与演示三段式
    body_form: full_rich_body
    body: 围绕把一个动作转成内容槽位、再用演示三段式来编排它，先认清一个前提：一个店内可见的动作，比如把针织开衫从叠放堆里取出来、顺肩线抖开、套到人台上看门襟对不对齐，本身不是现成的稿子，而是一串能被拆开、被跟随、被讲解的素材。要把它组织成内容，靠给动作排出先后：从动作起点算起，第一拍交代此刻要处理的对象与位置，第二拍让动作真正展开、把过程走完，接着找那个值得停一停的节点点破要领，末尾把画面收到一处可下完成判断的结果上——四拍照着起、承、转、合推进，缺了转和合，看的人就读不出这段动作想说明什么。每一拍旁边都挂一个解释槽位，只交代当下这只手在忙什么、为何这样处理，不外扩到别的结论。镜头跟随谁跟得久、旁白落几个字，取决于观察强不强：可见变化越清楚，画面就多给、话越省，观察薄弱时才补一两句。边界要设两道：其一，这套办法只在动作确实拆得开、演示得出来时才用得上，且它产出的是动作、解释、镜头三者彼此对应的骨架，是留给后面组稿的半成品，不能当对外那一版成品直接发出去；其二，它只整理可通用、可复用的讲解结构，凡会牵出某家店真实流程或某个真人上阵示范的片段，一律先摘掉或标成待补授权，任何关于效果、身体结果的说法都不能就此下结论，只能改用观察语言描述或挂为待补来源。至于平台侧给出的那些提示，只当研究阶段的旁注收着，既不固化成模板，也不念进正片。
