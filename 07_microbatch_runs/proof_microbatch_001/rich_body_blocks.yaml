    body: 围绕版型、廓形这类剪裁术语来梳理，第一步要把两个常被混说的词各自摆正：版型讲的是纸样层面怎样分割衣片、怎样安排结构处理，属于藏在里面的做法；廓形则指成衣上身以后从外部看到的那圈整体轮廓，落在外面。二者一个偏内部工艺、一个偏外部呈现，落笔时得各归各位，别搅在一句里当同义词替换。往下走，要把结构上的每个节点对应到肉眼能捕捉的视觉走向来讲，才算解释到位：肩线抬高或压低，会牵动肩部的走势；腰线定在偏上或偏下，会改变上下身的分割比例，视觉重心随之上移或下沉；衣长的长短决定上装和下装怎样衔接；裤脚与袖口的宽窄，牵动着四肢一段的轮廓收放；松量给得多还是少，则关系到布料和身体之间留出多大的活动空间。如此把“结构上动了什么”逐条映射成“外观上看着有什么不同”，链条便不会停在打版行话那一层。真正要卡住的一道界线是：这类术语只能说到结构与轮廓为止，不可顺势跳到对身体的保证，像“这版型穿上必定显高显瘦”就已越过了结构所能担保的范围。凡是显瘦、遮肉、显高这一类说法，都算需要依据支撑的结论；手头没有可核证据时，应把它改写成轮廓层面肉眼可辨的线条走向，而把带效果承诺的那半句暂时标为待补来源，不补齐就不落断言。
