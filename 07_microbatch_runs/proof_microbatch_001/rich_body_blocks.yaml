      observation_layer: 只描述可观察的结构、材质、动作与画面：门襟从单排明扣改成暗门襟、领座抬高、两块面料肌理凑近才见粗细、反复改版型与挪动搭配比例等可见线索。
      method_layer: 解释可复用的判断机制与顺序：先认素材在回答哪类问题，再据此选弧线，选定后绑定匹配的证明分量，让价值表达与证据位置随之调整。
