    body_form: full_rich_body
    body: 要把工艺与品质这类内容做成真能拍下来的画面，落地顺序是先认对象、再给镜头、再填说明、最后收边界，而不是反过来先琢磨旁白怎么夸。所谓可拍摄对象，指的是镜头能真正对上焦的那种实物点：一道走线的起落、两片拼缝的咬合、一颗扣位在布面上的钉法，还有里料收口翻过来后的那处折边——它们都能被光打到、被特写顶住，属于实打实的对象线索；而看不见摸不着的所谓性能不算对象，硬塞进镜头只会让画面空转。对象定住之后再排镜头线索：先用一个拉开的画面把衣服在身上的整体轮廓交代出来，接着收进中景锁住它所在的那一块结构区域，末了压到贴身的近景，把那个细节点单独顶到画面正中，层级从大往小走一遍，观众的视线才不至于在糊在一起的信息里迷路。镜头前还得配上能被完整记录的动作——把里料那一面翻转过来让折边正对光、顺着开合处缓缓带一下、或让正反两面并排摆着做个照应。每一层画面都对应一个解释槽位，槽位里只填得下几句话：这儿看到的是哪种处理、它长在衣服的哪个位置、跟旁边哪一块连着、镜头又是怎么把它呈现出来的。到了收边界这一步得格外守规矩：镜头交出来的始终是处理的手法，而不是它耐不耐穿、护不护身的结论；凡是旁白想往耐用、功能一类效果上滑，一律改回只讲眼睛看见了什么的说法，实在改不动、又拿不出可核验的独立来源，就先标成待补来源挂起来，绝不用一段特写去替代本该由检测给出的证明。
