    cluster_title: 产品到陈列叙事关系语法
    body_form: full_rich_body
    body: 谈产品到陈列的叙事关系语法，核心是挑几种关系把一件产品和它所处的陈列面组织进同一幅画面，而非铺一整套门店运作。第一层看位置关系：同一件衣服放在画面中轴、挪去侧边还是退到层次后方，读者感到的分量不同，这份分量便是它的视觉权重，也是把产品角色对到某个陈列位置的头道依据。第二层看邻接关系：一件廓形外套旁边若搁相邻的同色针织，整组读起来像一个系列；换成异材质相邻，如挺括面料紧挨起绒面料，注意力就转向触感落差；再在一侧留白，焦点反倒收紧。旁边摆什么、呼应还是相抵，会改变别人对这件衣服的读法，故邻接对象要单独记成一条可复述的叙事侧重。第三层是主次层级：先在同一组里定谁主谁辅，镜头先后才有落点，通常先交代主项再带出辅项。第四层主题化组合：几件产品收在一个主题下怎么摆，决定叙事往哪儿使劲。这套语法只在产品与陈列面之间的关系可被观察、能抽象成上述关系槽位时才启用；若画面只剩某家门店的实拍实况、抽不出关系，就不该硬套。其下游用处是把这些槽位翻成远景读层级、中景读邻接、近景读细节这类拍摄线索，供后续内容取用，而非生出可执行的陈列步骤。至于邻接会不会带来更好的阅读或成交，这类硬结论不能径直下，只能先用观察语言描述或标注为待补来源；凡要写进真实门店里的商品、位置或实景照片这类事实，都得先脱敏，脱不了就挂为待补，而正文只认位置、主次、邻接和主题这几种抽象关系结构。
