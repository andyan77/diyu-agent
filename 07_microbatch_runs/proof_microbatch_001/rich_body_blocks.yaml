    cluster_title: 使用教育与结果 claim 分界
    body_form: full_rich_body
    body: 这一簇要处理的，是把「怎么用」的教学和「用了会怎样」的许诺拆成两件事。先看画面：镜头拍一件外套先扣好内层再把领口翻出来、腰带绕到哪一格算贴身、袖口翻折两道后停在虎口上方，这些是在教穿着顺序与调节方式，属于可以放开讲的教学范围。第一道判断机制是，句子只要停在「先做什么、后做什么、眼睛看哪里对齐」，它就是使用指引；一旦拐向「这样穿就不走形、会更耐穿」，它已经变成对身体或产品结果的许诺，得另找依据才配说出口。第二道机制是把动作和结论分开：镜头里演过一遍层搭的过程，只能说明观众看见了哪几个步骤，它并没有替谁验证任何效力，把一段操作画面直接读成「效果因此成立」，就是越了界。第三道机制管比较：同类之间指出看得见的差异、上手时的差异、标签条件的差异都行，比如同一光线下两块布谁的纹路更平整，可只要冒出「谁更好、谁更值得选」这类评价词，就必须挂上与之相称的依据，否则这句留不住。收尾对结果性表达设边界：凡碰到耐久、贴合、性能这类硬结论，在拿到可核来源前一律先用观察语言描述，或整段回收为待补来源；风险高的结果说法要和教学句物理隔开，不能混排在同一段里顺势带出。洗护收纳也照此办，只说按标签条件与材料属性去操作，不预告任何结果。
