    cluster_title: 零售角色动作权限与加盟改写边界
    body_form: full_rich_body
    body: 在零售场景里，先要把角色、能做的动作和背后的权限三样东西对齐：某个岗位之所以能上手某类操作，是因为它握有对应授权，缺了这层授权，动作就不该落到它头上。以卖场里最常见的画面为例，站在货架前把叠装按色阶重新码放、把挂通间距拉匀、给顾客解说一件外套的肩线与落肩差别，这些整理、码放、讲解、比对类动作可以用泛化的口吻讲清楚，因为它们描述的是可复用的做法，而不是某个真人被谁授了什么权。真正要设卡的是加盟与授权那一类信息：一旦素材里冒出谈定的划片范围、返点比例或合同里的具体条目，就不能照抄，得先把可识别的数字、地名、条款抽干净，只留下“确有这么一类按约定成立的授权关系”这种抽象表面，让读者知道有这么一层结构，却摸不到任何真实实例。判断顺序上，遇到带有加盟或授权气味的硬事实，第一步是把它拦下、挂进缺口清单等后续可核材料补齐，而不是凭印象先写后补；材料没到位之前，宁可用观察式的语言把画面和做法描述出来，也不下缺来源的硬结论。若某条信息卡在“像规则又像实例”的模糊地带，边界一时说不清，就别自动放行，转给人来定夺。这样一来，正文里始终只有可讲的做法层和一般化后的授权表面，真实制度、真实合同、真实授权被稳稳挡在外面，既不越权表达，也不让内部安排顺着方法说明漏出去。
