    body: 一段服装内容走到结尾、要递出那句引导读者行动的话时，先确认的不是怎么把人推向下单，而是前面有没有把话讲够。这条从叙事收束走向非硬卖引导的分界，落点全在教育是否先行：只有当一套搭配的判断已交代明白、或某个穿着情境已说清楚，收尾那句引导才有依附之处，否则一开篇就喊人行动，等于把话悬在半空。判据很朴素：读者手里是否已有能照着做的方法，眼前是否见过至少一个能核对的画面细节，比如挂在货架中段、上装靠前下装错开排布的一组同系列单品，或袖口翻折后露出的内搭层次。铺垫落地之后，引导的信息量要收得很窄，最好只留一个可执行的小动作配一处观察点，例如提示把这组搭配条件记下来、回看陈列里谁主谁次、留意下摆开衩走动时的摆幅、或问一句这样穿更适合哪种场合。经过这样处理，叙事末端便从推销式口播换成保存、比对、端详与发问这类低压力动作，读者会把它当成内容顺下来的延伸，而非被推着买。边界还得焊死：引导句不能越过证据去替效果说话，凡是效果、身体反应、规模一类硬结论，在没有实证撑住时一律退回到只描述看得见的现象，或先记成待补来源；至于具体优惠、货品数字这些落在实例上的事实，属于要另行核实的信息，不能直接写成投得出去的销售句，而应按缺来源先挂起。反过来，若前文只有一张图或几个情绪词、方法根本没展开，这套收尾就不适用，此时更该把引导退成一句观察提示，而不是硬凑一句催单。
