    body: 这个聚类要解决的是让叙述口吻随场景轻重而变，同时不把任何一句话写成能对上某个真人的样子。先从场景轻重定口吻：给一组上衣与下装做日常换位提示时，用平缓、点到为止的说法就够了；只有走到关键工艺环节，比如一处滚边或一道明线的走向，才允许把语气稍稍收紧、显出郑重，绝不能反过来拿激动的措辞去顶一段本来很平常的整理动作。第二步把材料的分量和断言的分寸绑在一起：画面里能看清的，只说看得到的部分，例如“这条门襟的缉线排布得比较均匀”属于观察；一旦顺势滑向“这做工绝对靠得住”，就越过了画面能承载的范围，得退回改写、把限定语补齐。人设这一层只留可复用的表面特征——讲解的节奏、语序习惯、答疑时的耐心程度，而把长相、家里的事、原话对白、过往成绩这类能指向具体个人的东西全部剔除，保留的是“内行讲解者”的功能壳，不是某一个人。到了讲效果、说耐用、谈安全这类高风险说法跟前，先把绝对口气松下来，换成“一般而言”“多数场合下”“要看具体件况”之类的限定词，把话往回收；但要记牢，软化口气只改可读的强度，改不动事实这道门槛：凡主张效果或安全，哪怕把口气放得再软，也仍要有可核验的依据托底，缺依据就先按观察语言写，或标成待补来源暂时挂起，不能直接当结论抛出去。
