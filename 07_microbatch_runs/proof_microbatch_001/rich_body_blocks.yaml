    body: 给一件外套或针织单品写品质卖点之前，先把嘴边的形容词按'能说到哪一步'排队，这就是证据阶梯要处理的事。面对同一处袖口、同一块里布，话术拆成三步走：先辨清这句到底是软主张还是强主张，再给它配一类站得住的凭据，最后划出没凭据时最多能说到哪一层。像'上身松快''肩线不压''坐下不顶胯'这种，讲的是穿的人当下体感，属于偏软的体验类说法，落笔时得挂靠试穿过程里看到的情形，不能当成对所有身形都成立的定论。一旦词汇跳到'透气''挡风''洗后不走形''久穿不塌'，性质就变了——这些是能被测的功能主张，需要检测口径、行业标准或专业工艺说明来托底；讲到'反复水洗仍不起球''边缝扛得住拉扯'这类耐久话，门槛更高，要拿得出经得起核对的凭证。判断凭据够不够硬有个次序：主张越往功能与耐久靠，需要的证据就越实，用一句私人化的体感去顶一个功能承诺，等于偷换了层级。真正的边界卡在这里：当描述从看得见的线迹密度、织物垂坠、余量分布，悄悄滑成'所以它保暖、它耐穿'，而手上又没有对应材料时，就不能硬发，要把这句压回可观察的说法，同时标明缺的是检测还是标准这一类凭据，等材料补齐再谈功能。这样门店解释货品时，说出口的每句都对得上一层证据，而不是拿体验词去暗示没验证过的性能。
