    body_form: full_rich_body
    body: 把门店里的日常搬进内容之前，这一簇立的是一道处置约束：它管的是哪些能留、哪些得改、哪些要先停手，本身并不是能直接拿去召回、讲给读者听的领域正文。先给一个画面——试衣镜前有人捏着两件领型相近的针织衫来回掂量，脚边搁着刚脱下的外套。这样的构图可以照用，可一旦落笔带上某位真实到店者的相貌、随口那句原话、或是他从前买过哪些单品，就踩过了第一道界线。这道界线横在个人隐私和真实的实例事实之间：凡能指认到某个具体人的痕迹，不论长相、交谈还是购买记录，都不进内容。真遇上了，办法是把人抽掉、把情形留住——不写某位客人，而改成一类在相近版型间反复斟酌的到店问询，让画面从认得出的个人退回到通用角色。凡碰到真实的经营表现，像某段日子卖动没卖动、进店人多人少、货转得快转得慢，或是顾客反馈里那句原话，都归为实例事实，先剔除或改写；改写过关只看一条，就是回头再也倒推不出那个具体的人。至于授权说不清、来源没交代的材料，既不硬塞也不硬扔，先挂起，等授权或来源补齐再动。要说清的是，这条红线只管内容化前怎么处置，并不代表授权已经放行；碰上卖得好不好这类效果判断，也先用观察的话去描述、把定论留给后面补来源，不在这里拍板。
