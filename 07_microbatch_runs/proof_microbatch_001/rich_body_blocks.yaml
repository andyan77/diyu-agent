    body_form: full_rich_body
    body: 谈身材效果这件事，要有一套语言阶梯，也要讲清楚怎么做场景化观察：写文案时先把话落在眼睛看得见的地方，再决定能不能往下说。设想镜头里一条高腰直筒裤，腰头往里收进一道褶，裤缝的竖线从胯骨一路落到脚踝——这种只讲线条走向、外轮廓清不清楚、下摆停在小腿哪一段的表述最稳，属于观察词，它只报告结构和线条本身，不必另找依据就成立。往上一档是关系词，讲画面里两块结构之间的条件关联，比如上半身与下装的分割被抬起后，纵向看更连贯；这一档得带‘多半’‘在多数情况下’这类限定，说的是倾向而非定论。最高一档是结果词，最要留神：收腰、拔个子、把腰腹藏起来这些直指穿着者身体的说法，等于给身体结果打包票，默认就不直接写出。可复用的做法是把想夸的效果翻译成线条动作——与其断言这条裙让人瘦一圈，不如描述腰侧那道收口让竖向线条不被打断，把绝对的论断改写成‘若……则……’的条件句，这就是替代表达与回避表达。这套梯度只在内容确实涉及穿着如何呈现在身上时启用；一旦开始对某个具体的人许诺身材变好，就当场拦下或退回观察语言。凡牵涉能不能瘦、显不显高这类硬结论，缺个体化证据一律不放行，要么改回可观察描述，要么把这句保证暂挂成待补来源。至于在某个动作或站姿下描述视觉怎么变，这类场景化的观察被允许，但收尾仍不替身体下结论。
