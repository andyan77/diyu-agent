    body_form: full_rich_body
    body: 把一组同源内容当序列经营，起点是先定下贯穿其间的那根轴。一条主线企业叙事要立得住，靠的是它能被哪个维度反复佐证：立足点在做工顺序，就沿工艺流程节点切；在穿着情境，就沿场景任务切；落在服装本身的抉择，就沿品类的角色定位、面料上的取舍、版型的松紧变化、或货架陈列的搭配关系来切分。这根轴一旦落定，序列里每一格该讲哪件事、相邻两格靠哪个维度拉开距离，也随之定了——同讲一件外套，前一格盯住肩线与门襟的结构做法，后一格转去看它挂上货架后与内搭的层次关系，画面各管一段，不致让人反复听同一句话。接着要给每一格派一个不同的切入角度，并架起一道防重叠的约束：一旦发现相邻两格都在夸同一处好处，就强制换角度或换证据层级，让它们各有侧重而非彼此盖章。证明的疏密还得跟话题的层层展开对齐，分量重的证据点疏着放、轻的方法点密着铺；看得见的前台益处与藏在后头的能力交替出场，一段给好处、一段给缘由，读来才见起伏。同一根轴还能横跨不同载体，图文里讲得细些、短视频里讲得紧些，疏密各异而轴心不变。要留意的是，这套办法只在手上确有一批同源素材可供串联时才转得动；若只剩孤零零一条内容，硬架轴线只会空转，得先掂量有没有能连成一串的批量。还须守住一条边界：轴线终究只是编排骨架，不能借它凭空造出根本没有的产品序列或上市节点；一旦把序列坐实成某家的上新节奏、写进具体货号与排期，都超出可写范围，这类应标记为待补来源，正文只保留编排骨架本身。
