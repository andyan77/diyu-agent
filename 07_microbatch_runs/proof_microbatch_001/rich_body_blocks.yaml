    cluster_title: 故事弧线适用边界
    body_form: full_rich_body
    body: 这一簇要回答的是：手上这段素材配得上哪种叙事线，配错会踩哪些坑。判断的入口不在写手预设的情绪，而在素材本身在回答哪类问题。若画面呈现的是一件对象的静态差别——一件衬衫的门襟从明扣改成暗门襟、领座较常规抬高一指、两块面料肌理凑近才分得出粗细——它回答的是结构上哪里不同，就配一条把可见差异讲清、把取舍缘由说明、落在眼睛能确认之处的结构线，而非硬撑成跌宕起伏的历程。若画面记录的是一连串动作——反复改版型、把候选料两两并置做面料比较、为陈列挪动搭配比例——它回答的是这个选择怎样被逐步收拢，就配一条讲清难题、铺开取舍次序、交代如何定案的过程线。顺序必须先认素材、后配弧线；掉头先钉死一条线再回填桥段，只会空转套路。选好线，紧接着配上匹配的证明分量：越想突出前后落差、越想制造反转，越得拿出经得起查证的实打实事实，证明扛不动时线的强度就得往回收，能承载的价值表达与留给证据的位置随之变化。有几个信号一冒头就说明这条线不该用：非得摆出成绩数据撑场面、非得给画面里的人硬塞一段心理戏、非得让读者先默认一个尚未被证过的前提。真有过程可摊开，线才立得住；只想给一句空结论镶花边，它便失效，此时退回成一句朴素的做法交代。这样内容动笔前就先分清该做结构说明、过程展开还是退回观察问题，弱素材不会被硬架成撑不住的大历程。凡涉及效果好坏、体感优劣这类硬话，缺来源时先换成不带评判的观察说法，或挂起来等补可靠出处，别让叙事张力顶替本该拿出的证据。
