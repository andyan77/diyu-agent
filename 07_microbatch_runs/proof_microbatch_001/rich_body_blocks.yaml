    body: 讲清一件衣服的颜色，别急着先下判断，而要把它拆成三个能相互对照的坐标：第一是它落在哪个色系，色相负责把它归进蓝、绿还是橙这一族；第二是它的深浅位置，明度让它偏向近乎黑的沉，还是接近白的浅；第三是它看着鲜亮还是发闷，纯度区分饱满与灰调。拿一件灰绿调的棉麻衬衫来说，只有把这三个坐标各自说出口，这块颜色才算讲到可以核对，而不是丢一个结论词就算交代完。有了这套底层语言，才好往上接色彩家族的归类，以及偏冷偏暖、近乎中性这类方向性的通用说法，让后面写搭配时口径能对齐。接着得补一条镜头提醒：同一块布，摆在窗边的日光里、店内的暖黄灯下，或隔着手机屏幕，反射出的样子并不一致，因此落笔时要把当时是在哪种光下看到的一并交代，别拿某个场景里的一瞬呈现，去钉死这件衣服固定不变的色值。真正要守住的红线在最后一步：围绕颜色去编氛围、做联想是允许的，可一旦话头拐向穿上会变白、显得瘦一圈、看着更上档次这类落到人身上或品质等级的说法，就跨出了可观察的范围，成了拿不出凭据的效果承诺，必须当场掐断。凡是把某个颜色与身材修饰、肤色变好、用料等级绑在一起、却给不出支撑材料的句子，处理办法是退回到‘在这种光下看它与旁边颜色的关系’这种只讲所见的表述，同时把那句效果话单独记到缺来源的清单里，等日后有了可查依据再回头重议，不抢先对外抛出结论。
