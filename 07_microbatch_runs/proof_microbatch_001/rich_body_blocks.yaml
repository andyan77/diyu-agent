    body_form: full_rich_body
    body: 这一簇要理清的，是主题词与色彩故事之间的那张关系网，重点是把一个主题词怎样落成一组有主次的颜色说清楚。做法上先建立主题词到色彩组的对位：一个能被归纳出来的主题词，往往牵出一块以单一主色为骨、再加上几个辅色的配色，主题本身把这块配色的冷暖偏向和明暗深浅先框了一个大致口径，比如偏灰的蓝搭一层带雾感的白，就落在低对比、往冷调走的一组里。有了色彩组之后，观察和讲述要按固定次第推进：先由主色把整幅画面的基调压住、占住最大面积；再让辅色去衔接主体单品与背景、内搭之间的过渡；最后才轮到点缀色，在领口、袖口、腰带扣或陈列面上的小物件这类位置敲一个记忆点，制造轻重变化。顺着这条次序推下来，色彩故事才回得到 Look 结构上，交代每块颜色各自是在服务主体、陪衬还是层次。这也是在给系列感、节奏感这类整体印象划出可说的边界：颜色彼此的呼应、面积的轻重都能描述，但不能把它写成“看了就放松”“一眼就显得贵”这类对观者情绪或风格下定论的话——这种效果类说法在拿到可核来源之前只能按观察语言处理，或先标成待补来源。凡是牵扯到某个真实档期、活动或企划的具体信息，都得从正文里抽走、单独挂起来待补，正文只留颜色与结构本身的关系，让它成为一段能反复取用的通用编排，而不是某一季的成品方案。
