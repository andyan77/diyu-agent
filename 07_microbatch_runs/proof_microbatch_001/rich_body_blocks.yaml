    cluster_title: 陈列动作 SOP 节点框架
    body_form: full_rich_body
    body: 想把门店里的陈列动作沉淀成一套 SOP 式的节点框架，要留下的只是一副做法骨架：它把'该怎么摆货'拆成几个能回看核对的环节，内部只放判断做法与环节间的咬合，不装进任何一家卖场的现场实况。头一环是陈列前检查，负责盘点这步要备齐的进料——主推款有没有上位、连带的上下装是否成组、色系深浅走向能不能一眼读出；这环收工，交出的是一个'区位与货品都已对齐'的可见状态。它不停在原地，而是递给实施环节当开工底料，于是调衣架间距、把领口线捋顺、让外搭与内搭并肩立住这些动作才有据可依。实施一收尾便转进复核，回看主色压不压得住场、外廓够不够干净、视觉重心能否被镜头收进画面。就这样一环的出料恰好垫成下一环的进料，先后被钉死；谁若前一环产物还空着就硬往后闯，链子当场断开，这正是要拦下的跳步信号，也是整条流程走通与否的完成标志。为便于在店内讲清每步，这些环节还应摆成一条看得见的先后线索。边界上，骨架只管各环节本身、进料出料与彼此先后咬合这几件事；一旦有人把某处卖场当天的排班表、实到人手或货品现况塞进正文，就得先摘走或标成来源待补，不能就地当流程写。正因里头只有做法而非实况，后续照它做讲解或培训内容时，才不至于顺带把某家店的私有事实带出去。至于'照这么陈列能拉动多少成交'这类涉及效果的话，框架不下硬结论，只用观察语言把现象描出来，或挂为待补来源，日后核实。
