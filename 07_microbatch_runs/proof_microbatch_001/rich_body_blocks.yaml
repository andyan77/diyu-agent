    body: 当同一件外套要在店里被反复讲起，先要回答的不是它好不好看，而是这段文字究竟由谁开口，这正是角色发声寄存器最先处理的事。选定主语，就等于选定了叙述站位：店主开口，落点偏向为什么把这批货这样归类、这样陈列的经营取舍；导购开口，落点偏向顾客上身以后能不能抬臂、门襟扣拢会不会发紧这类当场可核的线索；搭配师开口，落点偏向腰线高低、外套与内搭的层次怎么铺排；轮到品牌旁白，则退回只讲得清的可见部分，把落肩、袖长这些结构交代明白就收住。站位定了，信息密度也随之定档，越专业的口吻越能铺陈结构，可每往前推一句，就得补一句限制语，别让“看着显瘦”这种主观感受滑成板上钉钉的判断。再往下是措辞分工：动作词只交代手上做了什么，比如把袖口向外翻两折；观察词只交代眼睛看见什么，比如面料在肩头微微起量；解释词只交代或许的缘由，比如可能和裁片走向有关，一旦把或许说成必然，就成了拿臆测顶替事实。这套约定仅在文字确有叙述者时才立得住，若要扮成某位真人来讲亲历，它就兜不了底；行文中一旦冒出具体姓名、职务或某家店的原话，要么整段撤掉，要么先挂为缺来源、等凭据补齐再启用，凡触及上身效果、走货这类硬话，也先用观察语言落笔，把下结论的权力留给后续能补上的来源。
