    body_form: full_rich_body
    body: 把一间卖场的空间先读成一组抽象的位置类型，是处理陈列区位、并从中标出可拍视觉锚点的起点。不去对照哪一处真实平面，只按功能给位置归档：入口区承担进店的第一眼，居中的中岛便于把几件货凑成一组来端详，走道尽头的端架把注意力压到一件主推单品上，沿墙的长挂通则用来把一个系列一字排开。这些都是位置类型的抽象说法，不落到某家店的面积或走动路线。观察它们时，镜头由远及近分三档推进：先取远景，交代该区位在整片货场里的位置与相邻关系；再切到中景，让一组搭配的叠压层次、色彩过渡和前后主次显出来；最后进近景，把领口的一道缝线、面料的织纹或纽扣的光泽这类单件线索单独框住。景别的先后不是随手排的，而是顺着该位置本身要说明的内容倒推出来的——位置先讲清它要交代什么，镜头再决定退到多远。每一类位置据此挑出一两个能入画的重点，就是静态陈列里给拍摄留的视觉锚点，采集时按远、中、近逐档取画面。要说清的是，从区位到景别的这份对应只是拍摄前的参考编排，属于半成品，还没到能直接对外发布的程度，真要发布还得另行脚本化并过合规一关。它还守着一条硬边界：正文一旦写进某家店的真实位置、面积、走动路线或正在卖的具体货品，就算越了界，得先撤下来，来源不明的先挂起，只把位置类型与景别之间的通用对应留在文里。至于某种区位究竟能带来多少停留或转化，这类涉及效果的说法没有实拍数据就不下结论，先用可观察的画面语言描述，或标为待补来源。
