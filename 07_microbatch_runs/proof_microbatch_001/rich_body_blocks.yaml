    body: 聊面料家族、给属性划边界，头一件事是把'纤维—纱线—面料'这三档拆开摆，别叠在一起混讲。最底下是原料这一档，棉、麻、聚酯各算一种纤维；把纤维捻合、纺成一根根线，是纱线这一档；线再上机织成整片布，才轮到面料这一档，去谈针织、梭织、罗纹、提花。三档各答各的问题，层级说岔了，后面手感和结构的落点全跟着错。往上走看织法：一件衬衫的门襟，经线纬线交叠得规规矩矩、摊平像一块挺括的片，多半走的是经纬互压那一路，稳、不太走形；一个领口的罗纹一圈圈线圈勾套、拉一下会回弹，走的是串圈那一路，弹性是它的脾气。这层织法差别，恰是许多上手触感和外观分野的起点，可以顺着它去讲线圈的纹路、片状的挺度、垂下来是压手还是飘。但话只能停在这儿。若从'表面起纹、垂感偏沉'一步跳到'因此特别御寒'，就越过了看得见的这层、闯进得靠检测才立得住的性能层，这类没凭据的性能话得当场撤回。所以手感词和事实词要划清：'上手偏沉'是观察，'很扛冻'是性能定论，后者无据就不落笔。做内容时的规矩是，织法、可见的组织、触点上的观察照写；凡碰到保暖透气、成分占比、洗护后果这类具体判断，一旦拿不出检测报告或行业标准佐证，就只留结构和看得见的线索，把整段性能说法移进待补来源清单，等凭证补齐再放行，绝不先替读者把结论坐实。
