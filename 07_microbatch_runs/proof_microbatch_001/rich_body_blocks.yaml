    body_form: full_rich_body
    body: 品类解释与属性槽位骨架的用法，是先给对象在整件衣服的结构里安一个落点，再顺着落点把属性格子一格一格打开，先后不能倒过来。顶层家族只立四个：套在上半身的上装、包住下半身的下装、上下连成一件的连衣类，以及罩在最外层的外搭类，每族底下各挂一串属性槽位。比如遇到一件套头上装，先认定它落在上装族，再依次看衣领是圆口还是带翻折、袖子怎么裁、前身如何闭合、衣身收到多长、贴身那层用什么材质。换成下装，格子就变成腰头落在哪个高度、裤管或裙身到多长、外廓怎样、有没有开衩和褶。连衣类要同时照看上下两段在哪儿接合、腰线卡在什么位置、下摆如何收放；外搭类则多出外层如何扣合、能压住几档厚度、给里面留多少容身空间。这套骨架只回答哪些看得见、哪些还能往里填、哪些必须刹住，替不了一件具体货品的资料。所以顺序一旦颠倒，落点还没定就急着说“这件好卖”之类跟结构不搭界的话，属性格子就会挂错层级，话题跟着跑偏。边界上同样要收住：缺了款式编号、售价、剩余数量或上架时间这些实例信息时，能写的就封顶在品类、属性和边界这三层，不许再往具体在售那一层探。要是有人把这套通用格子改口说成某家正在卖的货，那已经越界，处理办法只有两条，要么直接删掉，要么标成来源缺失、先搁置等待核对，绝不让品牌层面的事实顺着格子渗进正文。
