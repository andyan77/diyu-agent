  gen_mode:
    schema_version: v0.1
    task_id: GKB-PROOF-MICROBATCH-CLOSEOUT-AND-GENERATION-MODE-CSO-ALIGNMENT-001
    step_id: P7B
    contract_status: briefing_orchestration_contract
    formal_schema_contract: false
    ontology_truth_source: false
    purpose: 'Define the four generation modes that the generation orchestration layer
      may compile a Creative Brief into. A mode fixes how much brand FACT a draft
      needs, how much creative freedom it has, what it may never fabricate, and where
      its output may route next. No mode authorizes real generation, 3600, CandidatePack,
      KE, RAG, DIFY, or production by itself.

      '
    required_mode_ids:
    - creative_prototype
    - fact_slot_script
    - evidence_bound_candidate
    - display_solution
    generation_modes:
      creative_prototype:
        mode_id: creative_prototype
        meaning: 高品质创意原型 / 企业叙事 / 价值观表达 / 内容玩法（不依赖任何品牌真实事实即可产出）
        allowed_without_brand_facts: true
        fact_evidence_required: false
        required_fact_binding: none
        allowed_creative_freedom: high
        forbidden_fabrication:
        - fabricate_specific_brand_event
        - fabricate_real_person_experience
        - fabricate_product_fact
        - claim_published_fact_status
        allowed_claim_behavior: general_method_and_value_expression_only_no_specific_factual_claim
        required_slot_behavior: no_fact_slots_required
        required_cso_overlay:
        - narrative_rhythm
        - emotional_temperature
        - platform_native_expression
        - creative_tension
        governance_gate_requirements:
        - owner_routing_correct
        - readiness_all_false
        - no_real_instance_fact_leak
        - no_generation_allowed_true
        creative_gate_requirements:
        - platform_native_not_courseware
        - human_voice_present
        - not_semantic_checklist
        output_status: creative_prototype_draft
        publishability_status: not_publishable_without_downstream_fact_binding_or_review
        allowed_next_routes:
        - creative_gate_review
        - fact_slot_script
        - display_solution
        forbidden_next_routes:
        - accepted_domain_knowledge
        - candidatepack_ready
        - production_servable
        - direct_3600
      fact_slot_script:
        mode_id: fact_slot_script
        meaning: 高质感脚本，但关键事实留槽（在没有完整品牌事实时也能产出，缺的事实必须以槽位表达而非编造）
        allowed_without_brand_facts: true
        allowed_without_full_brand_facts: true
        fact_evidence_required: false
        required_fact_binding: slots_for_missing_facts
        missing_facts_must_be_slots: true
        allowed_creative_freedom: high
        forbidden_fabrication:
        - fill_missing_fact_with_invention
        - fabricate_product_fact
        - fabricate_real_person_experience
        - claim_published_fact_status
        allowed_claim_behavior: claims_only_via_declared_fact_slots
        required_slot_behavior: every_missing_key_fact_rendered_as_explicit_named_slot
        required_cso_overlay:
        - narrative_rhythm
        - role_voice
        - platform_native_expression
        governance_gate_requirements:
        - owner_routing_correct
        - readiness_all_false
        - no_real_instance_fact_leak
        - slots_declared_for_missing_facts
        creative_gate_requirements:
        - human_voice_present
        - platform_native_not_courseware
        output_status: fact_slot_script_draft
        publishability_status: not_publishable_until_slots_filled_by_brand_facts
        allowed_next_routes:
        - evidence_bound_candidate
        - creative_gate_review
        forbidden_next_routes:
        - accepted_domain_knowledge
        - candidatepack_ready
        - production_servable
        - direct_3600
      evidence_bound_candidate:
        mode_id: evidence_bound_candidate
        meaning: 事实绑定发布候选稿（只有当提供了品牌事实或存在 BrandKB/source 锚点时才允许）
        allowed_without_brand_facts: false
        fact_evidence_required: true
        required_fact_binding: required
        only_allowed_when:
        - provided_brand_facts_exist
        - or_BrandKB_or_source_anchor_exists
        allowed_creative_freedom: medium_bounded_by_evidence
        forbidden_fabrication:
        - make_unsupported_factual_claim
        - fabricate_product_fact
        - fabricate_real_person_experience
        allowed_claim_behavior: only_claims_backed_by_provided_fact_or_source_anchor
        required_slot_behavior: all_fact_slots_must_be_filled_by_evidence_not_invention
        required_cso_overlay:
        - platform_native_expression
        - emotional_temperature
        governance_gate_requirements:
        - owner_routing_correct
        - readiness_all_false
        - every_factual_claim_has_evidence_anchor
        - no_real_instance_fact_leak_without_authorized_source
        creative_gate_requirements:
        - human_voice_present
        - platform_native_not_courseware
        output_status: evidence_bound_candidate_draft
        publishability_status: publishable_candidate_only_after_governance_and_review_not_by_this_task
        allowed_next_routes:
        - governance_gate_review
        forbidden_next_routes:
        - accepted_without_evidence
        - candidatepack_ready_by_this_task
        - production_servable_by_this_task
        - direct_3600
      display_solution:
        mode_id: display_solution
        meaning: 陈列搭配落地方案，事实 + 方法论 + 创意组合（通用方法可先产，最终落地必须绑定门店/商品/素材事实）
        allowed_without_brand_facts: true
        general_method_allowed_first: true
        scene_fact_required_for_final_execution: true
        fact_evidence_required_for_final_execution: true
        allowed_creative_freedom: high_for_method_bounded_for_final_execution
        forbidden_fabrication:
        - pretend_specific_store_scene_exists_without_input
        - fabricate_product_fact
        - fabricate_real_person_experience
        allowed_claim_behavior: general_styling_method_freely_specific_store_execution_only_with_scene_facts
        required_slot_behavior: store_product_media_facts_as_slots_until_scene_input_provided
        required_cso_overlay:
        - visual_scene
        - aesthetic_framing
        - platform_native_expression
        governance_gate_requirements:
        - owner_routing_correct
        - readiness_all_false
        - final_execution_scene_facts_present_or_slotted
        creative_gate_requirements:
        - visual_scene_present
        - human_voice_present
        output_status: display_solution_draft
        publishability_status: method_prototype_not_final_execution_until_scene_facts_bound
        allowed_next_routes:
        - fact_slot_script
        - evidence_bound_candidate
        - creative_gate_review
        forbidden_next_routes:
        - final_store_execution_without_scene_facts
        - candidatepack_ready_by_this_task
        - production_servable_by_this_task
        - direct_3600
    cross_mode_invariants:
      no_mode_authorizes_real_generation: true
      no_mode_authorizes_3600: true
      no_mode_authorizes_candidatepack_or_KE_or_RAG_or_DIFY: true
      no_mode_flips_readiness: true
      creative_gate_is_not_production_readiness: true
  fact_binding:
    schema_version: v0.1
    task_id: GKB-PROOF-MICROBATCH-CLOSEOUT-AND-GENERATION-MODE-CSO-ALIGNMENT-001
    step_id: P7B
    contract_status: briefing_orchestration_contract
    formal_schema_contract: false
    ontology_truth_source: false
    core_principles:
      no_fact_does_not_block_creative_generation: true
      no_fact_only_blocks_specific_factual_claim: true
      no_fact_only_blocks_evidence_bound_candidate: true
      creative_prototype_generatable_without_facts: true
      fact_slot_script_generatable_without_facts_via_slots: true
      evidence_bound_candidate_requires_facts_or_evidence: true
      display_solution_general_method_first_then_scene_fact_bound_for_final_execution: true
    per_mode_fact_requirement:
      creative_prototype: no_fact_required
      fact_slot_script: missing_facts_expressed_as_slots_never_invented
      evidence_bound_candidate: fact_or_source_evidence_required
      display_solution: general_method_without_facts_final_execution_requires_scene_facts
    general_kb_rules:
      general_kb_must_not_fabricate_brand_fact: true
      general_kb_may_declare_which_brand_fact_slots_are_needed: true
      general_kb_writes_brand_facts: false
    slot_families:
    - brand_voice
    - brand_claim
    - event_anchor
    - role_anchor
    - product_anchor
    - media_anchor
    BrandKB_slot_contract:
      status: interface_boundary_only
      creates_BrandKB_instance: false
      writes_brand_facts: false
      writes_KE: false
      blocks_creative_prototype: false
      blocks_fact_slot_script: false
      note: 'BrandKB slots name what brand facts a future evidence-bound draft would
        need. Declaring a slot never creates a BrandKB instance, never writes a brand
        fact, never writes KE, and never blocks creative_prototype or fact_slot_script
        generation. It is an interface boundary only.

        '
    forbidden:
    - fabricate_brand_fact_in_general_kb
    - fill_fact_slot_with_invention
    - create_BrandKB_instance_from_a_slot_declaration
    - treat_slot_declaration_as_a_real_brand_fact
  cso_comp:
    schema_version: v0.1
    task_id: GKB-PROOF-MICROBATCH-CLOSEOUT-AND-GENERATION-MODE-CSO-ALIGNMENT-001
    step_id: P7B
    contract_status: briefing_orchestration_contract
    formal_schema_contract: false
    ontology_truth_source: false
    purpose: 'Fix the relationship between the Ontology Axis (object/fact/claim/owner/evidence/boundary)
      and the CSO Axis (narrative rhythm, emotion, platform-native expression, aesthetics).
      They are conceptually orthogonal and cross-cutting; at runtime the generation
      orchestration layer composes them into one Creative Brief. Neither replaces
      the other; CSO never crosses the fact boundary and is never written as ontology
      truth.

      '
    relationship:
      conceptual_model: orthogonal_cross_cutting
      runtime_model: compositional_overlay
      not:
      - ontology_first_then_copywriting_later
      - cso_freewriting_without_ontology_guardrails
    ontology_axis_controls:
    - object
    - fact
    - claim
    - owner
    - evidence
    - role_permission
    - source_boundary
    - readiness
    cso_axis_controls:
    - narrative_rhythm
    - emotional_temperature
    - platform_native_expression
    - role_voice
    - aesthetic_framing
    - creative_tension
    - human_scene
    - real_scene_feeling
    runtime_output:
    - generation_brief
    - mode_specific_constraints
    - governance_gate
    - creative_gate
    cso_written_to_ontology_truth: false
    cso_fields_forbidden_in_abox: true
    cso_fields_forbidden_in_tbox: true
    forbidden:
    - write_cso_field_into_ABox
    - write_cso_field_into_TBox
    - let_cso_cross_the_fact_boundary
    - let_ontology_directly_replace_creative_mode
    - treat_creative_gate_as_production_readiness
    boundary_notes:
      creative_gate_is_production_readiness: false
      cso_can_override_fact_boundary: false
      ontology_can_author_copywriting_alone: false
  creative_pat:
    schema_version: v0.1
    task_id: GKB-PROOF-MICROBATCH-CLOSEOUT-AND-GENERATION-MODE-CSO-ALIGNMENT-001
    step_id: P7B
    contract_status: briefing_orchestration_contract
    formal_schema_contract: false
    ontology_truth_source: false
    clarifications:
      creative_pattern_is_generation_mode_input: true
      creative_pattern_is_ontology_truth: false
      creative_pattern_usable_as_cso_overlay_or_generation_brief_input: true
      creative_pattern_enters_KE: false
      creative_pattern_equals_accepted_content_gold: false
      creative_pattern_may_reuse_semantic_pilot_governance_language: false
    required_pattern_family_min_count: 6
    creative_patterns:
      enterprise_narrative_pattern:
        pattern_id: enterprise_narrative_pattern
        applies_to_p0_group:
        - P0_01
        supports_generation_modes:
        - creative_prototype
        - fact_slot_script
        - evidence_bound_candidate
        creative_value: 把企业价值观/经营选择讲成有张力的叙事，而非口号或课件
        required_cso_signals:
        - narrative_rhythm
        - emotional_temperature
        - creative_tension
        forbidden_template_risks:
        - semantic_checklist
        - courseware_bullet_list
        - slogan_stacking
        positive_generation_signals:
        - 具体经营选择做叙事锚
        - 有转折与代价
        - 平台原生口吻
        negative_generation_signals:
        - 抽象价值词堆叠
        - 无场景无冲突
        - 治理话术入正文
        relation_to_ontology_axis: 叙事挂在 owner=GeneralKnowledgeBase 的 claim 上，不新增 object
        relation_to_creative_gate: 供 NarrativeBeat / HumanVoice 维度评估
        role_in_future_scoped_microbatch: P0_01 主力创意模式来源
      role_voice_pattern:
        pattern_id: role_voice_pattern
        applies_to_p0_group:
        - P0_02
        supports_generation_modes:
        - creative_prototype
        - fact_slot_script
        creative_value: 用角色人设的真实口吻说话（店长/主理人/买手），而非中立旁白
        required_cso_signals:
        - role_voice
        - human_scene
        - emotional_temperature
        forbidden_template_risks:
        - neutral_narrator
        - persona_flattening
        - courseware_tone
        positive_generation_signals:
        - 第一人称职业口吻
        - 岗位真实细节
        - 平台原生表达
        negative_generation_signals:
        - 编造真实人物经历
        - 无差别口吻
        - 抽象人设标签
        relation_to_ontology_axis: role_permission 边界内发声，不伪造真实个人事实
        relation_to_creative_gate: 供 HumanVoice / role_voice 维度评估
        role_in_future_scoped_microbatch: P0_02 角色内容主力
      visual_scene_pattern:
        pattern_id: visual_scene_pattern
        applies_to_p0_group:
        - P0_04
        supports_generation_modes:
        - creative_prototype
        - fact_slot_script
        - display_solution
        creative_value: 把陈列/门店现场写出画面感与空间调度，能被看见
        required_cso_signals:
        - visual_scene
        - aesthetic_framing
        - real_scene_feeling
        forbidden_template_risks:
        - abstract_style_word_stacking
        - no_spatial_detail
        positive_generation_signals:
        - 具体动作与空间关系
        - 可拍摄的画面
        - 材质光线细节
        negative_generation_signals:
        - 假装某具体门店场景存在
        - 无输入编造现场
        relation_to_ontology_axis: 场景事实以 slot 表达，最终执行需 scene facts
        relation_to_creative_gate: 供 VisualScene / AestheticFrame 维度评估
        role_in_future_scoped_microbatch: P0_04 陈列内容化主力
      display_to_content_pattern:
        pattern_id: display_to_content_pattern
        applies_to_p0_group:
        - P0_04
        - P0_03
        supports_generation_modes:
        - display_solution
        - fact_slot_script
        creative_value: 把陈列/搭配动作转成可传播内容（方法论 + 创意组合）
        required_cso_signals:
        - visual_scene
        - platform_native_expression
        - aesthetic_framing
        forbidden_template_risks:
        - dry_sop_list
        - hard_sell_pitch
        positive_generation_signals:
        - 通用搭配方法先行
        - 内容化钩子
        - 平台原生
        negative_generation_signals:
