pack:
  principle_text: '# Creative Content Principle — 3600 微批次开工核心原则 (v0.1)


    任务 / task: `GKB-3600-MICROBATCH-BRIEFING-AND-GO-NOGO-001` (P6)

    状态 / status: `briefing_requirement_only`（开工前 briefing 原则，不是 ontology、不是分数、不是 production 条件）


    ---


    ## 0. 一句话 / TL;DR


    笛语不是安全合规模型，笛语是服装行业内容生产系统。治理门负责不犯错，Creative Gate 负责判断有没有内容生产价值。两个门并列，都要过，谁也不能替代谁。


    ---


    ## 1. 定位纠偏 / What 笛语 actually is


    - **笛语不是安全合规模型。** 只会"不越权、不胡说、不错层、不伪闭环"是必要底线，不是产品价值本身。

    - **笛语是服装行业内容生产系统。** 它的产出最终要变成能看、能拍、能穿、能带货的服装内容：视觉场景、单品细节、真实生活场景、审美判断、叙事节拍、角色口吻、内容玩法。

    - 只强化治理系统 = 造了一个不会犯错但也不会创作的空壳。P6 之后的所有生成，必须同时被治理门和 Creative Gate 约束。


    ## 2. 两个门的分工 / Two gates, orthogonal


    | 门 / gate | 负责判断 | 判据本质 |

    |---|---|---|

    | **治理门 / Governance Gate** | 内容有没有犯错：越权 / 胡说 / 错层 / 伪闭环 / 泄露真实实例事实 / 硬主张无证据 | 不犯错才能进入后续；这是**否决权**，不是加分项 |

    | **创意门 / Creative Gate** | 内容有没有生产价值：好不好看、好不好拍、真不真实、有没有情绪审美生活感转化力 | 有内容生产价值才算好知识；这是**内容价值判断**，不产生 production readiness |


    **关键规则**：


    - **只过治理门，不算好知识。** 一条"绝对安全但毫无内容生产价值"的知识，治理门放行，但 Creative Gate 判为无价值，它不是好知识。

    - **只过创意门但越权，也不能进入后续。** 一条"很好看很会写但泄露了真实门店/顾客/SKU 事实或越权解锁下游"的内容，Creative Gate 再高分也被治理门否决，不得进入后续。

    - **Creative Gate 不替代 Governance Gate，也不弱化它。** 两门是并列的、正交的；创意分高不能抵消任何一条治理红线。


    ## 3. 治理知识 vs 面向正文的知识 / Governance knowledge vs body-facing knowledge


    - **治理知识只进入 compiler / judge / sidecar / route。** owner 为 GovernanceOutbox / EvidencePolicyOutbox / SourceGapLedger 的知识是控制面，它们进入编译器、裁判、旁车、路由决策，**不写进面向读者的正文 body**。

    - **面向正文的知识必须使用服装内容生产语言。** 进入正文的知识（GeneralKnowledgeBase / ExecutionAssetOutbox 语义）要说人话、说服装话：场景、单品、搭配、材质、光线、身形、情绪、玩法，而不是治理术语。

    - **正文不得被治理话术污染。** 正文里不允许出现 checker / source_gap / route_decision / readiness / owner_candidate / epistemic_class 等治理话术；这些词只属于 sidecar 与 route，不属于读者看到的内容。


    ## 4. 对 P7 3600 生成的硬约束 / Hard constraints on P7 generation


    - 生成正文时**必须引用 proposition_id**，不得在 proposition 之外编造新事实。

    - SourceGapLedger 命题只能作 gap / routing hint，**不得**当正向领域事实写进正文。

    - GovernanceOutbox 命题只能作 control / route / stop rule，**不得**写进正文。

    - EvidencePolicyOutbox 命题只能作 claim / evidence policy，**不得**误写成普通 GeneralKnowledgeBase 正文内容。

    - Creative Score 只用于内容生产价值排序与生成要求引导，**不得**变成 production / readiness 条件。


    ## 5. 这份原则不做什么 / What this principle is NOT


    - **不**把 AestheticFrame / VisualScene / StylingLogic / NarrativeBeat / HumanVoice / CreativePattern 注册为 ontology Object / TBox / ABox / KE。它们只是 briefing 阶段的生产能力要求（`briefing_requirement_only`）。

    - **不**解锁 3600 生成、**不**解锁 CandidatePack / Four-Gate / KE / Serving / RAG / DIFY。

    - **不**把 proposition_pack_v1 标为 accepted domain knowledge。

    - **不**翻任何 readiness flag。


    > 本文件是 P6 briefing 的原则声明。它约束 P7 将来"怎么生成"，但它本身不授权 P7 生成。真实 3600 生成需要单独的 founder 授权 + Codex 三关。

    '
  creative_gate:
    gate_version: v0.1
    task_id: GKB-3600-MICROBATCH-BRIEFING-AND-GO-NOGO-001
    gate_role: creative_content_value_judgment
    status: briefing_requirement_only
    does_not_replace_governance_gate: true
    does_not_weaken_governance_gate: true
    does_not_produce_production_readiness: true
    runs_alongside_governance_gate: true
    gate_is_orthogonal_to_governance_gate: true
    owner_types_body_facing:
    - GeneralKnowledgeBase
    - ExecutionAssetOutbox
    owner_types_control_plane:
    - EvidencePolicyOutbox
    - GovernanceOutbox
    - SourceGapLedger
    dimensions:
    - dimension: visual_scene_quality
      definition: 内容是否给出可拍可视的具体服装场景（地点、光线、时间、氛围、镜头感），而不是抽象空话。
      positive_signals:
      - 有明确场景锚点：通勤地铁口的清晨光、周末美术馆的侧逆光、初秋写字楼下沉广场
      - 场景能直接转成一条拍摄脚本或一张 moodboard
      - 场景与服装品类、身形、季节自洽
      negative_signals:
      - 只有"高级感/氛围感/松弛感"等抽象词，落不到具体场景
      - 场景与服装/季节矛盾（羽绒服配盛夏海边）
      - 场景无光线、无地点、无镜头，无法拍摄
      machine_proxy: body 中出现具体场景锚点词（地点/光线/时间/镜头）的密度与去重后独立场景数
      human_review_note: 审稿人判断"照这段能不能立刻拍出一条内容"；不能拍即不达标
      failure_code_if_missing: CG-01
      applies_to_owner_types:
      - GeneralKnowledgeBase
      - ExecutionAssetOutbox
    - dimension: apparel_detail_density
      definition: 内容是否含足够密度的服装专业细节（廓形、材质、工艺、版型、配比、层次），而非泛泛而谈。
      positive_signals:
      - 点到廓形/面料/工艺/版型的具体名词：落肩、醋酸垂坠、明线压边、H 版、九分直筒
      - 细节能指导选款与搭配决策
      - 细节与品类知识自洽、可核验为通用行业常识
      negative_signals:
      - 通篇形容词无一个服装专业名词
      - 细节错误或自相矛盾（真丝还免烫又厚重挺括）
      - 堆砌名词但不服务于任何判断或场景
      machine_proxy: body 中服装专业名词（材质/廓形/工艺/版型词表）命中数与去重种类
      human_review_note: 审稿人判断细节是否专业、准确、可用于选搭；错误细节直接否
      failure_code_if_missing: CG-02
      applies_to_owner_types:
      - GeneralKnowledgeBase
      - ExecutionAssetOutbox
    - dimension: real_scene_feeling
      definition: 内容是否有真实生活感——像真的人在真的生活里穿，而不是模特摆拍的悬浮设定。
      positive_signals:
      - 有真实生活情境：接送孩子、赶早高峰、临时加班改约会、雨天挤地铁
      - 承认真实约束：怕冷、要能走路、要抱娃、预算有限
      - 语气贴近读者的真实处境
      negative_signals:
      - 悬浮人设：无职业无处境的"精致女孩"
      - 无视真实约束（高跟鞋逛一天不累）
      - 编造具体真实顾客情节或真实门店事件（越治理红线，见 Governance Gate）
      machine_proxy: body 中真实生活情境词与真实约束词的出现，且不触发 real-instance-fact 泄露模式
      human_review_note: 审稿人判断"这像不像真实生活"，同时确认没有编造真实人物/门店事实
      failure_code_if_missing: CG-03
      applies_to_owner_types:
      - GeneralKnowledgeBase
      - ExecutionAssetOutbox
    - dimension: aesthetic_judgment
      definition: 内容是否给出可辩护的审美判断（为什么好看、为什么协调），而不是只贴风格标签。
      positive_signals:
      - 给出审美因果：为什么这个配色显白、为什么这个比例拉长身形
      - 有取舍立场：什么情况该收、什么情况该放
      - 判断能迁移到其他单品
      negative_signals:
      - 只贴标签（高级、气质、温柔）不解释原因
      - 审美判断无因果、无法迁移
      - 自相矛盾的审美主张
      machine_proxy: body 中"因为/所以/显/拉长/协调"等审美因果连接词与判断句的密度
      human_review_note: 审稿人判断审美主张是否成立且可迁移，纯标签堆砌不达标
      failure_code_if_missing: CG-04
      applies_to_owner_types:
      - GeneralKnowledgeBase
      - ExecutionAssetOutbox
    - dimension: narrative_beat
      definition: 内容是否有叙事节拍（钩子—展开—转折—落点），读起来有节奏，而不是平铺罗列。
      positive_signals:
      - 有开头钩子、中段展开、结尾落点
      - 有一个清晰的内容主张或情绪弧线
      - 节拍服务于服装内容，不是为叙事而叙事
      negative_signals:
      - 从头到尾平铺，无钩子无落点
      - 罗列要点像说明书
      - 叙事喧宾夺主、盖过服装内容
      machine_proxy: body 段落结构与首尾句功能（钩子/落点）识别；单一平铺段落判弱
      human_review_note: 审稿人判断读起来有没有节奏和落点，说明书式罗列不达标
      failure_code_if_missing: CG-05
      applies_to_owner_types:
      - GeneralKnowledgeBase
      - ExecutionAssetOutbox
    - dimension: human_voice_quality
      definition: 内容是否有可辨识的真人口吻（角色一致、语气自然），而不是无主体的通稿腔或治理话术腔。
      positive_signals:
      - 口吻一致、像一个具体的人在说话
      - 语气自然、可信、有温度
      - 角色口吻与内容主题匹配（买手/搭配师/生活博主）
      negative_signals:
      - 通稿腔、翻译腔、无主体
      - 正文混入 checker / source_gap / route_decision 等治理话术（越原则，见 principle §3）
      - 口吻前后不一致
      machine_proxy: body 中治理话术词命中即判负；第一/第二人称与口语连接词密度作正向代理
      human_review_note: 审稿人判断像不像一个真人在说话；出现治理话术直接否
      failure_code_if_missing: CG-06
      applies_to_owner_types:
      - GeneralKnowledgeBase
      - ExecutionAssetOutbox
    - dimension: platform_fit
      definition: 内容是否贴合投放平台的形态与消费习惯（小红书/抖音/公众号/店播的长度、结构、钩子差异）。
      positive_signals:
      - 结构与长度匹配目标平台
      - 钩子与落点符合平台消费习惯
      - 可直接改成该平台的一条内容
      negative_signals:
      - 平台错配（长图文逻辑塞进 15 秒口播）
      - 无平台意识的通用文案
      - 结构与平台习惯冲突
      machine_proxy: body 或其 tag 是否声明目标平台形态且长度/结构与之自洽
      human_review_note: 审稿人判断放到目标平台是否可用；错配不达标
      failure_code_if_missing: CG-07
      applies_to_owner_types:
      - GeneralKnowledgeBase
      - ExecutionAssetOutbox
    - dimension: inspiration_and_actionability
      definition: 内容是否既给灵感又可执行（读完既被触动，又知道下一步怎么穿/怎么搭/怎么拍/怎么买）。
      positive_signals:
      - 有可迁移灵感点，也有可执行动作
      - 读者能据此做一次选款/搭配/拍摄/转化
      - 灵感与执行不脱节
      negative_signals:
      - 只有灵感无执行，或只有执行无灵感
      - 动作空泛、无法照做
      - 与转化目标脱节
      machine_proxy: body 中可执行动作句与灵感触发句的共现；两者缺一即判弱
      human_review_note: 审稿人判断读者读完能不能既被触动又知道怎么做
      failure_code_if_missing: CG-08
      applies_to_owner_types:
      - GeneralKnowledgeBase
      - ExecutionAssetOutbox
    creative_failure_codes:
    - CG-01
    - CG-02
    - CG-03
    - CG-04
    - CG-05
    - CG-06
    - CG-07
    - CG-08
    note_creative_failure_codes_are_content_value_signals_not_governance_veto: true
    note_governance_veto_codes_live_in_governance_gate: true
  governance_gate:
    gate_version: v0.1
    task_id: GKB-3600-MICROBATCH-BRIEFING-AND-GO-NOGO-001
    gate_role: correctness_veto
    status: briefing_requirement_only
    gate_is_veto: true
    not_weakened_by_creative_gate: true
    not_replaced_by_creative_gate: true
    creative_score_cannot_override_governance_veto: true
    checks:
    - check: owner_routing_correct
      definition: 每条内容的 owner_candidate 与其 epistemic_class 一致，且路由符合 P2 合同（EvidencePolicy/Governance/ExecutionAsset/SourceGap 不得误并入 GeneralKnowledgeBase）。
      failure_code: FC-06
      veto_on_fail: true
    - check: readiness_all_false
      definition: 全部 readiness flag 保持 false（candidatepack_ready / KE_ready / RAG_ready / DIFY_ready / generation_allowed / generation_eligible / production_ready / release_ready / production_servable）。
      failure_code: FC-11
      veto_on_fail: true
    - check: no_real_instance_fact_leak
      definition: 正文不得出现真实品牌/SKU/货号/门店/人物/顾客/价格/库存/折扣等真实实例事实。
      failure_code: FC-10
      veto_on_fail: true
    - check: no_hard_claim_without_evidence_policy
      definition: 硬主张（功能性/性能/绝对化断言）必须挂 EvidencePolicy，否则否决。
      failure_code: FC-05
      veto_on_fail: true
    - check: no_governance_text_in_domain_body
      definition: 正文 body 不得混入 checker / source_gap / route_decision / readiness / owner_candidate / epistemic_class 等治理话术。
      failure_code: FC-03
      veto_on_fail: true
    - check: no_gold_body_surface_copy
      definition: 正文不得对 gold 语料做表层抄袭（去标题后最大公共子串低于阈值）。
      failure_code: FC-07
      veto_on_fail: true
    - check: no_template_reuse
      definition: 跨簇不得模板复用（跨簇最大公共子串低于阈值），杜绝 holdout 式模板空转。
      failure_code: FC-08
      veto_on_fail: true
    - check: no_candidatepack_or_downstream_materialization
      definition: 不得创建 CandidatePack 或任何下游物化（Four-Gate / eligibility / instances）。
      failure_code: FC-12
      veto_on_fail: true
    - check: no_KE_RAG_DIFY_touch
      definition: 不得触碰 KE / Serving / serving_projection / RAG / DIFY 任何路径。
      failure_code: FC-12
      veto_on_fail: true
    - check: no_generation_allowed_true
      definition: 不得把 generation_allowed / generation_eligible 置 true；briefing/go-no-go 不等于生成授权。
      failure_code: FC-11
      veto_on_fail: true
    governance_failure_codes:
    - FC-03
    - FC-05
    - FC-06
    - FC-07
    - FC-08
    - FC-10
    - FC-11
    - FC-12
    relation_to_creative_gate:
      both_gates_must_pass: true
      creative_gate_orthogonal: true
      order: governance_veto_first_then_creative_value
      note: 只过治理门不算好知识；只过创意门但越治理红线不得进入后续。
  creative_score_rubric:
    rubric_version: v0.1
    task_id: GKB-3600-MICROBATCH-BRIEFING-AND-GO-NOGO-001
    status: briefing_requirement_only
    creative_score_used_for:
    - content_production_value_ranking
    - generation_requirement_guidance
    - human_review_prioritization
    creative_score_used_as_production_readiness: false
    creative_score_used_as_generation_authorization: false
    creative_score_replaces_governance_gate: false
    creative_score_can_override_governance_veto: false
    high_creative_score_does_not_unlock:
    - candidatepack_ready
    - KE_ready
    - RAG_ready
    - DIFY_ready
    - generation_allowed
    - generation_eligible
    - production_ready
    - release_ready
    - production_servable
    scale: 0_to_5_per_dimension
    aggregation: mean_of_8_creative_dimensions
    dimensions_scored:
    - visual_scene_quality
    - apparel_detail_density
    - real_scene_feeling
    - aesthetic_judgment
    - narrative_beat
    - human_voice_quality
    - platform_fit
    - inspiration_and_actionability
    interpretation:
      high_score_means: strong_content_production_value_candidate_for_review
      high_score_does_not_mean: passed_governance_or_authorized_or_production_ready
      low_score_means: weak_content_value_needs_rework_or_deprioritize
      low_score_does_not_mean: governance_violation
    precedence_rule:
      governance_veto_is_absolute: true
      creative_score_only_ranks_governance_passing_content: true
      note: 一条内容必须先过治理门（无否决），Creative Score 才有意义；治理否决的内容不进入评分排序。
  capabilities:
    requirements_version: v0.1
    task_id: GKB-3600-MICROBATCH-BRIEFING-AND-GO-NOGO-001
    global_constraint:
      all_families_status: briefing_requirement_only
      registered_as_ontology_object: false
      registered_as_tbox: false
      registered_as_abox: false
      registered_as_ke: false
      allowed_only_in: 07_microbatch_briefing/**
      ontology_object_count_added: 0
    capability_families:
    - family: AestheticFrame
      capability_role: 为内容提供可辩护的审美框架（配色/比例/风格立场与取舍逻辑）。
      generation_requirement: 生成正文时给出审美因果与取舍，不得只贴风格标签。
      required_fields_or_tags:
      - aesthetic_stance
      - color_logic
      - proportion_logic
      - tradeoff_condition
      examples_of_positive_signal:
      - 说明为什么低饱和撞色在通勤场景显得克制不廉价
      - 给出高腰线拉长比例的适用与不适用身形
      examples_of_negative_signal:
      - 只写"高级感/气质感"不解释原因
      - 审美主张无法迁移到其他单品
      forbidden_misuse:
      - 注册为 ontology object
      - 写进治理正文话术
      relation_to_existing_proposition_pack: 消费 GeneralKnowledgeBase 命题中的审美判断，落为生成时的审美要求
      status: briefing_requirement_only
      registered_as_ontology_object: false
    - family: VisualScene
      capability_role: 为内容提供可拍可视的具体场景（地点/光线/时间/镜头/氛围）。
      generation_requirement: 生成正文时给出具体场景锚点，能直接转成拍摄脚本或 moodboard。
      required_fields_or_tags:
      - scene_anchor
      - lighting
      - time_of_day
      - camera_feel
      examples_of_positive_signal:
      - 初秋写字楼下沉广场的侧逆光通勤画面
      - 周末美术馆自然光下的静态单品特写
      examples_of_negative_signal:
      - 只有"氛围感"无地点无光线
      - 场景与季节/品类矛盾
      forbidden_misuse:
      - 注册为 ontology object
      - 编造真实门店/真实事件场景
      relation_to_existing_proposition_pack: 消费 GeneralKnowledgeBase / ExecutionAssetOutbox 命题的场景适用条件
      status: briefing_requirement_only
      registered_as_ontology_object: false
    - family: StylingLogic
      capability_role: 为内容提供搭配与陈列逻辑（层次/配比/呼应/身形适配）。
      generation_requirement: 生成正文时给出可执行搭配逻辑，而非零散单品罗列。
      required_fields_or_tags:
      - layering_logic
      - ratio_logic
      - body_fit_logic
      - display_pairing
      examples_of_positive_signal:
      - 三层叠穿的长度差与体积配比规则
      - 上宽下窄的比例呼应及其适用身形
      examples_of_negative_signal:
      - 只列单品不给搭配逻辑
      - 搭配逻辑与身形/场景矛盾
      forbidden_misuse:
      - 注册为 ontology object
      - 越权写成 CandidatePack 物化
      relation_to_existing_proposition_pack: 消费 ExecutionAssetOutbox / GeneralKnowledgeBase 命题的搭配方法
      status: briefing_requirement_only
      registered_as_ontology_object: false
    - family: NarrativeBeat
      capability_role: 为内容提供叙事节拍（钩子—展开—转折—落点）。
      generation_requirement: 生成正文时具备开头钩子与结尾落点，节拍服务于服装内容。
      required_fields_or_tags:
      - hook
      - development
      - turn
      - landing_point
      examples_of_positive_signal:
      - 开头一个反差钩子，结尾落到一个可执行动作
      - 情绪弧线服务于单品价值
      examples_of_negative_signal:
      - 说明书式平铺罗列
      - 叙事喧宾夺主盖过服装内容
      forbidden_misuse:
      - 注册为 ontology object
      - 用叙事掩盖硬主张无证据
      relation_to_existing_proposition_pack: 组织 GeneralKnowledgeBase 命题为有节拍的正文
      status: briefing_requirement_only
      registered_as_ontology_object: false
    - family: HumanVoice
      capability_role: 为内容提供可辨识的真人口吻（角色一致/语气自然）。
      generation_requirement: 生成正文时保持一致的角色口吻，不用通稿腔与治理话术腔。
      required_fields_or_tags:
      - persona_role
      - tone
      - person_perspective
      examples_of_positive_signal:
      - 买手口吻一致地讲选款取舍
      - 生活博主口吻讲真实穿着处境
      examples_of_negative_signal:
      - 通稿腔/翻译腔/无主体
      - 正文混入治理话术
      forbidden_misuse:
      - 注册为 ontology object
      - 把 GovernanceOutbox 命题当口吻写进正文
      relation_to_existing_proposition_pack: 为面向正文命题赋予一致口吻，控制面命题不进入正文口吻
      status: briefing_requirement_only
      registered_as_ontology_object: false
    - family: CreativePattern
      capability_role: 为内容提供可复用的内容玩法（选题结构/钩子模式/转化路径），但不得跨簇模板空转。
      generation_requirement: 生成正文时可用玩法结构，但每簇必须保持 cluster-specific，禁止模板复用。
      required_fields_or_tags:
      - play_structure
      - hook_pattern
      - conversion_path
      - cluster_specificity_guard
      examples_of_positive_signal:
      - 一个可复用的"痛点—反差—方案"结构，但每簇填充不同专业内容
      - 玩法服务于该簇独有的服装知识
      examples_of_negative_signal:
      - 跨簇套同一段模板文字（holdout 式空转）
      - 玩法空洞无服装内容
      forbidden_misuse:
      - 注册为 ontology object
      - 用玩法模板绕过 cluster-specificity 治理检查
      relation_to_existing_proposition_pack: 组织多条命题为可复用但 cluster-specific 的内容结构
      status: briefing_requirement_only
      registered_as_ontology_object: false
