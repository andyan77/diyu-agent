- rich_body_id: CANARY-40-RB-015
  canary_id: CANARY-40-015
  canonical_cluster_id: mkc_021
  cluster_title: 同类比较维度与禁比边界
  body_form: claim_boundary_body
  body: 同类比较维度与禁比边界要回答“两件同类商品，哪些能比、哪些不能比、比不出来的怎么办”。比如两条同类裤子，版型几何差异可以直接比，但“哪条更耐穿”需要检测支撑，缺数据时就在该维度标一个“此项未知”，而不是凭手感给结论。可比的一般是可观察且口径一致的维度：结构差异、材质类别、工艺可见度、覆盖或版型的几何特征，这些放在一起比较不会误导。不可直接比较的是需要检测或长期使用才能判定的维度：耐久、保暖、功能强弱，以及任何“谁更显瘦、谁更高档”的主观结果。比较时若某一维度缺乏可核验数据，应当显式标出“此项未知”，而不是用印象填补。判断何时必须要证据：当读者可能据比较结论做出与效果、性能相关的决定时，就要求证据到位，否则只呈现可见差异并注明未知项。两件商品确属同类且信息对称时才适用；跨品类或信息不对称的强行对比不适用。这一簇的输出是一份关于“证据够不够”的判断依据：无证据的优劣一律降级为观察加未知标注，涉及性能与效果的比较全部挂为待补证据，绝不并入普通领域说明。
  body_char_count: 429
