    - Does NOT generate any draft (0 of 120 generated).
    - Does NOT count P7A proof drafts toward 3600.
    - Does NOT create CandidatePack / run Four-Gate / write KE / Serving / RAG / DIFY.
    - Does NOT flip any readiness flag.
    note: 'This task does not generate. Only the next task (P7C-GEN, GKB-SCOPED-120-CONTENT-PRODUCTION-MICROBATCH-GENERATION-001) may generate the 120 drafts, and only under a separate founder authorization + Codex three-gate. 120 is the max count without new authorization; 320 requires a separate founder decision. Direct 3600 stays forbidden (contract-immutable + shared_rules.global_forbidden).

      '
