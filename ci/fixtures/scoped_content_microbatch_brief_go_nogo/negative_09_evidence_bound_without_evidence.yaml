    - Designs the scoped 120 content-production microbatch as an executable, checkable, stoppable brief.
    - Assigns 120 future drafts by P0 group / generation_mode / creative_pattern / owner / fact-binding.
    - Produces a go/no-go for the NEXT (generation) task.
