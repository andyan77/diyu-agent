  cards: *id001
  rich_bodies:
  - rich_body_id: PROOF-MB-001-RB-001
    candidate_id: PROOF-MB-001-001
    canonical_cluster_id: mkc_007
    cluster_title: 企业叙事骨架
    body_form: full_rich_body
    body: 给一家服装企业搭建企业叙事骨架，第一笔不该落在成立于哪一年或喊了什么口号上，而要先把它长年在替哪一类穿衣人化解哪一种经营难题讲明白——这道难题可能是同一批版型在换季返单后走样，也可能是导购站在货架前解释一件外套为何选这种面料时反复卡壳。锚点定下来，才轮到把企业在挑面料、排布生产节奏、分派各道责任上那些一再重复的动作摊开，它们不是某回临时起意，而是旁人能照着复述一遍的组织性做法。做法讲到位，往下就空出几格证明位：一格留给供应链上下游的协同，一格留给内部谁盯哪个复核节点，一格留给过程里攒下的可追溯记录，材料没到手时先空着，不拿想象去填。再往后，把这套做法折算成穿的人能亲眼比对的差别，比如同系列不同款之间版型对得上、拼接处收边不飘，让读者从画面里看出门道，而不是只读到一串形容词；这层价值还能沿系列轴切成若干可反复展开的段落，同一副骨架派生出多篇而彼此不撞。要守住的边界是：这副骨架只有在企业确实攒下可复述的稳定做法时才立得住，若手上只是一场限时活动或一桩孤立事件，就别硬撑成一段叙事，退回成一条普通信息记着便可；同时凡话头碰到体量、占比或增速这类要拿数据背书的判断，一律先按住，等官方材料补齐再讲，没材料就把那句挂起来待补，正文只保留能复述的方法层，绝不用观察口吻把经营成果硬写死。
    body_char_count: 543
    min_body_chars_standard: 350
    min_body_chars_met: true
    cluster_specific_mechanism_chain:
    - 问题场景 -> 经营方法
    - 经营方法 -> 证明槽位
    - 证明槽位 -> 价值表达
    - 价值表达 -> 系列轴
    domain_anchors:
    - 面料取舍
    - 版型稳定性
    - 门店解释难度
    - 复核节点
    - 系列一致性
    expected_body_topics_covered:
    - 企业所回应的问题场景
    - 组织性方法与长期选择
    - 供应链 / 组织 / 过程证明的预留槽位
    - 价值表达与可观察差异
    epistemic_split:
      observation_layer: 只描述可观察的结构、材质、动作与画面：版型换季返单后是否走样、拼接处收边是否发飘、导购在货架前解释面料时是否卡壳。
      method_layer: 解释可复用的判断顺序：先定问题场景，再摊开一再重复的组织性做法，再空出证明槽位，最后折算成能亲眼比对的价值并沿系列轴展开。
      boundary_layer: 对体量、占比、增速这类经营成果与市场地位的硬结论设边界，不用观察口吻硬写死。
      downgrade_path: 缺官方材料的硬结论先按住挂为待补，正文只留可复述的方法层；只有一次性活动或孤立事件时整体退回为普通信息条目。
    hard_claim_routing: performance_or_effect_claims_without_source_routed_to_missing_source_or_observation
    governance_text_in_body: false
    gold_body_surface_copied: false
    p4_canary_body_copied: false
    source_proposition_ids:
    - PROP-V1-001
    - PROP-V1-002
    - PROP-V1-003
    - PROP-V1-004
