refs:
  gold:
    mkc_007:
      gold_body: 企业叙事骨架的起点不是“品牌想显得更有理想”，而是先界定企业长期回应的服装经营问题。这个问题可以来自货品结构、面料取舍、版型稳定性、系列一致性、门店解释难度或顾客选择成本，但只能停留在通用问题层。骨架展开时应按四步组织：先说明问题场景，再说明企业采用的组织性方法，再列出需要被证明的槽位，最后把方法翻译成用户能够观察到的价值。若只有价值词而没有方法和证明槽位，只能形成主题提示；若有流程、角色分工、复核节点或系列结构线索，才可以进入企业叙事骨架。该机制把企业叙事从口号改成“问题—方法—证明—价值”的可复用结构。
    mkc_008:
      gold_body: 证明槽位不是给价值词找装饰，而是把“为什么这样做”拆成可核对的叙事位置。角色槽位说明谁在做判断，例如设计、版型、陈列、导购等通用角色；流程槽位说明判断发生在哪个节点，例如选料、打样、试穿、复核、上架前调整；质量门槽位说明哪里需要停下来确认；约束槽位说明为什么不能只追求好看或好卖。价值转译只能从这些槽位向外推一层：把“复核”转成稳定性意识，把“取舍”转成适用场景意识，把“交接”转成服务一致性意识。没有证据的槽位不能转译成耐穿、权威认证、销量结果或行业评价。
    mkc_009:
      gold_body: 故事弧线应由材料的问题类型决定，而不是由写作者想要的情绪决定。若材料展示的是一个服装对象的结构差异，例如领型、腰线、门襟、面料肌理，适合使用“结构说明弧线”：从可见差异进入，解释取舍逻辑，再停在可观察价值。若材料展示的是连续处理过程，例如修改版型、比较面料、调整陈列、确认搭配比例，适合使用“选择过程弧线”：先提出需要解决的选择问题，再展示取舍顺序，最后说明选择被如何收束。若材料只包含价值词或单张无上下文图片，不应展开成困境、坚持、转折、结果，只能降级为观察问题或补依据清单。弧线越强，需要的证明越强。
    mkc_010:
      gold_body: 反模板叙事的锚点由四类信息共同组成。对象锚点说明画面里可被指出的服装部位或陈列对象，例如领口、袖口、腰线、门襟、叠装层次、挂通色组；动作锚点说明对象如何被处理，例如整理、翻折、对比、递示、试穿、转身；约束锚点说明表达为什么不能任意放大，例如光线会影响颜色观感，层搭会影响轮廓关系，场景会影响单品任务；节点锚点说明内容从哪个时刻切入，例如上身前、整理中、对比后、陈列完成时。只有锚点组合能回答“看见什么、怎样处理、受什么限制、从哪里切入”，抽象词才有落点。
  canary_bodies:
    mkc_007: 企业叙事骨架要先回答“这家企业在替谁解决什么问题”，把问题场景确定成叙事的起点，而不是从口号或成立年份写起。举个具体例子，一段内容若从“怎么把控交期”这一问题场景切入，就比从“成立于哪一年”切入更容易接上后面的做法与证明，起点选错，后面几层都会悬空。问题场景确定之后，才展开长期采用的组织性做法：它在选料、排产、协作分工上做了哪些反复出现的选择，这些选择构成可复述的经营方法。方法之后要预留证明位，供应链、组织结构、过程记录各留一个可后续填充的槽位，暂时没有材料时保持空槽而不去编造。最后把方法与证明转译成对外可感知的价值表达，并按系列轴拆成可重复的叙事单元，让同一套骨架能派生出多条内容而不互相重复。这套骨架在企业确有稳定做法可讲时成立；若只有一次性事件或临时活动，则它失效，应降级为普通信息条目而不是硬撑成叙事。守住一条线：通用做法不能写成某一时点的经营成果或市场地位，凡触及规模、份额、增长这类硬结论，必须先有官方资料，缺材料时把该句挂起为待补，正文只留方法层。
    mkc_008: 这一簇处理的是“怎么把组织内部的分工和工序，翻译成外部能看懂的证明”。比如“成品复核”这个节点，可以讲存在一道二次确认的关口，但不能顺势说出某次复核挑出了多少件问题，那已经落进具体经营数据了。第一步是把角色分工与协作边界摆清：谁负责设计打样、谁负责工艺把关、谁负责成品复核，边界清楚才不会把功劳含糊化。第二步沿关键工序节点排布叙事位置，把面料进厂、裁剪、缝制、整烫、检验这些节点标成可讲解的先后段落。每个节点后面挂一道门：质量门看是否达标、复核门看是否二次确认、交接门看责任是否清晰移交，门与门之间形成可追溯的链条。供应链上的选择要连着约束一起讲，选某种做法往往是为了应对交期、批量或稳定性的限制，把选择与约束成对写出，方法才显得可信。它在存在可核验流程时适用；把想象的流程当既有流程时不适用。这里必须收住：具体供应商、工厂、检测报告属于实例事实，无授权材料一律不写，需要时挂为待补，正文只承认“存在这样一类工序节点”。
    mkc_009: 故事弧线适用边界解决的是“这段内容该用哪种叙事结构，以及哪种结构会带来风险”。比如同样讲一件外套，用成长弧要交代能力如何一步步积累，用对照弧则要摆出两种做法的差别，选哪条取决于手上能拿出哪种可核验的过程材料。不同弧线对应不同问题类型：成长弧适合讲能力如何积累，转折弧适合讲一次方法调整，对照弧适合讲两种做法的差异，先按内容的问题类型去挑弧线，而不是先定弧线再硬凑情节。选定弧线后要绑定证据强度，越是强调结果反差的弧线，对可核验事实的要求越高。弧线还要与价值表达和证明位兼容，若某条弧线必须依赖尚无材料支撑的关键情节，就说明它此刻并不适用。识别不适用的信号包括：必须搬出具体业绩数字、必须替人物编造内心、必须假设读者已相信某个未证明的前提。内容确有可展开的过程时它成立；只想用弧线包装空洞结论时它失效，此时把弧线压回一句方法说明。要点在于不得用叙事张力替代证据，凡涉及承诺性结果或对比性优劣而无据，一律改写成中性观察或标注为缺来源。
    mkc_010: 反模板叙事锚点用来对治“千篇一律的空泛叙述”，做法是先找到能被镜头和文字抓住的具体锚点，再围绕锚点展开。举例来说，与其写“这件衣服很好看”，不如把镜头落到“袖口那道明线的走向”这个对象锚点上，再接上“翻起袖口能看到里料收边”这个动作，叙述立刻有了抓手。锚点分四类：对象锚点是可指认的物件，比如一处走线、一枚纽扣、一段拼接；动作锚点是可观察的处理动作，比如翻折、比对、归位；约束锚点是取舍的表达，比如为活动量而放大的松度；节点锚点是前后台衔接处，比如从库房到陈列面的交接点。抓住锚点后，把对象连到动作、动作连到可见线索、约束连到取舍说明、节点连到场景可拍性，叙述就有了落点，也天然区别于其他条目的写法。内容里确有可指认细节时这套方法适用；只有情绪形容而无实物依托时不适用，这类稿子应先补锚点再落笔。要守的边界是：锚点必须是通用可复现的结构特征，不能把某件在售商品的独有卖点当锚点；凡带具体货号、价格或库存的描述都要剔除，或先标为缺来源再议。
