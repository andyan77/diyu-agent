name: Governance CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - ci/ci-remote-001-v2

permissions:
  contents: read

jobs:
  checker-compatibility:
    name: checker-compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install Package 8 checker dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            "PyYAML==6.0.3" \
            "Flask==3.1.3" \
            "Flask-Login==0.6.3" \
            "pydantic==2.13.4" \
            "SQLAlchemy==2.0.51" \
            "psycopg[binary]==3.3.4" \
            "psycopg2-binary==2.9.12"
      - name: Run governance checkers
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 ci/checkers/check_gkb_controlled_composition_v2.py
          python3 ci/checkers/check_gkb_controlled_composition_v2.py --selftest
          python3 ci/checkers/check_gkb_content_product_profiles_20.py
          python3 ci/checkers/check_gkb_content_product_profiles_20.py --selftest
          python3 ci/checkers/check_gkb_controlled_v2_component_review_20cp_v002.py --no-git
          python3 ci/checkers/check_gkb_controlled_v2_component_review_20cp_v002.py --selftest
          python3 07_microbatch_runs/scoped_content_microbatch_120_001/midbatch_320_001/controlled_composition_v2_001/component_review_20cp_and_handoff_002/run_component_review_20cp_v002_freezer.py --check
          python3 ci/checkers/check_gkb_v2_b_channel_24_component_review.py --predecessor-check component-supply
          python3 ci/checkers/check_gkb_v2_20cp_component_supply_closeout.py --selftest
          python3 07_microbatch_runs/scoped_content_microbatch_120_001/midbatch_320_001/controlled_composition_v2_001/component_supply_closeout_20cp_001/run_component_supply_closeout_freezer.py --check
          python3 ci/checkers/check_gkb_v2_b_channel_24_component_review.py --predecessor-check fact-authorization
          python3 ci/checkers/check_gkb_v2_20cp_fact_authorization_fixture_closeout.py --selftest
          python3 07_microbatch_runs/scoped_content_microbatch_120_001/midbatch_320_001/controlled_composition_v2_001/fact_authorization_fixture_closeout_001/run_fact_authorization_fixture_freezer.py --check
          python3 ci/checkers/check_gkb_v2_b_channel_24_component_review.py --predecessor-check orch-validation
          python3 ci/checkers/check_orch_v2_20cp_validation_dryrun.py --selftest
          python3 08_orchestration_runs/controlled_composition_v2_001/orch_20cp_validation_dryrun_001/run_orch_20cp_validation_dryrun_freezer.py --check
          python3 ci/checkers/check_gkb_v2_b_channel_24_component_review.py --predecessor-check generator-build
          python3 ci/checkers/check_controlled_content_generator_v2_build.py --selftest
          python3 controlled_content_generator_v2_001/build_and_acceptance_harness_001/run_generator_v2_acceptance_harness.py --check
          python3 ci/checkers/check_controlled_v2_20cp_qualification_probe_40.py --no-git
          python3 ci/checkers/check_controlled_v2_20cp_qualification_probe_40.py --selftest
          python3 controlled_content_generator_v2_001/qualification_probe_40_001/run_qualification_probe_40_orch_materializer.py --check
          python3 controlled_content_generator_v2_001/qualification_probe_40_001/run_qualification_probe_40_generator_acceptance.py --check
          python3 ci/checkers/check_controlled_v2_qualification_probe_40_targeted_repair.py --no-git
          python3 ci/checkers/check_controlled_v2_qualification_probe_40_targeted_repair.py --selftest
          python3 controlled_content_generator_v2_001/qualification_probe_40_targeted_repair_001/run_targeted_repair_materializer.py --phase calibration --check
          python3 controlled_content_generator_v2_001/qualification_probe_40_targeted_repair_001/run_targeted_repair_materializer.py --phase hidden --check
          python3 ci/checkers/check_controlled_v2_qualification_calibration_targeted_repair_002.py --no-git
          python3 ci/checkers/check_controlled_v2_qualification_calibration_targeted_repair_002.py --selftest
          python3 controlled_content_generator_v2_001/qualification_calibration_targeted_repair_002/run_qualification_calibration_repair_002_materializer.py --phase calibration --check
          python3 controlled_content_generator_v2_001/qualification_calibration_targeted_repair_002/run_qualification_calibration_repair_002_materializer.py --phase hidden --check
          python3 controlled_content_generator_v2_001/creative_authoring_route_oracle_convergence_001/checkpoint_0/check_controlled_v2_creative_authoring_route_convergence_lifecycle.py
          python3 controlled_content_generator_v2_001/creative_authoring_route_oracle_convergence_001/checkpoint_0/check_controlled_v2_creative_authoring_route_convergence_lifecycle.py --selftest
          python3 controlled_content_generator_v2_001/creative_authoring_route_oracle_convergence_001/run_convergence_materializer.py --check
          python3 ci/checkers/check_gkb_v2_b_channel_24_component_review.py --predecessor-check b-lane-dev-gate
          python3 controlled_content_generator_v2_001/b_lane_independent_composition_dev_gate_001/check_controlled_v2_b_lane_independent_composition_dev_gate.py --selftest
          python3 controlled_content_generator_v2_001/b_lane_independent_composition_dev_gate_001/run_b_lane_dev_gate.py --check
          python3 controlled_content_generator_v2_001/b_lane_independent_composition_dev_gate_001/phase_0/check_current_ledger_owner.py
          python3 controlled_content_generator_v2_001/b_lane_independent_composition_dev_gate_001/phase_0/check_current_ledger_owner.py --selftest
          python3 ci/checkers/check_gkb_v2_b_channel_24_component_review.py
          python3 ci/checkers/check_gkb_v2_b_channel_24_component_review.py --selftest
          python3 ci/checkers/check_orch_generator_v2_b_channel_component_consumption_dev_gate.py
          python3 ci/checkers/check_orch_generator_v2_b_channel_component_consumption_dev_gate.py --selftest
          python3 07_microbatch_runs/scoped_content_microbatch_120_001/midbatch_320_001/controlled_composition_v2_001/b_channel_component_review_and_handoff_001/run_b_channel_component_review_freezer.py --check
          python3 controlled_content_generator_v2_001/gate1_v1_1_001/p1a_standard_baseline_review_packet_and_governance_preflight_001/run_p1a_standard_baseline_review_packet_freezer.py --check
          python3 ci/checkers/check_gate1_v1_1_current.py
          python3 ci/checkers/check_gate1_v1_1_current.py --selftest
          test "$(sha256sum ci/checkers/check_product_foundation.py | cut -d ' ' -f 1)" = "6f802297d7fe182e76699f90feab5786a0d0ece04d1cf49c8fc5153380dd8e01"
          python3 ci/checkers/check_product_foundation.py
          python3 ci/checkers/check_product_foundation.py --selftest
      - name: Run reserved downstream package checks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          run_downstream_package_checker() {
            package_root="$1"
            checker="$2"
            required="${3:-false}"
            reference_commit="${4:-}"
            test "$required" = "true" || test "$required" = "false"
            if [ ! -e "$package_root" ]; then
              test "$required" = "false"
              return 0
            fi
            test -d "$package_root"
            test -f "$checker"
            run_root="."
            temporary_parent=""
            if [ -n "$reference_commit" ]; then
              temporary_parent="$(mktemp -d)"
              run_root="$temporary_parent/snapshot"
              git worktree add --detach "$run_root" "$reference_commit" >/dev/null
            fi
            set +e
            (cd "$run_root" && python3 "$checker" && python3 "$checker" --selftest)
            code=$?
            set -e
            if [ -n "$temporary_parent" ]; then
              git worktree remove --force "$run_root" >/dev/null
              rmdir "$temporary_parent"
            fi
            test "$code" -eq 0
          }
          run_downstream_package_checker "12_expression_service/expression_runtime_adapter_001" "12_expression_service/expression_runtime_adapter_001/check_light_expression_service.py" "false"
          run_downstream_package_checker "13_brand_data/brand_data_import_001" "13_brand_data/brand_data_import_001/check_brand_data_import.py" "false"
          run_downstream_package_checker "14_dify_shell/dify_content_shell_001" "14_dify_shell/dify_content_shell_001/check_dify_content_shell.py" "false"
          run_downstream_package_checker "15_brand_retrieval/brand_fact_retrieval_001" "15_brand_retrieval/brand_fact_retrieval_001/check_brand_fact_retrieval.py" "false" "24cd9888f38f2f22b22aa6c5a23f388b39fa1469"
          run_downstream_package_checker "16_composition_runtime/fact_aware_plan_adapter_001" "16_composition_runtime/fact_aware_plan_adapter_001/check_fact_aware_plan_adapter.py" "true"
          run_downstream_package_checker "17_dify_runtime/dify_end_to_end_001" "17_dify_runtime/dify_end_to_end_001/check_dify_end_to_end.py" "true" "f046ec6e3d1a34345c97292e9ab1f5a13a2bd031"
          run_downstream_package_checker "18_deployment/hosted_operations_001" "18_deployment/hosted_operations_001/check_hosted_operations.py" "true" "e4ca0b44d5f5b64a8c7840986b716abb3be4f88d"
          run_downstream_package_checker "19_cloud_cutover/ecs_migration_001" "19_cloud_cutover/ecs_migration_001/check_ecs_cutover.py" "true"
          run_downstream_package_checker "17_dify_runtime/dify_end_to_end_001" "17_dify_runtime/dify_end_to_end_001/check_dify_end_to_end.py" "true"
      - name: Verify fail-closed optimized mode
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          for args in \
            "ci/checkers/check_gkb_controlled_composition_v2.py" \
            "ci/checkers/check_gkb_controlled_composition_v2.py --selftest" \
            "ci/checkers/check_gkb_content_product_profiles_20.py" \
            "ci/checkers/check_gkb_content_product_profiles_20.py --selftest" \
            "ci/checkers/check_gkb_controlled_v2_component_review_20cp_v002.py" \
            "ci/checkers/check_gkb_controlled_v2_component_review_20cp_v002.py --selftest" \
            "ci/checkers/check_gkb_v2_20cp_component_supply_closeout.py" \
            "ci/checkers/check_gkb_v2_20cp_component_supply_closeout.py --selftest" \
            "ci/checkers/check_gkb_v2_20cp_fact_authorization_fixture_closeout.py" \
            "ci/checkers/check_gkb_v2_20cp_fact_authorization_fixture_closeout.py --selftest" \
            "ci/checkers/check_orch_v2_20cp_validation_dryrun.py" \
            "ci/checkers/check_orch_v2_20cp_validation_dryrun.py --selftest" \
            "ci/checkers/check_controlled_content_generator_v2_build.py" \
            "ci/checkers/check_controlled_content_generator_v2_build.py --selftest" \
            "ci/checkers/check_controlled_v2_20cp_qualification_probe_40.py" \
            "ci/checkers/check_controlled_v2_20cp_qualification_probe_40.py --selftest" \
            "ci/checkers/check_controlled_v2_qualification_probe_40_targeted_repair.py" \
            "ci/checkers/check_controlled_v2_qualification_probe_40_targeted_repair.py --selftest" \
            "ci/checkers/check_controlled_v2_qualification_calibration_targeted_repair_002.py" \
            "ci/checkers/check_controlled_v2_qualification_calibration_targeted_repair_002.py --selftest" \
            "controlled_content_generator_v2_001/creative_authoring_route_oracle_convergence_001/checkpoint_0/check_controlled_v2_creative_authoring_route_convergence_lifecycle.py" \
            "controlled_content_generator_v2_001/creative_authoring_route_oracle_convergence_001/checkpoint_0/check_controlled_v2_creative_authoring_route_convergence_lifecycle.py --selftest" \
            "controlled_content_generator_v2_001/b_lane_independent_composition_dev_gate_001/check_controlled_v2_b_lane_independent_composition_dev_gate.py" \
            "controlled_content_generator_v2_001/b_lane_independent_composition_dev_gate_001/check_controlled_v2_b_lane_independent_composition_dev_gate.py --selftest" \
            "controlled_content_generator_v2_001/b_lane_independent_composition_dev_gate_001/phase_0/check_current_ledger_owner.py" \
            "controlled_content_generator_v2_001/b_lane_independent_composition_dev_gate_001/phase_0/check_current_ledger_owner.py --selftest" \
            "ci/checkers/check_gkb_v2_b_channel_24_component_review.py" \
            "ci/checkers/check_gkb_v2_b_channel_24_component_review.py --selftest" \
            "ci/checkers/check_orch_generator_v2_b_channel_component_consumption_dev_gate.py" \
            "ci/checkers/check_orch_generator_v2_b_channel_component_consumption_dev_gate.py --selftest" \
            "ci/checkers/check_gate1_v1_1_current.py" \
            "ci/checkers/check_gate1_v1_1_current.py --selftest" \
            "ci/checkers/check_product_foundation.py" \
            "ci/checkers/check_product_foundation.py --selftest" \
            "07_microbatch_runs/scoped_content_microbatch_120_001/midbatch_320_001/controlled_composition_v2_001/b_channel_component_review_and_handoff_001/run_b_channel_component_review_freezer.py --check"
          do
            set +e
            python3 -O $args
            code=$?
            set -e
            test "$code" -eq 2
          done
      - name: Verify reserved downstream package fail-closed optimized mode
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          run_downstream_package_checker_optimized() {
            package_root="$1"
            checker="$2"
            required="${3:-false}"
            reference_commit="${4:-}"
            test "$required" = "true" || test "$required" = "false"
            if [ ! -e "$package_root" ]; then
              test "$required" = "false"
              return 0
            fi
            test -d "$package_root"
            test -f "$checker"
            run_root="."
            temporary_parent=""
            if [ -n "$reference_commit" ]; then
              temporary_parent="$(mktemp -d)"
              run_root="$temporary_parent/snapshot"
              git worktree add --detach "$run_root" "$reference_commit" >/dev/null
            fi
            set +e
            (cd "$run_root" && python3 -O "$checker")
            code=$?
            set -e
            test "$code" -eq 2
            set +e
            (cd "$run_root" && python3 -O "$checker" --selftest)
            code=$?
            set -e
            test "$code" -eq 2
            if [ -n "$temporary_parent" ]; then
              git worktree remove --force "$run_root" >/dev/null
              rmdir "$temporary_parent"
            fi
          }
          run_downstream_package_checker_optimized "12_expression_service/expression_runtime_adapter_001" "12_expression_service/expression_runtime_adapter_001/check_light_expression_service.py" "false"
          run_downstream_package_checker_optimized "13_brand_data/brand_data_import_001" "13_brand_data/brand_data_import_001/check_brand_data_import.py" "false"
          run_downstream_package_checker_optimized "14_dify_shell/dify_content_shell_001" "14_dify_shell/dify_content_shell_001/check_dify_content_shell.py" "false"
          run_downstream_package_checker_optimized "15_brand_retrieval/brand_fact_retrieval_001" "15_brand_retrieval/brand_fact_retrieval_001/check_brand_fact_retrieval.py" "false" "24cd9888f38f2f22b22aa6c5a23f388b39fa1469"
          run_downstream_package_checker_optimized "16_composition_runtime/fact_aware_plan_adapter_001" "16_composition_runtime/fact_aware_plan_adapter_001/check_fact_aware_plan_adapter.py" "true"
          run_downstream_package_checker_optimized "17_dify_runtime/dify_end_to_end_001" "17_dify_runtime/dify_end_to_end_001/check_dify_end_to_end.py" "true" "f046ec6e3d1a34345c97292e9ab1f5a13a2bd031"
          run_downstream_package_checker_optimized "18_deployment/hosted_operations_001" "18_deployment/hosted_operations_001/check_hosted_operations.py" "true" "e4ca0b44d5f5b64a8c7840986b716abb3be4f88d"
          run_downstream_package_checker_optimized "19_cloud_cutover/ecs_migration_001" "19_cloud_cutover/ecs_migration_001/check_ecs_cutover.py" "true"
          run_downstream_package_checker_optimized "17_dify_runtime/dify_end_to_end_001" "17_dify_runtime/dify_end_to_end_001/check_dify_end_to_end.py" "true"

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.0"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${version}_checksums.txt"
          grep " ${archive}$" "gitleaks_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: |
          set -euo pipefail
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
