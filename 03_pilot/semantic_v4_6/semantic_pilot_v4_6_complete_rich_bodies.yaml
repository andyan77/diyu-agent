  - draft_id: SEM-V4_6-APPAREL-CLAIM-BOUNDARY-001
    revision_of: SEM-V4_5-APPAREL-CLAIM-BOUNDARY-001
    compiler_id: claim_boundary
    expected_body_shape: claim_boundary_body
    body_language: zh-CN
    compiler_sections:
      expression_layer: 身材效果表达先拆成画面观察、条件体验、需来源支持的结果主张和禁用保证。画面观察只处理比例线、分界、遮挡和轮廓关系；它不能推出真实身体变化，也不能替代试穿数据。
      allowed_expression: 允许写“画面中的上下比例关系更清楚”“内外层分界更容易被看见”“衣摆位置让重心显得更明确”。这些句子都指向可见关系，不把显瘦、变高或身体结果当作事实。
      conditional_expression: 条件体验必须带场景条件，例如“在上短下长搭配中，穿着者可能更容易注意到腰线分界”。这里表达的是穿搭语境下的主观感受，不能省略条件，也不能写成普遍结论。
      source_workorder: 若出现显瘦、修饰比例、体感改善等结果语言，应转成补源任务：需要规则来源、样本条件或测量口径。没有来源时，只能保留可见线条和搭配条件。
      prohibited_expression: 禁止写“谁穿都显瘦”“保证拉长比例”“一定显高”。这类保证越过了观察层和条件体验层，既没有来源，也会把审美表达伪装成身体效果。
      safe_creative_alternative: 安全替代表达可围绕线条停顿、重心分界、外套开合和内搭露出比例展开。它保留审美方向，但把结果承诺改成画面关系和搭配条件。
      epistemic_warning: 触感、贴肤感和活动感不能标为 direct_observation；它们最多是 conditional_experience_expression。显瘦、耐穿、持久舒适等属于 source_required_performance_claim；保证性词组直接阻断。
    section_order: &id001
    - expression_layer
    - allowed_expression
    - conditional_expression
    - source_workorder
    - prohibited_expression
    - safe_creative_alternative
    - epistemic_warning
    body_zh_chars: 406
    difference_claim:
      what_decision_changes: 先拆表达层级，再决定保留或补源。
      what_observable_material_changes: 关注比例线、遮挡、分界和轮廓。
      what_transfer_logic_changes: 把效果句转成画面关系或来源任务。
      what_failure_mode_changes: 身体结果承诺直接阻断。
      what_downstream_use_changes: 用于安全表达和补源提示。
    sidecar_leak_into_rich_body: false
