      what_transfer_logic_changes: 把动作序列转成内容节奏。
      what_failure_mode_changes: 没有完成标记时退回素材采集。
      what_downstream_use_changes: 用于动作段落和演示提示。
    sidecar_leak_into_rich_body: false
