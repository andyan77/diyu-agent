  - draft_id: SEM-V4_6-CONTROL-PLANE-GOVERNANCE-001
    revision_of: SEM-V4_5-CONTROL-PLANE-GOVERNANCE-001
    compiler_id: control_plane
    expected_body_shape: control_plane_route_body
    body_language: zh-CN
    compiler_sections:
      trigger: 触发条件是候选片段出现缺少来源、建模冲突、风险敏感或禁止输出请求。正文先识别触发类型，再决定是否进入 source_gap、decision_required、founder_review 或 excluded。
      route: route 只描述四条处理路径：source_gap 用于缺来源；decision_required 用于结构冲突；founder_review 用于需要创始人裁决的敏感项；excluded 用于禁止输出或越权请求。
      ledger_target: 账本目标按路径确定：缺来源记录补源线索，结构冲突记录待决事项，敏感项记录裁决请求，禁止项记录排除原因。正文不把这些记录说成领域知识。
      block_or_split: 当一个输入同时像来源缺口、待决事项和执行资产时，先触发 block_or_split。能拆清楚归属就分流；拆不清楚就阻断，并保留需要人工决定的原因。
      reentry_condition: 再进入条件必须明确：source_gap 需要来源补足，decision_required 需要结构裁决，founder_review 需要创始人授权，excluded 通常不得再进入。
      forbidden_transition: 禁止从缺来源或敏感项直接进入领域正文，也禁止把排除项改写成安全表达后继续流转。控制路径必须先完成必要条件，不能用文字修饰绕过。
      false_generation_prevention: 'downstream_use: review_focus 检查触发、路径、账本目标和再进入条件是否齐全；execution_asset_hint 只提示需要补什么路由信息；content_angle_selection 不适用于控制路径。'
    section_order: &id002
    - trigger
    - route
    - ledger_target
    - block_or_split
    - reentry_condition
    - forbidden_transition
    - false_generation_prevention
    body_zh_chars: 338
