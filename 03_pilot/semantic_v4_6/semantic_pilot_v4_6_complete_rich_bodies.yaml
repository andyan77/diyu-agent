  - draft_id: SEM-V4_6-CONTROL-PLANE-GOVERNANCE-002
    revision_of: SEM-V4_5-CONTROL-PLANE-GOVERNANCE-002
    compiler_id: control_plane
    expected_body_shape: control_plane_route_body
    body_language: zh-CN
    compiler_sections:
      trigger: 触发条件是研究资产同时指向多种目标、缺少所有者、缺少非生产封印或含有运行态误导。输入一旦无法确定归属，就不能继续按普通内容样本处理。
      route: route 按资产绑定状态处理：缺绑定进入 source_gap，归属冲突进入 decision_required，敏感授权进入 founder_review，生产化误导或禁止请求进入 excluded。
      ledger_target: 账本目标记录资产名称、候选用途、冲突目标、缺少的授权和可再进入条件。它只服务治理路径，不把资产本身当作已完成知识或已发布素材。
      block_or_split: multi_asset_conflict 必须先 block_or_split：如果一个片段同时像内容方法、执行资产和控制规则，就拆成独立候选；不能拆时保持阻断，直到所有者明确。
      reentry_condition: 再进入条件包括目标所有者确认、资产边界写清、非生产封印存在、来源状态明确。任一条件缺失，片段只能停留在对应路径。
      forbidden_transition: 禁止把未绑定资产直接转成生产材料，禁止把多目标冲突压成一个泛化结论，禁止省略非生产封印后继续流转。
