    capsule_paraphrase_only: false
    epistemic_text_consistency: true
  - draft_id: SEM-V4_6-DISPLAY-TO-CONTENT-001
    revision_of: SEM-V4_5-DISPLAY-TO-CONTENT-001
    compiler_id: display_execution.spatial_variant
    expected_body_shape: display_spatial_execution_body
    body_language: zh-CN
    compiler_sections:
      spatial_signal: 空间信号来自入口焦点、货架层级、模特朝向、同色陈列和人行距离。正文先判断观者站在哪里会看见什么，而不是从动作开始。空间信号改变的是镜头取位和内容角度。
      visual_focus: 视觉焦点只能选择一个主区域，例如入口正面的同色组合或中岛台的高低层次。焦点要说明为什么能被看到：对比、留白、距离或高度，而不是泛泛说画面好看。
      supporting_object_or_distance: 辅助对象包括旁边的挂架、模特手位、标识留白或相邻色块；距离说明观者从远看、中看、近看时信息如何变化。它们服务空间判断，不承担动作演示。
      capture_order: 拍摄顺序按空间层级推进：先远景建立区位，再中景锁定焦点，最后近景捕捉支持对象。每一步都说明要拍什么和为什么，避免把陈列观察写成普通清单。
      content_angle: 内容角度可落在“为什么这个位置先被看见”“同色组合如何形成入口”“距离变化如何改变注意点”。它不声称门店效果，也不写成完整发布稿。
      authorization_boundary: 授权边界只允许基于可见空间和拍摄条件进行内容构思。涉及人脸、真实门店数据、销售结果或内部陈列策略时，应停止并转入人工确认。
      multi_output_consumption: 'downstream_use: content_angle_selection 可选空间焦点、视觉路径或距离变化；review_focus 检查是否把空间信号误写成效果事实；execution_asset_hint 提示远中近景补拍。'
    section_order:
    - spatial_signal
    - visual_focus
    - supporting_object_or_distance
    - capture_order
    - content_angle
    - authorization_boundary
    - multi_output_consumption
    body_zh_chars: 404
    difference_claim:
      what_decision_changes: 先选空间焦点和取景层级。
      what_observable_material_changes: 关注入口、距离、货架、相邻对象。
      what_transfer_logic_changes: 把空间信号转成内容角度。
      what_failure_mode_changes: 缺空间层级时退回拍摄提示。
      what_downstream_use_changes: 用于空间取景和内容角度选择。
    sidecar_leak_into_rich_body: false
    exact_section_reuse_with_other_cards: false
    capsule_paraphrase_only: false
    epistemic_text_consistency: true
  - draft_id: SEM-V4_6-DISPLAY-TO-CONTENT-002
    revision_of: SEM-V4_5-DISPLAY-TO-CONTENT-002
    compiler_id: display_execution.temporal_variant
    expected_body_shape: display_temporal_execution_body
    body_language: zh-CN
    compiler_sections:
      action_trigger: 动作触发来自拿起、展开、旋转、靠近镜面、停顿解释等事件。正文先判断哪个动作启动内容段落，而不是先看空间位置。触发点必须能在片段里被观察到。
      before_after_change: 前后变化记录动作前的状态和动作后的可见差异，例如衣摆从垂放到展开、内层从遮挡到露出、搭配从平面到上身对照。变化越清楚，解释槽位越稳定。
      explanation_slot: 解释槽位只说明动作改变了哪个可见关系：露出层次、改变垂坠、显示开合、说明搭配顺序。它不承诺效果，也不把导购话术写成最终成稿。
      completion_marker: 完成标记是动作停住、对象回到画面中心、对照关系被看清或解释语句结束。没有完成标记时，片段只能作为素材采集，不宜转成完整演示。
      content_rhythm: 节奏按触发、变化、解释、停顿四步排列。它和空间卡不同，重点在时间顺序和动作节点；如果只有静态陈列，就不使用这个编译器。
      authorization_boundary: 授权边界要求动作不涉及隐私、真实人物身份或内部销售结论。若动作需要额外许可或来源说明，应转为人工确认，不在正文里补事实。
      multi_output_consumption: 'downstream_use: content_angle_selection 可选择动作演示、前后变化或解释槽位；review_focus 检查完成标记是否存在；execution_asset_hint 提示补采触发前后和停顿点。'
    section_order:
    - action_trigger
    - before_after_change
    - explanation_slot
    - completion_marker
    - content_rhythm
    - authorization_boundary
    - multi_output_consumption
    body_zh_chars: 377
    difference_claim:
      what_decision_changes: 先确认动作触发和完成标记。
