semantic_pilot_v4_6_complete_rich_bodies:
  items:
  - draft_id: SEM-V4_6-CONTENT-METHOD-001
    revision_of: SEM-V4_5-CONTENT-METHOD-001
    compiler_id: content_story_method
    expected_body_shape: story_arc_body
    body_language: zh-CN
    compiler_sections:
      evidence_strength: 先估计素材能承载的证据强度：一张静态图只能支持可见细节和当下动作，一组连续片段才可能支持选择过程，只有外部来源才能支持结果型结论。强度判断改变的是叙事入口，而不是把薄弱材料包装得更完整。
      story_problem_type: 故事问题从“为什么这个细节值得被看见”开始，而不是从人物动机或受众反应开始。它要求先确认材料属于瞬间观察、选择过程还是价值取舍，再决定是提出问题、展开过程，还是只保留开放观察。
      allowable_arc: 可用弧线有三类：瞬间观察弧只呈现一个可见细节；选择过程弧展示取舍顺序；价值表达弧说明细节如何服务审美或角色。每个弧线都必须和证据强度绑定，证据不足时不能补因果。
      value_expression: 价值表达只落在方法层，例如“让细节先说话”“把取舍暴露出来”“让留白保留判断空间”。它不把情绪词写成真实反馈，也不声称观众已经产生某种反应。
      downgrade_path: 当素材只有衣物边线、袖口折痕或光线停顿时，正文应降级为观察问题；当素材出现拿取、比较、放回等连续动作时，才进入选择过程。缺少来源的结果句必须回到素材采集提示。
      micro_scene_contrast: 微场景对比是“同一件衣物被举起时看见边线”与“直接说它有故事感”的差别。前者让可见细节形成故事问题，后者只给空泛评价，无法指导下一步内容角度。
      downstream_use: 'downstream_use: content_angle_selection 可选择瞬间观察、选择过程或价值表达；review_focus 检查弧线是否越过证据强度；execution_asset_hint 只提示需要补采连续动作或细节特写。'
    section_order:
    - evidence_strength
    - story_problem_type
    - allowable_arc
    - value_expression
    - downgrade_path
    - micro_scene_contrast
    - downstream_use
    body_zh_chars: 478
    difference_claim:
      what_decision_changes: 先判证据强度，再选故事问题类型。
      what_observable_material_changes: 关注衣物细节和动作连续性，而不是空间位置。
      what_transfer_logic_changes: 由强度绑定弧线，不由锚点编排决定节奏。
      what_failure_mode_changes: 证据弱时降级为观察问题。
      what_downstream_use_changes: 用于内容角度选择和补采提示。
    sidecar_leak_into_rich_body: false
    exact_section_reuse_with_other_cards: false
    capsule_paraphrase_only: false
    epistemic_text_consistency: true
  - draft_id: SEM-V4_6-CONTENT-METHOD-002
    revision_of: SEM-V4_5-CONTENT-METHOD-002
    compiler_id: anchor_composition_method
    expected_body_shape: anchor_composition_body
    body_language: zh-CN
    compiler_sections:
      object_action_relation_time_space: 正文先列出对象、动作、关系、时间和空间：对象是衣物、衣架、手部或镜面；动作是靠近、抬起、摊开、转向；关系是遮挡、并列、前后；时间是动作前后；空间是桌面、挂杆或镜前位置。
      primary_anchor: 主锚点只能从最稳定的对象动作组合中选出，例如“手把衣摆抬起露出内层边线”。锚点决定观察顺序，不决定故事弧线；它回答“先看哪里”，不是回答“为什么感动”。
      constraint: 约束来自画面限制和材料限制：光线不足、动作太快、对象被遮挡、关系只出现一瞬。约束被记录后，正文才知道哪些内容角度不能展开，哪些只适合做短提示。
      sequencing: 编排顺序按锚点稳定度排列：先给对象位置，再给动作变化，再给关系变化，最后给可被提问的细节。这个顺序帮助创作避免模板化开头，也避免把缺失动作当作连续过程。
      content_rhythm: 节奏来自观察切换：慢看对象，短停动作，快速说明关系，再留一个问题。它和故事弧线不同，不讨论价值取舍，只让素材从杂乱画面变成可采集、可解释的观察段。
      anti_template_failure: 失败信号是只有“高级、松弛、氛围”这类形容词，没有对象动作关系，或把单个锚点硬套成完整故事。此时应返回锚点采集，而不是继续扩写。
      downstream_use: 'downstream_use: content_angle_selection 选择锚点观察或动作顺序；review_focus 检查对象动作关系是否齐全；execution_asset_hint 提示补拍对象位置、动作前后和关系变化。'
    section_order:
    - object_action_relation_time_space
    - primary_anchor
    - constraint
    - sequencing
    - content_rhythm
    - anti_template_failure
    - downstream_use
    body_zh_chars: 422
    difference_claim:
      what_decision_changes: 先选主锚点和观察顺序。
      what_observable_material_changes: 关注对象、动作、关系、时间、空间五元。
      what_transfer_logic_changes: 由锚点稳定度生成内容节奏。
      what_failure_mode_changes: 缺锚点时回到采集，不进入故事弧线。
      what_downstream_use_changes: 用于执行资产提示和观察顺序。
    sidecar_leak_into_rich_body: false
