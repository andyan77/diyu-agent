    canonical_body_zh: 'action_trigger: 动作触发来自拿起、展开、旋转、靠近镜面、停顿解释等事件。正文先判断哪个动作启动内容段落，而不是先看空间位置。触发点必须能在片段里被观察到。

      before_after_change: 前后变化记录动作前的状态和动作后的可见差异，例如衣摆从垂放到展开、内层从遮挡到露出、搭配从平面到上身对照。变化越清楚，解释槽位越稳定。

      explanation_slot: 解释槽位只说明动作改变了哪个可见关系：露出层次、改变垂坠、显示开合、说明搭配顺序。它不承诺效果，也不把导购话术写成最终成稿。

      completion_marker: 完成标记是动作停住、对象回到画面中心、对照关系被看清或解释语句结束。没有完成标记时，片段只能作为素材采集，不宜转成完整演示。

      content_rhythm: 节奏按触发、变化、解释、停顿四步排列。它和空间卡不同，重点在时间顺序和动作节点；如果只有静态陈列，就不使用这个编译器。

      authorization_boundary: 授权边界要求动作不涉及隐私、真实人物身份或内部销售结论。若动作需要额外许可或来源说明，应转为人工确认，不在正文里补事实。

