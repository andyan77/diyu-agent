      forbidden_transition: 禁止把未绑定资产直接转成生产材料，禁止把多目标冲突压成一个泛化结论，禁止省略非生产封印后继续流转。

      false_generation_prevention: downstream_use: review_focus 检查所有者、封印和冲突路径；execution_asset_hint 只列出需要补齐的绑定信息；content_angle_selection 不处理资产归属。'
