    canonical_body_zh: 'trigger: 触发条件是候选片段出现缺少来源、建模冲突、风险敏感或禁止输出请求。正文先识别触发类型，再决定进入 source_gap、decision_required、founder_review
      或 excluded。

      route: route 只描述四条处理路径：source_gap 用于缺来源；decision_required 用于结构冲突；founder_review 用于需要创始人裁决的敏感项；excluded 用于禁止输出或越权请求。

      ledger_target: 账本目标按路径确定：缺来源记录补源线索，结构冲突记录待决事项，敏感项记录裁决请求，禁止项记录排除原因。正文不把这些记录说成领域知识。

      block_or_split: 当一个输入同时像来源缺口、待决事项和执行资产时，先触发 block_or_split。能拆清楚归属就分流；拆不清楚就阻断，并保留需要人工决定的原因。

      reentry_condition: 再进入条件必须明确：source_gap 需要来源补足，decision_required 需要结构裁决，founder_review 需要授权，excluded 通常不得再进入。

      forbidden_transition: 禁止从缺来源或敏感项直接进入正式落地，也禁止把排除项改写成安全表达后继续流转。带出处、待审、人审未完成且无正式资格的草案可以保留，但必须停在草案状态。

      false_generation_prevention: 下游消费限定为 route_decision、generation_contract_guard、source_gap_or_decision_ledger_write 与
      reentry_validation；不得转成内容角度、执行提示或创意价值块。待审草案不等于正式落地。'
