    artifact_kind: general_knowledge_candidate
    canonical_body_zh: 'object_action_relation_time_space: 正文先列对象、动作、关系、时间和空间：对象是衣物、衣架、手部或镜面；动作是靠近、抬起、摊开、转向；关系是遮挡、并列、前后；时间是动作前后；空间是桌面、挂杆或镜前位置。

      primary_anchor: 主锚点从最稳定的对象动作组合中选出，例如手把衣摆抬起露出内层边线。锚点决定先看哪里，不回答为什么感动，也不替代故事弧线。

      constraint: 约束来自画面和材料限制：光线不足、动作太快、对象被遮挡、关系只出现一瞬。记录约束后，才知道哪些角度不能展开，哪些只能做短提示。

      sequencing: 编排顺序按锚点稳定度排列：先给对象位置，再给动作变化，再给关系变化，最后给可提问的细节。顺序帮助创作避免模板开头，也避免把缺失动作当作过程。

      content_rhythm: 节奏来自观察切换：慢看对象，短停动作，快速说明关系，再留问题。它不讨论价值取舍，只让杂乱画面变成可采集、可解释的观察段。

      anti_template_failure: 失败信号是只有高级、松弛、氛围等形容词，没有对象动作关系，或把单个锚点硬套成完整故事。此时返回锚点采集。

      downstream_use: 用于选择锚点观察、动作顺序或关系拆解；复核五个采集槽是否齐全；提示补拍对象位置、动作前后和关系变化。'
