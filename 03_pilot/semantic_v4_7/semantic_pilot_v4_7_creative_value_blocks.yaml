semantic_pilot_v4_7_creative_value_blocks:
  items:
  - draft_id: SEM-V4_7-CONTENT-METHOD-001
    compiler_id: content_story_method
    creative_value_dimensions:
      sensory_or_visual_anchor: 衣物被拿起、摊开、悬挂、靠近光线时出现的褶皱、厚薄和边线。
      aesthetic_tension: 想讲完整故事与证据只够讲一个瞬间之间的取舍。
      emotional_or_human_motive: 选择、犹豫和克制，而不是把素材包装成宏大故事。
      cross_domain_transfer: 从素材事实转译为内容角度、导购提问和视觉段落。
      generative_option_space: 瞬间观察、选择过程、价值表达三类方向。
      audience_cognition_shift: 先看见细节，再理解这个细节为什么足以开启一个问题。
    generative_options:
    - 瞬间观察
    - 选择过程
    - 价值表达
    creative_transfer_points_to_observable_material: true
    audience_cognition_shift_is_specific: true
    safe_alternative_performance_claim: false
    real_instance_fact_leak: false
    direct_publish_script: false
  - draft_id: SEM-V4_7-CONTENT-METHOD-002
    compiler_id: anchor_composition_method
    creative_value_dimensions:
      sensory_or_visual_anchor: 下摆塞入、袖口翻折、裤脚停在鞋面上方、挂通间距和手势方向。
      aesthetic_tension: 利落与松弛、前景与背景、粗糙材质与柔软印象之间的对比。
      emotional_or_human_motive: 照顾穿着者的犹豫、行动速度和想被轻轻理解的状态。
      cross_domain_transfer: 把陈列动作、服装结构和角色语气转译为内容节奏和讲解顺序。
      generative_option_space: 对象拆解、动作拆解、关系拆解三类方向。
      audience_cognition_shift: 先看见动作和对象，再理解风格来自可复用的取舍关系。
    generative_options:
    - 对象拆解
    - 动作拆解
    - 关系拆解
    creative_transfer_points_to_observable_material: true
    audience_cognition_shift_is_specific: true
    safe_alternative_performance_claim: false
    real_instance_fact_leak: false
    direct_publish_script: false
  - draft_id: SEM-V4_7-APPAREL-CLAIM-BOUNDARY-001
    compiler_id: claim_boundary
    creative_value_dimensions:
      audience_cognition_shift: 从效果承诺转向可观察关系和安全表达选择。
      generative_option_space: 安全替代表达至少五类。
    safe_creative_alternatives:
    - 线条停顿
    - 重心分界
    - 外套开合
    - 内搭露出比例
    - 轮廓遮挡关系
    safe_alternative_performance_claim: false
    creative_transfer_points_to_observable_material: true
    audience_cognition_shift_is_specific: true
    real_instance_fact_leak: false
    direct_publish_script: false
  - draft_id: SEM-V4_7-APPAREL-CLAIM-BOUNDARY-002
    compiler_id: claim_boundary
    creative_value_dimensions:
      audience_cognition_shift: 从体感和性能承诺转向可见结构、条件场景和来源任务。
      generative_option_space: 安全替代表达至少五类。
    safe_creative_alternatives:
    - 表面纹理
    - 接触面可见结构
    - 动作后衣摆形态
    - 留量形成的画面从容
    - 皱褶干扰减少的视觉关系
    safe_alternative_performance_claim: false
    creative_transfer_points_to_observable_material: true
    audience_cognition_shift_is_specific: true
    real_instance_fact_leak: false
    direct_publish_script: false
  - draft_id: SEM-V4_7-DISPLAY-TO-CONTENT-001
    compiler_id: display_execution.spatial_variant
    creative_value_dimensions:
      sensory_or_visual_anchor: 入口区、中岛、端架、挂通的高低、前后、明暗和材质对比。
      aesthetic_tension: 主搭与陪体的距离、亮面与哑面、密集与留白之间的节奏。
      emotional_or_human_motive: 让经过的人先被一个安静焦点照顾，而不是同时接收所有信息。
      cross_domain_transfer: 把空间关系转成短视频开场、笔记结构、导购讲解卡和训练观察题。
      generative_option_space: 远景引入、近景细节、导购解释、训练观察四种方向。
      audience_cognition_shift: 先停在视觉焦点，再理解陈列如何引向某个轮廓或材质。
    generative_options:
    - 远景引入
    - 近景细节
    - 导购解释
    - 训练观察
    creative_transfer_points_to_observable_material: true
    audience_cognition_shift_is_specific: true
    safe_alternative_performance_claim: false
    real_instance_fact_leak: false
    direct_publish_script: false
  - draft_id: SEM-V4_7-DISPLAY-TO-CONTENT-002
    compiler_id: display_execution.temporal_variant
    creative_value_dimensions:
      sensory_or_visual_anchor: 手把衣物拉平、两件衣物并排、转身递示、停顿等待。
      aesthetic_tension: 动作前后的差异、手部速度、衣物软硬和空间远近变化。
      emotional_or_human_motive: 照顾选择犹豫，降低信息压力，把复杂款式变成可慢慢看见的片段。
      cross_domain_transfer: 把服务动作转为内容片段、讲解卡、训练观察题和视觉节奏。
      generative_option_space: 动作解释、对比片段、等待片段、训练追问四种方向。
      audience_cognition_shift: 先看见一个动作，再理解动作背后的选择逻辑和被照顾感。
    generative_options:
    - 动作解释
    - 对比片段
    - 等待片段
    - 训练追问
    creative_transfer_points_to_observable_material: true
    audience_cognition_shift_is_specific: true
    safe_alternative_performance_claim: false
    real_instance_fact_leak: false
    direct_publish_script: false
