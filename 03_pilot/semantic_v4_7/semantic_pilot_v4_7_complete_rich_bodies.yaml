  - draft_id: SEM-V4_7-CONTROL-PLANE-GOVERNANCE-002
    revision_of: SEM-V4_6-CONTROL-PLANE-GOVERNANCE-002
    compiler_id: control_plane
    expected_body_shape: control_plane_route_body
    body_language: zh-CN
    compiler_sections:
      trigger: 触发条件是研究资产缺来源路径、owner 不明、用途边界不清或非生产封印缺失。正文先检查这些字段，而不是补写成领域观点。
      route: route 可进入 governance_outbox_write、prohibited_transition_block 或 reentry_validation。它描述资产绑定状态，不描述内容创作角度。
      ledger_target: 账本目标记录 source path digest、owner、用途边界、review_only 标签和缺口原因。记录用于后续复核，不构成正式资产。
      block_or_split: 当研究资产同时像来源、执行资产和控制项时，先拆分角色；无法拆分时保持待审，并记录阻断原因。
      reentry_condition: 再进入条件是来源路径、owner、用途边界和非生产封印都补齐，并完成复核。缺任一项都不能移动到正式链路。
      forbidden_transition: 禁止把待审绑定候选直接转为正式资产，也禁止把缺 owner 的素材当作可用证据。带来源线索但未完成人审的草案可以保留在待审状态。
      false_generation_prevention: 下游消费限定为 governance_outbox_write、prohibited_transition_block 与 reentry_validation；不得写成内容角度、执行提示或创意价值块。待审草案不具备正式落地资格。
    section_order:
    - trigger
    - route
    - ledger_target
