  items:
  - draft_id: SEM-V4_7-CONTENT-METHOD-001
    revision_of: SEM-V4_6-CONTENT-METHOD-001
    compiler_id: content_story_method
    expected_body_shape: story_arc_body
    body_language: zh-CN
    compiler_sections:
      evidence_strength: 先估计素材能承载的证据强度：静态画面只支持可见细节和当下动作，连续片段才支持选择过程，外部来源才支持结果型结论。强度判断决定叙事入口，不把薄弱材料包装成完整因果。
      story_problem_type: 故事问题从“这个细节为什么值得被看见”开始。它先区分瞬间观察、选择过程和价值取舍，再决定提出问题、展开顺序或保留开放观察。
      allowable_arc: 可用弧线包括瞬间观察、选择过程和价值表达。瞬间观察只呈现可见细节；选择过程展示取舍顺序；价值表达说明细节如何服务审美或角色。
      value_expression: 价值表达落在方法层，例如让细节先说话、把取舍暴露出来、让留白保留判断空间。它不把情绪词写成真实反馈，也不声称观众已经发生某种反应。
      downgrade_path: 素材只有边线、袖口折痕或光线停顿时，降级为观察问题；素材出现拿取、比较、放回等连续动作时，才进入过程弧线。结果句缺来源时回到补采提示。
      micro_scene_contrast: “衣物被举起时露出内层边线”能形成一个故事问题；“它很有故事感”只是评价。前者指向可见细节，后者无法指导下一步采集。
      downstream_use: 用于选择瞬间观察、选择过程或价值表达；复核弧线是否越过证据强度；提示补采连续动作、细节特写或外部来源。
    section_order:
    - evidence_strength
    - story_problem_type
    - allowable_arc
    - value_expression
    - downgrade_path
    - micro_scene_contrast
    - downstream_use
