  - draft_id: SEM-V4_7-DISPLAY-TO-CONTENT-001
    revision_of: SEM-V4_6-DISPLAY-TO-CONTENT-001
    compiler_id: display_execution.spatial_variant
    expected_body_shape: display_spatial_execution_body
    body_language: zh-CN
    compiler_sections:
      spatial_signal: 空间信号来自入口焦点、货架层级、模特朝向、同色陈列和人行距离。正文先判断观者站在哪里会看见什么，而不是从动作开始。
      visual_focus: 视觉焦点只能选择一个主区域，例如入口正面的同色组合或中岛台高低层次。焦点要说明为什么能被看到：对比、留白、距离或高度，而不是泛泛说画面好看。
      supporting_object_or_distance: 辅助对象包括旁边挂架、模特手位、标识留白或相邻色块；距离说明远看、中看、近看时信息如何变化。它们服务空间判断，不承担动作演示。
      capture_order: 拍摄顺序按空间层级推进：先远景建立区位，再中景锁定焦点，最后近景捕捉支持对象。每一步说明要拍什么和为什么。
      content_angle: 内容角度可落在为什么这个位置先被看见、同色组合如何形成入口、距离变化如何改变注意点。它不声称门店效果，也不写成完整发布稿。
      authorization_boundary: 授权边界只允许基于可见空间和拍摄条件进行内容构思。涉及人脸、真实门店数据、销售结果或内部陈列策略时，停止并转人工确认。
      multi_output_consumption: 用于选择空间焦点、视觉路径或距离变化；复核是否把空间信号误写成效果事实；提示远景、中景和近景补拍。
    section_order:
    - spatial_signal
    - visual_focus
    - supporting_object_or_distance
    - capture_order
    - content_angle
    - authorization_boundary
    - multi_output_consumption
