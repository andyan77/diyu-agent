  - draft_id: SEM-V4_7-APPAREL-CLAIM-BOUNDARY-002
    revision_of: SEM-V4_6-APPAREL-CLAIM-BOUNDARY-002
    compiler_id: claim_boundary
    expected_body_shape: claim_boundary_body
    body_language: zh-CN
    compiler_sections:
      expression_layer: 舒适和耐用品质表达按可见结构、条件体验、性能主张、保证句分层。可见结构包括缝线走向、接触面结构、松紧部位形态和动作后衣摆变化；舒适、透气、抗皱不能直接放进观察层。
      allowed_expression: 允许写“接触面的可见结构更平整”“动作后衣摆的形态变化更清楚”“缝线位置减少了画面杂乱”。这些表达说明画面中可看见的结构，不声称真实体感或耐久结果。
      conditional_expression: 条件体验可以写“在短时走动场景中，穿着者可能更注意到接触面是否顺滑”。它保留短时、场景、可能、主观感受等限制，不能改写为长期性能。
      source_workorder: 透气、抗皱、耐穿、回弹和持久舒适都需要来源任务。正文记录需要哪类测试口径或外部说明，而不是用创意替代路径软化性能句。
      prohibited_expression: 禁止写“保证舒适”“长期不变形”“活动多久都不勒”。这些话承诺真实效果和持续时间，缺少来源时不能进入正文表达。
      safe_creative_alternative: 安全替代可写成“动作后衣摆线条仍清楚”“接触面结构在画面里更容易辨认”“搭配中减少皱褶干扰”“留量让画面动作更从容”“表面纹理给人轻缓印象”。
      epistemic_warning: 触感、活动感、贴肤感不属于 direct_observation；如果正文把它们标成直接观察，就是认识论冲突。性能词只能进入 source_required_performance_claim，保证词进入
        prohibited_guarantee。
    section_order:
    - expression_layer
    - allowed_expression
    - conditional_expression
    - source_workorder
    - prohibited_expression
    - safe_creative_alternative
    - epistemic_warning
