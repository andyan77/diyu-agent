  - draft_id: SEM-V4_7-APPAREL-CLAIM-BOUNDARY-001
    revision_of: SEM-V4_6-APPAREL-CLAIM-BOUNDARY-001
    compiler_id: claim_boundary
    expected_body_shape: claim_boundary_body
    body_language: zh-CN
    compiler_sections:
      expression_layer: 身材效果表达先拆成画面观察、条件体验、需来源支持的结果主张和禁用保证。画面观察只处理比例线、分界、遮挡和轮廓关系，不能推出真实身体变化。
      allowed_expression: 允许写“画面中的上下比例关系更清楚”“内外层分界更容易被看见”“衣摆位置让重心显得更明确”。这些句子指向可见关系，不把身体结果当作事实。
      conditional_expression: 条件体验必须带场景条件，例如“在上短下长搭配中，穿着者可能更容易注意到腰线分界”。这里表达的是穿搭语境下的主观感受，必须保留可能性。
      source_workorder: 显瘦、显高、体感改善等结果语言应转成补源任务，需要规则来源、样本条件或测量口径。没有来源时，只保留可见线条和搭配条件。
      prohibited_expression: 禁止写“谁穿都显瘦”“保证拉长比例”“一定显高”。这些保证越过观察层和条件体验层，会把审美表达伪装成身体效果。
      safe_creative_alternative: 安全替代表达围绕线条停顿、重心分界、外套开合、内搭露出、轮廓遮挡展开。它保留审美方向，把承诺改成画面关系和搭配条件。
      epistemic_warning: 触感、贴肤感和活动感不能标为 direct_observation；它们最多是 conditional_experience_expression。显瘦、耐穿、持久舒适等属于 source_required_performance_claim；保证性词组直接阻断。
    section_order:
    - expression_layer
    - allowed_expression
    - conditional_expression
    - source_workorder
    - prohibited_expression
    - safe_creative_alternative
    - epistemic_warning
