    artifact_kind: decision_packet
    canonical_body_zh: 'decision_question：决策问题是：这份研究材料能否只作为非生产用途绑定到指定槽位，还是必须拆分、暂存或拒绝绑定。


      options：选项包括允许绑定、补齐槽位后绑定、拆分冲突材料、维持研究状态、拒绝进入后续用途。


      decision_owner：决策责任方是知识生成治理侧，不是内容撰写者或运行系统。内容人员只能提供材料说明，不能替代绑定决策。


      impacted_contract_or_layer：受影响层包括生成契约、研究资产清单、决策记录和后续资格判断；它不直接改写通用知识库。


      default_safe_action：默认安全动作是维持研究状态并阻止成品化使用，直到槽位、用途和冲突关系被明确记录。


      unresolved_inputs：未解决输入包括材料来源、用途范围、绑定排他条件、与其他资产的冲突关系。


      next_review_condition：下一次判断条件是来源补齐、用途收窄、冲突拆分或负责人给出明确选择。'
