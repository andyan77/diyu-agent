    pilot_category: content_method
    canonical_cluster_id: mkc_009
    canonical_cluster_title_from_authority: 故事弧线适用边界
    canonical_label_zh: 故事弧线选择边界的任务判定知识
    candidate_topic: 根据问题类型、证据强度和价值表达选择故事弧线
    type_specific_body_shape: general_knowledge
    artifact_kind: general_knowledge_candidate
    canonical_body_zh: 'definition：故事弧线选择边界是一套任务判定知识，用来决定内容应该解释过程、呈现变化、说明取舍，还是只保留事实清单。它不提供脚本句式，而是先识别问题类型，再判断证据强度能否支撑某种叙事弧线。


      differentiation_mechanism：使用这个知识簇后，系统会把为什么这样做、发生了什么变化、这个选择带来什么代价拆成不同弧线入口。不使用时，系统容易把所有内容都写成情绪化故事，导致证据很弱的材料被包装成完整叙事。


      applicable_conditions：适用条件包括：素材包含明确过程、选择理由、阶段变化或能力说明；表达目标需要把事件顺序和证据强度绑定；操作者能说明哪一种价值表达不会越过事实边界。


      not_applicable_conditions：不适用条件包括：只有单个口号、单张氛围图、无法验证的结果承诺，或任务本身只需要列出款式、颜色、区位等事实。此时继续套故事弧线会制造不存在的因果。


      positive_example_minimum：最低正例是：导购说明一个新品系列为何先讲材质再讲搭配，因为材质差异有观察依据，搭配建议只是使用场景，二者不能反过来写成性能结论。


      negative_example_minimum：最低反例是：看到一组陈列图就写成品牌成长故事，既没有过程证据，也没有人物或组织动作，最后只剩抽象情绪。


      observable_apparel_or_retail_anchor：可观察锚点可以是面料处理顺序、版型取舍、陈列动线、系列主题信息层级，或门店人员讲解时先后出现的证据材料。


      downstream_consumption_effect：下游使用时，内容说明会先选择问题类型，再选择弧线强度；若证据不足，则转成说明清单或补源任务，避免把弱材料推进成完整故事。'
