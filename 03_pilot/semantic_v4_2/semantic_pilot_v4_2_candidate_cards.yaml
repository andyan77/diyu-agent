      spatial_or_temporal_logic：时间逻辑是动作先于解释：先出现动作开始，再进入解释节点，随后镜头跟随变化，最后用完成状态收束。


      ordered_steps：步骤一记录动作起点，步骤二标注动作改变了什么，步骤三给出一句解释，步骤四确认动作是否产生可见完成状态。


      observable_completion_condition：完成条件是观看者能复述动作顺序，并理解每个动作对应的商品信息。


      failure_or_stop_condition：停止条件是只有口播没有动作，或动作很多但没有解释槽位，导致演示不可复用。


      shot_or_action_slot_mapping：槽位映射为：开始镜头看动作起点，跟随镜头看变化，中段解释说明原因，收束镜头确认结果。


      downstream_output_asset_shape：下游产物是动作演示提示卡，包含动作、解释、镜头跟随和完成判断四列。'
