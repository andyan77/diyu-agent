    pilot_category: apparel_claim_boundary
    canonical_cluster_id: mkc_026
    canonical_cluster_title_from_authority: 身材效果语言阶梯与场景化观察
    canonical_label_zh: 身材效果表达的观察词阶梯
    candidate_topic: 把视觉线条观察和身体结果承诺分开处理
    type_specific_body_shape: claim_boundary
    artifact_kind: general_knowledge_candidate
    canonical_body_zh: 'claim_type_ladder：语言阶梯从低到高依次是观察词、关系词、结果词和身体承诺词。观察词描述可见状态，例如腰线更清楚；关系词描述搭配关系，例如上短下长形成比例；结果词暗示效果，例如显瘦；身体承诺词声称身体改变，必须禁用。


      allowed_expression_examples：允许表达包括腰线位置更明确、裤管垂坠让腿部线条更顺、外套开穿时内搭比例更清楚。这些句子只描述视觉关系和穿搭条件。


      restricted_expression_examples：受限表达包括显高、显瘦、修饰身形。若必须使用，只能放在场景化观察中，并说明来自版型、长度、颜色或搭配关系，不能写成确定结果。


      prohibited_expression_examples：禁止表达包括保证瘦十斤、改变身材比例、穿上就瘦腿。这些句子把穿搭观察变成身体结果承诺。


      minimum_contrast_examples：最小对比是：腰线更清楚可以保留；让腰变细必须删除；视觉上更利落需要补充具体条件。


      evidence_threshold_by_claim_strength：观察词只需要图片或试穿场景；关系词需要搭配条件；结果词需要风险标记和改写；身体承诺词即使有单次反馈也不能进入正文。


      source_gap_route：当句子需要证明身体结果、长期效果或顾客普遍感受时，应进入补源路径，而不是用内容经验补足。


      downgrade_expression_rule：降级规则是把结果词改成观察词，把保证句改成条件句，把身体改变改成服装结构或搭配关系。'
