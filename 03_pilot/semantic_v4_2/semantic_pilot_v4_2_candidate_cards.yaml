    canonical_cluster_title_from_authority: 反模板叙事锚点
    canonical_label_zh: 反模板叙事的对象锚点知识
    candidate_topic: 用对象、动作、约束和流程节点组织非套话内容
    type_specific_body_shape: general_knowledge
    artifact_kind: general_knowledge_candidate
    canonical_body_zh: 'definition：反模板叙事锚点是一套内容组织知识，用来把抽象风格描述拉回具体对象。它要求先找到被说明的衣物、动作、约束或流程节点，再围绕这些锚点建立句子顺序。


      differentiation_mechanism：使用这个知识簇后，系统会把高级、松弛、适合日常拆成可见对象、处理动作和取舍关系。不使用时，内容会重复流行形容词，无法说明为什么这件衣服或这个陈列值得被讲。


      applicable_conditions：适用于对象清楚、动作可见、约束明确的内容任务，例如讲领口处理、裤管长度、挂通调整、搭配取舍或门店流程节点。


      not_applicable_conditions：不适用于完全没有对象和动作的口号，也不适用于需要硬事实证明的品质主张。若任务只给出价值词，必须先补充对象材料。


      positive_example_minimum：最低正例是：用衬衫下摆如何塞进半裙解释比例变化，而不是只说显得利落。对象是衬衫和半裙，动作是塞入，约束是腰线位置。


      negative_example_minimum：最低反例是：把所有图文都写成自在、松弛、有氛围，没有对象、动作和取舍，读者无法复用。


      observable_apparel_or_retail_anchor：锚点可以来自袖口翻折、鞋包呼应、试衣动作、叠搭层次、陈列焦点或导购手势。


      downstream_consumption_effect：下游会把内容说明转成锚点清单，先要求对象和动作，再生成表达；缺少锚点时不得进入正文扩写。'
