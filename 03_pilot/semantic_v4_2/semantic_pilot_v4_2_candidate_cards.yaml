    candidate_topic: 按缺源、冲突、风险和禁出请求把异常项分发到不同处理路径
    type_specific_body_shape: control_plane
    artifact_kind: control_plane_candidate
    canonical_body_zh: 'trigger_condition：触发条件包括缺少来源、建模冲突、风险敏感和禁止输出请求。每一种触发都对应不同状态，而不是同一个备注字段。


      state_transition：状态转移为：缺源进入 source_gap，冲突进入 decision_required，风险进入 human_review，禁出进入
      excluded。


      route_target：路由目标分别是补源队列、决策记录、人工判断队列和排除清单。路由目标只记录状态，不生成领域正文。


      ledger_write：账本写入必须包含触发原因、当前状态、禁止动作和重新进入条件，避免异常项在后续任务里失踪。


      reentry_condition：重新进入条件是来源补齐、决策完成、风险解除或请求改写为允许范围。


      prohibited_transition：禁止从 excluded 直接进入生成，也禁止从 source_gap 直接变成已接受知识。


      fail_closed_default：默认动作是停在当前状态并等待明确条件，不用经验判断替代缺失来源或风险决策。'
