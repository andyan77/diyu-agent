    canonical_cluster_title_from_authority: 陈列区位与可拍摄视觉锚点
    canonical_label_zh: 陈列区位到镜头观察的空间执行卡
    candidate_topic: 把零售区位转换为可拍摄的观察入口和画面重心
    type_specific_body_shape: execution_asset
    artifact_kind: execution_asset_outbox_candidate
    canonical_body_zh: 'input_signal：输入信号是门店空间中的区位差异，例如入口区、中岛、端架、挂通或橱窗。每个区位都带着不同的顾客视线入口。


      spatial_or_temporal_logic：空间逻辑是区位先于镜头：入口区负责第一眼，中岛负责组合关系，端架负责重点推荐，挂通负责纵向层次。


      ordered_steps：步骤一确认区位，步骤二确定观察目标，步骤三选择远景、中景或近景，步骤四把镜头动作绑定到信息任务。


      observable_completion_condition：完成条件是镜头能让观看者知道看哪里、为什么看、看完后得到什么商品关系。


      failure_or_stop_condition：停止条件是画面只展示摆放位置，却没有商品关系、视觉重心或信息任务。


      shot_or_action_slot_mapping：镜头映射为：远景交代区位，中景展示组合，近景捕捉材质、层次或搭配细节。


      downstream_output_asset_shape：下游产物是空间拍摄提示卡，包含区位、观察目标、镜头动作和信息任务四列。'
