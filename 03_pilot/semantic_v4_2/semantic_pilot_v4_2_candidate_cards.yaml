    canonical_cluster_title_from_authority: 舒适性能耐用品质证据阶梯
    canonical_label_zh: 舒适耐用品质表达的证据阶梯
    candidate_topic: 按证据层级区分观察、经验说明和待补源主张
    type_specific_body_shape: claim_boundary
    artifact_kind: general_knowledge_candidate
    canonical_body_zh: 'claim_type_ladder：语言阶梯从低到高依次是触感观察、穿着体验、材料性能、测试结论和耐用承诺。触感观察可以来自现场感知；性能和耐用承诺必须有方法、标准或可追溯资料。


      allowed_expression_examples：允许表达包括手感偏柔、面料有一定回弹感、缝线排列较整齐。这些句子停留在观察或有限体验。


      restricted_expression_examples：受限表达包括久穿不变形、透气性好、耐磨。若没有测试或标准，只能改为适合观察回弹状态或需补充测试依据。


      prohibited_expression_examples：禁止表达包括永久不变形、医学级舒适、经过测试但无来源。这些句子把未证实材料写成硬事实。


      minimum_contrast_examples：最小对比是：面料摸起来更柔可以保留；长时间穿着绝不闷必须补源；耐穿需要拆成缝线、面料和护理条件。


      evidence_threshold_by_claim_strength：触感观察需要场景说明；体验判断需要使用条件；性能主张需要方法或标准；耐用结论需要测试或长期资料。


      source_gap_route：当证据无法支撑性能或耐用主张时，句子进入补源路径；若补源失败，就保留为观察，不得继续上升。


      downgrade_expression_rule：降级规则是把性能结论改成观察对象，把耐用承诺改成待验证条件，把泛化顾客反馈改成单次场景描述。'
