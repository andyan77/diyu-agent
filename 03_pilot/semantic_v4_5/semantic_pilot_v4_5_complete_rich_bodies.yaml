  - draft_id: SEM-V4_5-DISPLAY-TO-CONTENT-001
    revision_of: SEM-V4_4-DISPLAY-TO-CONTENT-001
    body_language: zh-CN
    min_body_zh_chars: 420
    body_zh_chars: 547
    required_sections:
      mechanism_chain: 陈列转内容卡把空间秩序、视线路径和动作段落翻译成内容角度，但不替代门店事实或发布成稿。核心机制是把陈列中的区位、光线、视线顺序和动作节点拆成可拍摄材料，再决定它们适合转成什么内容角度。陈列区位与可拍摄视觉锚点 的 W7 主题指向 入口区/中岛/端架/挂通等一般化区位表达、远景-中景-近景的观察切换、静态陈列中的可拍摄重点，因此正文必须说明从空间观察到内容槽位的转换，而不是只列拍摄清单。
      observable_material: 可观察材料包括入口焦点、挂架间距、模特朝向、同色组合、拿取动作、镜前停顿、转身展示和导购解释节点。这些材料只证明画面结构和动作顺序，不证明销售效果、受众偏好或门店表现。
      transfer_logic: 创意转译要把一个陈列点拆成多个输出：短视频可用动作段落，小红书笔记可用观察问题，导购话术卡可用解释顺序，培训观察提示可用检查对象和动作。每个输出都回到同一组可观察材料，而不是直接生成成稿。
      boundary_logic: 边界逻辑要求 relation hints 只描述设计提示，不成为 formal graph edge；美学张力只能来自空间秩序与人类动机的对照，不能被写成真实顾客反馈或门店数据。
      contrast_or_micro_scenario: 对照场景：合格写法会先指出一个具体材料，再解释它如何转成选择、观察或路由；失败写法只堆叠好看、松弛、有氛围等形容词，或者把条件经验写成确定结论。
      anti_pattern: 反模式包括：只复制胶囊标题、把 sidecar 的状态字段塞进正文、写成面向发布的完整成稿、虚构真实品牌或顾客反馈、把 relation hint 称为本体边。
      downstream_use: 下游可把这段正文拆给 brief、judge、训练观察提示或人工复核使用；它只说明如何审阅和生成下一轮样本，不改变任何后续资产状态。
    capsule_alignment:
      capsule_core_expanded_in_sections:
        capsule_question: mechanism_chain
        core_mechanism: mechanism_chain
        observable_material: observable_material
        creative_transfer: transfer_logic
        boundary_guardrail: boundary_logic
        failure_signal: anti_pattern
        downstream_effect: downstream_use
      rich_body_contradicts_capsule: false
      capsule_paraphrase_only: false
      observable_material_expanded_beyond_capsule: true
    sidecar_leak_into_rich_body: false
    direct_publish_script_leak: false
    real_instance_fact_leak: false
