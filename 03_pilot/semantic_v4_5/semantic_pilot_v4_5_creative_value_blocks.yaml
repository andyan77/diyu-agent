semantic_pilot_v4_5_creative_value_blocks:
  items:
  - draft_id: SEM-V4_5-CONTENT-METHOD-001
    creative_value_dimensions:
      sensory_or_visual_anchor: 用衣物被拿起、摊开、悬挂、靠近光线时出现的褶皱、厚薄和边线作为可观察锚点。
      aesthetic_tension: 张力来自“想讲完整故事”与“证据只够讲一个瞬间”的取舍，形成留白而不是强行补因果。
      emotional_or_human_motive: 人类动机是选择、犹豫和克制：为什么先保留一个小细节，而不是把素材包装成宏大故事。
      cross_domain_transfer: 从素材事实转译为内容角度、导购提问和视觉段落，而不是直接生成发布文案。
      generative_option_space: 可生成过程弧线、选择弧线、留白观察三类方向。
      audience_cognition_shift: 观众先看见细节，再理解为什么这个细节足以开启一个故事，而不是相信一个未经证明的结果。
    generative_options:
    - 过程弧线：从材料细节进入选择理由
    - 选择弧线：从取舍动作进入价值表达
    - 留白观察：只保留一个可见瞬间和一个开放问题
    creative_transfer_observable_material_ref: 衣物边线、袖口折痕、面料垂坠、手把衣架推回原位的动作、光线落在表面的停顿。
    capsule_ref: SEM-V4_5-CONTENT-METHOD-001
    rich_body_section_refs:
    - transfer_logic
    - contrast_or_micro_scenario
    - downstream_use
    generative_options_distinct_count: 3
    creative_transfer_points_to_observable_material: true
    audience_cognition_shift_is_specific: true
    pure_aesthetic_adjective_stack: false
    real_instance_fact_leak: false
    direct_publish_script: false
    safe_alternative_performance_claim: false
  - draft_id: SEM-V4_5-CONTENT-METHOD-002
    creative_value_dimensions:
      sensory_or_visual_anchor: 锚点来自下摆塞入、袖口翻折、裤脚停在鞋面上方、挂通间距和手势方向。
      aesthetic_tension: 张力来自利落与松弛、前景与背景、粗糙材质与柔软触感之间的对比。
      emotional_or_human_motive: 动机不是炫耀风格，而是照顾穿着者的犹豫、行动速度和想被轻轻理解的状态。
      cross_domain_transfer: 把陈列动作、服装结构和角色语气转译为内容节奏、讲解顺序和训练问题。
      generative_option_space: 可生成对象拆解、动作拆解、关系拆解三类方向。
      audience_cognition_shift: 观众先看见动作和对象，再理解风格不是形容词堆叠，而是可复用的取舍关系。
    generative_options:
    - 对象路径：从一件衣物的结构进入表达
    - 动作路径：从一个整理或试穿动作进入表达
    - 关系路径：从主次搭配和空间距离进入表达
    creative_transfer_observable_material_ref: 衬衫下摆、半裙腰线、鞋面距离、衣架排列、导购手势和顾客视线移动方向的通用观察。
    capsule_ref: SEM-V4_5-CONTENT-METHOD-002
    rich_body_section_refs:
    - transfer_logic
    - contrast_or_micro_scenario
    - downstream_use
    generative_options_distinct_count: 3
    creative_transfer_points_to_observable_material: true
    audience_cognition_shift_is_specific: true
    pure_aesthetic_adjective_stack: false
    real_instance_fact_leak: false
    direct_publish_script: false
    safe_alternative_performance_claim: false
  - draft_id: SEM-V4_5-APPAREL-CLAIM-BOUNDARY-001
    creative_value_dimensions:
      audience_cognition_shift: 观众从效果承诺转向可观察关系和安全表达选择。
      generative_option_space: 安全替代表达至少三类。
    generative_options:
    - 观察句：腰线位置更清楚
    - 条件体验句：在上短下长搭配中更容易感到比例被拉开
    - 审美方向句：让视觉重心更克制地停在上半身
    creative_transfer_observable_material_ref: 腰线位置、外套开合、裤管垂坠、内搭比例、上下装颜色分界。
    capsule_ref: SEM-V4_5-APPAREL-CLAIM-BOUNDARY-001
    rich_body_section_refs:
    - transfer_logic
    - contrast_or_micro_scenario
    - downstream_use
    generative_options_distinct_count: 3
    creative_transfer_points_to_observable_material: true
    audience_cognition_shift_is_specific: true
    pure_aesthetic_adjective_stack: false
    real_instance_fact_leak: false
    direct_publish_script: false
    safe_alternative_performance_claim: false
  - draft_id: SEM-V4_5-APPAREL-CLAIM-BOUNDARY-002
    creative_value_dimensions:
      audience_cognition_shift: 观众从效果承诺转向可观察关系和安全表达选择。
      generative_option_space: 安全替代表达至少三类。
    generative_options:
    - 观察句：面料表面更平整
    - 条件体验句：在长时间坐立切换时更关注留量
    - 审美方向句：把舒适感转为轻、缓、少束缚的画面节奏
    creative_transfer_observable_material_ref: 面料触感、内里接触面、缝线位置、活动留量、衣摆回弹的可见状态。
    capsule_ref: SEM-V4_5-APPAREL-CLAIM-BOUNDARY-002
    rich_body_section_refs:
    - transfer_logic
    - contrast_or_micro_scenario
    - downstream_use
    generative_options_distinct_count: 3
    creative_transfer_points_to_observable_material: true
    audience_cognition_shift_is_specific: true
    pure_aesthetic_adjective_stack: false
    real_instance_fact_leak: false
    direct_publish_script: false
    safe_alternative_performance_claim: false
  - draft_id: SEM-V4_5-DISPLAY-TO-CONTENT-001
    creative_value_dimensions:
      sensory_or_visual_anchor: 入口区、中岛、端架、挂通的高低、前后、明暗和材质对比。
      aesthetic_tension: 张力来自主搭与陪体的距离、亮面与哑面、密集与留白之间的节奏。
      emotional_or_human_motive: 动机是让经过的人先被一个安静焦点照顾，而不是被所有信息同时推向前。
      cross_domain_transfer: 把空间关系转成短视频开场、小红书笔记结构、导购讲解卡和训练观察题。
      generative_option_space: 可生成远景引入、近景细节、导购解释、训练观察四种方向。
      audience_cognition_shift: 观众先停在一个视觉焦点，再理解陈列为什么把注意力引向某个轮廓或材质。
    generative_options:
    - 短视频：先远景停留再近景解释
    - 小红书笔记：用主搭和陪体关系组织段落
    - 导购讲解卡：用第一眼焦点引出款式关系
    - 训练观察题：让新人找出停留点和陪体
    creative_transfer_observable_material_ref: 前后层级、灯光边缘、挂通间距、材质反差、主搭和陪体的距离。
    capsule_ref: SEM-V4_5-DISPLAY-TO-CONTENT-001
    rich_body_section_refs:
    - transfer_logic
    - contrast_or_micro_scenario
    - downstream_use
    generative_options_distinct_count: 4
    creative_transfer_points_to_observable_material: true
    audience_cognition_shift_is_specific: true
    pure_aesthetic_adjective_stack: false
    real_instance_fact_leak: false
    direct_publish_script: false
    safe_alternative_performance_claim: false
  - draft_id: SEM-V4_5-DISPLAY-TO-CONTENT-002
    creative_value_dimensions:
      sensory_or_visual_anchor: 动作锚点包括手把衣物拉平、把两件衣物并排、转身递示、停顿等待。
      aesthetic_tension: 张力来自动作前后的差异、手部速度、衣物软硬和空间远近变化。
      emotional_or_human_motive: 动机是照顾选择犹豫、降低信息压力、把复杂款式变成可被慢慢看见。
      cross_domain_transfer: 把服务动作转为内容片段、讲解卡、训练观察题和视觉节奏。
      generative_option_space: 可生成动作解释、对比片段、等待片段、训练追问四种方向。
      audience_cognition_shift: 观众先看见一个动作，再理解动作背后的选择逻辑和被照顾感。
    generative_options:
    - 短视频：动作前后对比
    - 笔记：把动作理由写成观察问题
    - 导购卡：用递示动作解释选择条件
    - 训练题：判断动作是否有结束标志
    creative_transfer_observable_material_ref: 整理衣摆、并排比较、递示衣架、手势停顿、视线从整体移向细节。
    capsule_ref: SEM-V4_5-DISPLAY-TO-CONTENT-002
    rich_body_section_refs:
    - transfer_logic
    - contrast_or_micro_scenario
    - downstream_use
    generative_options_distinct_count: 4
    creative_transfer_points_to_observable_material: true
    audience_cognition_shift_is_specific: true
    pure_aesthetic_adjective_stack: false
    real_instance_fact_leak: false
    direct_publish_script: false
    safe_alternative_performance_claim: false
  - draft_id: SEM-V4_5-CONTROL-PLANE-GOVERNANCE-001
    creative_weight_not_applicable: true
    not_counted_as_creative_domain_quality_pass: true
    operational_insight_summary: 控制面样本只用于验证四路由和资产冲突处理，不参与创意质量计数。
    four_route_coverage:
      source_gap: 缺少来源或证据时登记 source_gap，补源后才可再进入。
      decision_required: 建模冲突或多资产归属冲突进入 decision_required。
      founder_review: 风险敏感或路线授权事项进入 founder_review。
      excluded: 禁止输出、生产化误导或越权请求进入 excluded。
    multi_asset_conflict_rule:
      trigger: one_input_maps_to_multiple_asset_surfaces_without_authorized_split
      route: block_or_split
      ledger: decision_required_or_governance_outbox
      reentry_condition: explicit_owner_and_asset_split_approved
    batch_generation_unlocked: false
