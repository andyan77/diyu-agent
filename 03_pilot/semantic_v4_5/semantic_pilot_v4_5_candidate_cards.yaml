    canonical_body_zh: 'mechanism_chain: 控制面卡只说明路由、账本、阻断和再进入条件，不把治理判断伪装成领域正文质量。核心机制是先识别异常类型，再分配到 source_gap、decision_required、founder_review、excluded 四条路线。异常分发与再进入规则 的 required relations 包括 missing_source -> source_gap；modeling_conflict -> decision_required，所以正文必须把触发条件、账本写入和再进入条件写清楚。

      observable_material: 可观察材料是候选片段里的缺源标记、建模冲突、风险敏感项、禁止输出请求、资产绑定冲突和非生产封印。它们不是创意素材，而是决定该片段能否继续被处理的控制信号。

      transfer_logic: 转译逻辑是把控制信号转成可执行的处理结果：缺源进入 source_gap，结构冲突进入 decision_required，创始人裁决项进入 founder_review，禁止输出进入 excluded。多资产冲突必须先阻断或拆分，不能强行绑定。

      boundary_logic: 边界逻辑要求控制面正文不计入创意质量通过；sidecar 记录路由证据和 ledger 目标，但 Rich Body 只解释规则本身，不声明任何知识已可生产或可批量。

      contrast_or_micro_scenario: 对照场景：合格写法会先指出一个具体材料，再解释它如何转成选择、观察或路由；失败写法只堆叠好看、松弛、有氛围等形容词，或者把条件经验写成确定结论。

      anti_pattern: 反模式包括：只复制胶囊标题、把 sidecar 的状态字段塞进正文、写成面向发布的完整成稿、虚构真实品牌或顾客反馈、把 relation hint 称为本体边。

