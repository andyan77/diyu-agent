    canonical_cluster_title_from_authority: 身材效果语言阶梯与场景化观察
    canonical_label_zh: 身材效果表达的安全创意替代胶囊 V4.5
    candidate_topic: 把身材效果风险句改成可观察、可条件化、可审美化的表达路径
    type_specific_body_shape: claim_boundary
    predicate_profile_id: claim_boundary
    relation_profile_id: relation_profile_claim_boundary
    artifact_kind: general_knowledge_candidate
    canonical_body_zh: 'mechanism_chain: 服饰 claim 边界卡把画面观察、条件体验、需补源性能主张和禁用保证拆开，避免把审美表达误写成身体效果。核心机制是把一句穿搭表达先拆成四层：可见的画面关系、带条件的穿着体验、需要外部来源支持的性能主张、必须阻断的保证句。身材效果语言阶梯与场景化观察 对应的正文主题包括 观察词/关系词/结果词分层、能说视觉线条变化与不能保证身体结果的边界、替代表达与回避表达，所以正文不能只说禁用词，而要说明每一层如何被改写和转路由。

      observable_material: 可观察材料只包括画面里的线条、分界、遮挡、垂坠、开合、层次和动作停顿。它可以支持“腰线位置更清楚”“面料边界更容易被看见”这类观察句；触感、舒适、显瘦、耐穿等不能被写成直接观察。

      transfer_logic: 创意转译不是把效果说得更夸张，而是把风险句改写成安全表达路径：先写画面条件，再写感受的条件性，最后把性能或身体结果交给补源工单。这样内容仍有审美方向，但不会把经验词冒充事实。

      boundary_logic: 边界逻辑要求 direct_observation、conditional_experience_expression、source_required_performance_claim、prohibited_guarantee 四类同时出现。safe alternative 只能提供观察、条件体验、场景表达和美学方向，不能承诺结果，也不能绕开来源要求。

      contrast_or_micro_scenario: 对照场景：合格写法会先指出一个具体材料，再解释它如何转成选择、观察或路由；失败写法只堆叠好看、松弛、有氛围等形容词，或者把条件经验写成确定结论。

      anti_pattern: 反模式包括：只复制胶囊标题、把 sidecar 的状态字段塞进正文、写成面向发布的完整成稿、虚构真实品牌或顾客反馈、把 relation hint 称为本体边。

      downstream_use: 下游可把这段正文拆给 brief、judge、训练观察提示或人工复核使用；它只说明如何审阅和生成下一轮样本，不改变任何后续资产状态。'
