    canonical_body_zh: 'definition：故事弧线选择边界用于判断一段内容应该解释过程、呈现阶段变化、说明取舍，还是退回事实清单。V4.3 把选择动作放在任务入口：先问素材里是否有过程证据，再问表达目标是否需要价值说明，最后决定弧线强度。


      decision_matrix_for_story_arc_or_anchor_choice：若输入是时间顺序和阶段变化，优先使用过程弧线；若输入是单个对象和动作，优先使用锚点说明；若输入只有价值词，必须降级为补充素材请求或事实清单。


      input_signal_to_method_selection：输入信号包括事件顺序、选择理由、可观察材料、角色动作和不可验证主张。每个信号只选择能够被证据支撑的方法，不把弱信号扩写成完整故事。


      failure_downgrade_path：当证据不足以支持故事弧线时，输出应降级为说明清单、观察锚点或 source gap；不得用情绪词补足因果。


      difference_from_neighbor_cluster：它区别于 mkc_010：本条决定弧线强度，mkc_010 决定对象锚点如何打破套话。'
    owner_model:
