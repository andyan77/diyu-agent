      allowed_expression_examples：允许表达：腰线位置更清楚、外套开穿时内搭比例更明确、裤管垂坠让线条更顺。


      restricted_expression_examples：受限表达：显高、显瘦、修饰身形。只有在搭配条件明确且改写为观察句时才可保留。


      prohibited_expression_examples：禁止表达：保证瘦十斤、改变身材比例、穿上就瘦腿。


      evidence_threshold_by_claim_strength：观察词需要图片或试穿场景；关系词需要搭配条件；结果词需要平台规则或品牌政策确认；身体承诺词即使有反馈也不能作为证据。


      source_workorder_hint：任何需要证明身体结果或普遍效果的句子都必须进入 source_workorder_needed，不得由专家经验补足。'
