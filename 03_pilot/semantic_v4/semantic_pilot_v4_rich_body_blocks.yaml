      text: 证据依据来自权威项、权威项和权威项。这些证据类别只允许方法说明、观察线索、风险边界或路由标签进入正文，不允许把真实品牌、真实门店、真实人物、检测结果或身体结果补写成事实（身材效果语言的场景化观察边界专属判断权威项）。
      proposition_refs:
      - 证据层级
    - heading: 无证据降级表达
      text: 输出影响必须保持为：约束后续候选内容优先使用观察语言，降低敏感断言风险。。这句话来自权威表，不能被改写成更宽泛的生产承诺（身材效果语言的场景化观察边界专属判断权威项）。内容、陈列、导购、平台和控制面都只能围绕这个影响组织下一步判断（身材效果语言的场景化观察边界专属判断权威项）。
      proposition_refs:
      - 无证据降级表达
