      text: 适用时，操作者要把观察词/关系词/结果词分层作为首要判断，把能说视觉线条变化与不能保证身体结果的边界作为限制条件，把替代表达与回避表达作为输出检查点。这样能够保留行业判断，同时避免把一次样本写成通用授权（身材效果语言的场景化观察边界专属判断权威项）。
