      proposition_refs:
      - 来源缺口触发
    - heading: 审查前判断
      text: 本条的低质风险是把身材效果语言阶梯与场景化观察当作标题材料使用，而不是当作权威记录使用。修正时要逐句检查主题、关系、证据和输出影响是否仍与原记录一致（身材效果语言的场景化观察边界专属判断权威项）。只有一致时，才可进入下一步审查（身材效果语言的场景化观察边界专属判断权威项）。
