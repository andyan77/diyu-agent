    body_sections:
    - heading: 观察对象
      text: 身材效果语言的场景化观察边界以《身材效果语言阶梯与场景化观察》为权威来源，正文只应用观察词/关系词/结果词分层、能说视觉线条变化与不能保证身体结果的边界、替代表达与回避表达等已登记主题，不另造标准知识簇含义。在身材效果语言的场景化观察边界中，操作者先识别任务对象，再判断对象能否支撑关系和证据要求，最后把输出限制在权威表允许的范围内。
      proposition_refs:
