      text: 异常分发和再进入的控制面分流以《异常分发与再进入规则》为权威来源，正文只应用权威项 触发模式、权威项 触发模式、权威项 触发模式等已登记主题，不另造标准知识簇含义。在异常分发和再进入的控制面分流中，操作者先识别任务对象，再判断对象能否支撑关系和证据要求，最后把输出限制在权威表允许的范围内。
      proposition_refs:
      - 控制对象
    - heading: 路由条件
      text: 关系依据来自权威关系项和权威关系项。异常分发和再进入的控制面分流使用这些关系，不是为了写漂亮表达，而是为了说明约束方向、触发条件、分流对象和降级结果。若异常分发和再进入的控制面分流的正文无法回到这些关系，就说明它偏离了权威表。
      proposition_refs:
      - 路由条件
    - heading: 阻断条件
      text: 证据依据来自权威项、权威项和权威项。这些证据类别只允许方法说明、观察线索、风险边界或路由标签进入正文，不允许把真实品牌、真实门店、真实人物、检测结果或身体结果补写成事实（异常分发和再进入的控制面分流专属判断权威项）。
      proposition_refs:
      - 阻断条件
    - heading: 分流账本
      text: 输出影响必须保持为：将异常研究项分发到后续可验证的不同账本，避免控制面地图把问题隐藏在模糊说明里。。这句话来自权威表，不能被改写成更宽泛的生产承诺（异常分发和再进入的控制面分流专属判断权威项）。内容、陈列、导购、平台和控制面都只能围绕这个影响组织下一步判断（异常分发和再进入的控制面分流专属判断权威项）。
      proposition_refs:
      - 分流账本
    - heading: 不得进入通用知识的原因
      text: 适用时，操作者要把权威项 触发模式作为首要判断，把权威项 触发模式作为限制条件，把权威项 触发模式作为输出检查点。这样能够保留行业判断，同时避免把一次样本写成通用授权（异常分发和再进入的控制面分流专属判断权威项）。
      proposition_refs:
      - 不得进入通用知识的原因
    - heading: 与批量生成的关系
      text: 不适用时，任务会要求超出异常分发与再进入规则的事实、效果或资产状态。此时必须退回来源缺口、决策分流或人工复核，而不能继续扩写（异常分发和再进入的控制面分流专属判断权威项）。这个阻断确保后续批次不会沿着错误主题复制（异常分发和再进入的控制面分流专属判断权威项）。
      proposition_refs:
      - 与批量生成的关系
    - heading: 审查前判断
      text: 本条的低质风险是把异常分发与再进入规则当作标题材料使用，而不是当作权威记录使用。修正时要逐句检查主题、关系、证据和输出影响是否仍与原记录一致（异常分发和再进入的控制面分流专属判断权威项）。只有一致时，才可进入下一步审查（异常分发和再进入的控制面分流专属判断权威项）。
      proposition_refs:
      - 审查前判断
