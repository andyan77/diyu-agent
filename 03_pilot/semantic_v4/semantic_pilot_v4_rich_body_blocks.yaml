    - heading: 说法类型边界
      text: 关系依据来自承接 权威项-权威项 与 权威项-权威项和连接 权威项-权威项 场景化观察方法。身材效果语言的场景化观察边界使用这些关系，不是为了写漂亮表达，而是为了说明约束方向、触发条件、分流对象和降级结果。若身材效果语言的场景化观察边界的正文无法回到这些关系，就说明它偏离了权威表。
      proposition_refs:
      - 说法类型边界
