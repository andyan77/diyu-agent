    canonical_body_zh: 舒适性能耐用品质证据阶梯的最低表达以《舒适性能耐用品质证据阶梯》为权威来源，正文只应用权威项 分级、不同 权威项 对应的证据类别、无证据时允许保留的最低表达层级等已登记主题，不另造标准知识簇含义（舒适性能耐用品质证据阶梯的最低表达专属段一）。在舒适性能耐用品质证据阶梯的最低表达中，操作者先识别任务对象，再判断对象能否支撑关系和证据要求，最后把输出限制在权威表允许的范围内（舒适性能耐用品质证据阶梯的最低表达专属段二）。关系依据来自承接
