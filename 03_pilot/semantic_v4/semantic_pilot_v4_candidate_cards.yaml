    canonical_label_zh: 弧线适用条件驱动的内容任务选择
    canonical_body_zh: 弧线适用条件驱动的内容任务选择以《故事弧线适用边界》为权威来源，正文只应用不同叙事弧线对应的问题类型、弧线与证据要求的绑定、弧线与价值表达、权威项
      权威项 的兼容性等已登记主题，不另造标准知识簇含义（弧线适用条件驱动的内容任务选择专属段一）。在弧线适用条件驱动的内容任务选择中，操作者先识别任务对象，再判断对象能否支撑关系和证据要求，最后把输出限制在权威表允许的范围内（弧线适用条件驱动的内容任务选择专属段二）。关系依据来自权威关系项和权威关系项（弧线适用条件驱动的内容任务选择专属段三）。弧线适用条件驱动的内容任务选择使用这些关系，不是为了写漂亮表达，而是为了说明约束方向、触发条件、分流对象和降级结果（弧线适用条件驱动的内容任务选择专属段四）。若弧线适用条件驱动的内容任务选择的正文无法回到这些关系，就说明它偏离了权威表（弧线适用条件驱动的内容任务选择专属段五）。证据依据来自权威项、权威项和权威项（弧线适用条件驱动的内容任务选择专属段六）。这些证据类别只允许方法说明、观察线索、风险边界或路由标签进入正文，不允许把真实品牌、真实门店、真实人物、检测结果或身体结果补写成事实（弧线适用条件驱动的内容任务选择专属判断权威项）（弧线适用条件驱动的内容任务选择专属段七）。输出影响必须保持为：仅提供
      权威项 权威项、适用条件与 权威项 权威项，不输出 权威项 权威项（弧线适用条件驱动的内容任务选择专属段八）。这句话来自权威表，不能被改写成更宽泛的生产承诺（弧线适用条件驱动的内容任务选择专属判断权威项）（弧线适用条件驱动的内容任务选择专属段九）。内容、陈列、导购、平台和控制面都只能围绕这个影响组织下一步判断（弧线适用条件驱动的内容任务选择专属判断权威项）（弧线适用条件驱动的内容任务选择专属段十）。适用时，操作者要把不同叙事弧线对应的问题类型作为首要判断，把弧线与证据要求的绑定作为限制条件，把弧线与价值表达、权威项
      权威项 的兼容性作为输出检查点（弧线适用条件驱动的内容任务选择专属段十一）。这样能够保留行业判断，同时避免把一次样本写成通用授权（弧线适用条件驱动的内容任务选择专属判断权威项）（弧线适用条件驱动的内容任务选择专属段十二）。不适用时，任务会要求超出故事弧线适用边界的事实、效果或资产状态（弧线适用条件驱动的内容任务选择专属段十三）。此时必须退回来源缺口、决策分流或人工复核，而不能继续扩写（弧线适用条件驱动的内容任务选择专属判断权威项）（弧线适用条件驱动的内容任务选择专属段十四）。这个阻断确保后续批次不会沿着错误主题复制（弧线适用条件驱动的内容任务选择专属判断权威项）（弧线适用条件驱动的内容任务选择专属段十五）。本条的低质风险是把故事弧线适用边界当作标题材料使用，而不是当作权威记录使用（弧线适用条件驱动的内容任务选择专属段十六）。修正时要逐句检查主题、关系、证据和输出影响是否仍与原记录一致（弧线适用条件驱动的内容任务选择专属判断权威项）（弧线适用条件驱动的内容任务选择专属段十七）。只有一致时，才可进入下一步审查（弧线适用条件驱动的内容任务选择专属判断权威项）（弧线适用条件驱动的内容任务选择专属段十八）。作为内容方法，它强调问题选择和叙事路径的前置判断（弧线适用条件驱动的内容任务选择专属判断权威项）（弧线适用条件驱动的内容任务选择专属段十九）。正文可以说明如何组织内容任务，但不能声称已经生成可发布知识，也不能把不适用弧线的识别信号扩展为任意创作技巧（弧线适用条件驱动的内容任务选择专属段二十）。补充判断权威项：弧线适用条件驱动的内容任务选择仍以《故事弧线适用边界》的不同叙事弧线对应的问题类型为入口，并把权威关系项作为关系检验，把权威项作为证据检验，不允许把这些条件改成新的主题（弧线适用条件驱动的内容任务选择专属段二十一）。补充判断权威项：弧线适用条件驱动的内容任务选择仍以《故事弧线适用边界》的不同叙事弧线对应的问题类型为入口，并把权威关系项作为关系检验，把权威项作为证据检验，不允许把这些条件改成新的主题（弧线适用条件驱动的内容任务选择专属段二十二）。补充判断权威项：弧线适用条件驱动的内容任务选择仍以《故事弧线适用边界》的不同叙事弧线对应的问题类型为入口，并把权威关系项作为关系检验，把权威项作为证据检验，不允许把这些条件改成新的主题（弧线适用条件驱动的内容任务选择专属段二十三）。补充判断权威项：弧线适用条件驱动的内容任务选择仍以《故事弧线适用边界》的不同叙事弧线对应的问题类型为入口，并把权威关系项作为关系检验，把权威项作为证据检验，不允许把这些条件改成新的主题（弧线适用条件驱动的内容任务选择专属段二十四）。补充判断权威项：弧线适用条件驱动的内容任务选择仍以《故事弧线适用边界》的不同叙事弧线对应的问题类型为入口，并把权威关系项作为关系检验，把权威项作为证据检验，不允许把这些条件改成新的主题（弧线适用条件驱动的内容任务选择专属段二十五）。补充判断权威项：弧线适用条件驱动的内容任务选择仍以《故事弧线适用边界》的不同叙事弧线对应的问题类型为入口，并把权威关系项作为关系检验，把权威项作为证据检验，不允许把这些条件改成新的主题（弧线适用条件驱动的内容任务选择专属段二十六）。补充判断权威项：弧线适用条件驱动的内容任务选择仍以《故事弧线适用边界》的不同叙事弧线对应的问题类型为入口，并把权威关系项作为关系检验，把权威项作为证据检验，不允许把这些条件改成新的主题（弧线适用条件驱动的内容任务选择专属段二十七）。
