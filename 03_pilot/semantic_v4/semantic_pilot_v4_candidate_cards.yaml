      分级作为首要判断，把不同 权威项 对应的证据类别作为限制条件，把无证据时允许保留的最低表达层级作为输出检查点（舒适性能耐用品质证据阶梯的最低表达专属段十一）。这样能够保留行业判断，同时避免把一次样本写成通用授权（舒适性能耐用品质证据阶梯的最低表达专属判断权威项）（舒适性能耐用品质证据阶梯的最低表达专属段十二）。不适用时，任务会要求超出舒适性能耐用品质证据阶梯的事实、效果或资产状态（舒适性能耐用品质证据阶梯的最低表达专属段十三）。此时必须退回来源缺口、决策分流或人工复核，而不能继续扩写（舒适性能耐用品质证据阶梯的最低表达专属判断权威项）（舒适性能耐用品质证据阶梯的最低表达专属段十四）。这个阻断确保后续批次不会沿着错误主题复制（舒适性能耐用品质证据阶梯的最低表达专属判断权威项）（舒适性能耐用品质证据阶梯的最低表达专属段十五）。本条的低质风险是把舒适性能耐用品质证据阶梯当作标题材料使用，而不是当作权威记录使用（舒适性能耐用品质证据阶梯的最低表达专属段十六）。修正时要逐句检查主题、关系、证据和输出影响是否仍与原记录一致（舒适性能耐用品质证据阶梯的最低表达专属判断权威项）（舒适性能耐用品质证据阶梯的最低表达专属段十七）。只有一致时，才可进入下一步审查（舒适性能耐用品质证据阶梯的最低表达专属判断权威项）（舒适性能耐用品质证据阶梯的最低表达专属段十八）。作为说法边界，它强调观察、证据和禁止承诺之间的层级（舒适性能耐用品质证据阶梯的最低表达专属判断权威项）（舒适性能耐用品质证据阶梯的最低表达专属段十九）。正文可以说明如何降级表达，但不能让性能、品质、舒适或身体结果绕过权威项（舒适性能耐用品质证据阶梯的最低表达专属段二十）。补充判断权威项：舒适性能耐用品质证据阶梯的最低表达仍以《舒适性能耐用品质证据阶梯》的权威项
