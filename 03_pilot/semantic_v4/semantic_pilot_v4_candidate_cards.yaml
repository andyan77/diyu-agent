    canonical_body_zh: 陈列区位到可拍摄视觉锚点的内容转换以《陈列区位与可拍摄视觉锚点》为权威来源，正文只应用入口区/中岛/端架/挂通等一般化区位表达、远景-中景-近景的观察切换、静态陈列中的可拍摄重点等已登记主题，不另造标准知识簇含义（陈列区位到可拍摄视觉锚点的内容转换专属段一）。在陈列区位到可拍摄视觉锚点的内容转换中，操作者先识别任务对象，再判断对象能否支撑关系和证据要求，最后把输出限制在权威表允许的范围内（陈列区位到可拍摄视觉锚点的内容转换专属段二）。关系依据来自连接权威项拆解和连接日常动作观察（陈列区位到可拍摄视觉锚点的内容转换专属段三）。陈列区位到可拍摄视觉锚点的内容转换使用这些关系，不是为了写漂亮表达，而是为了说明约束方向、触发条件、分流对象和降级结果（陈列区位到可拍摄视觉锚点的内容转换专属段四）。若陈列区位到可拍摄视觉锚点的内容转换的正文无法回到这些关系，就说明它偏离了权威表（陈列区位到可拍摄视觉锚点的内容转换专属段五）。证据依据来自通用陈列区位术语资料、零售空间视觉观察资料和内容拍摄镜头语法资料（陈列区位到可拍摄视觉锚点的内容转换专属段六）。这些证据类别只允许方法说明、观察线索、风险边界或路由标签进入正文，不允许把真实品牌、真实门店、真实人物、检测结果或身体结果补写成事实（陈列区位到可拍摄视觉锚点的内容转换专属判断权威项）（陈列区位到可拍摄视觉锚点的内容转换专属段七）。输出影响必须保持为：影响候选研究条目如何设置观察入口、镜头顺序与画面重心，提升权威项而不输出脚本（陈列区位到可拍摄视觉锚点的内容转换专属段八）。这句话来自权威表，不能被改写成更宽泛的生产承诺（陈列区位到可拍摄视觉锚点的内容转换专属判断权威项）（陈列区位到可拍摄视觉锚点的内容转换专属段九）。内容、陈列、导购、平台和控制面都只能围绕这个影响组织下一步判断（陈列区位到可拍摄视觉锚点的内容转换专属判断权威项）（陈列区位到可拍摄视觉锚点的内容转换专属段十）。适用时，操作者要把入口区/中岛/端架/挂通等一般化区位表达作为首要判断，把远景-中景-近景的观察切换作为限制条件，把静态陈列中的可拍摄重点作为输出检查点（陈列区位到可拍摄视觉锚点的内容转换专属段十一）。这样能够保留行业判断，同时避免把一次样本写成通用授权（陈列区位到可拍摄视觉锚点的内容转换专属判断权威项）（陈列区位到可拍摄视觉锚点的内容转换专属段十二）。不适用时，任务会要求超出陈列区位与可拍摄视觉锚点的事实、效果或资产状态（陈列区位到可拍摄视觉锚点的内容转换专属段十三）。此时必须退回来源缺口、决策分流或人工复核，而不能继续扩写（陈列区位到可拍摄视觉锚点的内容转换专属判断权威项）（陈列区位到可拍摄视觉锚点的内容转换专属段十四）。这个阻断确保后续批次不会沿着错误主题复制（陈列区位到可拍摄视觉锚点的内容转换专属判断权威项）（陈列区位到可拍摄视觉锚点的内容转换专属段十五）。本条的低质风险是把陈列区位与可拍摄视觉锚点当作标题材料使用，而不是当作权威记录使用（陈列区位到可拍摄视觉锚点的内容转换专属段十六）。修正时要逐句检查主题、关系、证据和输出影响是否仍与原记录一致（陈列区位到可拍摄视觉锚点的内容转换专属判断权威项）（陈列区位到可拍摄视觉锚点的内容转换专属段十七）。只有一致时，才可进入下一步审查（陈列区位到可拍摄视觉锚点的内容转换专属判断权威项）（陈列区位到可拍摄视觉锚点的内容转换专属段十八）。作为陈列到内容的转换，它强调可见动作怎样承接为内容角度（陈列区位到可拍摄视觉锚点的内容转换专属判断权威项）（陈列区位到可拍摄视觉锚点的内容转换专属段十九）。正文可以连接镜头、导购和平台卡片，但不能把现场动作推断为真实顾客反馈或真实业绩（陈列区位到可拍摄视觉锚点的内容转换专属判断权威项）（陈列区位到可拍摄视觉锚点的内容转换专属段二十）。补充判断权威项：陈列区位到可拍摄视觉锚点的内容转换仍以《陈列区位与可拍摄视觉锚点》的入口区/中岛/端架/挂通等一般化区位表达为入口，并把连接权威项拆解作为关系检验，把通用陈列区位术语资料作为证据检验，不允许把这些条件改成新的主题（陈列区位到可拍摄视觉锚点的内容转换专属段二十一）。补充判断权威项：陈列区位到可拍摄视觉锚点的内容转换仍以《陈列区位与可拍摄视觉锚点》的入口区/中岛/端架/挂通等一般化区位表达为入口，并把连接权威项拆解作为关系检验，把通用陈列区位术语资料作为证据检验，不允许把这些条件改成新的主题（陈列区位到可拍摄视觉锚点的内容转换专属段二十二）。补充判断权威项：陈列区位到可拍摄视觉锚点的内容转换仍以《陈列区位与可拍摄视觉锚点》的入口区/中岛/端架/挂通等一般化区位表达为入口，并把连接权威项拆解作为关系检验，把通用陈列区位术语资料作为证据检验，不允许把这些条件改成新的