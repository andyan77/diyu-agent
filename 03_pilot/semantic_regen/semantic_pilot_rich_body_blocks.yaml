    body_text: 'Occasion ladder from garment role defines a semantic pilot rule driven by cluster mkc_019. The mechanism is linking a garment role to a sequence of occasion questions. The apparel object is light jacket and straight trouser, placed in a retail scene such as front fixture with mixed outerwear. The content action is to build a three-step occasion outline, while the display or styling action is to separate the anchor layer from support garments. This cluster changes the rule because a light jacket, folded trouser, and inner layer are compared as occasion anchors. If the cluster changed, the mechanism would no longer emphasize this object-action pair; the draft would need a different applicability boundary, evidence mode, and downstream output implication. The operator decision is to choose one occasion ladder before drafting captions, which makes the draft different from neighboring clusters and prevents title-only variation. The evidence or claim boundary is that requires a
      visible styling cue, a shopper task, and a boundary that says which occasion is excluded. The failure mode is generic seasonal copy with no occasion decision. The risk boundary is the angle collapses when the scene is chosen by mood alone and not by observable wardrobe function. This wording stays at the level of draft knowledge and does not name any brand, SKU, store, person, customer statement, measured fabric result, or body outcome. The downstream output implication is a content outline that moves from occasion need to styling choice and ends with a cautious selection cue. The candidate therefore changes the future content or display output through linking a garment role to a sequence of occasion questions, not through metadata, count coverage, or a hash-only difference. Its relation edges must carry specific actions such as constraining a claim type, requiring an evidence mode, translating a display action to a content angle, or routing a control rule to a decision packet. The
