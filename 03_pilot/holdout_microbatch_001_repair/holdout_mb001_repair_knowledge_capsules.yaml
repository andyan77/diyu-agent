  - draft_id: HOLDOUT-MB001-REPAIR-REPAIR-001
    source_holdout_draft_id: HOLDOUT-MB001-REPAIR-001
    selected_w7_cluster_id: mkc_002
    canonical_title: 路由阶梯与降级触发
    domain_question: 路由阶梯与降级触发 要回答的是：当输入材料只给出 route 梯级定义 与 degradation 类型 时，如何判断它应形成哪一种结构化判断，而不是停留在题名索引。
    core_mechanism: 路由阶梯与降级触发 的核心机制是把“观察对象、判断条件、边界信号、下游用途”连成一个闭环；每个判断都要把 route 梯级定义 转化为可复核的中间规则，再由边界信号决定是否保留为方法、证据边界或控制项。
    observable_or_operational_inputs:
    - route 梯级定义
    - degradation 类型
    - owner_routing_signal
    - source_gap_signal
    transformation_or_decision_rule:
    - 先把 route 梯级定义 转成可观察对象：它说明输入材料里哪些词、结构、动作或证据槽位真正参与判断。
    - 再把 degradation 类型 转成判断条件：只有当条件能解释对象之间的差异时，正文才保留该条件。
    - 然后用 soft fallback 与 hard block 区分 标记失败信号：来源不足、归属冲突、效果断言或对象混淆都会触发边界处理。
    boundary_or_failure_signal:
    - owner_conflict
    - source_gap
    - hard_claim_without_support
    - formal_landing_attempt
    downstream_consumer_effect: 只提供人工复核前的结构化方法材料；正式落地、证据归属和资产归属仍保持关闭。
