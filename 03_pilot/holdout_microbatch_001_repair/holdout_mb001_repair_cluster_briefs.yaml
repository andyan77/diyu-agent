    canonical_cluster_id: mkc_002
    canonical_title: 路由阶梯与降级触发
    owner_capability_group: P0-00
    expected_body_topics: &id001
    - route 梯级定义
    - degradation 类型
    - soft fallback 与 hard block 区分
    - review-only 与 source-gap 分流
    required_relations:
    - checker_result -> route_decision
    - evidence_need_missing -> source_gap
    - ontology_conflict -> decision_required
    - risk_sensitive_override -> founder_review
    cluster_domain_question: 路由阶梯与降级触发 要回答的是：当输入材料只给出 route 梯级定义 与 degradation 类型 时，如何判断它应形成哪一种结构化判断，而不是停留在题名索引。
    cluster_specific_mechanism_claim: 路由阶梯与降级触发 的核心机制是把“观察对象、判断条件、边界信号、下游用途”连成一个闭环；每个判断都要把 route 梯级定义 转化为可复核的中间规则，再由边界信号决定是否保留为方法、证据边界或控制项。
    must_cover_topics: *id001
    must_not_be_only_boundary: true
    owner_routing_risk: control_or_global_claim_boundary
