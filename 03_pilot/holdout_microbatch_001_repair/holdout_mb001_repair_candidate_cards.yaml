    canonical_label_zh: 路由阶梯与降级触发
    candidate_topic: route 梯级定义 / degradation 类型
    cluster_specific_domain_question: 路由阶梯与降级触发 要回答的是：当输入材料只给出 route 梯级定义 与 degradation 类型 时，如何判断它应形成哪一种结构化判断，而不是停留在题名索引。
    cluster_specific_mechanism_claim: 路由阶梯与降级触发 的核心机制是把“观察对象、判断条件、边界信号、下游用途”连成一个闭环；每个判断都要把 route 梯级定义 转化为可复核的中间规则，再由边界信号决定是否保留为方法、证据边界或控制项。
    canonical_body_zh: 'cluster_mechanism_chain: 先把 route 梯级定义 转成可观察对象：它说明输入材料里哪些词、结构、动作或证据槽位真正参与判断。；再把 degradation 类型 转成判断条件：只有当条件能解释对象之间的差异时，正文才保留该条件。；然后用
      soft fallback 与 hard block 区分 标记失败信号：来源不足、归属冲突、效果断言或对象混淆都会触发边界处理。；最后把关系提示 checker_result -> route_decision 与 evidence_need_missing
      -> source_gap 降为设计线索，正文只解释机制路径，不声明正式图谱边。

      expected_topic_coverage: route 梯级定义：route 梯级定义 被写成一个可执行判断：将观察对象、判断条件和越界处理信号写成同一个可复核命题。；degradation 类型：degradation 类型
      被写成一个可执行判断：将观察对象、判断条件和越界处理信号写成同一个可复核命题。；soft fallback 与 hard block 区分：soft fallback 与 hard block 区分 被写成一个可执行判断：将观察对象、判断条件和越界处理信号写成同一个可复核命题。；review-only
      与 source-gap 分流：review-only 与 source-gap 分流 被写成一个可执行判断：将观察对象、判断条件和越界处理信号写成同一个可复核命题。

      operational_input: 输入对象是规则片段、证据缺口、归属冲突和组合请求，本条锚定《路由阶梯与降级触发》。路由阶梯与降级触发 不读取真实实例事实，只读取结构信号、缺项信号和冲突信号。

      decision_transformation: 转换规则先判定触发源，再判定归属层，最后选择保留、分流、阻断或请求裁决，本条锚定《路由阶梯与降级触发》；route 梯级定义 是第一层触发，review-only 与 source-gap
      分流 是最终分流依据。

      boundary_logic: 边界逻辑要求 P0-00 或全局控制项默认留在控制面，本条锚定《路由阶梯与降级触发》。若出现 GeneralKnowledgeBase 目标，必须有显式 owner decision，否则保持阻断。

      anti_pattern_and_consequence: 反例是把控制项写成领域方法，或把缺来源写成可用知识，本条锚定《路由阶梯与降级触发》；后果是下游误以为已经具备正式落地条件，本条锚定《路由阶梯与降级触发》。

      downstream_use: 下游只消费为 route_decision、governance_outbox_write 或 reentry_validation 的判断材料，不作为正式领域知识，本条锚定《路由阶梯与降级触发》。'
