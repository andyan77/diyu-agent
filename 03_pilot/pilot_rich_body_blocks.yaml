  - candidate_id: PILOT-APPAREL-CLAIM-BOUNDARY-001
    pilot_category: apparel_claim_boundary
    body_text: Material wording boundary defines a cautious wording boundary for apparel drafts. The draft may describe visible qualities, styling intent, or evidence needs, but it must not assert measured performance, personal outcomes, or verified product facts. When a sentence moves beyond description, the safe action is to downgrade it into a question for review or a source work item. This keeps the language useful for planning while preventing unsupported product statements from entering later stages. Reviewers should verify whether each sentence is descriptive, whether evidence is requested for stronger wording, and whether the draft avoids named examples. This sample number 1 is held as a boundary exercise only.
