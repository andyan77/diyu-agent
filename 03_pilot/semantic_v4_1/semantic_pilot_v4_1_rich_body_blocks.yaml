    canonical_label_zh: 异常研究项的分流与再进入规则
    canonical_body_zh: 'p1：异常研究项的分流与再进入规则解决的是日常内容生产中最容易被混在一起的判断：先看对象处在什么场景，再看它能提供哪一种可观察材料，最后决定能写到什么层级。以异常分发与再进入规则为背景时，重点不在于把概念摆进正文，而是让操作者能够在具体任务里分辨source_gap
      触发模式、decision_required 触发模式和founder_review 触发模式之间的顺序。这样写出的内容会先处理事实可见性，再处理表达强度，最后处理不能继续展开的边界。


      p2：实际操作时，缺源触发通常先发生在素材筛选阶段。操作者要看见缺少来源标记、模型冲突标记和敏感风险标记这些具体线索，而不是只凭抽象风格词下判断。接着进入建模冲突触发：如果素材能支撑过程、位置、动作或证据，就可以写成方法说明；如果只能支撑局部观察，就只能保留观察句；如果连观察对象都不稳定，就应转成待补充资料。


      p3：第三步是风险人工确认触发。这一层决定正文能否形成可复用知识，而不是临时口号。先标记异常原因，再选择账本或人工确认路径，最后在条件满足前阻止重新进入生成链路。这三个动作让内容从感受性表达回到可执行判断。比如在服装、门店和内容任务里，同一句话既可能是观察，也可能是主张；差别取决于它有没有对象、场景、证据和可反驳条件。


      p4：边界处理由禁出排除承担。如果异常项只被写进说明文字而没有分流标签，后续任务会误以为问题已经解决。因此，正文应当保留清楚的降级路径：证据不足时降为观察，关系不足时降为任务提示，风险过高时进入人工判断，缺少来源时进入补源队列。这个路径让研究材料、方法说明和成品表达保持分层，避免一次观察被扩成普遍承诺。


      p5：在质量判断上，异常研究项的分流与再进入规则需要同时覆盖行业机制、可观察锚点、操作者动作和失败模式。行业机制说明为什么要这样分流；可观察锚点说明判断来自哪里；操作者动作说明下一步怎么做；失败模式说明什么情况下必须停下。四者同时出现时，正文才不像模板句，也不会把方法、证据和治理边界混成一个含糊字段。


      p6：落到后续使用时，它可以帮助人审人员判断一条草案是否真正回应了按缺源、冲突、风险和禁出请求把异常项分发到不同处理路径。可保留的句子应当能指出场景中的对象、动作或证据；需要修改的句子通常只有评价词、目标词或夸张结果；必须阻断的句子则会绕过证据层级，或把控制性质的限制写成领域知识结论。将异常研究项分发到后续可验证的不同账本，避免控制面地图把问题隐藏在模糊说明里。这类影响只用于说明表达边界，不能替代证据、场景和人工判断。


      p7：在治理场景里，这类知识还要处理异常项的可追踪性。异常不是一句备注，而是一组可以被分流、阻断、拆分或等待资料补齐的状态。缺少来源、条件冲突、风险过高和用途不明，都需要不同处理路径。较稳的做法是先记录触发原因，再记录暂存位置，最后记录重新进入工作的条件。这样能够避免问题被包装成普通知识，也避免研究材料越过用途边界。'
