semantic_pilot_v4_4_knowledge_capsules:
  items:
  - draft_id: SEM-V4_4-CONTENT-METHOD-001
    revision_of: SEM-V4_3-CONTENT-METHOD-001
    capsule_question: 同一组素材为什么可以产生多个叙事角度，而不是只套一个故事模板？
    core_mechanism: 先拆证据强度，再选择弧线强度；证据只够一个瞬间时，用留白和观察保留情绪，不补因果。
    observable_material: 衣物边线、袖口折痕、面料垂坠、手把衣架推回原位的动作、光线落在表面的停顿。
    creative_transfer: 把这些可观察材料转成“先看见一个细节，再判断它能不能撑起故事”的内容角度。
    boundary_guardrail: 情绪只能作为表达方向，不能当作品牌事实、顾客反馈或效果证据。
    generative_options:
    - 过程弧线：从材料细节进入选择理由
    - 选择弧线：从取舍动作进入价值表达
    - 留白观察：只保留一个可见瞬间和一个开放问题
    failure_signal: 只有情绪词、没有对象动作或证据强度时，不使用故事弧线。
    downstream_effect: L2 可据此生成选题问题；L3 可生成素材采集提示；人审判断情绪是否越界为事实。
  - draft_id: SEM-V4_4-CONTENT-METHOD-002
    revision_of: SEM-V4_3-CONTENT-METHOD-002
    capsule_question: 情绪标签如何转为对象、动作、光线、空间和关系采集任务？
    core_mechanism: 把抽象词拆成五个采集槽：对象、动作、关系、时间、空间；每个槽都必须能被观察或复述。
    observable_material: 衬衫下摆、半裙腰线、鞋面距离、衣架排列、导购手势和顾客视线移动方向的通用观察。
    creative_transfer: 将风格词转成“哪个对象先出现、哪个动作改变比例、哪个空间关系制造节奏”的内容框架。
    boundary_guardrail: 不得虚构真实人物、真实顾客反馈或具体门店情节。
    generative_options:
    - 对象路径：从一件衣物的结构进入表达
    - 动作路径：从一个整理或试穿动作进入表达
    - 关系路径：从主次搭配和空间距离进入表达
    failure_signal: 如果只能写高级、氛围、松弛等形容词而没有对象动作，则停止扩写。
    downstream_effect: 为 L2 提供反模板选题，为 L3 提供观察任务，为人审提供虚构实例拦截点。
  - draft_id: SEM-V4_4-APPAREL-CLAIM-BOUNDARY-001
    revision_of: SEM-V4_3-APPAREL-CLAIM-BOUNDARY-001
    capsule_question: 不能说身体结果时，内容还能怎样保留美感和使用价值？
    core_mechanism: 把结果承诺拆成观察句、条件体验句、搭配语境句和审美方向句；边界主导，创意只提供安全替代。
    observable_material: 腰线位置、外套开合、裤管垂坠、内搭比例、上下装颜色分界。
    creative_transfer: 将显瘦显高类冲动转为“线条更清楚、比例关系更明确、视觉重心更稳定”的观察路径。
    boundary_guardrail: 不得把主观体验写成直接观察，不得把身体效果写成保证。
    generative_options:
    - 观察句：腰线位置更清楚
    - 条件体验句：在上短下长搭配中更容易感到比例被拉开
    - 审美方向句：让视觉重心更克制地停在上半身
    failure_signal: 出现无条件身体结果、保证句或需平台法务来源的性能句时，转 source workorder。
    downstream_effect: 人审判断句子层级；L2 使用安全替代方向；不得进入 CandidatePack。
  - draft_id: SEM-V4_4-APPAREL-CLAIM-BOUNDARY-002
    revision_of: SEM-V4_3-APPAREL-CLAIM-BOUNDARY-002
    capsule_question: 缺少测试或标准时，舒适性能内容如何不失去表达空间？
    core_mechanism: 把性能词先降为体感条件和结构观察，再把需要证明的部分标记为 source workorder。
    observable_material: 面料触感、内里接触面、缝线位置、活动留量、衣摆回弹的可见状态。
    creative_transfer: 将抗皱、耐穿、透气等冲动转为“触感、活动余量、贴肤条件、使用场景”的安全表达。
    boundary_guardrail: 专家综合不能替代平台规则、测试方法或品牌政策来源。
    generative_options:
    - 观察句：面料表面更平整
    - 条件体验句：在长时间坐立切换时更关注留量
    - 审美方向句：把舒适感转为轻、缓、少束缚的画面节奏
    failure_signal: 出现检测证明、永久耐用、医学级或保证体验时必须阻断。
    downstream_effect: L2 只消费安全表达方向，人审处理证据层级，source workorder 追踪需证实主张。
  - draft_id: SEM-V4_4-DISPLAY-TO-CONTENT-001
    revision_of: SEM-V4_3-DISPLAY-TO-CONTENT-001
    capsule_question: 第一眼为什么停留，陈列区位如何转成内容角度？
    core_mechanism: 把区位信号拆成焦点、陪体、距离和停顿，再选择内容输出形态。
    observable_material: 前后层级、灯光边缘、挂通间距、材质反差、主搭和陪体的距离。
    creative_transfer: 从空间观察转译为内容角度、画面开场、说明顺序、导购提问和训练观察。
    boundary_guardrail: 不使用真实门店、真实人员或未授权素材；不生成面向发布的完整成稿。
    generative_options:
    - 短视频：先远景停留再近景解释
    - 小红书笔记：用主搭和陪体关系组织段落
    - 导购讲解卡：用第一眼焦点引出款式关系
    - 训练观察题：让新人找出停留点和陪体
    failure_signal: 只有拍摄前检查清单而没有内容角度转译时，不作为 V4.4 合格样本。
    downstream_effect: L3 生成执行资产候选；L2 提取内容角度；人审检查授权边界。
  - draft_id: SEM-V4_4-DISPLAY-TO-CONTENT-002
    revision_of: SEM-V4_3-DISPLAY-TO-CONTENT-002
    capsule_question: 哪个门店动作可变成内容片段，而不是普通整理动作？
    core_mechanism: 动作必须同时具备对象、前提、变化和结束标志，才可转成内容片段。
    observable_material: 整理衣摆、并排比较、递示衣架、手势停顿、视线从整体移向细节。
    creative_transfer: 把动作顺序转成内容角度和情绪节奏：为什么停、为什么比、为什么递给对方看。
    boundary_guardrail: 不虚构真实顾客反馈，不写真实人员故事，不输出面向发布的完整成稿。
    generative_options:
    - 短视频：动作前后对比
    - 笔记：把动作理由写成观察问题
    - 导购卡：用递示动作解释选择条件
    - 训练题：判断动作是否有结束标志
    failure_signal: 如果动作只剩执行步骤，没有内容角度和人类动机，则退回执行资产草案。
    downstream_effect: L3 获得动作槽位，L2 获得内容角度，人审检查是否虚构真实互动。
  - draft_id: SEM-V4_4-CONTROL-PLANE-GOVERNANCE-001
    revision_of: SEM-V4_3-CONTROL-PLANE-GOVERNANCE-001
    capsule_question: 什么状态必须阻断生成并进入 founder_review？
    core_mechanism: 当 source gap、建模冲突、风险敏感 claim 或 owner 不明时，路由优先级高于内容产出。
    observable_material: 可观察的是状态字段、ledger 写入、route target 和 reentry 条件，不是美学素材。
    creative_transfer: not_applicable_for_control_plane; this capsule protects generation quality by preventing false creative continuation.
    boundary_guardrail: 不得从 unresolved route 直接进入 batch generation、CandidatePack 或 KE。
    generative_options:
    - source gap 路由说明
    - founder_review 阻断说明
    - reentry 条件说明
    failure_signal: route target 不是 founder_review 或 ledger 缺失时必须失败。
    downstream_effect: checker 和人审使用本胶囊防止假绿；不作为创意质量 pass 计数。
  - draft_id: SEM-V4_4-CONTROL-PLANE-GOVERNANCE-002
    revision_of: SEM-V4_3-CONTROL-PLANE-GOVERNANCE-002
    capsule_question: 研究资产什么时候只能形成 review-only 绑定候选？
    core_mechanism: 绑定需要来源路径、owner、用途边界和非生产封印同时存在；缺任一项都不能向生产链路移动。
    observable_material: 可观察的是 source path digest、owner 字段、review_only 标签和 not_production_ready 状态。
    creative_transfer: not_applicable_for_control_plane; it keeps creative materials from being treated as production assets before review.
    boundary_guardrail: 不得写 CandidatePack、KE、RAG、DIFY 或生产运行文件。
    generative_options:
    - review-only stub 说明
    - binding block reason
    - reentry review condition
    failure_signal: 缺 source、owner 或非生产封印时绑定候选无效。
    downstream_effect: GovernanceOutbox 接收候选，checker 阻断生产态误用；不作为创意质量 pass 计数。
