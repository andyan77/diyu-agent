    artifact_kind: general_knowledge_candidate
    canonical_body_zh: 'capsule_question：同一组素材为什么可以产生多个叙事角度，而不是只套一个故事模板？


      core_mechanism：先拆证据强度，再选择弧线强度；证据只够一个瞬间时，用留白和观察保留情绪，不补因果。


      observable_material：衣物边线、袖口折痕、面料垂坠、手把衣架推回原位的动作、光线落在表面的停顿。


      creative_transfer：把这些可观察材料转成“先看见一个细节，再判断它能不能撑起故事”的内容角度。


      boundary_guardrail：情绪只能作为表达方向，不能当作品牌事实、顾客反馈或效果证据。


      generative_options：过程弧线：从材料细节进入选择理由；选择弧线：从取舍动作进入价值表达；留白观察：只保留一个可见瞬间和一个开放问题


      failure_signal：只有情绪词、没有对象动作或证据强度时，不使用故事弧线。


      downstream_effect：L2 可据此生成选题问题；L3 可生成素材采集提示；人审判断情绪是否越界为事实。'
