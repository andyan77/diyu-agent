    canonical_body_zh: 'capsule_question：什么状态必须阻断生成并进入 founder_review？


      core_mechanism：当 source gap、建模冲突、风险敏感 claim 或 owner 不明时，路由优先级高于内容产出。


      observable_material：可观察的是状态字段、ledger 写入、route target 和 reentry 条件，不是美学素材。


      creative_transfer：not_applicable_for_control_plane; this capsule protects generation quality by preventing false creative continuation.


      boundary_guardrail：不得从 unresolved route 直接进入 batch generation、CandidatePack 或 KE。


      generative_options：source gap 路由说明；founder_review 阻断说明；reentry 条件说明


      failure_signal：route target 不是 founder_review 或 ledger 缺失时必须失败。


      downstream_effect：checker 和人审使用本胶囊防止假绿；不作为创意质量 pass 计数。'
