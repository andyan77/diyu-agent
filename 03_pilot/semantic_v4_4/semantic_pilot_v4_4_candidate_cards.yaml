    canonical_body_zh: 'capsule_question：缺少测试或标准时，舒适性能内容如何不失去表达空间？


      core_mechanism：把性能词先降为体感条件和结构观察，再把需要证明的部分标记为 source workorder。


      observable_material：面料触感、内里接触面、缝线位置、活动留量、衣摆回弹的可见状态。


      creative_transfer：将抗皱、耐穿、透气等冲动转为“触感、活动余量、贴肤条件、使用场景”的安全表达。


      boundary_guardrail：专家综合不能替代平台规则、测试方法或品牌政策来源。


      generative_options：观察句：面料表面更平整；条件体验句：在长时间坐立切换时更关注留量；审美方向句：把舒适感转为轻、缓、少束缚的画面节奏


      failure_signal：出现检测证明、永久耐用、医学级或保证体验时必须阻断。


      downstream_effect：L2 只消费安全表达方向，人审处理证据层级，source workorder 追踪需证实主张。'
