    canonical_body_zh: 'capsule_question：不能说身体结果时，内容还能怎样保留美感和使用价值？


      core_mechanism：把结果承诺拆成观察句、条件体验句、搭配语境句和审美方向句；边界主导，创意只提供安全替代。


      observable_material：腰线位置、外套开合、裤管垂坠、内搭比例、上下装颜色分界。


      creative_transfer：将显瘦显高类冲动转为“线条更清楚、比例关系更明确、视觉重心更稳定”的观察路径。


      boundary_guardrail：不得把主观体验写成直接观察，不得把身体效果写成保证。


      generative_options：观察句：腰线位置更清楚；条件体验句：在上短下长搭配中更容易感到比例被拉开；审美方向句：让视觉重心更克制地停在上半身


      failure_signal：出现无条件身体结果、保证句或需平台法务来源的性能句时，转 source workorder。


      downstream_effect：人审判断句子层级；L2 使用安全替代方向；不得进入 CandidatePack。'
