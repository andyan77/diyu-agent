    artifact_kind: execution_asset_outbox_candidate
    canonical_body_zh: 'capsule_question：哪个门店动作可变成内容片段，而不是普通整理动作？


      core_mechanism：动作必须同时具备对象、前提、变化和结束标志，才可转成内容片段。


      observable_material：整理衣摆、并排比较、递示衣架、手势停顿、视线从整体移向细节。


      creative_transfer：把动作顺序转成内容角度和情绪节奏：为什么停、为什么比、为什么递给对方看。


      boundary_guardrail：不虚构真实顾客反馈，不写真实人员故事，不输出面向发布的完整成稿。


      generative_options：短视频：动作前后对比；笔记：把动作理由写成观察问题；导购卡：用递示动作解释选择条件；训练题：判断动作是否有结束标志


      failure_signal：如果动作只剩执行步骤，没有内容角度和人类动机，则退回执行资产草案。


      downstream_effect：L3 获得动作槽位，L2 获得内容角度，人审检查是否虚构真实互动。'
