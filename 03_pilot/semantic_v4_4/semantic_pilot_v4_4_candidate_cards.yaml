    canonical_body_zh: 'capsule_question：第一眼为什么停留，陈列区位如何转成内容角度？


      core_mechanism：把区位信号拆成焦点、陪体、距离和停顿，再选择内容输出形态。


      observable_material：前后层级、灯光边缘、挂通间距、材质反差、主搭和陪体的距离。


      creative_transfer：从空间观察转译为内容角度、画面开场、说明顺序、导购提问和训练观察。


      boundary_guardrail：不使用真实门店、真实人员或未授权素材；不生成面向发布的完整成稿。


      generative_options：短视频：先远景停留再近景解释；小红书笔记：用主搭和陪体关系组织段落；导购讲解卡：用第一眼焦点引出款式关系；训练观察题：让新人找出停留点和陪体


      failure_signal：只有拍摄前检查清单而没有内容角度转译时，不作为 V4.4 合格样本。


      downstream_effect：L3 生成执行资产候选；L2 提取内容角度；人审检查授权边界。'
