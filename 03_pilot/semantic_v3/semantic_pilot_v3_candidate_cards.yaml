          text: 版型比较不触碰身体效果讨论的不是一句单品卖点，而是一条可复用的服装零售判断。它以直筒裤、锥形裤、短款下摆为对象，把牛仔斜纹与垂顺裤料、裤腿线条、裤脚长度、腰臀空间和按几何线条分组的裤装墙放在同一个工作情境里理解。该知识单元先确认服装或规则本身能被观察到什么，再判断这些观察可以怎样进入内容、陈列、导购或流程控制。它的核心不是追求更响亮的表达，而是让操作者知道什么可以写、什么只能作为线索、什么必须等待证据。
          proposition_refs:
          - definition
        - heading: 机制与适用条件
          text: 机制上，版型比较如何避开身体效果成立，是因为店铺里的视觉安排、材料细节和内容承诺之间存在层级关系。当用裤型线条和下摆长度做对照时，操作者可以执行的动作是比较服装几何，而不是评价穿着者身体。如果直接跳到形容词或结果承诺，正文会失去服装对象的约束；如果先说明对象、场景、动作和边界，读者就能分辨这是方法、规则还是待证事实。这个机制要求内容把观察链条写清楚，而不是用情绪化赞美替代判断。适用条件是：任务中已经能看到直筒裤、锥形裤、短款下摆，并且需要把它转成可审的内容或流程判断；同时，按几何线条分组的裤装墙提供了足够的上下文，使操作者能说明为什么要这样摆放、这样描述或这样降级。不适用条件是：只有标题、风格词、主观感受或未经来源确认的结论；也不适用于需要真实检测、真实销量、真实门店反馈、真实人物经验才能成立的说法。
          proposition_refs:
          - applicable_when
          - output_effect
        - heading: 证据边界与误用风险
          text: 证据边界是本单元最重要的部分。可以说裤型线条变化，不能承诺身体比例改变、视觉拉长或穿着者身形改变。这意味着正文可以处理可见结构、动作顺序、展示层级和说法强度，但不能把观察改写成性能事实、身体结果、真实实例或已验证承诺。若需要更强结论，正确做法是进入来源缺口、决策包或人工复核，而不是在正文里补想象出来的事实。典型误用是：把版型选择写成身体排名或身材修饰。一旦出现这种误用，文本看似完整，实际会把边界、证据和归属混在一起，使后续批次复制出大量只换名称的内容。修正方式是回到对象、场景、动作、证据要求和输出影响五个环节，逐项确认每一句话是否由当前服装任务支撑。只有这些环节同时成立，版型比较不触碰身体效果才适合进入下一轮审查，而不是直接成为可发布知识或下游资产。
          proposition_refs:
          - not_applicable_when
          - risk_boundary
          - evidence_requirement
        - heading: 输出影响
          text: 对输出的影响是：形成中性版型比较规则。对于内容生产，它能减少同质化标题和空泛推荐；对于陈列或导购，它能让动作顺序、物件位置和话术理由互相对应；对于审查，它能把可继续加工的观察文本与必须阻断的硬说法分开。操作者因此可以在不制造事实的前提下，保留服装行业判断的密度。
          proposition_refs:
          - output_effect
        body_proposition_refs:
        - definition
        - applicable_when
        - not_applicable_when
        - output_effect
        - risk_boundary
        - evidence_requirement
