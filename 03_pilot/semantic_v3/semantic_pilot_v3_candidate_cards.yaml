          text: 证据边界是本单元最重要的部分。真实舒适感需要评测或反馈，未审查时只能说衣物线索。这意味着正文可以处理可见结构、动作顺序、展示层级和说法强度，但不能把观察改写成性能事实、身体结果、真实实例或已验证承诺。若需要更强结论，正确做法是进入来源缺口、决策包或人工复核，而不是在正文里补想象出来的事实。典型误用是：直接替穿着者声明舒适、轻松、无负担。一旦出现这种误用，文本看似完整，实际会把边界、证据和归属混在一起，使后续批次复制出大量只换名称的内容。修正方式是回到对象、场景、动作、证据要求和输出影响五个环节，逐项确认每一句话是否由当前服装任务支撑。只有这些环节同时成立，舒适措辞降级路径才适合进入下一轮审查，而不是直接成为可发布知识或下游资产。
