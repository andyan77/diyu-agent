        - heading: 对象定义
          text: 控制面规则禁止混入通用知识讨论的不是一句单品卖点，而是一条可复用的服装零售判断。它以路由规则、状态字段、生成权限为对象，把不适用面料属性、不适用版型观察和生成准备线的状态管理界面放在同一个工作情境里理解。该知识单元先确认服装或规则本身能被观察到什么，再判断这些观察可以怎样进入内容、陈列、导购或流程控制。它的核心不是追求更响亮的表达，而是让操作者知道什么可以写、什么只能作为线索、什么必须等待证据。
