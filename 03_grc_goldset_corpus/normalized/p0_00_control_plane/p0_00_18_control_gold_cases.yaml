      - "HG-002 no_template_reuse"
      - "HG-003 no_governance_text_in_domain_body"
      - "HG-004 owner_storage_artifact_alignment"
      - "HG-005 epistemic_label_alignment"
      - "HG-006 relation_hint_boundary"
