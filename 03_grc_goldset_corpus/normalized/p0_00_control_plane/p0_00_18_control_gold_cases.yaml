      cluster_id: "mkc_001"
      cluster_title: "入口槽位契约"
      case_type: "positive_control_gold"
      semantic_owner: "governance_control_plane"
      storage_target: "ControlPlaneContractSource"
      artifact_kind: "route_contract"
      body_form: "input_slot_contract"
      control_body:
        purpose: "把用户请求先规整为可路由槽位，而不是直接生成领域正文。"
        required_slots:
          - "request_intent"
          - "requested_output_type"
          - "material_type"
          - "brand_instance_fact_present"
          - "claim_risk_level"
          - "evidence_anchor_present"
          - "requested_asset_type"
          - "target_capability_hint"
        slot_status_values:
          - "complete"
          - "partial"
          - "missing"
          - "unsafe"
        route_outputs:
          - "slot_completeness_report"
          - "initial_route_hint"
          - "missing_slot_list"
          - "blocking_or_gap_signal"
      mechanism_chain:
        - "request_payload -> required_slot_scan"
        - "slot_completeness -> route_ladder"
        - "instance_fact_presence -> blocking_or_gap"
        - "claim_risk_level -> evidence_checker"
        - "requested_asset_type -> asset_binding_gate"
      expected_judge_result:
        expected_verdict: "accept_gold_candidate"
        expected_score_floor: 108
        expected_failure_codes: []
      codex_usage:
        use_as_reference_for:
          - "input normalizer"
          - "slot completeness checker"
          - "prevent direct domain body generation"
        must_copy_logic: true
        must_not_copy_phrasing: true

