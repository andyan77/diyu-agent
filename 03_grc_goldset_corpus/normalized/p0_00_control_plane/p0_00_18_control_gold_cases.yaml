      cluster_title: "入口槽位契约"
      case_type: "anti_control_gold"
      semantic_owner: "governance_control_plane"
      storage_target: "ControlPlaneContractSource"
      artifact_kind: "route_contract"
      body_form: "invalid_input_slot_contract"
      control_body:
        invalid_pattern: "把真实品牌故事、商品库存、门店照片、顾客反馈直接设计成通用入口槽位，并默认进入 GeneralKnowledgeBase。"
        why_invalid:
          - "真实品牌字段不能被抽象成通用槽位"
          - "品牌实例事实不能污染 GeneralKnowledge"
          - "入口槽位不能绕过 claim / owner / source gate"
        reject_signal:
          - "brand_instance_fact_present 被忽略"
          - "slot_completeness 未定义"
          - "缺少 blocking_or_gap_signal"
      expected_judge_result:
        expected_verdict: "reject_or_blocking_revise"
        expected_score_floor: 0
        expected_failure_codes:
          - "F14_BRAND_FACT_POLLUTION"
          - "F01_NO_CLUSTER_SPECIFIC_MECHANISM"
      codex_usage:
        use_as_reference_for:
          - "reject brand fact as generic slot"
          - "anti-gold owner pollution"
        must_copy_logic: true
        must_not_copy_phrasing: true

