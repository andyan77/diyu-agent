      cluster_title: "入口槽位契约"
      case_type: "borderline_control_repair"
      semantic_owner: "governance_control_plane"
      storage_target: "ControlPlaneContractSource"
      artifact_kind: "route_contract"
      body_form: "input_slot_contract_repair"
      control_body:
        borderline_pattern: "已列出 request_intent、material_type、claim_risk_level，但没有区分品牌事实槽位与通用方法槽位。"
        repair_required:
