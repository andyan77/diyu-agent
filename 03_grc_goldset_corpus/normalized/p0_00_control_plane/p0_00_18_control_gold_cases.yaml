    - case_id: "GRC-P0-00-MKC002-POS-001"
      cluster_id: "mkc_002"
      cluster_title: "路由阶梯与降级触发"
      case_type: "positive_control_gold"
      semantic_owner: "governance_control_plane"
      storage_target: "ControlPlaneContractSource"
      artifact_kind: "control_plane_candidate"
      body_form: "route_ladder_contract"
      control_body:
        purpose: "根据 checker_result 决定单能力路由、组合路由、降级、source_gap、decision_required 或 hard block。"
        route_levels:
          - level: "L0_BLOCK"
            trigger: "unsafe_brand_fact_or_privacy_or_prohibited_claim"
            output: "blocked"
          - level: "L1_SINGLE_CAPABILITY"
            trigger: "clear_primary_capability"
            output: "single_capability_route"
          - level: "L2_COMPOSITION_CHECK"
            trigger: "multi_capability_request"
            output: "composition_check"
          - level: "L3_SOURCE_GAP"
            trigger: "evidence_need_missing"
            output: "source_gap_record"
          - level: "L4_DECISION_REQUIRED"
            trigger: "ontology_conflict_or_owner_ambiguity"
            output: "decision_packet"
        degradation_types:
          - "hard_block"
          - "source_gap"
          - "review_only"
          - "downgrade_to_observation"
          - "decision_required"
      mechanism_chain:
        - "checker_result -> route_decision"
        - "evidence_need_missing -> source_gap"
        - "ontology_conflict -> decision_required"
        - "risk_sensitive_override -> founder_review"
      expected_judge_result:
        expected_verdict: "accept_gold_candidate"
        expected_score_floor: 108
        expected_failure_codes: []

