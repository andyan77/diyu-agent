- case_id: GRC-P0-03-MKC021-POS-001
  batch_id: GRC-P0-03-FABRIC-CRAFT-CLAIM-001
  capability_group: P0-03
  cluster_id: mkc_021
  cluster_title: 同类比较维度与禁比边界
  cluster_owner: P0-03
  source_cluster_refs: &id013
  - P0-03-RS01-CL03
  case_type: positive_gold
  scope_control:
    scope_type: GoldReferenceCase
    target_bucket: EvaluationOnly
    not_candidatepack: true
    not_ke_truth: true
    not_serving: true
    not_rag: true
    not_dify: true
    not_production: true
  routing_contract:
    semantic_owner: apparel_claim_boundary
    storage_target: EvidencePolicyOutbox
    artifact_kind: evidence_policy_candidate
    allowed_registry: *id003
    forbidden_storage_targets: *id004
  body_contract:
    body_form: claim_boundary_body
    gold_body: >-
      同类比较只能比较同一层级中可观察或可记录的差异。两件衬衫可以比较领型、肩线、门襟、衣长、袖口、厚薄观感和面料表面纹理；两条裤子可以比较腰位、裤长、裤腿宽窄、褶量、垂落线和活动空间；两件外套可以比较开合方式、领口结构、内搭容量和层次厚度。比较句必须停在结构差异和使用情境，不得从“更短、更挺、更厚、更宽松”直接推出更舒服、更耐穿、更显瘦、更保暖或更高级。未知项要显示为待补依据，不能用主观判断填补。
    mechanism_chain: &id012
    - comparison_dimension -> allowed_observation
    - comparison_dimension -> prohibited_effect_claim
    - unknown_comparison_item -> downgrade_expression
    - comparative_superiority -> source_required_claim
    apparel_domain_anchors:
    - 长度
    - 厚薄
    - 版型
    - 可见工艺
    - 使用场景
    output_effect: 作为该簇合格正文机制参照，约束生成时先写对象与机制，再写边界和降级路径。
    failure_signal: 缺少该簇独有机制、把观察外推为效果承诺、或混入品牌实例事实。
    repair_instruction_if_failed: 补足对象、机制、边界与降级路径；删除实例事实和无依据效果词。
  epistemic_contract:
    observation_statements: &id014
    - 长度、厚薄、结构、版型和可见工艺可以作为同类比较维度。
    - 未知项应显示为待补依据。
    method_claims: &id015
    - 比较只能停留在可观察维度或有依据维度。
    - 优劣、效果和性能比较必须降级或补证。
    creative_hypotheses: &id016
    - 同类比较可以转化为选择条件说明。
    source_required_claims: &id017
    - 耐用比较
    - 舒适比较
    - 性能比较
    - 竞品优劣
    - 上一代效果比较
    prohibited_claims: &id018
    - 无证据更耐穿
    - 无证据更显瘦
    - 无证据更舒服
    - 无证据竞品优劣
    downgrade_paths: &id019
    - 效果比较 -> 结构差异
    - 优劣比较 -> 条件说明
    - 未知比较 -> 待补依据
  boundary_contract:
    do_not_include:
    - specific brand fact
    - specific founder story
    - specific SKU
    - specific price
    - specific inventory
    - specific store event
    - real customer feedback
    - private SOP
    - unauthorized staff/customer/persona fact
    - real supplier or factory fact
    - real testing or certification fact
    anti_hallucination_guard: 不得编造真实品牌、商品、门店、顾客、供应商、工厂、检测、认证、库存、价格或护理结果；涉及效果、性能、耐用和品质时必须按观察、待补依据、禁出三层处理。
  sidecar_contract:
    sidecar_allowed: true
    sidecar_fields:
    - review_notes
    - batch_metadata
    - judge_usage
    - readiness_assertions
    - relation_design_hints
    - source_gap_notes
    forbidden_in_gold_body:
    - judge
    - brief
    - batch
    - CandidatePack
    - KE_ready
    - RAG_ready
    - DIFY_ready
    - 人审
    - 评测
    - gold candidate
    - W7
    - 第几批
    - production-ready
    - readiness
  relation_contract:
    relation_status: design_hint_not_ontology_edge
    relation_hints: *id012
    formal_ontology_edge_allowed: false
    human_review_required_for_relation: true
  readiness_flags:
    candidatepack_ready: false
    KE_ready: false
    serving_ready: false
    RAG_ready: false
    DIFY_ready: false
    production_ready: false
    generation_allowed: false
  expected_judge_result:
    expected_verdict: accept_gold_candidate
    expected_hard_gates: *id011
    expected_failure_codes: []
    expected_score_floor: 108
  codex_usage:
    use_as_reference_for:
