gold_reference_cases:
- case_id: GRC-P0-03-MKC020-POS-001
  batch_id: GRC-P0-03-FABRIC-CRAFT-CLAIM-001
  capability_group: P0-03
  cluster_id: mkc_020
  cluster_title: 品类解释与属性槽位骨架
  cluster_owner: P0-03
  source_cluster_refs: &id002
  - P0-03-RS01-CL01
  - P0-03-RS01-CL02
  case_type: positive_gold
  scope_control:
    scope_type: GoldReferenceCase
    target_bucket: EvaluationOnly
    not_candidatepack: true
    not_ke_truth: true
    not_serving: true
    not_rag: true
    not_dify: true
    not_production: true
  routing_contract:
    semantic_owner: apparel_domain_method
    storage_target: GeneralKnowledgeBase
    artifact_kind: general_knowledge_candidate
    allowed_registry: &id003
    - gold_reference_case_registry
    - judge_calibration_registry
    forbidden_storage_targets: &id004
    - KE truth source
    - Serving Projection
    - RAG Context Bundle
    - DIFY
  body_contract:
    body_form: domain_method_body
    gold_body: >-
      品类解释要先确定对象处在服装结构中的位置，再展开属性槽位。上装可以进入领型、袖型、门襟、肩线、衣长、面料表面和穿着层次；下装可以进入腰位、裤长或裙长、裤腿或裙摆轮廓、开衩、褶量和活动空间；连衣类要同时处理上半身连接点、腰线位置、裙摆结构和整体比例；外搭类还要增加开合方式、厚薄层次和内搭容纳关系。这个骨架只说明“可观察什么、可补充什么、哪些表达要停住”，不能替代具体商品资料。若没有款号、价格、库存、上新安排或品牌产品线材料，正文只能保留品类—属性—边界三层，不得把通用品类写成某个品牌正在销售的事实。
    mechanism_chain: &id001
    - category_family -> attribute_slot_group
    - attribute_slot_group -> claim_boundary_entry
    - category_description -> sku_fact_cutoff
    - category_slot_gap -> neutral_question_prompt
    apparel_domain_anchors:
    - 上装
    - 下装
    - 连衣类
    - 外搭类
    - 属性槽位
    output_effect: 作为该簇合格正文机制参照，约束生成时先写对象与机制，再写边界和降级路径。
    failure_signal: 缺少该簇独有机制、把观察外推为效果承诺、或混入品牌实例事实。
    repair_instruction_if_failed: 补足对象、机制、边界与降级路径；删除实例事实和无依据效果词。
  epistemic_contract:
    observation_statements: &id005
    - 上装、下装、连衣类、外搭类可以对应不同属性槽位。
    - 属性槽位只描述可观察结构与待补字段。
    method_claims: &id006
    - 品类解释应按品类—属性—边界组织。
    - 通用品类方法不得写成品牌商品事实。
    creative_hypotheses: &id007
    - 同一品类可以因属性槽位不同形成多种内容入口。
    source_required_claims: &id008
    - 真实 SKU
    - 真实价格
    - 真实库存
    - 真实上新节奏
    - 真实品牌产品线
    prohibited_claims: &id009
    - 把通用品类写成具体品牌商品事实
    - 无依据主推款描述
    - 无依据库存与价格表达
    downgrade_paths: &id010
    - 具体商品事实 -> 品类槽位
    - 品牌产品线 -> 待补商品资料
    - 库存价格 -> 删除
  boundary_contract:
    do_not_include:
    - specific brand fact
    - specific founder story
    - specific SKU
    - specific price
    - specific inventory
    - specific store event
    - real customer feedback
    - private SOP
    - unauthorized staff/customer/persona fact
    - real supplier or factory fact
    - real testing or certification fact
    anti_hallucination_guard: 不得编造真实品牌、商品、门店、顾客、供应商、工厂、检测、认证、库存、价格或护理结果；涉及效果、性能、耐用和品质时必须按观察、待补依据、禁出三层处理。
  sidecar_contract:
    sidecar_allowed: true
    sidecar_fields:
    - review_notes
    - batch_metadata
    - judge_usage
    - readiness_assertions
    - relation_design_hints
    - source_gap_notes
    forbidden_in_gold_body:
    - judge
    - brief
    - batch
    - CandidatePack
    - KE_ready
    - RAG_ready
    - DIFY_ready
    - 人审
    - 评测
    - gold candidate
    - W7
    - 第几批
    - production-ready
    - readiness
  relation_contract:
    relation_status: design_hint_not_ontology_edge
    relation_hints: *id001
    formal_ontology_edge_allowed: false
    human_review_required_for_relation: true
  readiness_flags:
    candidatepack_ready: false
    KE_ready: false
    serving_ready: false
    RAG_ready: false
    DIFY_ready: false
    production_ready: false
    generation_allowed: false
  expected_judge_result:
    expected_verdict: accept_gold_candidate
    expected_hard_gates: &id011
    - HG-001
    - HG-002
    - HG-003
    - HG-004
    - HG-005
    - HG-006
    - HG-007
    - HG-008
    expected_failure_codes: []
    expected_score_floor: 108
  codex_usage:
    use_as_reference_for:
    - category_slot_skeleton
    - sku_fact_cutoff
    - attribute_boundary
    must_copy_structure: false
    must_copy_logic: true
    must_not_copy_phrasing: true
