  batch_id: GRC-P0-03-FABRIC-CRAFT-CLAIM-001
  capability_group: P0-03
  cluster_id: mkc_029
  cluster_title: 工艺品质内容的可拍摄表达
  cluster_owner: P0-03
  source_cluster_refs: &id077
  - P0-03-RS04-CL04
  case_type: positive_gold
  scope_control:
    scope_type: GoldReferenceCase
    target_bucket: EvaluationOnly
    not_candidatepack: true
    not_ke_truth: true
    not_serving: true
    not_rag: true
    not_dify: true
    not_production: true
  routing_contract:
    semantic_owner: apparel_domain_method
    storage_target: GeneralKnowledgeBase
    artifact_kind: general_knowledge_candidate
    allowed_registry: *id003
    forbidden_storage_targets: *id004
  body_contract:
    body_form: domain_method_body
    gold_body: >-
      工艺品质内容的可拍摄表达要把对象、镜头、解释槽位和边界分开。对象可以是领口压线、袖口收口、门襟层次、包边转角、纽扣孔、里布衔接、拼接处、面料纹理和下摆处理；镜头可以选择远景定位服装位置，中景说明结构关系，近景捕捉线迹、边缘和转角；动作可以是翻开、摊平、对比、轻拉、转向光线或展示内外层。解释槽位只说明“看到什么、它位于哪里、连接了什么、画面如何呈现”，不能把镜头细节写成耐用、舒适或整体品质证明。
    mechanism_chain: &id076
    - object_cue -> camera_cue
    - camera_cue -> explanation_slot
    - explanation_slot -> claim_boundary
    - process_detail -> filmability
    apparel_domain_anchors:
    - 对象线索
    - 镜头线索
    - 解释槽位
    - 近景
    - 边界
    output_effect: 作为该簇合格正文机制参照，约束生成时先写对象与机制，再写边界和降级路径。
    failure_signal: 缺少该簇独有机制、把观察外推为效果承诺、或混入品牌实例事实。
    repair_instruction_if_failed: 补足对象、机制、边界与降级路径；删除实例事实和无依据效果词。
  epistemic_contract:
    observation_statements: &id078
    - 领口、袖口、门襟、包边、纽扣孔和面料纹理都可被拍摄。
    - 远景、中景、近景承载不同说明任务。
    method_claims: &id079
    - 可拍摄表达应区分对象、镜头、解释槽位和边界。
    - 镜头细节不能自动证明质量。
    creative_hypotheses: &id080
    - 同一工艺节点可通过不同镜头层级形成不同解释顺序。
    source_required_claims: &id081
    - 真实耐用结果
    - 真实舒适体验
    - 整体品质证明
    prohibited_claims: &id082
    - 用镜头证明耐穿
    - 用细节证明舒适
    - 把拍摄对象写成质量保证
    downgrade_paths: &id083
    - 质量证明 -> 解释槽位
    - 拍摄脚本 -> 方法节点
    - 耐用结论 -> 待补依据
