    artifact_kind: general_knowledge_candidate
    allowed_registry: *id003
    forbidden_storage_targets: *id004
  body_contract:
    body_form: domain_method_body
    gold_body: >-
      版型说明要区分“版型结构”和“廓形轮廓”。版型关注衣片分割、肩线位置、腰线位置、松量、长度和剪裁路径；廓形关注外轮廓在画面中形成的直线、弧线、A形、H形、收腰、放量或箱形关系。正文可以说肩线位置改变上装重心，衣长改变上下装衔接，裤腿宽窄改变下装轮廓，松量影响衣物与身体之间的空间关系。它不能把这些结构观察直接写成显瘦、显高、遮肉、修饰某部位或适合所有身材。
    mechanism_chain: &id036
    - fit_term -> structural_observation
    - silhouette_line -> visual_relation
    - ease_amount -> wearing_condition_note
    - body_effect_word -> claim_boundary
    apparel_domain_anchors:
    - 肩线
    - 腰线
    - 衣长
    - 松量
    - 廓形
    output_effect: 作为该簇合格正文机制参照，约束生成时先写对象与机制，再写边界和降级路径。
    failure_signal: 缺少该簇独有机制、把观察外推为效果承诺、或混入品牌实例事实。
    repair_instruction_if_failed: 补足对象、机制、边界与降级路径；删除实例事实和无依据效果词。
  epistemic_contract:
    observation_statements: &id038
    - 版型结构和廓形轮廓需要区分。
    - 长度、宽窄、松量和重心可以作为结构观察。
    method_claims: &id039
    - 版型术语应连接结构节点，不直接承诺身体效果。
    - 视觉关系可以写，身体结果不能保证。
    creative_hypotheses: &id040
    - 同一廓形可因长度与松量不同形成不同解释入口。
    source_required_claims: &id041
    - 真实试穿效果
    - 适合所有身材
    - 显瘦显高结果
    prohibited_claims: &id042
    - 版型一定遮肉
    - 所有人适合
    - 无依据修饰身体部位
    downgrade_paths: &id043
    - 显瘦显高 -> 视觉关系
    - 遮肉 -> 外轮廓变化
    - 适合所有人 -> 条件表达
