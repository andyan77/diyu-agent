    gold_body: >-
      工艺讲解应从可见节点开始，而不是从质量结论开始。可观察节点包括领口压线、门襟结构、袖口收口、下摆处理、口袋边缘、纽扣孔、里布衔接、包边、明线和拼接处。讲解顺序可以是外观位置、结构作用、细节观察、表达边界：先指出节点在哪里，再说明它连接了哪些衣片或边缘，接着描述线迹、转角、贴合、层次和收口，最后停在观察线索。工艺名称不能自动证明功能、耐用、高端或专业，也不能补写工厂流程、质检结果或认证状态。
    mechanism_chain: &id044
    - visible_craft_node -> explanation_order
    - construction_detail -> observation_cue
    - craft_name -> function_claim_cutoff
    - process_story_gap -> source_required_claim
    apparel_domain_anchors:
    - 领口压线
    - 门襟
    - 袖口
    - 包边
    - 纽扣孔
    output_effect: 作为该簇合格正文机制参照，约束生成时先写对象与机制，再写边界和降级路径。
    failure_signal: 缺少该簇独有机制、把观察外推为效果承诺、或混入品牌实例事实。
    repair_instruction_if_failed: 补足对象、机制、边界与降级路径；删除实例事实和无依据效果词。
  epistemic_contract:
    observation_statements: &id046
    - 线迹、包边、门襟、袖口和里布衔接属于可见工艺节点。
    - 工艺节点可按外观、结构、细节顺序讲解。
    method_claims: &id047
    - 工艺讲解应停在观察线索，不能自动上升为质量证明。
    - 工艺故事需要来源，不可补写流程。
    creative_hypotheses: &id048
    - 工艺节点可以形成细节讲解顺序。
