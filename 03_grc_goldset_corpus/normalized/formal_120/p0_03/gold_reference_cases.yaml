  capability_group: P0-03
  cluster_id: mkc_024
  cluster_title: 版型廓形剪裁术语
  cluster_owner: P0-03
  source_cluster_refs: &id037
  - P0-03-RS02-CL03
  case_type: positive_gold
  scope_control:
    scope_type: GoldReferenceCase
