  body_contract:
    body_form: evidence_policy_body
    gold_body: >-
      品质观察项必须先路由到证明类型，而不是直接形成整体保证。线迹平整、边缘收口、纽扣孔形态、里布衔接、拼接对位、面料表面稳定性都属于局部观察；它们可以提示需要观察哪些位置，但不能单独证明整体品质。若要写认证、执行标准、检测结果或耐用等级，应进入更高证明类型，需要明确来源。若只有镜头细节，只能写成“可观察线索”；若有工艺说明，可写成“方法说明”；若有标准或测试，才可进入强证明表达。路由规则是观察先降级，证明另取源，局部不能替代整体。
    mechanism_chain: &id068
    - quality_observation -> proof_type
    - proof_type -> claim_routing
    - certification_signal -> higher_evidence_need
    - unsupported_proof -> source_gap
    apparel_domain_anchors:
    - 线迹
    - 收口
    - 拼接
    - proof_type
    - 局部观察
    output_effect: 作为该簇合格正文机制参照，约束生成时先写对象与机制，再写边界和降级路径。
    failure_signal: 缺少该簇独有机制、把观察外推为效果承诺、或混入品牌实例事实。
