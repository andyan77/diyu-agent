  epistemic_contract:
    observation_statements: &id070
    - 线迹、收口、纽扣孔、拼接和里布属于局部观察项。
    - 局部观察不能直接证明整体品质。
    method_claims: &id071
    - quality_observation 需要先连接 proof_type。
    - 认证、标准、检测类表达应被路由到更高证明要求。
    creative_hypotheses: &id072
    - 品质观察项可以形成拍摄和讲解清单。
    source_required_claims: &id073
    - 真实证书
    - 真实检测结果
    - 真实执行标准
    - 真实质检结论
