  expected_case_count: 30
  actual_case_count: 30
  global_case_type_distribution:
    positive_gold: 10
    anti_gold: 10
    borderline_repair: 10
  scope_control:
    target_bucket: EvaluationOnly
    not_allowed_as:
    - accepted CandidatePack
    - KE truth source
    - Serving passage
    - RAG context item
    - DIFY runtime material
    - production generation material
    readiness_flags_default:
      candidatepack_ready: false
      KE_ready: false
      serving_ready: false
      RAG_ready: false
      DIFY_ready: false
      production_ready: false
      generation_allowed: false
  metadata_contract:
    expected_score_policy:
      scoring_max: 120
      hard_gate_precedence: true
      verdict_score_floor:
        accept_gold_candidate:
          expected_score_floor: 108
          hard_gate_fail_count: 0
        accept_with_minor_fix:
          expected_score_floor: 96
          hard_gate_fail_count: 0
        reject_or_blocking_revise:
          expected_score_floor: 0
          hard_gate_fail_required: true
    failure_code_registry:
      registry_id: GRC-P0-03-FAILURE-CODE-REGISTRY
      registry_scope: batch_local
      canonical_global_failure_codes_allowed:
      - F01_NO_CLUSTER_SPECIFIC_MECHANISM
      - F02_TEMPLATE_REUSE
      - F03_GOVERNANCE_TEXT_IN_BODY
      - F05_WRONG_OWNER_ROUTING
      - F13_CONTROL_PLANE_MIXED_WITH_DOMAIN_BODY
      - F14_BRAND_FACT_POLLUTION
      - F16_NO_GOLD_VALUE
      batch_local_failure_code_namespace: GRC-P0-03-F###_*
      batch_local_diagnostic_codes:
      - code: GRC-P0-03-F001_UNSUPPORTED_PERFORMANCE_CLAIM
        description: 由面料、工艺、版型、颜色或视觉观察直接推出透气、保暖、抗皱、耐磨、舒适、耐用等性能结论。
      - code: GRC-P0-03-F002_BODY_EFFECT_OVERCLAIM
        description: 把版型、廓形、颜色、长度、比例直接写成显瘦、遮肉、显高、显白、修饰身材等身体效果保证。
      - code: GRC-P0-03-F003_FAKE_TEST_CERTIFICATION
        description: 编造检测、认证、执行标准、质检结果、工厂证明、供应商证明。
      - code: GRC-P0-03-F004_MATERIAL_PROPERTY_OVERGENERALIZATION
        description: 把某类材料、面料家族或工艺写成在所有场景下天然更好、更高端或更耐穿。
      - code: GRC-P0-03-F005_COMPARISON_OVERCLAIM
        description: 同类比较越界为优劣承诺、竞品比较、上一代比较或未证实性能比较。
      - code: GRC-P0-03-F006_SKU_OR_FACTORY_FACT_LEAK
        description: 通用知识中泄漏真实 SKU、价格、库存、工厂、产地、供应商、门店配货等实例事实。
      - code: GRC-P0-03-F007_OBSERVATION_TO_PROOF_CONFUSION
        description: 把局部视觉观察、镜头细节、手感词或工艺节点误写成整体质量证明。
      forbidden_unregistered_global_codes:
      - F15_*
      - F17_*
      - F18_*
      - F19_*
      borderline_repair_rule: borderline_repair does not put repair codes in expected_failure_codes; repair references are
        carried by codex_usage and judge_calibration_index.repair_code_refs.
    hard_gate_id_namespace:
      registry_id: GRC-P0-03-HARD-GATE-NAMESPACE
      canonical_namespace: HG-###
      canonical_gate_ids:
      - gate_id: HG-001
        name: cluster_specific_mechanism
      - gate_id: HG-002
        name: no_template_reuse
      - gate_id: HG-003
        name: no_governance_text_in_body
      - gate_id: HG-004
