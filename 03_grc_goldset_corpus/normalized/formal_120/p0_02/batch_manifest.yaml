  expected_case_count: 21
  actual_case_count: 21
  global_case_type_distribution:
    positive_gold: 7
    anti_gold: 7
    borderline_repair: 7
  metadata_contract:
    expected_score_policy:
      scoring_max: 120
      hard_gate_precedence: true
      verdict_score_floor:
        accept_gold_candidate:
          expected_score_floor: 108
          hard_gate_fail_count: 0
        accept_with_minor_fix:
          expected_score_floor: 96
          hard_gate_fail_count: 0
        reject_or_blocking_revise:
          expected_score_floor: 0
          hard_gate_fail_required: true
    failure_code_registry:
      registry_id: GRC-P0-02-FAILURE-CODE-REGISTRY
      registry_scope: batch_local
      canonical_failure_codes_allowed:
      - F01_NO_CLUSTER_SPECIFIC_MECHANISM
      - F02_TEMPLATE_REUSE
      - F03_GOVERNANCE_TEXT_IN_BODY
      - F05_WRONG_OWNER_ROUTING
      - F13_CONTROL_PLANE_MIXED_WITH_DOMAIN_BODY
      - F14_BRAND_FACT_POLLUTION
      - F16_NO_GOLD_VALUE
      batch_local_diagnostic_namespace: GRC-P0-02-F###_*
      batch_local_diagnostic_codes:
      - code: GRC-P0-02-F001_REAL_PERSONA_LEAK
        use_when: 角色视角被写成真实员工、顾客、创始人或真实人物画像。
      - code: GRC-P0-02-F002_AUTHORITY_OVERCLAIM
        use_when: 角色口吻被写成官方声明、授权背书、检测证明或组织立场。
      - code: GRC-P0-02-F003_PRIVATE_OPS_LEAK
        use_when: 组织生态或视角切换泄漏真实 SOP、审批链、门店配置、私域运营、加盟或渠道事实。
      - code: GRC-P0-02-F004_EMOTION_AS_EVIDENCE
        use_when: 用情绪温度、信任感、温柔感替代证据或暗示确定性结果。
      - code: GRC-P0-02-F005_AUDIENCE_MODEL_TO_REAL_FEEDBACK
        use_when: 把受众距离模型误写成真实顾客反馈、敏感个人数据或真实用户画像。
      forbidden_unregistered_global_codes:
      - F15_*
      - F17_*
      - F18_*
      - F19_*
    hard_gate_id_namespace:
      registry_id: GRC-P0-02-HARD-GATE-NAMESPACE
      canonical_namespace: HG-###
      canonical_gate_ids:
      - gate_id: HG-001
        name: cluster_specific_mechanism
      - gate_id: HG-002
        name: no_template_reuse
      - gate_id: HG-003
        name: no_governance_text_in_body
      - gate_id: HG-004
        name: owner_storage_artifact_alignment
      - gate_id: HG-005
        name: epistemic_label_alignment
      - gate_id: HG-006
        name: relation_hint_boundary
      - gate_id: HG-007
        name: readiness_false_lock
      - gate_id: HG-008
        name: brand_instance_pollution
      forbidden_new_output_aliases:
      - HG01_NO_MECHANISM
      - HG02_TEMPLATE_OR_BOILERPLATE
      - HG03_GOVERNANCE_TEXT_IN_BODY
      - HG05_WRONG_OWNER_ROUTING
      - HG08_INDEX_SHELL
      - HG10_READINESS_DRIFT
      - HG13_CONTROL_PLANE_MIXED_WITH_DOMAIN_BODY
  readiness_assertions:
    all_readiness_flags_false: true
    candidatepack_ready: false
    KE_ready: false
    serving_ready: false
    RAG_ready: false
    DIFY_ready: false
    production_ready: false
    generation_allowed: false
  delivery_outputs:
