    gold_body: 受众距离与信息深浅轴由三个变量共同决定：knowledge distance 表示对服装术语、面料、版型和搭配逻辑的熟悉程度；decision stage 表示只是浏览、正在比较、准备试穿还是需要承接建议；interaction
