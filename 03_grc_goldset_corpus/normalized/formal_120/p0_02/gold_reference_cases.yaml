    failure_signal: 角色口吻被写成官方声明、真实人员同意、真实身份或默认组织背书。
    repair_instruction_if_failed: 把越权句拆成方法层、待授权事实和禁出内容；删除默认代表和真实身份暗示。
  epistemic_contract:
    observation_statements:
    - 服装对象、门店动作、陈列区位、角色主语和表达限制只能作为可观察或可解释材料。
    - 角色视角可改变信息密度、叙述站位和说明顺序。
    method_claims:
