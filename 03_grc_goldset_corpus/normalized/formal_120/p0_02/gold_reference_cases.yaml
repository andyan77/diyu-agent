    - DIFY
  body_contract:
    body_form: role_voice_body
    gold_body: 角色授权表面要把可说的方法层和不可说的事实层分开。可说的是角色作为表达方法能承担什么：导购口吻可以提示观察顺序，搭配师口吻可以解释比例与层次，店主口吻可以表达取舍逻辑，旁白可以整理公开说明。不可说的是角色背后是否真的存在某个人、是否获得同意、是否代表组织立场、是否掌握内部资料。默认背书的危险信号包括“我们保证”“店里都这样说”“某位角色亲自确认”“代表品牌宣布”。越权表述要拆成三类：角色方法可以保留，待授权事实必须补依据，真实身份和默认代表应直接删除。
    mechanism_chain:
    - speakable_method_layer -> role_expression_allowed
    - not_speakable_fact_layer -> authorization_required
    - default_endorsement_signal -> authority_overclaim
    - overclaim_statement -> split_method_source_required_prohibited
    - real_identity_hint -> remove_or_deauthorize
    apparel_domain_anchors: &id022
    - 可说方法层
    - 不可说事实层
    - 默认背书
    - 越权表述
    - 去授权化
    - 身份暗示
