    gold_body: 组织生态角色网格要描述的是通用内容职责与观察接口，不是真实组织结构。一个服装品牌可以抽象出五类公开可用角色：商品解释者负责品类、面料、版型和卖点边界；造型组织者负责色彩、比例、层次和场景任务；空间观察者负责陈列区位、视觉焦点和动线提示；服务转译者负责把试穿前后的疑问改成可公开提醒；方法旁白负责把以上角色的判断整理成稳定说明。每个角色只暴露对应的信息颗粒度：商品解释者不能替代检测报告，空间观察者不能透露门店经营数据，服务转译者不能转述真实顾客反馈。该网格的价值在于把生态视角变成内容角度，而不是把内部组织搬到通用知识里。
    mechanism_chain:
    - role_function_layer -> content_responsibility
    - content_responsibility -> observation_interface
    - role_function_layer -> information_granularity
    - public_role_grid -> reusable_content_angle
    - private_org_fact -> excluded_from_grid
    apparel_domain_anchors: &id010
