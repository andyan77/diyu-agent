- case_id: GRC-P0-02-MKC013-POS-001
  batch_id: GRC-P0-02-ROLE-ORGANIZATION-001
  capability_group: P0-02
  cluster_id: mkc_013
  cluster_title: 角色发声寄存器
  cluster_owner: P0-02
  source_cluster_refs: &id001
  - P0-02-RS01-C01
  case_type: positive_gold
  scope_control:
    scope_type: GoldReferenceCase
    target_bucket: EvaluationOnly
    not_candidatepack: true
    not_ke_truth: true
    not_serving: true
    not_rag: true
    not_dify: true
    not_production: true
  routing_contract:
    semantic_owner: role_perspective_operating
    storage_target: GeneralKnowledgeBase
    artifact_kind: general_knowledge_candidate
    allowed_registry:
    - gold_reference_case_registry
    - judge_calibration_registry
    forbidden_storage_targets:
    - KE truth source
    - Serving Projection
    - RAG Context Bundle
    - DIFY
  body_contract:
    body_form: role_voice_body
    gold_body: 角色发声寄存器的作用，是把“谁在说”转成可控的叙述站位，而不是制造人物经历。店主视角适合承接取舍与经营判断，句子可以更像“为什么这样摆、为什么这样搭”；导购视角适合承接试穿前后的观察与提醒，动作词更多，限制语也更多；搭配师视角适合解释比例、层次、色彩和场景任务，信息密度较高；品牌旁白适合做稳定说明，只保留可见对象、选择逻辑和价值边界。角色一旦确定，主语、动词、观察词和解释词都要同步变化：导购可以说“先看肩线和活动量”，旁白更适合说“肩线与松量共同决定上身轮廓”。该机制只定义通用角色的发声范围，不生成真实身份、真实经历或可直接发布的人设话术。
    mechanism_chain:
    - role_subject -> narrative_stance
    - narrative_stance -> information_density
    - role_subject -> allowed_action_words
    - role_subject -> allowed_observation_words
    - role_boundary -> de_personalized_voice
    apparel_domain_anchors: &id002
    - 店主视角
    - 导购视角
    - 搭配师视角
    - 品牌旁白
    - 动作词
    - 观察词
    - 解释词
    output_effect: 让同一服装对象能够按店主、导购、搭配师或品牌旁白切换表达密度与限制语，同时避免人物事实幻觉。
    failure_signal: 把角色发声写成某个真实员工的经历、授权口吻、固定人设话术或门店现场记录。
    repair_instruction_if_failed: 删除真实身份和经历暗示，只保留角色主语、观察范围、动作词类型和解释深度。
  epistemic_contract:
    observation_statements:
    - 服装对象、门店动作、陈列区位、角色主语和表达限制只能作为可观察或可解释材料。
    - 角色视角可改变信息密度、叙述站位和说明顺序。
    method_claims:
    - 角色发声寄存器 是通用角色视角方法，不绑定具体品牌或真实人物。
    - 高风险事实必须降级为观察、限制语、待补依据或排除项。
    creative_hypotheses:
    - 同一服装对象可以因角色主语、受众距离和情绪温度不同形成不同表达入口。
    source_required_claims:
    - 真实人物身份
    - 真实员工经历
    - 真实顾客反馈
    - 真实授权同意
    - 真实门店运营事实
    prohibited_claims:
    - 无来源授权背书
    - 无来源质量保证
    - 无来源舒适保证
    - 无来源身体效果
    - 无来源组织立场
    downgrade_paths:
    - 真实身份 -> 通用角色口吻
    - 组织事实 -> 公开观察接口
    - 顾客反馈 -> 阶段模型
    - 强信任断言 -> 低风险观察
    - 授权口吻 -> 去授权表达
  boundary_contract:
    do_not_include: &id003
    - specific brand fact
    - specific founder story
    - specific SKU
    - specific price
    - specific inventory
    - specific store event
    - real customer feedback
    - private SOP
    - unauthorized staff/customer/persona fact
    anti_hallucination_guard: 不得把角色口吻写成真实员工、真实门店、真实顾客或默认授权；角色只作为表达功能和观察位置。
  sidecar_contract:
    sidecar_allowed: true
    sidecar_fields:
    - review_notes
    - batch_metadata
    - judge_usage
    - readiness_assertions
    - relation_design_hints
    - source_gap_notes
    - codex_usage
    forbidden_in_gold_body:
    - W7
    - 第几批
    - judge
    - brief
    - batch
    - CandidatePack
    - KE_ready
    - RAG_ready
    - DIFY_ready
    - 人审
    - 评测
    - gold candidate
    - readiness
  relation_contract:
    relation_status: design_hint_not_ontology_edge
    relation_hints: &id004
    - depends_on:P0-02-RS04-C01
    - modulated_by:P0-02-RS03-C01
    - shares_boundary_with:P0-01
    formal_ontology_edge_allowed: false
    human_review_required_for_relation: true
  readiness_flags:
    candidatepack_ready: false
    KE_ready: false
    serving_ready: false
    RAG_ready: false
    DIFY_ready: false
    production_ready: false
    generation_allowed: false
  expected_judge_result:
    expected_verdict: accept_gold_candidate
    expected_hard_gates: &id005
    - HG-001
    - HG-002
    - HG-003
    - HG-004
    - HG-005
    - HG-006
    - HG-007
    - HG-008
    expected_failure_codes: []
    expected_score_floor: 108
  codex_usage:
    use_as_reference_for:
    - role_voice_register
    - narrative_stance
    - de_personalized_role_voice
    must_copy_structure: false
    must_copy_logic: true
    must_not_copy_phrasing: true
