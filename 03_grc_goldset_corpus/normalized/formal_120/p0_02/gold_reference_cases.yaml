    mechanism_chain:
    - knowledge_distance -> explanation_depth
    - decision_stage -> information_sequence
    - interaction_intensity -> role_voice_density
    - audience_stage_model -> no_real_user_profile
    - role_voice -> adjusted_explanation_density
    apparel_domain_anchors: &id016
    - knowledge distance
    - decision stage
    - interaction intensity
