    - 观察接口
    - 信息颗粒度
    - 生态视角
    - 公开表达
    output_effect: 让组织生态被抽象为可复用角色功能层级，支持内容角度生成但不暴露真实组织。
    failure_signal: 写成真实部门、真实岗位汇报、门店配置、加盟关系或私域经营资料。
    repair_instruction_if_failed: 把组织关系改为功能层级与观察接口；删除具体职位链、配置链和经营链。
  epistemic_contract:
    observation_statements:
    - 服装对象、门店动作、陈列区位、角色主语和表达限制只能作为可观察或可解释材料。
    - 角色视角可改变信息密度、叙述站位和说明顺序。
    method_claims:
    - 组织生态角色网格 是通用角色视角方法，不绑定具体品牌或真实人物。
    - 高风险事实必须降级为观察、限制语、待补依据或排除项。
    creative_hypotheses:
