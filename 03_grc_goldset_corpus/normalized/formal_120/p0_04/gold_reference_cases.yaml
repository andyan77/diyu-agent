    - RAG Context Bundle
    - DIFY
  body_contract:
    body_form: execution_asset_body
    gold_body: 动作转内容槽位要先保留动作本身，再决定解释强度。三段式不是成稿结构，而是执行观察顺序：第一段记录动作起点，例如取下、展开、靠近、并置；第二段记录动作中的可见变化，例如领口被整理、面料被对比、层搭被打开、色彩关系被并排；第三段记录完成判断，例如轮廓更清楚、主次关系更明显、可拍细节已出现。强观察适合写对象和变化，弱解释只说明为什么这样观察，不承诺效果。平台提示只能停留在素材使用注释，不能固化成固定模板或口播。
    input_condition: 输入为通用门店动作或演示动作，能看见起点、变化和完成状态。
    executable_action: 把动作拆成起点、变化、完成三段，并为每段匹配观察槽位和弱解释槽位。
    output_asset: 动作转内容槽位表与演示三段式提示。
    stop_condition: 出现发布成稿、真实口播、真实培训口径或固定平台模板时停止。
    mechanism_chain:
    - store_action -> demonstration_segment
    - demonstration_segment -> explanation_slot
    - observation_strength -> wording_level
    - stop_condition -> output_boundary
    apparel_domain_anchors:
    - 动作起点
    - 可见变化
    - 解释槽位
    - 镜头跟随
    - 完成判断
    output_effect: 为 动作转内容槽位与演示三段式 提供可校准的合格机制样本。
    failure_signal: 无 blocking 失败信号；仅需检查是否保持通用化、字段化和非实例化。
    repair_instruction_if_failed: 保持机制链，若出现实例事实或成稿输出则回退到观察节点与执行槽位。
  epistemic_contract:
    observation_statements:
    - 只描述通用可见对象、动作、区位、色彩或节点。
    - 观察结论必须落在一般化门店与陈列语义上。
    - 输出资产不包含真实门店、真实员工、真实顾客或真实经营事实。
    method_claims:
    - 动作转内容槽位与演示三段式 必须呈现该知识簇独有机制。
    - 执行类内容必须能形成输入条件、动作、输出资产和停止条件。
    - 治理类内容必须字段化为风险边界或局部提示。
    creative_hypotheses:
    - 同一组通用陈列对象可按不同观察入口形成不同执行提示。
    source_required_claims:
    - 真实门店平面
    - 真实员工授权
    - 真实顾客反馈
    - 真实加盟或合同事实
    - 真实销售或库存结果
    prohibited_claims:
    - 具体品牌事实
    - 真实门店事件
    - 真实员工或顾客身份
    - 真实授权结论
    - 发布级脚本或口播成稿
    downgrade_paths:
    - 实例事实 -> 一般化观察
