- case_id: GRC-P0-04-MKC030-POS-001
  batch_id: GRC-P0-04-STORE-DISPLAY-CONTENT-001
  capability_group: P0-04
  cluster_id: mkc_030
  cluster_title: Look 拆解观察骨架
  cluster_owner: P0-04
  source_cluster_refs:
  - W5_P0_04_RS01_CL01
  case_type: positive_gold
  scope_control:
    scope_type: GoldReferenceCase
    target_bucket: EvaluationOnly
    not_candidatepack: true
    not_ke_truth: true
    not_serving: true
    not_rag: true
    not_dify: true
    not_production: true
  routing_contract:
    semantic_owner: display_to_content
    storage_target: ExecutionAssetOutbox
    artifact_kind: execution_asset_outbox_candidate
    allowed_registry:
    - gold_reference_case_registry
    - judge_calibration_registry
    forbidden_storage_targets:
    - KE truth source
    - Serving Projection
    - RAG Context Bundle
    - DIFY
  body_contract:
    body_form: execution_asset_body
    gold_body: Look 拆解应先把画面中的搭配关系拆成主体、陪体、层次、轮廓和搭配位。主体回答哪一件服装承担视觉重心，陪体回答哪些单品支持主体，层次回答内外、长短、厚薄如何相互显现，轮廓回答整体线条是收、放、直还是展开，搭配位回答领口、腰部、下摆、鞋包等位置如何完成连接。单套搭配只需形成一条清晰观察线；成组陈列则要比较每套之间的主次、节奏和重复点。可拍摄结构按前景、主体、陪体拆开，前景提供进入点，主体提供解释对象，陪体提供关系说明。这个骨架只处理通用观察节点，不替代任何品牌造型事实。
    input_condition: 输入为一套或一组成组服装画面，只能看见单品、层次、轮廓、搭配位和画面主次。
    executable_action: 按主体、陪体、层次、轮廓、搭配位逐项标注，并将前景、主体、陪体转成镜头锚点。
    output_asset: Look 拆解观察清单与镜头锚点列表。
    stop_condition: 出现具体品牌造型事实、具体门店记录或完整陈列系统推导时停止扩写。
    mechanism_chain:
    - look_layer -> observation_node
    - foreground_subject_companion -> shot_structure
    - group_display -> look_decomposition
    - stop_condition -> output_boundary
    apparel_domain_anchors:
    - 主体
    - 陪体
    - 层次
    - 轮廓
    - 搭配位
    - 前景
    output_effect: 为 Look 拆解观察骨架 提供可校准的合格机制样本。
    failure_signal: 无 blocking 失败信号；仅需检查是否保持通用化、字段化和非实例化。
    repair_instruction_if_failed: 保持机制链，若出现实例事实或成稿输出则回退到观察节点与执行槽位。
  epistemic_contract:
    observation_statements:
    - 只描述通用可见对象、动作、区位、色彩或节点。
    - 观察结论必须落在一般化门店与陈列语义上。
    - 输出资产不包含真实门店、真实员工、真实顾客或真实经营事实。
    method_claims:
    - Look 拆解观察骨架 必须呈现该知识簇独有机制。
    - 执行类内容必须能形成输入条件、动作、输出资产和停止条件。
    - 治理类内容必须字段化为风险边界或局部提示。
    creative_hypotheses:
    - 同一组通用陈列对象可按不同观察入口形成不同执行提示。
    source_required_claims:
    - 真实门店平面
    - 真实员工授权
    - 真实顾客反馈
    - 真实加盟或合同事实
    - 真实销售或库存结果
    prohibited_claims:
    - 具体品牌事实
    - 真实门店事件
    - 真实员工或顾客身份
    - 真实授权结论
    - 发布级脚本或口播成稿
    downgrade_paths:
    - 实例事实 -> 一般化观察
    - 授权不明 -> decision_required 提示
    - 证据不足 -> source_gap 提示
    - 成稿输出 -> 执行资产槽位
  boundary_contract:
    do_not_include:
    - specific brand fact
    - specific founder story
    - specific SKU
    - specific price
    - specific inventory
    - specific store event
    - real customer feedback
    - private SOP
    - unauthorized staff/customer/persona fact
    - real franchise fact
    - real authorization conclusion
    anti_hallucination_guard: 不得把通用观察、通用动作、一般化角色或局部风险提示扩写为真实品牌、真实门店、真实员工、真实顾客、真实授权、真实加盟、真实库存或真实销售事实。
  sidecar_contract:
    sidecar_allowed: true
    sidecar_fields:
    - review_notes
    - batch_metadata
    - judge_usage
    - readiness_assertions
    - relation_design_hints
    - source_gap_notes
    - codex_usage
    forbidden_in_gold_body:
    - W7
    - 第几批
    - judge
    - brief
    - batch
    - CandidatePack
    - KE_ready
    - RAG_ready
    - DIFY_ready
    - 人审
    - 评测
    - gold candidate
    - readiness
  relation_contract:
    relation_status: design_hint_not_ontology_edge
    relation_hints:
    - look_layer -> observation_node
    - foreground_subject_companion -> shot_structure
    - group_display -> look_decomposition
    - match_position -> content_anchor
    formal_ontology_edge_allowed: false
    human_review_required_for_relation: true
  readiness_flags:
    candidatepack_ready: false
    KE_ready: false
    serving_ready: false
    RAG_ready: false
    DIFY_ready: false
    production_ready: false
    generation_allowed: false
  expected_judge_result:
    expected_verdict: accept_gold_candidate
    expected_hard_gates:
    - HG-001
    - HG-002
    - HG-003
    - HG-004
    - HG-005
    - HG-006
    - HG-007
    - HG-008
    expected_failure_codes: []
    expected_score_floor: 108
