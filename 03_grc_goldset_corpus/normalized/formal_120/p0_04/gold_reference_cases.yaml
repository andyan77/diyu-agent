    - color_story -> look_structure
    - stop_condition -> output_boundary
    apparel_domain_anchors:
    - 主色
    - 辅色
    - 点缀色
    - 色彩组
    - Look 结构
    - 主题词
    output_effect: 为 主题与色彩故事关系网 提供可校准的合格机制样本。
    failure_signal: 无 blocking 失败信号；仅需检查是否保持通用化、字段化和非实例化。
    repair_instruction_if_failed: 保持机制链，若出现实例事实或成稿输出则回退到观察节点与执行槽位。
  epistemic_contract:
    observation_statements:
    - 只描述通用可见对象、动作、区位、色彩或节点。
