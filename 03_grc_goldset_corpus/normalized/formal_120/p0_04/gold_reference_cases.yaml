    gold_body: 动作、解释和镜头的关系已经成立：先有动作起点，再有变化，再有完成判断。问题是局部句子变成了可直接发布的开头和结尾，还把平台表达固定为模板。修复时应退回执行资产结构：动作起点只写发生了什么，变化段只写看见了什么，解释段只写为什么值得观察，结尾改成输出资产边界，不给成稿或购买引导。
    input_condition: 输入中已有动作三段，但局部滑向成稿或平台模板。
    executable_action: 删除成稿式开头结尾，恢复动作起点、可见变化、完成判断三类槽位。
    output_asset: 修复后的动作转内容槽位表。
    stop_condition: 仍需要输出发布内容时停止。
    mechanism_chain:
    - store_action -> demonstration_segment
