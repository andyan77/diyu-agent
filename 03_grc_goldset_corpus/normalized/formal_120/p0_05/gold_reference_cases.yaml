    method_claims: &id025
    - 生命周期阶段只描述内容任务，不表达经营状态。
    creative_hypotheses: &id026
    - 同一产品在不同抽象阶段可承担不同教育密度。
    source_required_claims: &id027
    - 真实上新时间
