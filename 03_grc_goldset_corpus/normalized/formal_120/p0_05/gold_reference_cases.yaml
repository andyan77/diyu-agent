    storage_target: GeneralKnowledgeBase
    artifact_kind: general_knowledge_candidate
    allowed_registry: &id002
    - gold_reference_case_registry
    - judge_calibration_registry
    forbidden_storage_targets: &id003
    - KE truth source
    - Serving Projection
    - RAG Context Bundle
    - DIFY
  body_contract:
    body_form: domain_method_body
    gold_body: 产品进入叙事时先被命名为角色，而不是被当成待售物。若它在开头承担“提出任务”的功能，它是主角；若它用于暴露两个穿着任务的差异，它是对比项；若它在问题之后提供可观察处理路径，它是解决项；若它连接两个场景、两种层次或两个搭配重心，它是过渡项；若镜头首先给到领口、门襟、腰线、面料纹理等局部，它更适合作为教育节点。首出现位置决定段落顺序：第一镜出现的产品负责建立任务，问题后出现的产品负责解释处理，旁边并列出现的产品负责形成对照，细节特写出现的产品负责说明结构。该框架只决定叙事槽位，不推出购买理由、身体结果或商品事实。
    mechanism_chain:
    - first_appearance_position -> product_role_name
    - product_role_name -> narrative_section
    - narrative_section -> scene_task_binding
    - visible_detail -> education_node
    apparel_domain_anchors:
    - 领口
    - 门襟
    - 腰线
    - 面料纹理
    - 层次变化
    - 搭配重心
    output_effect: 让内容生成先判断产品在故事中承担的结构任务，再决定开头、对比、解释或教育段落。
    failure_signal: 把产品一出现就写成值得购买、效果确定或带有具体商品事实的销售对象。
    repair_instruction_if_failed: 把销售理由和结果承诺删掉，改为角色命名、首出现位置、场景任务和可见锚点。
  epistemic_contract:
    observation_statements: &id004
    - 产品首出现位置可以作为叙事段落判断线索。
    - 服装细节只能支持可见结构说明。
    method_claims: &id005
    - 先命名产品叙事角色，再决定段落位置。
    - 产品角色不得直接推出购买理由。
    creative_hypotheses: &id006
    - 同一产品可因首出现位置不同承担主角、对比项、解决项、过渡项或教育节点。
    source_required_claims: &id007
    - 具体商品事实
    - 真实销售表现
    - 真实门店案例
    - 具体顾客反馈
    prohibited_claims: &id008
    - 无来源商品事实
    - 产品角色推出功效结论
    - 产品角色推出身材结果
    - 直接销售口播
    downgrade_paths: &id009
    - 购买理由 -> 叙事功能
    - 效果承诺 -> 可见结构观察
    - 具体商品事实 -> 删除或待补来源
  boundary_contract:
    do_not_include: &id010
    - specific brand fact
    - specific founder story
    - specific SKU
    - specific price
    - specific inventory
    - specific store event
    - real customer feedback
    - private SOP
    - unauthorized staff/customer/persona fact
    anti_hallucination_guard: 只允许描述抽象产品角色、场景任务、视觉线索、说明动作和边界规则；不得补写品牌、商品、价格、库存、门店、顾客、渠道或经营事实。
  sidecar_contract:
    sidecar_allowed: true
    sidecar_fields: &id011
    - review_notes
    - batch_metadata
    - judge_usage
    - readiness_assertions
    - relation_design_hints
    - source_gap_notes
    forbidden_in_gold_body: &id012
    - judge
    - brief
    - batch
    - CandidatePack
    - KE_ready
    - RAG_ready
    - DIFY_ready
    - 人审
    - 评测
    - gold candidate
  relation_contract:
    relation_status: design_hint_not_ontology_edge
    relation_hints: &id013
    - product_role -> scene_task
    - product_role -> narrative_section
    - product_role -> visual_anchor
    - product_role -> education_node
    formal_ontology_edge_allowed: false
    human_review_required_for_relation: true
  readiness_flags:
    candidatepack_ready: false
    KE_ready: false
    serving_ready: false
    RAG_ready: false
    DIFY_ready: false
    production_ready: false
    generation_allowed: false
  expected_judge_result:
    expected_verdict: accept_gold_candidate
    expected_hard_gates: &id014
