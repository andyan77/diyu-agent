    body_form: domain_method_body
    gold_body: 场景适配要从任务条件开始，而不是从人群或效果开始。可记录的任务锚点包括坐立切换、步行距离、外搭层次、室内外温差、手部动作、携带物限制和正式程度。适配条件说明“在什么任务下可以观察什么”，不适配条件说明“在哪些动作、温度、层次或礼仪限制下应降低推荐强度”。场景切换时，产品角色也要切换：通勤任务中可能是过渡项，短途出行中可能是主角，层搭场景中可能是连接项。场景匹配度只限制
      CTA 上限，不能推出舒适、性能、身材效果或适合所有人的结论。
    mechanism_chain:
    - scene_task -> fit_condition
    - action_limit -> unsuitable_condition
    - scene_switch -> product_role_shift
    - fit_confidence -> cta_strength_ceiling
    apparel_domain_anchors:
    - 坐立切换
    - 步行距离
    - 外搭层次
    - 室内外温差
    - 携带物限制
    - 正式程度
