- case_id: GRC-P0-05-PRODUCT-NARRATIVE-001-MKC_040-POS-001
  batch_id: GRC-P0-05-PRODUCT-NARRATIVE-001
  capability_group: P0-05
  cluster_id: mkc_040
  cluster_title: 叙事到 CTA 的非硬卖边界
  cluster_owner: P0-05
  source_cluster_refs: &id015
  - P0-05-RS01-C02
  case_type: positive_gold
  scope_control:
    scope_type: GoldReferenceCase
    target_bucket: EvaluationOnly
    not_candidatepack: true
    not_ke_truth: true
    not_serving: true
    not_rag: true
    not_dify: true
    not_production: true
  routing_contract:
    semantic_owner: creative_content_operating
    storage_target: GeneralKnowledgeBase
    artifact_kind: general_knowledge_candidate
    allowed_registry: *id002
    forbidden_storage_targets: *id003
  body_contract:
    body_form: domain_method_body
    gold_body: CTA 只能作为叙事收束的轻动作，不是成交推进。它出现前必须完成三个条件：观众已经知道产品在场景中承担什么任务，至少看到一个可观察锚点，并且已经获得一条使用说明或比较边界。CTA 的信息密度应控制在“一项动作 +
      一个观察对象 + 一个条件提示”以内，例如引导保存搭配条件、对照陈列中的主次关系、观察领口与内搭的连接方式、询问适合的使用场景。CTA 不新增商品事实，不承诺结果，不把产品角色直接转成购买理由；若前文只有情绪词或单张图，CTA 应降级为观察提示。
    mechanism_chain:
    - education_condition -> cta_permission
    - cta_density -> low_pressure_action
    - product_fact_isolation -> no_sales_overreach
    - display_or_scene_cue -> observation_prompt
    apparel_domain_anchors:
    - 观察对象
    - 搭配条件
    - 陈列主次
    - 领口连接
    - 场景提示
    output_effect: 让叙事末端从硬卖口播改为保存、对照、观察、提问等低风险动作。
    failure_signal: CTA 直接催促购买、承诺成交收益或补充未经来源支持的商品事实。
    repair_instruction_if_failed: 把成交动作改为观察动作，把多项卖点堆叠改为一个条件化提示。
  epistemic_contract:
    observation_statements: &id016
    - CTA 前应已有产品角色、可见锚点和教育条件。
    method_claims: &id017
    - CTA 信息密度控制为轻动作和条件提示。
    - CTA 不新增商品事实。
    creative_hypotheses: &id018
    - 同一叙事可收束为保存、观察、对照或询问条件。
    source_required_claims: &id019
    - 真实渠道活动
    - 真实营销节点
    - 商品可得性
    - 具体交易条件
    prohibited_claims: &id020
    - 成交承诺
    - 直接下单口播
    - 渠道玩法事实
    - 结果承诺
    downgrade_paths: &id021
    - 购买动作 -> 观察动作
    - 多动作 CTA -> 单一动作提示
    - 渠道事实 -> 删除
  boundary_contract:
    do_not_include: *id010
    anti_hallucination_guard: 只允许描述抽象产品角色、场景任务、视觉线索、说明动作和边界规则；不得补写品牌、商品、价格、库存、门店、顾客、渠道或经营事实。
  sidecar_contract:
    sidecar_allowed: true
    sidecar_fields: *id011
    forbidden_in_gold_body: *id012
  relation_contract:
    relation_status: design_hint_not_ontology_edge
    relation_hints: &id022
    - narrative_resolution -> low_pressure_cta
    - education_condition -> cta_permission
    - cta_density -> claim_boundary
    - display_or_scene_cue -> observation_prompt
    formal_ontology_edge_allowed: false
    human_review_required_for_relation: true
  readiness_flags:
    candidatepack_ready: false
    KE_ready: false
    serving_ready: false
    RAG_ready: false
    DIFY_ready: false
    production_ready: false
    generation_allowed: false
  expected_judge_result:
    expected_verdict: accept_gold_candidate
    expected_hard_gates: *id014
    expected_failure_codes: []
    expected_score_floor: 108
  codex_usage:
    use_as_reference_for:
    - low_pressure_cta
    - cta_density_control
    - sales_copy_boundary
    - positive_gold_mechanism_reference
    must_copy_structure: false
    must_copy_logic: true
    must_not_copy_phrasing: true
