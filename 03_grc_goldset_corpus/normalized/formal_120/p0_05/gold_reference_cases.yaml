    body_form: governance_policy_body
    gold_body: 跨域关系只提供归属提示和最严格边界提示，不产生实现结构。产品角色连接角色语气时，只能说明同一产品由导购式、设计解释式、品牌旁白式表达会改变信息密度和限制语；连接组织生态视角时，只能提示是否需要过程、角色或来源支持；连接
      display 动作时，只能提示产品是主角、陪衬、过渡还是教育节点；连接 narrative 段落时，只能提示它适合进入开头、解释、对比或收束。若产品角色与效果断言、人物立场、陈列动作或控制规则重叠，应采用最严格边界：claim 归
      claim 边界，角色语气归角色视角，陈列动作归陈列内容化，产品簇不接管控制规则。
    mechanism_chain:
    - product_role -> role_perspective_hint
    - product_role -> display_action_hint
    - product_role -> narrative_sequence_hint
    - cross_domain_overlap -> strictest_wins_note
    apparel_domain_anchors:
    - 导购式表达
    - 设计解释式表达
    - 品牌旁白式表达
    - 主角
    - 陪衬
    - 过渡
    - 教育节点
    output_effect: 把产品叙事与角色、陈列、叙事段落之间的交叉关系限制为提示层，避免越权生成实现结构。
    failure_signal: 把跨域关系写成状态字段、执行图、接口步骤，或让产品簇覆盖控制规则。
    repair_instruction_if_failed: 改为 relation hint、ownership hint 和 strictest-wins note，不输出实现结构。
  epistemic_contract:
    observation_statements: &id064
    - 产品角色可与角色语气、陈列动作和叙事段落形成交叉提示。
    method_claims: &id065
