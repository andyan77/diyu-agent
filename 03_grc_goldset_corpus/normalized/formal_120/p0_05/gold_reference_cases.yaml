  body_contract:
    body_form: domain_method_body
    gold_body: 产品生命周期在通用知识中只能使用抽象阶段族，而不能使用具体经营状态。可用阶段包括认知进入期、结构教育期、组合扩展期、场景验证期、复盘维护期。阶段改变的是叙事任务：认知进入期解释产品承担什么角色，结构教育期提高面料、版型、搭配或使用说明密度，组合扩展期说明它与陪衬项、过渡项、主题项的关系，场景验证期强调适配条件和不适配条件，复盘维护期只整理观察与注意事项。阶段可以影响教育重心、陈列更新提示和
      CTA 强度上限，但不能生成上新、库存、售罄、滞销、促销或订货结论。
    mechanism_chain:
    - abstract_lifecycle_stage -> narrative_task
    - narrative_task -> education_focus
    - abstract_stage -> cta_strength_ceiling
    - business_status -> prohibited_instance_fact
    apparel_domain_anchors:
    - 认知进入期
    - 结构教育期
    - 组合扩展期
    - 场景验证期
    - 复盘维护期
    output_effect: 使产品生命周期只服务内容任务分配，不泄漏经营状态或渠道判断。
    failure_signal: 把生命周期阶段写成具体上新时间、库存状态、售罄滞销或促销处置。
    repair_instruction_if_failed: 把实例化经营词改成抽象阶段族，并只保留叙事任务变化。
