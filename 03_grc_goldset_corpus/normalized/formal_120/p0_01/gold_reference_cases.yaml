    target_bucket: EvaluationOnly
    not_candidatepack: true
    not_ke_truth: true
    not_serving: true
    not_rag: true
    not_dify: true
    not_production: true
  routing_contract:
    semantic_owner: creative_content_operating
    storage_target: GeneralKnowledgeBase
    artifact_kind: general_knowledge_candidate
    allowed_registry:
    - gold_reference_case_registry
    - judge_calibration_registry
    forbidden_storage_targets: &id002
    - KE truth source
    - Serving Projection
    - RAG Context Bundle
    - DIFY
  boundary_contract:
    do_not_include: &id003
    - specific brand fact
    - specific founder story
    - specific SKU
    - specific price
    - specific inventory
    - specific store event
    - real customer feedback
    - private SOP
    - unauthorized staff/customer/persona fact
    anti_hallucination_guard: 不得把企业叙事骨架补写成真实品牌起源、创始人经历、扩张节点或行业地位。
  sidecar_contract:
    sidecar_allowed: true
    sidecar_fields: &id004
    - review_notes
    - batch_metadata
    - judge_usage
    - readiness_assertions
    - relation_design_hints
    - source_gap_notes
    forbidden_in_gold_body:
    - judge
    - brief
    - batch
    - CandidatePack
    - KE_ready
    - RAG_ready
    - DIFY_ready
    - 人审
    - 评测
    - gold candidate
  relation_contract:
    relation_status: design_hint_not_ontology_edge
    relation_hints: &id005
    - problem_domain -> operating_method
    - operating_method -> proof_slot
    - proof_slot -> value_expression
    - value_expression -> series_axis
    formal_ontology_edge_allowed: false
    human_review_required_for_relation: true
  readiness_flags:
    candidatepack_ready: false
    KE_ready: false
    serving_ready: false
    RAG_ready: false
    DIFY_ready: false
    production_ready: false
    generation_allowed: false
  body_contract:
    body_form: full_rich_body
    gold_body: 企业叙事骨架的起点不是“品牌想显得更有理想”，而是先界定企业长期回应的服装经营问题。这个问题可以来自货品结构、面料取舍、版型稳定性、系列一致性、门店解释难度或顾客选择成本，但只能停留在通用问题层。骨架展开时应按四步组织：先说明问题场景，再说明企业采用的组织性方法，再列出需要被证明的槽位，最后把方法翻译成用户能够观察到的价值。若只有价值词而没有方法和证明槽位，只能形成主题提示；若有流程、角色分工、复核节点或系列结构线索，才可以进入企业叙事骨架。该机制把企业叙事从口号改成“问题—方法—证明—价值”的可复用结构。
    mechanism_chain:
    - problem_domain -> operating_method
    - operating_method -> proof_slot
    - proof_slot -> value_expression
    - value_expression -> series_axis
    apparel_domain_anchors:
    - 货品结构
    - 面料取舍
    - 版型稳定性
    - 系列一致性
    - 门店解释难度
    - 顾客选择成本
    - 复核节点
    output_effect: 让企业叙事先判断问题与方法是否成立，再决定能否展开为组织选择、系列主题或价值说明。
    failure_signal: 正文只有愿景、使命、长期主义、行业领先等抽象话语，没有问题场景、组织性方法和证明槽位。
    repair_instruction_if_failed: 删除无依据的起源史和行业地位，改为问题场景、方法选择、证明槽位和可观察价值。
  epistemic_contract:
    observation_statements:
    - 服装企业叙事可从货品结构、版型稳定性、系列一致性等通用经营问题进入。
    - 角色分工、复核节点和流程线索只能作为证明槽位，不等于真实企业事实。
    method_claims:
    - 企业叙事应按问题、方法、证明、价值组织。
    - 没有证明槽位时应降级为主题提示或待补依据问题。
    creative_hypotheses:
    - 同一组门店素材可按“选择成本降低”或“系列一致性”形成不同叙事骨架。
    source_required_claims:
    - 真实品牌起源
    - 真实企业节点
    - 真实创始人经历
    - 真实经营成果
    - 真实行业地位
    prohibited_claims:
    - 无来源品牌使命
    - 无来源行业领先
    - 无来源多年沉淀
    - 无来源创始人选择
    downgrade_paths:
    - 企业历史 -> 问题场景
    - 行业地位 -> 方法说明
    - 品牌使命 -> 价值表达边界
  expected_judge_result:
    expected_verdict: accept_gold_candidate
    expected_hard_gates:
    - HG-001
    - HG-002
    - HG-003
    - HG-004
    - HG-005
    - HG-006
    - HG-007
    - HG-008
    expected_failure_codes: []
    expected_score_floor: 108
  codex_usage:
    use_as_reference_for:
    - enterprise_narrative_skeleton
    - problem_to_method_to_proof
    - value_expression_boundary
    - series_axis_seed
    must_copy_structure: false
    must_copy_logic: true
    must_not_copy_phrasing: true
