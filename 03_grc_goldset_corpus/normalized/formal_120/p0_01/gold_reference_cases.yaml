  body_contract:
    body_form: full_rich_body
    gold_body: 叙事放大禁区用于判断哪些表达不能被继续美化。第一类是权威信号，例如排名、认证、奖项、行业地位；它们只能在有明确依据时出现，否则应删除或改成方法层描述。第二类是实例事实，例如顾客反馈、员工经历、门店事件、供应链节点；它们不能被泛化为通用品牌故事。第三类是结果承诺，例如更显瘦、更耐穿、更舒适、更受欢迎；没有证据时只能降为观察词或选择建议。第四类是敏感背书，例如授权、隐私、内部流程；边界不清时不得进入对外表达。该机制的目标不是把风险句改得更安全，而是先决定删除、降级、补依据或升级为裁决项。
    mechanism_chain:
    - risk_zone -> routing_target
    - authority_signal -> evidence_requirement
    - instance_fact_dependency -> evidence_question
    - sensitive_promise -> decision_required
    apparel_domain_anchors:
    - 排名
    - 认证
    - 奖项
    - 顾客反馈
    - 员工经历
    - 门店事件
    - 更显瘦
    - 更耐穿
    output_effect: 让企业叙事先识别放大禁区，再决定删除、降级、补依据或进入裁决项。
    failure_signal: 把权威、实例事实、结果承诺和授权信息写成安全的品牌表达。
    repair_instruction_if_failed: 将高风险表达拆成风险区、依据需求和处理动作；不能补依据的内容删除或降级。
  epistemic_contract:
    observation_statements:
    - 权威信号、实例事实、结果承诺和敏感背书属于不同风险区。
    - 实例事实不能泛化为通用故事。
    method_claims:
    - 风险句应先分区，再决定删除、降级、补依据或裁决。
    creative_hypotheses:
    - 同一句“被认可”可拆成权威背书、顾客反馈或经营结果三种不同风险。
    source_required_claims:
    - 真实排名
    - 真实认证
    - 真实顾客反馈
    - 真实授权
    - 真实检测结果
    prohibited_claims:
    - 无来源行业地位
    - 无来源顾客评价
    - 无来源授权背书
    - 无来源结果承诺
