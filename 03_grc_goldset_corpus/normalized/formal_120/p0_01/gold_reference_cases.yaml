    - judge_calibration_registry
    forbidden_storage_targets: *id002
  boundary_contract:
    do_not_include: *id003
    anti_hallucination_guard: 不得把角色、流程、质量门或供应链选择写成真实供应商、真实认证、真实检测结果或产品效果。
  sidecar_contract:
    sidecar_allowed: true
    sidecar_fields: *id004
    forbidden_in_gold_body:
    - judge
    - brief
