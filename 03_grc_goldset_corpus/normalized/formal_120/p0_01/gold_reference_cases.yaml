    KE_ready: false
    serving_ready: false
    RAG_ready: false
    DIFY_ready: false
    production_ready: false
    generation_allowed: false
  body_contract:
    body_form: full_rich_body
    gold_body: 故事弧线应由材料的问题类型决定，而不是由写作者想要的情绪决定。若材料展示的是一个服装对象的结构差异，例如领型、腰线、门襟、面料肌理，适合使用“结构说明弧线”：从可见差异进入，解释取舍逻辑，再停在可观察价值。若材料展示的是连续处理过程，例如修改版型、比较面料、调整陈列、确认搭配比例，适合使用“选择过程弧线”：先提出需要解决的选择问题，再展示取舍顺序，最后说明选择被如何收束。若材料只包含价值词或单张无上下文图片，不应展开成困境、坚持、转折、结果，只能降级为观察问题或补依据清单。弧线越强，需要的证明越强。
    mechanism_chain:
    - material_problem_type -> story_arc_selection
    - story_arc_selection -> required_proof_intensity
    - required_proof_intensity -> compatible_value_expression
    - arc_mismatch -> downgrade_to_observation_or_question
    apparel_domain_anchors:
    - 领型
    - 腰线
    - 门襟
    - 面料肌理
    - 版型修改
    - 面料比较
    - 陈列调整
    - 搭配比例
    output_effect: 让内容生成先判断材料适合结构说明、选择过程还是观察问题，避免弱材料承担强故事。
    failure_signal: 把单张图片、价值词或局部细节扩写成完整品牌历程。
    repair_instruction_if_failed: 删除无依据的经历、转折和结果，改为可见差异、取舍逻辑和待补依据问题。
  epistemic_contract:
    observation_statements:
    - 结构差异支持结构说明弧线。
    - 连续处理过程支持选择过程弧线。
    - 价值词本身不支持完整故事。
    method_claims:
    - 故事弧线必须绑定材料问题类型和证明强度。
    - 证据不足时应降级为观察问题。
    creative_hypotheses:
    - 同一组搭配比例材料可写成结构说明，也可在有过程证据时写成选择过程。
    source_required_claims:
    - 真实品牌起源
    - 真实里程碑
    - 真实创始人经历
    - 真实组织选择
    - 真实供应链证明
    prohibited_claims:
    - 无来源逆袭故事
    - 无来源传承故事
    - 无来源行业见证
    - 无来源顾客反馈
    downgrade_paths:
    - 完整故事 -> 结构说明
    - 人物经历 -> 方法观察
    - 品牌历史 -> 待补依据问题
  expected_judge_result:
    expected_verdict: accept_gold_candidate
    expected_hard_gates:
    - HG-001
    - HG-002
    - HG-003
    - HG-004
    - HG-005
    - HG-006
    - HG-007
    - HG-008
    expected_failure_codes: []
    expected_score_floor: 108
  codex_usage:
    use_as_reference_for:
    - story_arc_selection
    - evidence_strength_boundary
    - downgrade_path
    - non_boilerplate_content_method
    must_copy_structure: false
    must_copy_logic: true
    must_not_copy_phrasing: true
