    - DIFY_ready
    - 人审
    - 评测
    - gold candidate
  relation_contract:
    relation_status: design_hint_not_ontology_edge
    relation_hints: &id007
    - organization_role -> process_node
    - process_node -> quality_gate
    - supply_chain_choice -> constraint
    - constraint -> method_credibility
    formal_ontology_edge_allowed: false
    human_review_required_for_relation: true
  readiness_flags:
    candidatepack_ready: false
    KE_ready: false
    serving_ready: false
    RAG_ready: false
    DIFY_ready: false
    production_ready: false
    generation_allowed: false
  body_contract:
    body_form: full_rich_body
    gold_body: 证明槽位不是给价值词找装饰，而是把“为什么这样做”拆成可核对的叙事位置。角色槽位说明谁在做判断，例如设计、版型、陈列、导购等通用角色；流程槽位说明判断发生在哪个节点，例如选料、打样、试穿、复核、上架前调整；质量门槽位说明哪里需要停下来确认；约束槽位说明为什么不能只追求好看或好卖。价值转译只能从这些槽位向外推一层：把“复核”转成稳定性意识，把“取舍”转成适用场景意识，把“交接”转成服务一致性意识。没有证据的槽位不能转译成耐穿、权威认证、销量结果或行业评价。
    mechanism_chain:
    - organization_role -> process_node
    - process_node -> quality_gate
    - supply_chain_choice -> constraint
    - constraint -> method_credibility
    - proof_slot -> value_expression
    apparel_domain_anchors:
    - 设计角色
    - 版型角色
    - 陈列角色
    - 导购角色
    - 选料节点
    - 打样节点
    - 试穿节点
    - 复核门
    output_effect: 让企业价值表达从可证明槽位出发，避免把抽象价值直接写成产品效果或经营事实。
    failure_signal: 正文直接说品质好、供应链强、专业可靠，却没有角色、流程、质量门和约束说明。
    repair_instruction_if_failed: 为每个价值判断补证明槽位；无法补槽位的价值词降级为待补依据问题。
  epistemic_contract:
    observation_statements:
    - 角色、流程、质量门和约束是通用证明槽位。
    - 证明槽位只能支持方法可信度，不能自动支持产品效果。
    method_claims:
    - 价值转译应从证明槽位向外推一层。
    - 无槽位价值词应降级为待补依据问题。
    creative_hypotheses:
    - 同一流程节点可转译为稳定性、适配性或服务一致性等不同价值。
    source_required_claims:
    - 真实供应商
    - 真实认证
    - 真实检测结果
    - 真实质检结论
    - 真实销售结果
    prohibited_claims:
    - 无来源认证
    - 无来源耐用结论
    - 无来源供应链事实
    - 无来源品质保证
    downgrade_paths:
    - 产品效果 -> 方法可信度
    - 供应链事实 -> 约束槽位
    - 认证背书 -> 待补依据问题
  expected_judge_result:
    expected_verdict: accept_gold_candidate
    expected_hard_gates:
    - HG-001
    - HG-002
    - HG-003
    - HG-004
    - HG-005
    - HG-006
    - HG-007
    - HG-008
    expected_failure_codes: []
    expected_score_floor: 108
  codex_usage:
    use_as_reference_for:
    - proof_slot_taxonomy
    - value_translation
    - process_node_to_quality_gate
    - overclaim_downgrade
    must_copy_structure: false
    must_copy_logic: true
    must_not_copy_phrasing: true
