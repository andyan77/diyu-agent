  - rich_body_id: CANARY-40-RB-040
    canary_id: CANARY-40-040
    canonical_cluster_id: mkc_046
    cluster_title: 产品到角色到叙事跨域关系
    body_form: governance_policy_body
    body: 产品到角色到叙事的跨域关系，是把不同能力面上的接口对齐，而不是新建一条执行流程。举例说，同一件产品，用一线讲解视角说话会偏具体操作，用生态观察视角说话会偏关系梳理，当这两种规则在一处冲突时，取更严的一方并记下这处冲突。它要处理四组接口：产品与角色语气的关系，即同一产品在不同叙述视角下语气如何调整；产品与组织生态视角的连接，即产品由哪种功能角色来讲更合适；产品与陈列动作的接口，即产品叙事如何落到展示动作上；产品与叙事段落的跨域对齐，即产品角色如何贯穿整段内容。当多个能力面在同一处交叉、彼此规则不一致时，采用更严的一方作为约束，并把冲突记录下来供后续判断。内容确实跨越多个能力面需要对接口时它适用；把跨域关系写成一张可直接执行的流程图或产线对象时不适用。这一簇只提供跨域接口提示，属于关系与路由层面的治理性说明，不形成执行图，也不写入真实商品、真实门店或真实组织事实；遇到具体实例或归属冲突，先挂起或交人工裁决。
