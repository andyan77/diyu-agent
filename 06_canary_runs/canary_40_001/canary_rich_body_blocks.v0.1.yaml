    body: 语气校准与去人物化处理“怎么把语气调到与场景匹配，同时不留真人痕迹”。比如描述一处拼接，可以说“接缝走得较平整”，这是观察；若顺口改成“做工一定过硬”，就把语气当成了结论，需要退回并补上限定。核心是语气强度要跟场景强度对齐：讲日常整理用平稳语气，讲重要工艺节点可略微郑重，不能用夸张语气去撑普通内容。允许保留一层功能化人设，比如“懂行的讲解者”，但不可写入能指认到真实个人的细节。不可写的真人痕迹包括具体长相、家庭情况、真实对话、真实业绩。遇到高风险断言前先降调，加“通常”“在多数情况下”“需视具体情况”这类限定，把绝对表达收回来。内容需要一个稳定叙述口吻时它适用；必须依赖某个真实人物才成立的稿子则不适用。要认清一点：去人物化不等于去责任，凡涉及效果、耐用、安全的说法，即便语气放软也仍要有证据支撑，无证据时标为缺来源；语气调整只改表达强度，改不了事实门槛，这两件事必须分开处理。
