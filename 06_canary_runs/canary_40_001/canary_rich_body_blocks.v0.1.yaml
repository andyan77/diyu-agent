    body_form: full_rich_body
    body: 组织生态角色网格给出一张“谁在这个内容生态里承担什么功能”的通用视角图。举例来说，讲“负责陈列的角色”能看到货品在陈列面上的组合关系，讲“负责复核的角色”则看到是否达标，内容该由哪种视角产出，取决于要讲的是布局还是把关。先分角色功能层级：有负责选品与组货的、有负责陈列与视觉的、有负责讲解与内容的、有负责复核与把关的，层级清楚才知道每种内容该由哪种功能视角产出。再给每个角色配内容职责和观察接口，说明它能看到什么、适合讲什么。不同角色的信息颗粒度不同：偏运营的角色掌握较粗的结构信息，偏一线的角色掌握较细的操作信息，内容要按角色能合法掌握的颗粒度来写。需要按角色分工组织内容时，这张网格用得上；要暴露真实组织架构或人员编制时，它就不该被拿来当依据。整张网格停在抽象功能模型这一层：不能据此写出某企业的真实部门、真实人数或真实汇报关系，这类组织事实一旦冒出来，先删或先挂待补，能被正文接纳的只有“存在这样一类功能角色”。
