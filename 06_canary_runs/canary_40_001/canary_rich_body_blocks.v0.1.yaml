    body_form: full_rich_body
    body: 情绪温度层与信任门控处理“内容用多热的情绪、以及信任靠什么建立”。比如“这件耐穿”属于想让人相信的性能，必须先过证据门；而“表面能看到细密的走线”只是可核验的观察，可以放心使用，两者不能混为一谈。先给情绪温度分层：冷层是纯结构与事实描述，温层是带一点场景代入的解释，热层是带明显情感召唤的表达，越热越要谨慎。低风险的信任信号可以自由使用，比如可核验的工序说明、可观察的细节展示。强证据信号则受门控：凡想让读者相信某个效果或性能，必须先过证据门，有据才写，无据就回收为观察。从可接受表达滑向需补来源的触发条件包括：出现结果承诺、出现横向对比、出现权威背书暗示。内容需要建立可信度时它适用；用情绪替代证据去推动结论时它拦截。有一条不能破：情绪温度越高，越不能夹带未证明的硬结论，凡涉及功效、安全、耐久的说法一律先过证据门，不足即标为缺来源。情绪只负责表达，不负责举证，这两件事在这一簇里始终分开。
