  - rich_body_id: CANARY-40-RB-002
    canary_id: CANARY-40-002
    canonical_cluster_id: mkc_008
    cluster_title: 证明槽位与价值转译
    body_form: full_rich_body
    body: 这一簇处理的是“怎么把组织内部的分工和工序，翻译成外部能看懂的证明”。比如“成品复核”这个节点，可以讲存在一道二次确认的关口，但不能顺势说出某次复核挑出了多少件问题，那已经落进具体经营数据了。第一步是把角色分工与协作边界摆清：谁负责设计打样、谁负责工艺把关、谁负责成品复核，边界清楚才不会把功劳含糊化。第二步沿关键工序节点排布叙事位置，把面料进厂、裁剪、缝制、整烫、检验这些节点标成可讲解的先后段落。每个节点后面挂一道门：质量门看是否达标、复核门看是否二次确认、交接门看责任是否清晰移交，门与门之间形成可追溯的链条。供应链上的选择要连着约束一起讲，选某种做法往往是为了应对交期、批量或稳定性的限制，把选择与约束成对写出，方法才显得可信。它在存在可核验流程时适用；把想象的流程当既有流程时不适用。这里必须收住：具体供应商、工厂、检测报告属于实例事实，无授权材料一律不写，需要时挂为待补，正文只承认“存在这样一类工序节点”。
