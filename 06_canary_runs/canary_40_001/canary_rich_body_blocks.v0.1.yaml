    body_form: claim_boundary_body
    body: 身材效果语言阶梯与场景化观察给出一套“想说效果时先降到观察”的用语梯度。举例说，与其写“这条裙显瘦”，不如降到观察层写“裙身在腰侧收进去，视觉上纵向线条更连贯”，把对身体的保证换成对线条的描述。最底层是观察词，只讲看到的线条与结构关系，比如“腰线位置偏高，视觉上把上下分割抬高了”。中间层是关系词，讲结构与呈现之间的因果倾向，但用“倾向于”“通常会”限定。最高层的结果词——“显高”“显瘦”“遮肉”——属于对身体的结果保证，默认不直接使用。当内容想表达效果时，提供替代表达和回避表达：把结果词换成线条描述，把绝对判断换成条件判断。场景化观察是允许的：在具体动作或姿态下描述视觉变化，但仍不下身体结论。内容涉及穿着呈现时它适用；向任意个体承诺身材改善时它拦下。这一簇的核心产出是“证据够不够、该不该降级”的判断：结果词一旦出现即视为需证据的承诺，缺依据时沿阶梯降为观察或关系表达，并把该承诺挂为待补证据。
