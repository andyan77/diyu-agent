    body_form: full_rich_body
    body: 受众距离与信息深浅轴用来决定“对不同阶段的受众，内容该讲多深”。举例说，面对刚接触某品类的人，要先把基础概念讲清；面对已在几件之间权衡的人，则直接给可对比的维度，两者需要的信息深浅完全不同。第一条轴是知识距离：受众对品类越陌生，越要从基础概念讲起；越熟悉，越可以直接进入细节比较。第二条轴是决策阶段：处在了解阶段的人需要框架性说明，处在权衡阶段的人需要维度对比，处在确认阶段的人需要注意事项。第三条轴是互动强度：能反复观看的内容可以密一些，一次性浏览的内容要疏一些。把三条轴叠起来，就能给一段内容定出合适的深浅。能大致判断受众所处阶段时，这套方法适用；要求给出真实用户画像或个人数据时，它不适用也不允许。深浅轴只调整讲解粒度，不能据此虚构出某类顾客的真实身份、消费记录或偏好数据；一旦内容里出现这类真实用户信息，先剔除或挂为待补，正文里承认的只有“不同阶段需要不同信息深度”这一条方法。
