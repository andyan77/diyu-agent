  - rich_body_id: CANARY-40-RB-005
    canary_id: CANARY-40-005
    canonical_cluster_id: mkc_011
    cluster_title: 叙事放大禁区与风险路由
    body_form: full_rich_body
    body: 这一簇给叙事划出高风险禁区，并规定越界后往哪里分流。举个边界例子，“穿上显年轻十岁”既踩了身体效果承诺，又暗含绝对化比较，遇到这类表达应先判定它属于哪个禁区，再决定改写、挂起还是送审。先对高风险区做分类：身体效果承诺区、健康或功效暗示区、身份与背书区、绝对化比较区，每一类都容易把内容从方法说明推成事实断言。针对不同禁区给出分流动作：能改写的降级为观察语言，不能改写的挂起等材料，涉及敏感承诺的交人工复核。同时维护一份放大词清单，像“彻底”“永久”“最”“一定”这类会把普通描述抬成硬结论的词，默认回避或加限定。内容触及可能被读成承诺的表达时，这套路由生效；纯结构性、无任何效果暗示的说明则用不到它。这里有一条硬边界：凡依赖具体人物、具体案例才成立的叙述都算实例依赖，缺授权即不得出现；当放大表达与证据强度不匹配时，优先牺牲表达强度而非准确性，把结论回收成“能观察到什么、还缺什么才能下判断”。任何功效类断言无据时一律标为缺来源。
