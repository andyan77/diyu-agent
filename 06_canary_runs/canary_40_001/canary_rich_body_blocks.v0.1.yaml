    body: 陈列动作SOP节点框架把“陈列这件事”拆成可复核的节点序列。举例来说，“陈列前检查”这个节点的输入是待陈列的货品与道具清单，输出是一份“区位与货品已核对”的可见状态，它正好成为“实施”节点的前置。先给通用节点：陈列前检查，如核对货品、清点道具、确认区位；实施，如按规划上架与组合；复核，如比对规划、检查安全与整齐。每个节点标出输入和输出：输入是这一步需要的前置物，输出是这一步完成后的可见状态，前一节点的输出正好成为后一节点的输入。节点之间的依赖顺序要固定，缺了前置就不能进入下一步。节点还要可见化，便于讲解和培训演示。陈列过程可被节点化时它适用；把某家店的真实排班或真实执行记录当节点内容时不适用。SOP框架是通用流程模型，产出可复核的流程素材，本身不承载实例；凡写入真实门店的具体执行数据、人员安排或商品实况的部分，先删或挂为缺来源，能落进正文的只是节点、输入输出与依赖关系这三样。
