    body_form: domain_method_body
    body: 叙事到CTA的非硬卖边界处理“内容里要不要引导行动、怎么引导才不硬卖”。举例来说，一段内容把搭配方法讲透之后，收尾用“想看更多穿法可以进一步了解”这类引导即可，而不是塞进一句带具体价格的促销。核心原则是CTA需要前置教育条件：只有当内容已经把该讲的方法或场景讲清楚，引导才有落点，不能开头就催促。CTA的信息密度要控制，点到为止，避免堆叠促销话术。关键切断是CTA与商品事实隔离：引导可以指向“了解更多”这类动作，但不得夹带未经证实的价格、库存、效果承诺。CTA还要和陈列或场景连接，让行动引导落在具体情境里而非空喊。内容已完成足够铺垫时它适用；在缺乏内容支撑时强行收尾催单则不适用。CTA只作为方法节点存在，不产出可直接投放的销售句；凡涉及具体优惠、具体商品事实的表达都属实例信息，先挂为缺来源。引导行动的表达不得替代证据去暗示效果，整段收束保持在非成品状态，把“怎么收尾”和“承诺什么结果”彻底分开。
