    body: 颜色表达与视觉解释边界处理“怎么讲颜色才准确又不越界”。比如一件米白外套，可以讲它在暖光下偏黄、在屏幕上偏冷，这是带观察条件的描述；但说“穿上显白”就滑到了对人的效果结论，需要退回。先立基础维度：色相决定是什么色系，明度决定深浅，纯度决定鲜或灰，先用这三项把颜色说清。再引入色彩家族与冷暖中性的通用表达，便于归类和搭配说明。然后加镜头与光线的观察提醒：同一颜色在自然光、暖光、屏幕下会有偏差，描述时要注明观察条件，避免把某一环境下的呈现当成绝对色值。最关键的切断是：颜色故事可以讲氛围联想，但不能滑向“显白”“显瘦”“更高档”这类身体或价值结论，这些属于效果承诺。面对可描述的颜色对象时它适用；对具体商品做未经验证的上身效果判断时不适用。把颜色与身材效果、肤色改善、品质等级挂钩的说法都要证据支撑，没有依据时回收成“在某光线下看到的色彩关系”这类观察，并把相关效果句挂为缺来源，等材料再议。
