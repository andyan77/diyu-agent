    body: 异常回退与前复核路由提示规定“流程出问题时停在哪、转向哪”。举例说，若“复核”节点因为缺规划底稿无法进行，就回退到能补齐底稿的那一步，而不是跳过复核硬把这批陈列算作完成。先列异常类型与对应回退：某个节点缺失时，回退到能补齐前置的最近节点，而不是硬往下走。证据不足时，把缺乏支撑的结论挂起，标明还需要什么证据。授权不明时，交人工裁决：归属或权限不清的项交由人工判断，不自行认定。所有异常项都用一个最小记录格式登记：发生在哪一步、属于哪类异常、转向了哪里，便于后续复核。流程中确实出现可识别异常时它适用；把正常步骤当异常处理时不适用。这一簇约束的是遇到证据缺口、边界冲突或控制面信息泄漏时的停机与转向方式，属于流程治理规则。异常处置只做记录与转向，不在此处补写未经证实的结论；任何涉及真实经营异常的具体数据都属实例事实，先挂起或删除，正文只留通用的回退与路由规则。
