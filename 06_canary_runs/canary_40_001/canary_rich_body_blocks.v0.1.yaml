    body_form: role_voice_body
    body: 角色授权表面与人物故事红线区分“借角色能说的方法层”和“借角色不能说的事实层”。举个越权的例子，“店里最有经验的师傅说这件最值”，把一个功能角色当成了证据来源，遇到这种表达要拆回方法层，去掉替读者下判断的部分。可说的是方法与通用经验：某类角色通常怎么看货、怎么讲搭配、按什么顺序检查，这些属于可复用方法。不可说的是事实层：具体某人的真实履历、真实业绩、真实私下言论，无授权一律不写。要警惕默认背书的危险信号，比如让一个功能化角色去“保证”某种效果，这等于用虚构权威替读者做了判断。对越权表述要拆解：把“某位资深店员说这件最显瘦”拆回“显瘦属于身体效果承诺，需证据；店员为实例人物，需授权”，两头都不成立就改写或删除。内容需要一个讲解者身份时它适用；必须依赖真实人物证词才成立的稿子则不适用。授权表面只能承载方法，承载不了事实与承诺；凡把角色当证据来源的表达，都要回收成中性观察，或先挂为缺来源。
