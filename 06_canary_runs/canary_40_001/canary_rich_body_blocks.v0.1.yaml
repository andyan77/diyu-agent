    body: 工艺观察线索与讲解节点回答“看一件衣服的工艺，该按什么顺序看、讲到哪儿要停”。比如看到“锁边干净、扣位牢固”是观察，可以讲；若顺势说“所以这件特别耐穿”，就把一处细节放大成了整体耐用结论，需要退回补证据。先列可见工艺节点：走线是否平整、拼接是否对位、锁边是否干净、扣位与开口的处理、里布与衬的收口。观察顺序建议从外观到结构再到细节：先看整体呈现，再看关键结构处理，最后看收尾细节，层层深入而不是一上来就抠局部。工艺名词要与耐用、功能结论切断：看到“走线密而齐”是观察，断言“所以特别耐穿”是性能结论，后者需要使用或测试支撑。讲解时给工艺节点排一个叙事先后，让内容有推进感而非罗列。工艺特征可被直接观察时它适用；把局部工艺当整体质量保证时不适用。凡从可见工艺推向耐用度、使用寿命、功能表现的说法，都属需证据的结论，缺来源时只描述看到的处理方式，质量承诺一律挂为待补证据，不用“工艺好”笼统替代举证。
