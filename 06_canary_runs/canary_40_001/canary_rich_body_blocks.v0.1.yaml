  - rich_body_id: CANARY-40-RB-007
    canary_id: CANARY-40-007
    canonical_cluster_id: mkc_013
    cluster_title: 角色发声寄存器
    body_form: role_voice_body
    body: 角色发声寄存器规定“这段话由谁的口吻说、能说到什么颗粒度”。举例说，同讲一条裤子，陈列视角会落在“它在这组里怎么摆、和谁相邻”，导购视角会落在“它适合完成什么穿着任务”，两种站位可用的信息本就不同。先做主语选择与叙述站位：是以导购视角讲搭配，还是以陈列视角讲布局，还是以内容编导视角讲拍摄，站位不同，可用的信息和语气都随之不同。再控制信息密度和限制语，专业视角可以多用结构性描述，但要配限制语，防止把观察说成定论。动作词、观察词、解释词各守边界：动作词说做了什么，观察词说看到什么，解释词说可能的原因，三者不混用才不会把猜测当事实。在服装零售场景里为每类角色设一个稳定的发声锚点，口吻就能复用而不飘。内容有明确叙述者视角时它适用；需要冒充真实员工或顾客现身说法时不适用。发声寄存器只提供口吻分桶这一件事，不能据此编造具体人物的经历或原话；凡出现真实姓名、职务、门店的引述，都要剔除或先标为缺来源，等授权到位再谈。
