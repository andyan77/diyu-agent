  - rich_body_id: CANARY-40-RB-004
    canary_id: CANARY-40-004
    canonical_cluster_id: mkc_010
    cluster_title: 反模板叙事锚点
    body_form: full_rich_body
    body: 反模板叙事锚点用来对治“千篇一律的空泛叙述”，做法是先找到能被镜头和文字抓住的具体锚点，再围绕锚点展开。举例来说，与其写“这件衣服很好看”，不如把镜头落到“袖口那道明线的走向”这个对象锚点上，再接上“翻起袖口能看到里料收边”这个动作，叙述立刻有了抓手。锚点分四类：对象锚点是可指认的物件，比如一处走线、一枚纽扣、一段拼接；动作锚点是可观察的处理动作，比如翻折、比对、归位；约束锚点是取舍的表达，比如为活动量而放大的松度；节点锚点是前后台衔接处，比如从库房到陈列面的交接点。抓住锚点后，把对象连到动作、动作连到可见线索、约束连到取舍说明、节点连到场景可拍性，叙述就有了落点，也天然区别于其他条目的写法。内容里确有可指认细节时这套方法适用；只有情绪形容而无实物依托时不适用，这类稿子应先补锚点再落笔。要守的边界是：锚点必须是通用可复现的结构特征，不能把某件在售商品的独有卖点当锚点；凡带具体货号、价格或库存的描述都要剔除，或先标为缺来源再议。
