  - rich_body_id: CANARY-40-RB-003
    canary_id: CANARY-40-003
    canonical_cluster_id: mkc_009
    cluster_title: 故事弧线适用边界
    body_form: full_rich_body
    body: 故事弧线适用边界解决的是“这段内容该用哪种叙事结构，以及哪种结构会带来风险”。比如同样讲一件外套，用成长弧要交代能力如何一步步积累，用对照弧则要摆出两种做法的差别，选哪条取决于手上能拿出哪种可核验的过程材料。不同弧线对应不同问题类型：成长弧适合讲能力如何积累，转折弧适合讲一次方法调整，对照弧适合讲两种做法的差异，先按内容的问题类型去挑弧线，而不是先定弧线再硬凑情节。选定弧线后要绑定证据强度，越是强调结果反差的弧线，对可核验事实的要求越高。弧线还要与价值表达和证明位兼容，若某条弧线必须依赖尚无材料支撑的关键情节，就说明它此刻并不适用。识别不适用的信号包括：必须搬出具体业绩数字、必须替人物编造内心、必须假设读者已相信某个未证明的前提。内容确有可展开的过程时它成立；只想用弧线包装空洞结论时它失效，此时把弧线压回一句方法说明。要点在于不得用叙事张力替代证据，凡涉及承诺性结果或对比性优劣而无据，一律改写成中性观察或标注为缺来源。
