    body: 产品生命周期角色窗口给出“同一产品在不同阶段承担不同叙事任务”的方法。比如同一件单品，在导入阶段要多讲它怎么用、怎么搭，到了成熟阶段就可以只做一句提示，叙事密度随阶段递减，而不是每次都从头讲。先做阶段抽象命名：导入、成长、成熟、退场，用抽象阶段而非具体档期来讲。阶段与叙事密度相关：导入期需要多讲背景与用法，成熟期可以精简，退场期转向收尾表达。阶段与教育重心相关：早期偏认知教育，中期偏使用与搭配，后期偏场景延展。阶段还与陈列更新相关：不同阶段对应不同的陈列强调点。据此为每个阶段构造一个可比较的角色窗口。能对产品所处阶段做抽象判断时它适用；据此推断具体经营节奏或销售结论时不适用。生命周期窗口只产出可比较的叙事任务结构，不能写成对某商品真实上市时间、销量走势或库存状态的判断；凡涉及真实经营阶段数据的地方，先挂为缺来源，正文里能留下的只有阶段与叙事任务的对应方法。
