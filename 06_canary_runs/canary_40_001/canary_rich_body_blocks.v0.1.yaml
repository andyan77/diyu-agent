  - rich_body_id: CANARY-40-RB-038
    canary_id: CANARY-40-038
    canonical_cluster_id: mkc_044
    cluster_title: 使用教育与结果 claim 分界
    body_form: claim_boundary_body
    body: 使用教育与结果claim分界这一簇，划定“教用户怎么用可以、承诺用了有什么结果不可以”的界线。举例来说，讲“怎么把这件衣服的褶皱抚平”属于教育性说明，可以讲；而“这样处理就不会再皱”是效果承诺，需要证据支撑，不能顺口带出。允许的是教育性说明：怎么穿、怎么搭、怎么打理、注意哪些使用事项，这些帮助用户正确使用。要把演示和证明分开：演示是展示一个用法或过程，证明是断言某种效果成立，展示动作不等于证明结果。比较语言要设边界：同类之间讲可见差异可以，断言“更好、更有效”则需要证据分级支撑。注意事项要明确表达，提醒使用限制。内容聚焦正确使用方法时它适用；把使用说明包装成效果承诺时它拦下。这一簇本质是一条证据分界线：凡从“怎么用”滑向“用了会怎样”的结果性表达，都视为需证据的结论，按证据等级要求处理，不足时整体挂为待补证据；高风险的结果claim必须与教育说明隔离，绝不让演示动作替读者得出效果结论。
