  - rich_body_id: CANARY-40-RB-039
    canary_id: CANARY-40-039
    canonical_cluster_id: mkc_045
    cluster_title: 产品到陈列叙事关系语法
    body_form: domain_method_body
    body: 产品到陈列叙事关系语法回答“产品与陈列之间用什么关系来组织画面”。比如把一件外套放在陈列面中心作主角，两侧用内搭作邻接呼应，背景压低作陪衬，这组位置关系就能直接转成一条“中心—两侧—背景”的镜头线索。先讲位置关系：产品在陈列面里处于中心、侧位还是背景，位置决定视觉权重。再讲邻接关系：它旁边放什么、和什么形成呼应或对比，邻接对象影响读者对它的理解。还有主次层级：一组里谁主谁次，层级清楚画面才有重点。以及主题化组合：一组产品在同一主题下如何摆放才能讲出关系。把这些关系连起来，产品角色就能对到具体的陈列位置、邻接对象和拍摄镜头线索，让内容具备可视结构。存在可观察的产品与陈列关系时它适用；落到某个真实门店的具体陈列实况时不适用。关系语法产出的是产品与陈列的关系槽位，供后续内容参考；凡写入真实门店的位置、商品与实景照片事实的部分，先脱敏，不行就挂为待补，正文这一层只承认位置、邻接、主次与主题这几层关系结构。
