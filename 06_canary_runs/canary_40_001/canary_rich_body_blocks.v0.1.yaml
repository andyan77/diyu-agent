    canonical_cluster_id: mkc_007
    cluster_title: 企业叙事骨架
    body_form: full_rich_body
    body: 企业叙事骨架要先回答“这家企业在替谁解决什么问题”，把问题场景确定成叙事的起点，而不是从口号或成立年份写起。举个具体例子，一段内容若从“怎么把控交期”这一问题场景切入，就比从“成立于哪一年”切入更容易接上后面的做法与证明，起点选错，后面几层都会悬空。问题场景确定之后，才展开长期采用的组织性做法：它在选料、排产、协作分工上做了哪些反复出现的选择，这些选择构成可复述的经营方法。方法之后要预留证明位，供应链、组织结构、过程记录各留一个可后续填充的槽位，暂时没有材料时保持空槽而不去编造。最后把方法与证明转译成对外可感知的价值表达，并按系列轴拆成可重复的叙事单元，让同一套骨架能派生出多条内容而不互相重复。这套骨架在企业确有稳定做法可讲时成立；若只有一次性事件或临时活动，则它失效，应降级为普通信息条目而不是硬撑成叙事。守住一条线：通用做法不能写成某一时点的经营成果或市场地位，凡触及规模、份额、增长这类硬结论，必须先有官方资料，缺材料时把该句挂起为待补，正文只留方法层。
