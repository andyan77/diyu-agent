    cluster_title: 品类解释与属性槽位骨架
    body_form: domain_method_body
    body: 做品类说明时，应当先把对象在服装结构里的位置定下来，再逐层打开它的属性格子，顺序不能颠倒。举例来说，讲一件上衣时先认定它属于上衣结构，再依次打开领口、袖型、门襟这些格子，就不会一上来就跳到“这款卖得好”这类与结构无关的话。服装大类通常先分成上装、下装、连衣类与外搭类四组，每组之下再挂各自的属性槽位。上衣一类可以打开的格子有领口形态、袖子结构、门襟方式、肩部走向、衣身长度以及表层材质；裤装裙装一类可以打开腰头高低、下摆或裤长、腿型或裙型轮廓、开衩与褶裥、以及活动余量；一体连身的一类要同时照顾上下衔接、腰线落点、下摆结构与整体比例；外层搭配的一类还要补上开合方式、厚薄层次和对内搭的容纳。这个格子体系只回答“可以观察什么、还能补什么、哪里必须收住”，替代不了某件具体商品的资料。面对可归类的品类时它适用；把通用格子直接说成某个正在售卖的款式时，它就被误用了。一旦缺少款号、定价、库存或上新信息，正文只能停在品类、属性、边界三层；把通用品类写成某品牌在售事实即越界，这类信息要么剔除，要么先挂为缺来源。
