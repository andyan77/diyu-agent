    body: 品质观察项与证明类型路由回答“看到的品质线索，该配哪种证明，以及哪些必须转走”。举例来说，看到一处走线整齐只能支撑“这一处处理到位”，若写成“整件品质可靠”，就把局部观察放大成了整体保证，必须拆回去。先整理可观察品质线索：接缝平整度、面料克重的直观厚薄、五金件的做工、边缘处理是否毛糙，这些是肉眼可判的。再建立证明类型的分类：有的靠可见证据，有的靠标准或检测，有的靠专业方法说明，不同结论要匹配不同证明。凡涉及认证、标准、等级这类声称，必须转到更高证据要求，不能凭观察直接认定。核心禁令是：不得把局部观察写成整体保证，看到一处做工好不等于整体品质达标。品质线索可被直接观察时它适用；用单点线索给出总体品质结论时不适用。这一簇给出的是一份“该走哪条证据路”的判断：认证与标准类声称一律要官方来源，缺失即挂为待补证据；局部观察只支撑局部描述，任何整体性、承诺性的品质结论无据不写，绝不并入普通说明。
