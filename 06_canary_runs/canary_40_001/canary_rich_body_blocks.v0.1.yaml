    body_form: domain_method_body
    body: 版型廓形剪裁术语这一簇，先要把版型和廓形分开：版型是纸样与结构的处理方式，廓形是穿着后外部呈现的整体轮廓，一个在内一个在外，说的时候不能混为一谈。举例来说，可以讲“腰线落点偏高，从轮廓上看上下比例被抬高了”，这是结构到视觉的解释；但接着说“所以人人穿都显高”，就越过了结构能担保的范围。描述廓形可用轮廓线走向、衣长、宽窄比例、松量分布和视觉重心这几项通用语言。结构节点要与视觉结果连起来解释：肩线位置影响肩部走向，腰线落点影响上下比例，下摆处理影响整体收放，把“做了什么结构”对到“看上去有什么变化”。关键切断在于：版型术语只描述结构与视觉，不能直接跳到身材效果承诺，比如“这个版型一定显高显瘦”属于对身体结果的保证。面对可归类的版型时它适用；把结构特征说成对任何人都成立的身材改善时不适用。凡涉及显高、显瘦、遮肉的说法都算需证据的结论，缺乏依据时改写成“从轮廓上能看到的线条变化”，效果承诺部分先挂为缺来源。
