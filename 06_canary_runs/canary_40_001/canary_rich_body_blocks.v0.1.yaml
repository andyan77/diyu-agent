    body: 零售角色动作权限与加盟改写边界这一簇，规定“哪些角色权限能讲、加盟与授权信息怎么泛化”。比如某地的加盟返点条款属于实例，不能原样写；要泛化成“存在这样一类按区域约定的授权安排”，把具体数字和区域名都抽掉才可保留。先把角色、动作、权限连成关系：某类角色能做某类动作，是因为拥有对应权限，三者要对齐，不能让角色去做超出权限的动作。可讲的是一般化的授权表面——“存在这样一类被授权处理陈列的角色”，这属于方法层。加盟与授权类信息必须经过泛化改写才能出现：把具体的加盟条件、区域划分、真实合同条款，抽象成“存在这样一类授权安排”，去掉可识别的实例。真实制度与内部方法层要切断，不得原样外露。需要说明角色权限关系时它适用；想沉淀任何真实授权信息时它禁止。这一簇产出的是权限与改写的边界规则，属于治理性约束；遇到具体授权事实先挂起等材料，遇到边界不清交人工裁决，真实加盟、授权、合同信息一概不进正文。
