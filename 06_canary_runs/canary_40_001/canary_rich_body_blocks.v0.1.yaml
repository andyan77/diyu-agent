    body: 这一簇讲“怎么把工艺讲清楚又能真的拍出来”。比如要拍“里料收口”，就翻开衣里让镜头对准那一处，用近景交代针脚走向，旁白只讲看到的处理，而不替观众断定这样就一定结实。先定可拍摄对象：走线、拼缝、扣位、里料收口这些细节都是能对上焦的实物点。再定可拍摄动作：翻开衣里展示收口、拉动开合展示顺滑、对比正反两面展示处理，动作要能被镜头完整记录下来。画面按层次安排：远景交代整体，中景交代结构区域，近景交代关键细节，层层清楚才不至于糊成一团。所有画面都配非结论化的说明：讲“这里能看到怎样的处理”，而不是“这说明质量一定好”。工艺细节具备可视性时它适用；把无法观察的性能硬拍成“证据”时不适用。它的产出只是看得到的处理方式，供后续内容采用，不构成成品，也不得借画面暗示未经验证的耐用或功能结论；凡涉及性能承诺的旁白都改成观察语言，改不动的先挂为缺来源，镜头能拍到的永远是做法而非效果。
