    body_form: evidence_policy_body
    body: 舒适、性能、耐用这类品质话术，要按“断言强度—证据类别—可保留表达”三段来管。比如“透气”这类具体性能属于强断言，要有检测或标准撑着；实在没有材料时，只能退到“面料结构较疏松”这种可观察的最低表达。先给断言分级：泛泛的“穿着体验”属弱断言，具体的“透气、保暖、抗皱、耐洗”属强断言，涉及数值或对比的属最强断言。每一级对应可接受的证据类别：标准依据、检测方法、专业方法说明，强断言要匹配更硬的证据。当没有任何证据时，规定一个最低可保留的表达层级——只描述可观察的材料与结构线索，不下性能结论。触发补来源的阈值很明确：一旦话术从“看到什么”滑到“会带来什么效果”，且无证据支撑，即整体挂起等材料。内容确需谈及品质时它适用；用体验词暗示未验证的性能时它拦截。这一簇本身就是一份证据分级依据：所有性能与耐用结论都需检测或标准支撑，缺失时不得用“亲测”“很耐用”替代，必须回收为观察并注明还缺哪一类证据。
