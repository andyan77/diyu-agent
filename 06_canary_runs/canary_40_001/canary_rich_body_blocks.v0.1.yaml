    body: 场景适配条件与不适配条件回答“一件产品适合什么场景、不适合什么场景、边界在哪”。比如一件轻薄外套，适配“室内外温差大的通勤”这个场景任务，但并不适配“正式场合的庄重要求”，把不适配的场景也点出来，判断才完整。先定场景任务锚点：每个场景有它要完成的核心任务，比如通勤要方便活动、聚会要有存在感，产品要对着任务讲。再给场景切换条件：什么情况下从一个场景过渡到另一个，过渡处要交代清楚。场景里对动作有限制，要说明在该场景下产品能怎么用、不宜怎么用。关键是显式表达不适配条件：哪些场景并不适合这件产品，把边界讲出来比一味说“百搭”更可信。场景与产品任务可对应时它适用；对所有场景一律宣称适配时不适用。这一簇围绕“场景条件—动作任务—产品角色”展开，不滑向“穿上就能达到某种效果”的保证；凡涉及效果、适用人群的硬结论都需证据支撑，缺失时先挂为缺来源，正文最终留下的是场景与任务之间的匹配方法。
