    cluster_title: 面料家族与属性边界
    body_form: domain_method_body
    body: 面料家族与属性边界解决“怎么讲材料才既有信息量又不越界”。举例说，看到面料“表面有明显纹理、悬垂时略沉”是可讲的观察；若据此断言“所以很保暖”，就跨到了需要检测支撑的性能层，必须收回。先把层级分清：纤维是原料层，如棉、麻、聚酯；纱线是纤维加工成的线；面料是纱线织成的布，三层不能混着说。再区分结构：梭织由经纬交织、相对稳定，针织由线圈串套、相对有弹性，结构差异是很多手感和外观差别的入口。可讲的是常见可观察项：表面纹理、光泽、悬垂状态、厚薄。不可直接外推的是性能项：保暖、透气、耐磨、免烫这类需要测试支撑的结论。手感词要和事实词划界：“摸起来偏厚”是观察，“很保暖”是性能断言，后者无据不写。面对可归类的材料时它适用；把通用材料特征说成某件商品的实测结果时不适用。这一簇专门盯着证据边界：凡涉及性能、成分含量、护理结果的具体结论，都需检测或标准来源，缺来源时只留结构与可见线索，把性能话术整体挂为待补证据。
