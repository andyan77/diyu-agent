    body: 产品叙事角色入场框架回答“产品以什么身份进入一段内容、在哪里首次出现”。比如让一件针织衫作为“解决项”登场，就要先铺一个“换季早晚偏凉”的场景任务，再让它在这个任务里首次出现，入场才有由头。先给产品做功能命名：它在这段内容里是主角、对比项、解决项还是过渡项，身份不同，叙述位置就不同。再定首次出现位置：是开头即亮相，还是在铺垫场景任务后才登场，入场时机决定读者对它的第一印象。产品要和场景任务绑定：它是来完成某个具体使用任务的，而不是凭空展示。围绕这些，把产品角色连到场景任务、叙事段落、视觉锚点和教育节点上，形成可检查的叙事骨架。内容确有可承担叙事功能的产品对象时它适用；把通用叙事结构写成某个在售商品的推广稿时不适用。入场框架只产出“产品以何种角色进入故事”的结构槽位，不能填入具体货号、价格、卖点承诺这类实例事实；涉及真实商品信息的部分先挂为缺来源，正文只留角色与位置这两层方法。
