    cluster_title: 视角切换与公开安全边界
    body_form: full_rich_body
    body: 视角切换与公开安全边界解决“同一个对象在不同角色视角下怎么改名、以及哪些内容必须切断”。比如同一件外套，在选品视角登记为组货单元，进入拍摄时改称拍摄主体，若不把这层改名写清楚，读者在两段之间就会以为是两件东西。同一件商品，在选品视角叫组货单元，在陈列视角叫展示对象，在内容视角叫拍摄主体，要把这些命名变化显式登记，避免跨视角时读者对不上号。视角之间有交接节点，在节点处要做上下文切换说明，交代从哪个视角转到哪个视角。最要紧的是划出公开可讲与内部运营的切断线：面向公众的内容只用公开安全信息，涉及内部操作细节的转入受限区。异常项按可接受、待补、剔除三条路分流。内容会在多角色间流转时它适用；把内部运营信息直接外发时它禁止。切换只改视角命名，不改事实门槛，不能借视角切换把未证明的说法洗成可用结论；凡触及内部作业规程或真实经营数据的，一律切断，能改写就改写，改不了就挂起或删除。
