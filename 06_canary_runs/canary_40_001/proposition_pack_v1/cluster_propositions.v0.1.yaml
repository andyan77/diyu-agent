      proposition_type: definition
      owner_candidate: GeneralKnowledgeBase
      epistemic_class: domain_method
      applicable_when: 为企业撰写叙事骨架、需要确定内容起点时。
      not_applicable_when: 只做一次性事件或临时活动的普通信息条目、无需完整骨架时。
      failure_signal: 内容从口号或成立年份切入，后面几层做法与证明接不上而悬空。
      downstream_effect: 起点选对后，后续做法层与证明层能顺畅衔接，不至于悬空。
      source_requirement: 起点为通用做法叙事，无需外部来源；一旦引入具体经营成果需待补官方来源。
      evidence_requirement: 问题场景用观察语言描述即可，涉及硬结论时改为待补来源，不硬下结论。
