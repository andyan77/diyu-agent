      source_text_span_end: 147
      source_span_verified_in_rich_body: true
      proposition_text: 只有在问题场景确定之后，才展开企业长期采用的、在选料排产协作分工上反复出现的组织性做法，构成可复述的经营方法。
      proposition_type: mechanism
      owner_candidate: GeneralKnowledgeBase
      epistemic_class: domain_method
      applicable_when: 问题场景已确定、要从起点过渡到做法层时。
      not_applicable_when: 问题场景尚未确定，或企业无长期反复出现的做法可讲时。
      failure_signal: 未定问题场景就先写做法，或所写做法非反复出现、无法复述。
      downstream_effect: 形成可复述的经营方法，为后续预留证明位与价值表达提供内容。
      source_requirement: 做法层取自企业稳定通用做法，暂无需外部来源；个案选择需另行核实。
      evidence_requirement: 做法须为反复出现的选择，个别一次性选择不得当作方法，缺证据时挂起待补。
