      proposition_text: 叙事骨架仅在企业确有稳定做法可讲时成立；若只有一次性事件或临时活动则失效，应降级为普通信息条目而非硬撑成叙事。
      proposition_type: boundary_condition
      owner_candidate: GeneralKnowledgeBase
      epistemic_class: domain_method
      applicable_when: 判断素材能否支撑叙事骨架、决定是否降级时。
      not_applicable_when: 企业已有长期稳定、可复述的做法时（此时骨架成立不需降级）。
      failure_signal: 把一次性事件或临时活动硬套骨架，叙事空洞悬空。
      downstream_effect: 无稳定做法的素材被降级为普通信息条目，避免虚构叙事。
      source_requirement: 需确认做法是否长期反复出现；一次性事件应标注并降级为普通条目。
      evidence_requirement: 稳定做法的判断待补企业侧材料，缺证据时按普通信息条目处理，不硬撑成叙事。
