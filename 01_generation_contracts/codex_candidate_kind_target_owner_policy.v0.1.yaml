candidate_kind_target_owner_policy:
  schema_version: v0.1
  generated_by_task: CODEX-KNOWLEDGE-GENERATION-CONTRACT-LOCK-001
  source_repo_live_dependency: false
  source_type_decides_final_layer: false
  candidate_kind_allowed:
  - general_knowledge_candidate
  - control_plane_candidate
  - cso_outbox_candidate
  - execution_asset_outbox_candidate
  - governance_outbox_candidate
  - evidence_policy_candidate
  - source_gap
  - decision_packet
  proposed_target_owner_allowed:
  - GeneralKnowledgeBase
  - ControlPlaneContractSource
  - CSOOutbox
  - ExecutionAssetOutbox
  - GovernanceOutbox
  - EvidencePolicyOutbox
  - SourceGapLedger
  - DecisionPacketLedger
  rules:
  - if: candidate_kind == general_knowledge_candidate
    allowed_target_owner:
    - GeneralKnowledgeBase
    forbidden_content:
    - P0_00_control_plane_operation
    - route_authority
    - readiness_transition_rule
    - real_brand_fact
    - real_SKU_fact
    - real_store_fact
    - real_person_fact
  - if: candidate_kind == control_plane_candidate
    allowed_target_owner:
    - ControlPlaneContractSource
    forbidden_target_owner:
    - GeneralKnowledgeBase
  - if: candidate_kind in [source_gap, decision_packet]
    allowed_target_owner:
    - SourceGapLedger
    - DecisionPacketLedger
    forbidden:
    - candidatepack_ready_true
    - KE_ready_true
    - generation_eligible_true
  - if: candidate_kind == evidence_policy_candidate
    role: claim_and_evidence_policy_outbox
    allowed_target_owner:
    - EvidencePolicyOutbox
    forbidden_target_owner:
    - GeneralKnowledgeBase
    - ControlPlaneContractSource
    - KE_truth_source
    - ServingProjection
    - RAG
    - DIFY
    allowed_target_layer:
    - EvidencePolicy_candidate
    forbidden_target_layer:
    - ABox
    - TBox_Object
    - BrandInstance
    - Product
    - Store
    - PersonProfile
    - KE_truth_source
    - ServingProjection
    - RAG
    - DIFY
    not_role:
    - GeneralKnowledgeBase
    - KE_truth_source
    - production_servable_content
    allowed_use_now:
    - judge_fixture
    - canary_contract_input_after_P3
    - draft_generation_owner_target_after_canary_authorization
    not_allowed_use_now:
    - CandidatePack
    - Four_Gate
    - KE
    - Serving
    - RAG
    - DIFY
    - production
    forbidden:
    - candidatepack_ready_true
    - KE_ready_true
    - generation_eligible_true
    - object_creation
    - map_to_general_knowledge_candidate
    - map_to_GeneralKnowledgeBase
