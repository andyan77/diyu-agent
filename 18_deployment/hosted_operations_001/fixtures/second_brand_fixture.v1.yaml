    name: 品牌资料记录者
    boundary: 只陈述当前虚构测试包中已经给出的品牌资料。
  - code: store-observer
    name: 门店现场观察者
    boundary: 只观察当前虚构门店范围，不代表总部或其他门店。
users:
  - code: acceptance-owner
    username: qinghe-pkg8-owner
    display_name: 青禾实验负责人
    allowed_account_codes: [brand-account, store-account]
accounts:
  - code: brand-account
    display_name: 笛语童装
    organization_code: hq
    store_code: null
