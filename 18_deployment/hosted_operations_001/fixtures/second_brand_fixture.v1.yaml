    role_code: brand-recorder
    allowed_source_organization_codes: [hq, east]
  - code: store-account
    display_name: 青禾门店记录
    organization_code: east
    store_code: riverside
    level: STORE
    role_code: store-observer
    allowed_source_organization_codes: [hq, east]
authorizations:
  - code: current-material
    status: GRANTED
    valid_from: 2026-07-01T00:00:00Z
    valid_until: 2027-07-01T00:00:00Z
    organization_codes: [hq, east]
    store_codes: [null, riverside]
    account_codes: [brand-account, store-account]
