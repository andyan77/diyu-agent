  brand_code: qinghe-home
  enterprise_name: 青禾生活实验企业（虚构）
  brand_name: 青禾生活实验品牌（虚构）
organizations:
  - code: hq
    name: 青禾实验总部
    level: HEADQUARTERS
  - code: east
    name: 青禾实验东区
    level: REGION
stores:
  - code: riverside
    name: 青禾实验河畔店
    organization_code: east
roles:
