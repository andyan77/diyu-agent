    status: EXPIRED
    valid_from: 2025-01-01T00:00:00Z
    valid_until: 2025-12-31T23:59:59Z
    organization_codes: [east]
    store_codes: [riverside]
    account_codes: [store-account]
materials:
  - code: calm-home-note
    title: 青禾实验品牌的家居选择记录
    text: 青禾生活实验品牌是一组完全虚构的测试资料。当前记录只说明：整理物品时先保留日常会反复使用的部分，再决定是否增加新的收纳用品。
    source_label: 第8包虚构品牌资料
    authorization_code: current-material
    account_codes: [brand-account, store-account]
    observed_at: 2026-07-15T00:00:00Z
    valid_until: 2027-07-01T00:00:00Z
  - code: expired-store-photo
    title: 已过期的虚构门店照片记录
    text: 这条虚构照片说明已经过期，不得用于当前内容。
    source_label: 第8包撤回测试资料
    authorization_code: expired-photo
    account_codes: [store-account]
    observed_at: 2025-06-01T00:00:00Z
    valid_until: 2025-12-31T23:59:59Z
    status: REVOKED
facts:
  - code: basket-record
    kind: SKU
    label: 虚构商品记录
    value: {product_name: 青禾实验收纳篮, sku: QH-LAB-001}
    source_label: 第8包虚构精确字段
    authorization_code: current-material
    account_codes: [brand-account, store-account]
    effective_at: 2026-07-15T00:00:00Z
    valid_until: 2027-07-01T00:00:00Z
  - code: expired-display-date
    kind: TIME_POINT
    label: 已过期虚构陈列日期
    value: {display_date: 2025-06-01, state: expired}
    source_label: 第8包过期字段
    authorization_code: expired-photo
    account_codes: [store-account]
    effective_at: 2025-06-01T00:00:00Z
    valid_until: 2025-12-31T23:59:59Z
    status: EXPIRED
expression:
  why_exist: 用克制、清楚的方式帮助用户理解日常整理选择。
  audience: 正在整理日常生活空间的普通用户。
  tone_tendencies: [安静具体, 不替用户下结论, 保留生活观察]
  preferred_phrasing: [从眼前物件进入, 先说明当前条件]
  prohibited_categories: [fabricated_fact, unsupported_promise, invented_local_event]
  storylines:
    - code: everyday-order
      name: 日常秩序怎样形成
      purpose: 从已有物件和当前使用条件讲清选择。
    - code: store-observation
      name: 门店范围内的观察
      purpose: 只记录当前虚构门店允许使用的资料。
  columns:
    - code: one-object
      name: 从一个物件开始
      storyline_code: everyday-order
    - code: current-store
      name: 当前门店记录
      storyline_code: store-observation
